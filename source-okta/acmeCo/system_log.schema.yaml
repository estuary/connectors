$defs:
  Meta:
    properties:
      op:
        default: u
        description: 'Operation type (c: Create, u: Update, d: Delete)'
        enum:
        - c
        - u
        - d
        title: Op
        type: string
      row_id:
        default: -1
        description: Row ID of the Document, counting up from zero, or -1 if not known
        title: Row Id
        type: integer
    title: Meta
    type: object
additionalProperties: true
description: |-
  One System Log event, the atomic audit fact Okta records.

  Only the collection key and the backfill watermark are modelled; every
  other field rides schema inference. Events are immutable once published.
properties:
  _meta:
    $ref: '#/$defs/Meta'
    description: Document metadata
  uuid:
    title: Uuid
    type: string
  published:
    format: date-time
    title: Published
    type: string
required:
- uuid
- published
title: SystemLogEvent
type: object
x-infer-schema: true
if:
  required:
  - _meta
  properties:
    _meta:
      required:
      - op
      properties:
        op:
          const: d
then:
  reduce:
    strategy: merge
    delete: true
