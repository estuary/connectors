info:
  name: polling first page
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/logs?since={{logs_since}}&sortOrder=ASCENDING&limit={{logs_limit}}"
  params:
    - name: since
      value: "{{logs_since}}"
      type: query
    - name: sortOrder
      value: ASCENDING
      type: query
    - name: limit
      value: "{{logs_limit}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Capture the `after` token from the rel="next" link (read verbatim, never
        // constructed) for `System Log / polling resume after`.
        const link = res.getHeader('link') || '';
        const next = link.split(',').find((l) => /rel="next"/.test(l));
        const m = next && next.match(/[?&]after=([^&>]+)/);
        if (m) bru.setVar('logs_after', decodeURIComponent(m[1]));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** https://developer.okta.com/docs/reference/system-log-query/

  **WHY:** the request shape the incremental task starts from: a polling
  request (`since` set, no `until`, ASCENDING) at the max page size. Learns the
  next-link shape (are `since`/`sortOrder`/`limit` carried? is `since` dropped
  in favor of `after`?) and the `after` token format, whose stability decides
  GATE-OPAQUE-CURSOR.

  **VERIFIED (2026-10-07):**
  - Polling pages are ordered by persistence time, not `published`: 76 of
    440 adjacent pairs in the full sandbox log step backwards in
    `published`, by up to 298 ms behind the running max.
  - The next link carries `since`, `limit`, `sortOrder` and `after` together
    (although the docs call `since` and `after` mutually exclusive). The
    `after` token is `<epoch-ms>_<n>`, where `<epoch-ms>` is the persistence
    time of the last event returned. It lands 56–207 ms after that event's
    `published`, and `System Log / polling since boundary probe` pins it as
    the persistence ms.
  - Paging `limit=200` and resuming from the token (`System Log / polling
    resume after`) reassembles the single `limit=1000` page exactly: 441
    uuids, same order, no overlap.
  - **LIMITATION (VERIFIED 2026-10-07):** polling withholds fresh events
    server-side. Seeded events published 14:28:10/14:28:13 were returned by
    `System Log / bounded recent window` at 14:28:20, but polling still
    withheld them at 14:29:00 and released them by 14:29:19, roughly 45–65 s
    after persistence. An earlier seeded pair showed the same ~75 s gap. This
    holdback is the server-side settle that makes the polling head safe to
    checkpoint; it also sets the incremental stream's minimum latency.

examples:
- name: '200 - since 89d, limit 1000, all 441 events (projection: uuid, published, eventType)'
  request:
    url: '{{base_url}}/logs?since=2026-07-10T00%3A00%3A00Z&sortOrder=ASCENDING&limit=1000'
    method: GET
  response:
    status: 200
    statusText: OK
    headers:
    - name: content-type
      value: application/json
    - name: x-rate-limit-limit
      value: '60'
    - name: x-rate-limit-remaining
      value: '59'
    - name: x-rate-limit-reset
      value: '1791382732'
    - name: link
      value: <{{base_url}}/logs?since=2026-07-10T00%3A00%3A00Z&limit=1000&sortOrder=ASCENDING>; rel="self", <{{base_url}}/logs?since=2026-07-10T00%3A00%3A00Z&limit=1000&sortOrder=ASCENDING&after=1791382154413_1>; rel="next"
