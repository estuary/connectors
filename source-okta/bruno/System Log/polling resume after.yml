info:
  name: polling resume after
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/logs?sortOrder=ASCENDING&limit=1000&after={{logs_after}}"
  params:
    - name: sortOrder
      value: ASCENDING
      type: query
    - name: limit
      value: "1000"
      type: query
    - name: after
      value: "{{logs_after}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Pull a token from `polling first page` only when none was supplied: neither
        // a runtime var from an earlier request in this run nor a real (non-PIN_)
        // env value, e.g. `--env-var logs_after=...`. Checking only the runtime var
        // would let the nested call silently replace a token passed on the CLI.
        const pinned = bru.getEnvVar('logs_after');
        if (!bru.getVar('logs_after') && (!pinned || pinned.startsWith('PIN_'))) {
          await bru.runRequest('System Log/polling first page');
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** https://developer.okta.com/docs/reference/system-log-query/

  **WHY:** the steady-state incremental request: resume from a checkpointed
  `after` token. At the head of the log this is the empty polling page — does
  it still carry a next link, and does that link equal `self` (is the token
  stable when nothing new arrived)?

  **VERIFIED (2026-10-07):**
  - At the head, an empty page still carries `rel="next"`, identical to
    `self`: the token does not move until new events are released, so an
    empty poll has nothing to checkpoint.
  - A request rebuilt from the token alone (`after` + `limit` +
    `sortOrder`, no `since`) resumes exactly where the issuing page ended
    (241 remaining of 441, contiguous). The connector can checkpoint just
    the token and need not store the whole next URL.
  - The head token captured at 14:17 was replayed after two seeded group
    events (create/delete, 14:21:38/41). It still returned nothing at +14 s
    and returned both events at +75 s, with the next token advanced to
    their persistence ms. The token survived unrelated tenant changes
    between issue and reuse.

  **VERIFIED (2026-10-16):** a minted token is served like an issued one,
  and `<n>` counts events from `<epoch-ms>` on, not "after this ms".
  Event `c1035a75…` was persisted at `1788464187011`.
  `after=1788464187010_1` skips it (the `_1` counts it, so nothing sits at
  `…010`), `after=1788464187011_1` skips it, and `after=1788464187011_0`
  returns it first, with the same head as `since=…27.011Z` (`System Log / polling
  since boundary probe`). So `<ms>_0` is the exact equivalent of an
  inclusive `since=<ms>`: the connector seeds its incremental cursor with
  `<cutoff ms>_0` and never sends `since` when polling. `<ms − 1>_1` would
  instead lose the first event at `<ms>`.

  **GATE-OPAQUE-CURSOR evidence.** The provider documents the token only as
  "Opaque token" ("Retrieves the next page of results. Okta returns a link
  in the HTTP Header (`rel=next`) that includes the after query
  parameter" — DOCUMENTED 2026-10-07, OpenAPI `listLogEvents`, v2026.09.2),
  and states no expiry. Observed: it is a pure position value
  (`<persistence epoch-ms>_<n>`), not a server session handle. A token
  positioned 34 days back resumes, and a position 189 days back is clamped
  rather than rejected (`System Log / stale after probe`).
  **UNOBSERVABLE:** a literal multi-day wall-clock gap between issue and
  reuse, and any future change to the token format. Assumed: a value-encoded
  position cannot expire. Fallback: a 400 on a checkpointed token surfaces
  as a capture error, and re-backfilling the binding recovers.

examples:
- name: 200 - head of log, empty page, next == self (token unchanged)
  request:
    url: '{{base_url}}/logs?sortOrder=ASCENDING&limit=1000&after=1791382154413_1'
    method: GET
  response:
    status: 200
    statusText: OK
    headers:
    - name: content-type
      value: application/json
    - name: x-rate-limit-limit
      value: '60'
    - name: x-rate-limit-remaining
      value: '58'
    - name: x-rate-limit-reset
      value: '1791382732'
    - name: link
      value: <{{base_url}}/logs?limit=1000&sortOrder=ASCENDING&after=1791382154413_1>; rel="self", <{{base_url}}/logs?limit=1000&sortOrder=ASCENDING&after=1791382154413_1>; rel="next"
    body:
      type: json
      data: '[]'
- name: '200 - resume mid-history token, remaining 241 of 441, contiguous (projection: uuid, published)'
