info:
  name: sort key probe
  type: http
  seq: 7

http:
  method: GET
  url: "{{base_url}}/groups?limit=200&search=created gt \"1970-01-01T00:00:00.000Z\"&sortBy={{groups_sort}}&sortOrder={{groups_order}}"
  params:
    - name: limit
      value: "200"
      type: query
    - name: search
      value: created gt "1970-01-01T00:00:00.000Z"
      type: query
    - name: sortBy
      value: "{{groups_sort}}"
      type: query
    - name: sortOrder
      value: "{{groups_order}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - sortBy=created asc (same rows and order for sortBy=id asc) (projection)
    request:
      url: "{{base_url}}/groups?limit=200&search=created gt \"1970-01-01T00:00:00.000Z\"&sortBy=created&sortOrder=asc"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          [
            { "id": "00g176zmw9j1Wyxqf698", "created": "2026-09-03T19:36:27.000Z" },
            { "id": "00g176zmw9kqvHDny698", "created": "2026-09-03T19:36:27.000Z" },
            { "id": "00g18gur2rc3zz7MS698", "created": "2026-10-07T14:36:50.000Z" },
            { "id": "00g18h004ubJFvh3C698", "created": "2026-10-07T16:20:22.000Z" }
          ]
  - name: 200 - sortBy=created desc reverses it (sortBy=lastUpdated desc gives the same order) (projection)
    request:
      url: "{{base_url}}/groups?limit=200&search=created gt \"1970-01-01T00:00:00.000Z\"&sortBy=created&sortOrder=desc"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          [
            { "id": "00g18h004ubJFvh3C698", "created": "2026-10-07T16:20:22.000Z" },
            { "id": "00g18gur2rc3zz7MS698", "created": "2026-10-07T14:36:50.000Z" },
            { "id": "00g176zmw9j1Wyxqf698", "created": "2026-09-03T19:36:27.000Z" },
            { "id": "00g176zmw9kqvHDny698", "created": "2026-09-03T19:36:27.000Z" }
          ]

docs: |-
  **REFERENCE:** [List all groups](https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Group/#tag/Group/operation/listGroups)

  **WHY:** `filter` can't sort and Groups `search` ignored `sortBy=lastUpdated`
  (`Groups / sort probe`). This checks whether `search` honors a sort on an
  immutable key, `created` or `id`, which would allow a value-watermark
  backfill for Groups. Run with `--env-var groups_sort=created|id|lastUpdated`
  and `--env-var groups_order=asc|desc`.

  **VERIFIED (2026-10-08):** `search` honors `sortOrder`: `created desc`
  exactly reverses `created asc`. `sortBy=id asc` returned the same order as
  `created asc`, and `lastUpdated desc` the same as `created desc`. For these 4
  groups, id, `created` and true `lastUpdated` (from `Groups / bare`) all order
  identically, so which key each `sortBy` really applies is not yet separable.
  Telling them apart needs a group whose `created` order differs from its true
  `lastUpdated` order. Bodies are still index copies with index-stamped
  `lastUpdated` (`Groups / sort probe`).
