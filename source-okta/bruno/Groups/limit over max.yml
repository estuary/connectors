info:
  name: limit over max
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/groups?limit=10001&filter=lastUpdated gt \"1970-01-01T00:00:00.000Z\""
  params:
    - name: limit
      value: "10001"
      type: query
    - name: filter
      value: lastUpdated gt "1970-01-01T00:00:00.000Z"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - limit 10001 clamped to 10000 (self link rewritten), 4 items (projection)
    request:
      url: "{{base_url}}/groups?limit=10001&filter=lastUpdated gt \"1970-01-01T00:00:00.000Z\""
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: link
          value: <https://okta-domain-from-config/api/v1/groups?limit=10000&filter=lastUpdated+gt+%221970-01-01T00%3A00%3A00.000Z%22>; rel="self"
      body:
        type: json
        data: |-
          [
            { "id": "00g18gur2rc3zz7MS698" },
            { "id": "00g18h004ubJFvh3C698" },
            { "id": "00g176zmw9j1Wyxqf698" },
            { "id": "00g176zmw9kqvHDny698" }
          ]

docs: |-
  **REFERENCE:** [List all groups](https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Group/#tag/Group/operation/listGroups)

  **WHY:** checks whether `limit=10001`, one past the documented maximum of
  10000, is rejected or clamped. The connector uses 200 (Okta's recommended
  ceiling) regardless; this records the enforcement mode.

  **VERIFIED (2026-10-07):** silent clamp. The request returns 200, and the
  `self` link comes back rewritten to `limit=10000`.

  **DOCUMENTED (2026-10-07):** "We recommend using a limit less than or equal to
  200." (`listGroups`). The connector sends 200, matching Users, so one page
  size serves both streams.
