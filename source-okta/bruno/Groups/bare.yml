info:
  name: bare
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/groups?limit=200"
  params:
    - name: limit
      value: "200"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - 4 groups (2 OKTA_GROUP, 2 BUILT_IN); full shape of Everyone, others projected
    request:
      url: "{{base_url}}/groups?limit=200"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: link
          value: <https://okta-domain-from-config/api/v1/groups?limit=200>; rel="self"
        - name: x-rate-limit-limit
          value: "250"
      body:
        type: json
        data: |-
          [
            { "id": "00g18gur2rc3zz7MS698", "type": "OKTA_GROUP", "lastUpdated": "2026-10-07T14:36:50.000Z", "lastMembershipUpdated": "2026-10-07T14:37:12.000Z" },
            { "id": "00g18h004ubJFvh3C698", "type": "OKTA_GROUP", "lastUpdated": "2026-10-07T16:20:31.000Z", "lastMembershipUpdated": "2026-10-07T16:20:27.000Z" },
            {
              "id": "00g176zmw9j1Wyxqf698",
              "created": "2026-09-03T19:36:27.000Z",
              "lastUpdated": "2026-09-03T19:36:27.000Z",
              "lastMembershipUpdated": "2026-10-07T16:20:12.000Z",
              "objectClass": ["okta:user_group"],
              "type": "BUILT_IN",
              "profile": { "name": "Everyone", "description": "All users in your organization" },
              "_links": "REDACTED"
            },
            { "id": "00g176zmw9kqvHDny698", "type": "BUILT_IN", "lastUpdated": "2026-09-03T19:36:27.000Z", "lastMembershipUpdated": "2026-09-03T19:36:27.000Z" }
          ]

docs: |-
  **REFERENCE:** [List all groups](https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Group/#tag/Group/operation/listGroups)

  **WHY:** shows the Group object (`lastUpdated` versus `lastMembershipUpdated`,
  and the `type` values) and the response envelope, and fixes the unfiltered
  population.

  **VERIFIED (2026-10-07):** a bare JSON array with `Link`-header pagination.
  Item keys are `id, created, lastUpdated, lastMembershipUpdated, objectClass,
  type, profile{name, description}, _links`. `lastMembershipUpdated` is
  populated on every group, and a freshly created group carries
  `lastMembershipUpdated = created` (see `Seeding / Create Fixture Group`), so it is
  never null in this org.

  **VERIFIED (2026-10-07):** the BUILT_IN Everyone group's
  `lastMembershipUpdated` moves whenever a user is created (16:20:12 = creation
  of the user from `Seeding / Create Active User`), while its `lastUpdated`
  stays at org creation. The unfiltered order is not id order.

  **VERIFIED (2026-10-07):** `x-rate-limit-limit: 250` on `/groups` for this
  token.
