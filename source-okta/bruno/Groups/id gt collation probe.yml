docs: |-
  **REFERENCE:** [List all groups](https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Group/#tag/Group/operation/listGroups)

  **WHY:** the groups backfill resumes each page with the exact `search` shape
  sent here, `(<window>) and id gt "<last id>"`. Resuming is gapless only if
  `id gt` compares ids the same way `sortBy=id` orders them
  (`Groups / id sort probe`). Okta ids mix upper and lower case, so the two
  candidate comparisons, byte order and case-insensitive order, disagree on
  some bounds. Run with `--env-var groups_id_gt_bound=<bound>`, using
  bounds built from an existing id so that the comparisons disagree on it.

  Each bound copies `00g18h004ubJFvh3C698` up to its first mixed-case
  character, `J` at index 11, then varies that character:

  | bound ends | byte order | case-insensitive | lower before upper | observed |
  |---|---|---|---|---|
  | `…a` | excluded | included | included | included |
  | `…k` | excluded | excluded | included | excluded |
  | `…jF` (prefix) | excluded | included | included | included |
  | `…B` | included | included | included | included |
  | `…Z` | excluded | excluded | excluded | excluded |
  | exact id | excluded | excluded | excluded | excluded |

  **VERIFIED (2026-10-19):** `id gt` inside `search` compares ids
  case-insensitively, and strictly: the exact id is excluded. Only the
  case-insensitive column matches every observed row. Whether `sortBy=id` orders
  the same way is UNOBSERVABLE (`Groups / id sort probe`).
