info:
  name: after fallout probe
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/groups?limit=2&filter=lastUpdated le \"2026-10-07T16:21:00.000Z\"&after={{groups_after}}"
  params:
    - name: limit
      value: "2"
      type: query
    - name: filter
      value: lastUpdated le "2026-10-07T16:21:00.000Z"
      type: query
    - name: after
      value: "{{groups_after}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - page 1, ends on the fixture group (projection)
    request:
      url: "{{base_url}}/groups?limit=2&filter=lastUpdated le \"2026-10-07T16:21:00.000Z\"&after="
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: link
          value: <https://okta-domain-from-config/api/v1/groups?limit=2&filter=lastUpdated+le+%222026-10-07T16%3A21%3A00.000Z%22>; rel="self", <https://okta-domain-from-config/api/v1/groups?after=00g18h004ubJFvh3C698&limit=2&filter=lastUpdated+le+%222026-10-07T16%3A21%3A00.000Z%22>; rel="next"
      body:
        type: json
        data: |-
          [
            { "id": "00g18gur2rc3zz7MS698", "lastUpdated": "2026-10-07T14:36:50.000Z" },
            { "id": "00g18h004ubJFvh3C698", "lastUpdated": "2026-10-07T16:20:31.000Z" }
          ]
  - name: 200 - page 2 after the anchor left the set (lastUpdated now 16:25:58) → resumes in place (projection)
    request:
      url: "{{base_url}}/groups?limit=2&filter=lastUpdated le \"2026-10-07T16:21:00.000Z\"&after=00g18h004ubJFvh3C698"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: link
          value: <https://okta-domain-from-config/api/v1/groups?after=00g18h004ubJFvh3C698&limit=2&filter=lastUpdated+le+%222026-10-07T16%3A21%3A00.000Z%22>; rel="self"
      body:
        type: json
        data: |-
          [
            { "id": "00g176zmw9j1Wyxqf698", "lastUpdated": "2026-09-03T19:36:27.000Z" },
            { "id": "00g176zmw9kqvHDny698", "lastUpdated": "2026-09-03T19:36:27.000Z" }
          ]

docs: |-
  **REFERENCE:** [Pagination](https://developer.okta.com/docs/api/#pagination)

  **WHY:** in a backfill or incremental drain, the group named by `after` can be
  updated between pages, so its `lastUpdated` leaves the filtered set. This
  checks whether the next page still resumes in place or skips or repeats rows,
  given that Groups' `filter` order is not id order.

  Procedure: page 1 with `--env-var groups_after=` (it should end on the
  fixture group from `Seeding / Create Fixture Group`). Then run
  `Seeding / Update Group Profile` with `--env-var seed_group_id=<that id>` to
  move it past the bound. Then request page 2 with `groups_after=<that id>`.

  **VERIFIED (2026-10-07):** page 1 ended on fixture `00g18h004ubJFvh3C698`
  (`lastUpdated` 16:20:31, inside `le 16:21:00`). The profile edit moved it to
  16:25:58, outside the filter. Page 2 with `after=00g18h004ubJFvh3C698` still
  returned exactly the two remaining BUILT_IN groups, with no skip and no
  repeat. `after` seeks past an anchor that no longer matches, so a mid-drain
  update cannot shift a bystander row out of the walk.
