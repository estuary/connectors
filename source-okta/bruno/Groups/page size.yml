info:
  name: page size
  type: http
  seq: 8

http:
  method: GET
  url: "{{base_url}}/groups?limit=1000&filter=lastUpdated gt \"1970-01-01T00:00:00.000Z\""
  params:
    - name: limit
      value: "1000"
      type: query
    - name: filter
      value: lastUpdated gt "1970-01-01T00:00:00.000Z"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - limit 1000 kept as-is in the self link, 4 items (projection)
    request:
      url: "{{base_url}}/groups?limit=1000&filter=lastUpdated gt \"1970-01-01T00:00:00.000Z\""
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: link
          value: <https://okta-domain-from-config/api/v1/groups?limit=1000&filter=lastUpdated+gt+%221970-01-01T00%3A00%3A00.000Z%22>; rel="self"
      body:
        type: json
        data: |-
          [
            { "id": "00g18gur2rc3zz7MS698" },
            { "id": "00g18h004ubJFvh3C698" },
            { "id": "00g176zmw9j1Wyxqf698" },
            { "id": "00g176zmw9kqvHDny698" }
          ]

docs: |-
  **REFERENCE:** [List all groups](https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Group/#tag/Group/operation/listGroups)

  **WHY:** the connector's Groups page size, `Group.PAGE_SIZE = 1000` (user decision,
  2026-10-08). This is above Okta's "≤ 200" recommendation and below the 10000
  maximum (`Groups / limit over max`). It confirms Okta takes 1000 under
  `filter` without clamping it.

  **VERIFIED (2026-10-08):** 200, and the `self` link keeps `limit=1000`, so
  there's no clamp.

  **UNOBSERVABLE:** how a full 1000-group page performs (latency, timeouts).
  The sandbox has 4 groups. Okta's only stated risk is timeouts ("If your
  request times out, retry your request with a smaller `limit`"); the
  connector relies on the CDK's standard retry and has no shrink-on-timeout
  logic. Revisit if production logs show timeouts on `/groups`.
