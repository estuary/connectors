docs: |-
  **REFERENCE:** [Retrieve a user schema](https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Schema/#tag/Schema/operation/getUserSchema)

  **WHY:** reads a schema through a user type's `_links.schema.href`, the path a per-type
  iteration follows. Proves the href's last segment is a valid `schemaId` and whether the
  `default` alias and the default type's concrete id return the same object.

  **VERIFIED (2026-10-07):** the href's last segment works as `schemaId`. The default type's
  concrete id returns the same object as `/default` (same `id` alias URL).

  **VERIFIED (2026-10-07):** a non-default type (`Seeding / Create User Type`) has its own schema
  whose `id` is its concrete URL `…/meta/schemas/user/osc18gusqxw7j8TeA698`, its own
  `name`/`title` (the type's), and its **own** `definitions.custom` — empty here even
  though the default type has `estuarySeedCostCode`. Custom attributes are per user type,
  so reading only `/default` would miss every non-default type's attributes: the stream
  must iterate types.
