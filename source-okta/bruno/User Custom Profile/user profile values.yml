docs: |-
  **REFERENCE:** [List all users](https://developer.okta.com/docs/api/openapi/okta-management/management/tag/User/#tag/User/operation/listUsers)

  **WHY:** `User_Custom_Profile` is per-user custom attribute *values*, matching Fivetran's
  `user_custom_profile` table: one row per user per custom attribute, columns `name` (PK),
  `users_id` (PK, FK → users), `value`. The user supplied that schema on 2026-10-08 (the
  Fivetran docs pages render client-side, so no fetcher can read them). This probe shows how
  custom values arrive in `/users`, and so how the Users fetch can derive the resource.
  Decided 2026-10-08: the resource is reassigned to the Users cluster.

  **VERIFIED (2026-10-07):** `profile` is one flat object; base and custom attributes are not
  separated. After `Seeding / Add Custom User Attribute`, users who have no value for it
  show **no** `estuarySeedCostCode` key at all (unset custom attributes are omitted, while
  some unset base attributes such as `mobilePhone` appear as `null`). So a per-user
  "custom values" document would need the schema's custom-attribute names to pick keys out
  of `profile`. Each user carries `type.id`, which maps to its user type (and schema).

  **VERIFIED (2026-10-08, `Seeding / Set Custom Value` + `Users / get by id`):** a user
  *with* a custom value set carries it as a plain top-level `profile` key
  (`"estuarySeedCostCode": "CC-12"`), and the partial profile update moves `lastUpdated`.
