docs: |-
  **REFERENCE:** [List all user types](https://developer.okta.com/docs/api/openapi/okta-management/management/tag/UserType/#tag/UserType/operation/listUserTypes)

  **WHY:** each user type owns its own profile schema (`_links.schema.href`). Establishes how
  many types the org has, the envelope, and the schema-id shape, which decides whether
  User_Custom_Profile iterates types or reads only `default`. The after-response script
  captures a schema id into `user_schema_id` for `User Custom Profile / schema by type`.

  **VERIFIED (2026-10-07):** bare JSON array of `UserType`, no `Link` header at all (not
  paginated; Okta caps an org at 10 types: `default` + 9, OpenAPI spec v2026.09.2 (`management-oneOfInheritance.yaml`) `createUserType`).
  Each type carries `id` (`oty…`), `name`, `displayName`, `default`, `created`,
  `lastUpdated`, `createdBy`, `lastUpdatedBy`, and `_links.schema.href` =
  `…/api/v1/meta/schemas/user/osc…`. The schema id shares the type id's suffix
  (`oty176zmw9ti8gVdP698` ↔ `osc176zmw9ti8gVdP698`), but the connector takes it from the
  link, not by string surgery.
