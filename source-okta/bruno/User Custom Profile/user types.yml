info:
  name: user types
  type: http
  seq: 1

http:
  method: GET
  url: '{{base_url}}/meta/types/user'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: after-response
      code: |-
        // Capture the schema id of the first NON-default user type (falls back to the default
        // type) from `_links.schema.href` for `User Custom Profile / schema by type`.
        // Non-secret resource id; runtime vars are in-memory only.
        const types = res.getBody();
        if (Array.isArray(types) && types.length) {
          const t = types.find((x) => !x.default) || types[0];
          const href = t?._links?.schema?.href || '';
          bru.setVar('user_schema_id', href.split('/').pop());
        }

