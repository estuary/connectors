docs: |-
  **REFERENCE:** [Retrieve a user schema](https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Schema/#tag/Schema/operation/getUserSchema)

  **WHY:** the default user type's profile schema: `definitions.base` (Okta-defined) and
  `definitions.custom.properties` (the org's custom attributes). Confirms the token's role
  can read it, the object's key set, and whether `id` is stable enough to key on.

  **VERIFIED (2026-10-07):** readable with this token (super admin). Keys: `id`, `$schema`,
  `name`, `title`, `description`, `created`, `lastUpdated`, `definitions.base`,
  `definitions.custom`, `type`, `properties.profile`, `_links`. `definitions.base.properties`
  holds 31 Okta-defined attributes.

  **VERIFIED (2026-10-07):** a custom attribute definition (after
  `Seeding / Add Custom User Attribute`) is an object keyed by attribute name under
  `definitions.custom.properties`, with `title`, `description`, `type`, `mutability`,
  `scope`, `permissions[]`, `master.type`; Okta filled in the defaults we did not send.
  Adding the attribute advanced the schema's `lastUpdated` (2026-09-03 → 2026-10-07).

  **VERIFIED (2026-10-07):** `id` here is the alias URL `https://<org>/meta/schemas/user/default`,
  **not** the concrete `…/osc…` id that `_links.self.href` shows. The same object read via
  `User Custom Profile / schema by type` (default type's `osc…` id) returns the identical
  `id`. The `id` also embeds the org host. Neither is a usable stable key on its own; the
  user type id (from `User Custom Profile / user types`) is.
