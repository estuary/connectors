http:
  method: GET
  url: '{{base_url}}/apps?limit=201'
  params:
    - name: limit
      value: '201'
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - limit 201 silently clamped to 200 (self link shows limit=200; projection)"
    request:
      url: "{{base_url}}/apps?limit=201"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: content-type
          value: "application/json"
        - name: x-rate-limit-limit
          value: "50"
        - name: link
          value: "<https://integrator-9297012.okta.com/api/v1/apps?limit=200>; rel=\"self\""
      body:
