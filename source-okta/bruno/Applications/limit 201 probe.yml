docs: |-
  **REFERENCE:** [List all applications](https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Application/#tag/Application/operation/listApplications)

  **WHY:** documented max page size is 200 (OpenAPI spec v2026.09.2 (`management-oneOfInheritance.yaml`)). One past it records the enforcement
  mode (reject vs. clamp) so the connector knows whether it must clamp `limit` itself.

  **VERIFIED (2026-10-07):** silent clamp: `200`, and the `self` link rewrites the request to
  `limit=200`. Not rejected. The connector sends `limit=200`. Whether the clamp could
  truncate without a next link is not observable here (org has 8 apps, far below 200);
  the connector completes on the absence of `rel="next"`, which the docs state is present
  whenever more rows remain — that contract, not the requested size, governs completion.
