docs: |-
  **REFERENCE:** [List all applications](https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Application/#tag/Application/operation/listApplications)

  **WHY:** silent-data-loss audit. `includeNonDeleted` (default `false`) is documented as
  "include non-active, but not deleted apps" (OpenAPI spec v2026.09.2 (`management-oneOfInheritance.yaml`)). If INACTIVE apps only appeared with
  it set, the connector would need it on every snapshot or deactivated apps would vanish
  and be tombstoned. Compare with `Applications / bare` and
  `Applications / status INACTIVE filter`.

  **VERIFIED (2026-10-07):** no partition is hidden by the default. After
  `Seeding / Create Inactive Bookmark App`, the INACTIVE app appears both with and without
  `includeNonDeleted=true`; the two responses are identical (8 apps). The connector sends
  `includeNonDeleted=true` anyway, because the spec documents the default as excluding
  non-active apps even though the observed default lists them.

  **DOCUMENTED (2026-10-07):** DELETED apps are never returned by the list endpoint
  (OpenAPI spec v2026.09.2 (`management-oneOfInheritance.yaml`), `ApplicationLifecycleStatus` lists DELETED but list results exclude them).
  A deleted app disappears from the snapshot, and the CDK's snapshot tombstone records the
  deletion.
