info:
  name: status INACTIVE filter
  type: http
  seq: 3

http:
  method: GET
  url: '{{base_url}}/apps?filter=status eq "INACTIVE"'
  params:
    - name: filter
      value: 'status eq "INACTIVE"'
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - before seeding: no INACTIVE apps"
    request:
      url: "{{base_url}}/apps?filter=status%20eq%20%22INACTIVE%22"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: content-type
          value: "application/json"
        - name: x-rate-limit-limit
          value: "50"
        - name: link
          value: "<https://integrator-9297012.okta.com/api/v1/apps?limit=20&filter=status+eq+%22INACTIVE%22>; rel=\"self\""
      body:
        type: json
        data: |-
          []
  - name: "200 - after seeding: the seeded INACTIVE BOOKMARK app (projection)"
    request:
      url: "{{base_url}}/apps?filter=status%20eq%20%22INACTIVE%22"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: content-type
          value: "application/json"
        - name: x-rate-limit-limit
          value: "50"
        - name: link
          value: "<https://integrator-9297012.okta.com/api/v1/apps?limit=20&filter=status+eq+%22INACTIVE%22>; rel=\"self\""
      body:
        type: json
        data: |-
          [
            {
              "id": "0oa18gus6s1DyA92Z698",
              "name": "bookmark",
              "status": "INACTIVE",
              "signOnMode": "BOOKMARK",
              "lastUpdated": "2026-10-07T14:36:53.000Z"
            }
          ]

docs: |-
  **REFERENCE:** [List all applications](https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Application/#tag/Application/operation/listApplications)

  **WHY:** proves whether INACTIVE apps exist and are listable without
  `includeNonDeleted`. Paired with `Applications / includeNonDeleted` to decide the
  connector's default-filter handling.

  **VERIFIED (2026-10-07):** the `status` filter is honored: empty before seeding, exactly the one
  seeded INACTIVE app after `Seeding / Create Inactive Bookmark App` (narrowed 8 → 1).
  The connector does not filter by status; this only proves INACTIVE is a listable partition.
