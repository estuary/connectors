docs: |-
  **REFERENCE:** [List all applications](https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Application/#tag/Application/operation/listApplications)

  **WHY:** the request the connector's snapshot sends minus `limit`. Establishes the
  envelope, per-item key set, the `signOnMode` polymorphism, which `status` values appear
  with no filter, and the `/apps` rate-limit bucket.

  **VERIFIED (2026-10-07):** envelope is a bare JSON array (no wrapper object). Every item, of
  both observed `signOnMode`s (`OPENID_CONNECT`, `BOOKMARK`), carries the same top-level
  keys: `id`, `orn`, `name`, `label`, `status`, `created`, `lastUpdated`, `signOnMode`,
  `accessibility`, `visibility`, `features`, `credentials`, `universalLogout`,
  `settings`, `_links`. Timestamps are RFC3339 with milliseconds and `Z`.
  No secrets in the list response (`credentials` holds `userNameTemplate` and
  `signing.kid` only).

  **VERIFIED (2026-10-07):** with no params, the INACTIVE app seeded by
  `Seeding / Create Inactive Bookmark App` **is listed** alongside the ACTIVE ones —
  the `includeNonDeleted=false` default does not hide INACTIVE apps (see
  `Applications / includeNonDeleted`).

  **VERIFIED (2026-10-07):** default page size is 20 (`self` link carries `limit=20`).

  **VERIFIED (2026-10-07):** `X-Rate-Limit-Limit: 50` for this token on `/apps` (the brief's
  10/min estimate was conservative). Org has 8 apps, so a snapshot is one request.

  **UNOBSERVABLE:** `SAML_2_0`, `AUTO_LOGIN`, `WS_FEDERATION` etc. items. Their extra
  fields live under `settings`/`credentials`; the connector relies on schema inference,
  so new shapes widen the inferred schema rather than fail. Seeding a SAML app needs
  certificate and ACS configuration — out of proportion for a probe.
