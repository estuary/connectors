docs: |-
  **REFERENCE:** [List all applications](https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Application/#tag/Application/operation/listApplications)

  **WHY:** `useOptimization=true` returns "a subset of app instance properties"
  (OpenAPI spec v2026.09.2 (`management-oneOfInheritance.yaml`)). Records which properties are dropped so the plan can decide whether the
  cheaper response is acceptable.

  **VERIFIED (2026-10-07):** on this org's 7 built-in OIDC apps the response is identical to
  `Applications / bare` (no property dropped at any depth). Since the subset is
  undocumented and could drop fields on other app types, the connector does **not** send it.
