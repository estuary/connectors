info:
  name: Create Delete-Probe Group
  type: http
  seq: 17

http:
  method: POST
  url: "{{base_url}}/groups"
  body:
    type: json
    data: |-
      {
        "profile": {
          "name": "estuary-updated-delprobe-group",
          "description": "Estuary connector throwaway (updated cluster delete probe)"
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) bru.setVar('delprobe_group_id', res.getBody().id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [Add a group](https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Group/#tag/Group/operation/addGroup)

  SEEDING REQUEST. Run by the assistant under `seeding: assistant`.

  **WHY:** a throwaway group for `Seeding / Delete Delete-Probe Group`, so
  `Deletes / delete events` can show the `target[]` shape of
  `group.lifecycle.delete`.

  **Outcome:** ran 2026-10-08 and created `00g18ijkhmo0VBRTQ698` (17:25:02). It
  was deleted by `Seeding / Delete Delete-Probe Group`.
