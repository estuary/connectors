info:
  name: Assign Group to App
  type: http
  seq: 27

http:
  method: PUT
  url: "{{base_url}}/apps/{{members_seed_app_id}}/groups/{{members_seed_group_id}}"
  body:
    type: json
    data: |-
      {}
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('members_seed_app_id')) await bru.runRequest('Seeding/Create Bookmark App');
        if (!bru.getVar('members_seed_group_id')) await bru.runRequest('Seeding/Create Members Group');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** https://developer.okta.com/docs/api/openapi/okta-management/management/tag/ApplicationGroups/#tag/ApplicationGroups/operation/assignGroupToApplication

  SEEDING REQUEST — sandbox tenant only (`seeding: assistant`).

  **WHY:** a group assignment, so User B shows up in `Application users / bare` with
  `scope: GROUP` (and we learn what User A's direct+group assignment reports).

  Outcome: ran 2026-10-07 (assistant, sandbox tenant); findings VERIFIED in
  `Group members / bare`, `Application users / bare` and `Application users / parent apps`.
