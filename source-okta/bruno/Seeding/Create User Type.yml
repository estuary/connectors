docs: |-
  **REFERENCE:** [Create a user type](https://developer.okta.com/docs/api/openapi/okta-management/management/tag/UserType/#tag/UserType/operation/createUserType)

  **WHY:** the org has only the `default` user type, so per-type schema iteration and
  the non-default schema's `id` can't be observed. Okta allows nine extra types per org.
  Feeds `User Custom Profile / user types` (two types) and
  `User Custom Profile / schema by type` (its after-response picks the non-default type):
  is a non-default schema's `id` its own URL, distinct from the default's
  `.../meta/schemas/user/default`? That decides whether `id` can key the document.

  **Cleanup:** `DELETE /api/v1/meta/types/user/{typeId}` (only while no user has the type).

  Outcome: ran 2026-10-07 (assistant, `seeding: assistant`); created `oty18gusqxw7j8TeA698`. Finding VERIFIED in `User Custom Profile / schema by type`.
