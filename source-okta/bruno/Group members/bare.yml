  - name: "200 \u2014 after User B deprovisioned, B is still a member (projection: id/status/login)"
    request:
      url: "{{base_url}}/groups/00g18gur2rc3zz7MS698/users?limit=200"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: content-type
          value: "application/json"
        - name: link
          value: "<https://okta-domain/api/v1/groups/00g18gur2rc3zz7MS698/users?limit=200>; rel=\"self\""
        - name: x-rate-limit-limit
          value: "250"
      body:
        type: json
        data: |-
          [
            {
              "id": "00u18gupu552EU005698",
