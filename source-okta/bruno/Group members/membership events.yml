                },
                {
                  "type": "UserGroup",
                  "id": "00g18gur2rc3zz7MS698"
                }
              ]
            },
            {
              "eventType": "group.user_membership.add",
              "published": "2026-10-07T14:37:12.879Z",
              "outcome": {
