info:
  name: membership events group delete
  type: http
  seq: 10

http:
  method: GET
  url: "{{base_url}}/logs?since=2026-10-09T17:25:00.000Z&until=2026-10-09T17:30:00.000Z&filter=eventType sw \"group.user_membership\" or eventType sw \"group.lifecycle\"&sortOrder=ASCENDING&limit=100"
  params:
    - name: since
      value: "2026-10-09T17:25:00.000Z"
      type: query
    - name: until
      value: "2026-10-09T17:30:00.000Z"
      type: query
    - name: filter
      value: eventType sw "group.user_membership" or eventType sw "group.lifecycle"
      type: query
    - name: sortOrder
      value: ASCENDING
      type: query
    - name: limit
      value: "100"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** https://developer.okta.com/docs/reference/system-log-query/

  **WHY:** The window covers `Seeding / Create Doomed Group`, `Seeding / Add User A to Doomed
  Group` and `Seeding / Delete Doomed Group` (2026-10-09). Answers whether deleting a group that
  still has members logs a `group.user_membership.remove` per member, or only
  `group.lifecycle.delete`.

  **LIMITATION (VERIFIED 2026-10-09):** only `group.lifecycle.delete` (target: the
  `UserGroup`) is logged; no `group.user_membership.remove` for the member, checked 37 s
  after the delete and again about an hour later. Group_members cannot tombstone a deleted group's memberships; the Groups
  stream's delete document is the source of truth for group existence.

examples:
  - name: "200 \u2014 group delete logs only group.lifecycle.delete, no per-member remove (projection: eventType/published/outcome/target)"
    request:
      url: "{{base_url}}/logs?since=2026-10-09T17%3A25%3A00.000Z&until=2026-10-09T17%3A30%3A00.000Z&filter=eventType%20sw%20%22group.user_membership%22%20or%20eventType%20sw%20%22group.lifecycle%22&sortOrder=ASCENDING&limit=100"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: content-type
          value: "application/json"
        - name: link
          value: "<https://okta-domain/api/v1/logs?since=2026-10-09T17%3A25%3A00.000Z&until=2026-10-09T17%3A30%3A00.000Z&limit=100&sortOrder=ASCENDING&filter=eventType+sw+%22group.user_membership%22+or+eventType+sw+%22group.lifecycle%22>; rel=\"self\""
        - name: x-rate-limit-limit
          value: "60"
      body:
        type: json
        data: |-
          [
            {
