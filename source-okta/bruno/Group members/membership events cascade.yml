info:
  name: membership events cascade
  type: http
  seq: 8

http:
  method: GET
  url: "{{base_url}}/logs?since=2026-10-09T17:04:00.000Z&until=2026-10-09T17:10:00.000Z&filter=eventType sw \"group.user_membership\" or eventType sw \"user.lifecycle\"&sortOrder=ASCENDING&limit=100"
  params:
    - name: since
      value: "2026-10-09T17:04:00.000Z"
      type: query
    - name: until
      value: "2026-10-09T17:10:00.000Z"
      type: query
    - name: filter
      value: eventType sw "group.user_membership" or eventType sw "user.lifecycle"
      type: query
    - name: sortOrder
      value: ASCENDING
      type: query
    - name: limit
      value: "100"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** https://developer.okta.com/docs/reference/system-log-query/

  **WHY:** The window covers the 2026-10-09 User C sequence: `Seeding / Create Member User C`,
  `Seeding / Add User C to Group`, `Seeding / Remove User C from Group`, a second add, then
  `Seeding / Deactivate Member User C` and `Seeding / Delete Member User C` while C was still
  a member. It answers: the shape of `group.user_membership.remove`, and whether a hard user
  delete logs a membership removal for each of the user's groups.

  **VERIFIED (2026-10-09):** `group.user_membership.remove` has the same `target[]` shape as
  the add (`User` + `UserGroup`). A hard delete logs, in order,
  `user.lifecycle.delete.initiated`, a `group.user_membership.remove` for the explicit group,
  then `user.lifecycle.delete.completed`; nothing is logged for leaving Everyone.
  `user.lifecycle.create` targets only the `User`. Deactivation logs
  `user.lifecycle.deactivate` and no membership removal (deprovisioned users stay members —
  `Group members / bare`).

