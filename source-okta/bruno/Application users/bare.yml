              },
              "profile": {},
              "_links": {
                "app": {
                  "href": "https://okta-domain/api/v1/apps/0oa18guruj0FfvFkL698"
                },
                "user": {
                  "href": "https://okta-domain/api/v1/users/00u18gupu552EU005698"
                }
              }
            },
            {
              "id": "00u18gut4epTYtsK2698",
              "externalId": null,
              "created": "2026-10-07T14:37:47.000Z",
              "lastUpdated": "2026-10-07T14:37:47.000Z",
              "scope": "GROUP",
              "status": "ACTIVE",
              "statusChanged": "2026-10-07T14:37:47.000Z",
              "passwordChanged": null,
              "syncState": "DISABLED",
              "credentials": {
                "userName": "estuary-members-b@example.com"
              },
              "profile": {},
              "_links": {
                "app": {
                  "href": "https://okta-domain/api/v1/apps/0oa18guruj0FfvFkL698"
                },
                "user": {
                  "href": "https://okta-domain/api/v1/users/00u18gut4epTYtsK2698"
                },
                "group": {
                  "name": "estuary-members-group",
                  "href": "https://okta-domain/api/v1/groups/00g18gur2rc3zz7MS698"
                }
              }
            }
          ]
  - name: "200 \u2014 after User B deprovisioned, B is gone (projection: id/scope/status/app href)"
    request:
      url: "{{base_url}}/apps/0oa18guruj0FfvFkL698/users?limit=500"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: content-type
          value: "application/json"
        - name: link
          value: "<https://okta-domain/api/v1/apps/0oa18guruj0FfvFkL698/users?limit=500>; rel=\"self\""
        - name: x-rate-limit-limit
          value: "50"
      body:
        type: json
        data: |-
          [
            {
              "id": "00u18gupu552EU005698",
              "scope": "USER",
              "status": "ACTIVE",
              "_links.app.href": "https://okta-domain/api/v1/apps/0oa18guruj0FfvFkL698"
            }
          ]
  - name: "200 \u2014 INACTIVE app still lists its assignment (projection: id/scope/status/app href)"
    request:
      url: "{{base_url}}/apps/0oa18guruj0FfvFkL698/users?limit=500"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
