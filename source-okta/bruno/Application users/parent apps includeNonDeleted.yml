info:
  name: parent apps includeNonDeleted
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/apps?limit=200&includeNonDeleted=true"
  params:
    - name: limit
      value: "200"
      type: query
    - name: includeNonDeleted
      value: "true"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Application/#tag/Application/operation/listApplications

  **WHY:** Silent-data-loss audit of the parent drain. The spec documents
  `includeNonDeleted` (default `false`) as "include non-active, but not deleted apps",
  so the default listing may hide INACTIVE apps — and with them every user still
  assigned to one. Compare against `Application users / parent apps`.

  **VERIFIED (2026-10-07):** refuted — the default listing already returns the 2
  INACTIVE apps; `includeNonDeleted=true` returns the same 9 apps. The connector
  sends `includeNonDeleted=true` anyway, since the spec documents the default as
  excluding non-active apps even though the observed default lists them.

  **DOCUMENTED (2026-10-07):** deleted apps are excluded either way ("include
  non-active, but not deleted apps" — `listApplications` in
  https://raw.githubusercontent.com/okta/okta-management-openapi-spec/master/dist/current/management-oneOfInheritance.yaml).

