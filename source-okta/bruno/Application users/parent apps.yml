info:
  name: parent apps
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/apps?limit=200"
  params:
    - name: limit
      value: "200"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Chain: capture an app id for `Application users / bare`. Prefer the seeded
        // fixture (`Seeding / Create Bookmark App`) — built-in apps carry no per-user
        // assignments. Without the fixture, keep any id already captured rather than
        // falling back to an assignment-less built-in app.
        const apps = res.getBody();
        if (Array.isArray(apps) && apps.length) {
          const seeded = apps.find((a) => a.label === 'estuary-members-bookmark');
          if (seeded) bru.setVar('app_id', seeded.id);
          else if (!bru.getVar('app_id')) bru.setVar('app_id', apps[0].id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Application/#tag/Application/operation/listApplications

  **WHY:** Application_users iterates every app as its parent. This proves the
  parent drain: page size (`limit` max 200), the Link-header contract, and which
  apps the default listing returns (see `Application users / parent apps includeNonDeleted`).

  **VERIFIED (2026-10-07):** bare JSON array; with 9 apps under `limit=200` only
  `rel="self"` is returned. The default listing **includes INACTIVE apps** (2 of 9
  INACTIVE after `Seeding / Deactivate Bookmark App`) — no partition is hidden.
  Ids observed in ascending order, identical across runs.

  **VERIFIED (2026-10-07):** `/apps` and `/apps/{id}/users` (and app mutations)
  decrement one shared `X-Rate-Limit-Remaining`; this token's
  `X-Rate-Limit-Limit` is **50**/min on this Integrator Free tenant (the brief's
  published 20 org-wide / 10 per token is lower — size against the published figure).

examples:
  - name: "200 \u2014 default listing includes INACTIVE apps (projection: id/label/status/signOnMode)"
    request:
      url: "{{base_url}}/apps?limit=200"
      method: GET
