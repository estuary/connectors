info:
  name: assignment events
  type: http
  seq: 7

http:
  method: GET
  url: "{{base_url}}/logs?since=2026-10-07T14:37:20.000Z&until=2026-10-07T14:45:00.000Z&filter=eventType sw \"application.user_membership\" or eventType sw \"application.lifecycle\" or eventType sw \"user.lifecycle\"&sortOrder=ASCENDING&limit=100"
  params:
    - name: since
      value: "2026-10-07T14:37:20.000Z"
      type: query
    - name: until
      value: "2026-10-07T14:45:00.000Z"
      type: query
    - name: filter
      value: eventType sw "application.user_membership" or eventType sw "application.lifecycle" or eventType sw "user.lifecycle"
      type: query
    - name: sortOrder
      value: ASCENDING
      type: query
    - name: limit
      value: "100"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** https://developer.okta.com/docs/reference/system-log-query/

  **WHY:** Would an event-driven Application_users (like Group_members) be complete? The window
  covers the 2026-10-07 seeding: `Seeding / Create Bookmark App`, `Seeding / Assign User A to
  App` (direct), `Seeding / Assign Group to App` (group-granted assignment for User B),
  `Seeding / Deactivate Member User B` (assignment vanished) and `Seeding / Deactivate Bookmark
  App`. Shows which of those changes are logged as `application.user_membership.*`.

  **VERIFIED (2026-10-09, events of 2026-10-07):** both the direct (User A) and the
  group-granted (User B) assignment log `application.user_membership.add` with targets
  `AppUser` + `AppInstance` + `User`; User B's deprovisioning logs
  `application.user_membership.remove` (just before `user.lifecycle.deactivate`); app
  deactivation logs only `application.lifecycle.deactivate` (assignments stay). Not used:
  Application_users stays a snapshot because add/remove events don't refresh assignment state
  (`status`, `syncState`, app `profile`) — see `plan-application_users.md` §5.

examples:
