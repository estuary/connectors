info:
  name: deprovisioned coverage
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/users?limit=200&filter=lastUpdated gt \"1970-01-01T00:00:00.000Z\""
  params:
    - name: limit
      value: "200"
      type: query
    - name: filter
      value: lastUpdated gt "1970-01-01T00:00:00.000Z"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - all 5 users incl. 2 DEPROVISIONED, id-ascending (projection)
    request:
      url: "{{base_url}}/users?limit=200&filter=lastUpdated gt \"1970-01-01T00:00:00.000Z\""
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          [
            { "id": "00u176zmwbsJ1Uak8698", "status": "ACTIVE", "lastUpdated": "2026-09-03T19:37:36.000Z" },
            { "id": "00u18gupu552EU005698", "status": "STAGED", "lastUpdated": "2026-10-07T14:36:28.000Z" },
            { "id": "00u18gut4epTYtsK2698", "status": "DEPROVISIONED", "lastUpdated": "2026-10-07T14:39:17.000Z" },
            { "id": "00u18gzxz10URexK9698", "status": "DEPROVISIONED", "lastUpdated": "2026-10-07T16:20:07.000Z" },
            { "id": "00u18h00o173Yc9fV698", "status": "STAGED", "lastUpdated": "2026-10-07T16:20:17.000Z" }
          ]

docs: |-
  **REFERENCE:** [List all users](https://developer.okta.com/docs/api/openapi/okta-management/management/tag/User/#tag/User/operation/listUsers)

  **WHY:** the unfiltered list omits DEPROVISIONED users. This request checks
  whether a bare `lastUpdated` filter (no `status` clause) includes them, which
  decides whether the connector needs Airbyte's `status eq …` OR-chain.

  **DOCUMENTED (2026-10-07):** "This operation omits users that have a status of
  `DEPROVISIONED` in the response. To return all users, use a filter or search
  query instead." On `filter`: "Returned users include those with the
  `DEPROVISIONED` status." (OpenAPI spec v2026.09.2, `listUsers`.)

  **VERIFIED (2026-10-07):** a bare `lastUpdated gt "1970-01-01T00:00:00.000Z"`
  returns all 5 users, including both DEPROVISIONED ones (one deactivated by
  `Seeding / Deactivate User`), against 3 from `Users / bare`. No `status`
  OR-chain is needed: any `lastUpdated` filter is the "include DEPROVISIONED"
  switch.

  **VERIFIED (2026-10-07):** `filter` results come back id-ascending (5 of 5),
  which here also coincides with `created` order. The docs specify no order;
  see `Users / after page`.
