info:
  name: after page
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/users?limit=2&filter=lastUpdated gt \"1970-01-01T00:00:00.000Z\"&after={{users_after}}"
  params:
    - name: limit
      value: "2"
      type: query
    - name: filter
      value: lastUpdated gt "1970-01-01T00:00:00.000Z"
      type: query
    - name: after
      value: "{{users_after}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - page 1 of 3, next after = last id (projection)
    request:
      url: "{{base_url}}/users?limit=2&filter=lastUpdated gt \"1970-01-01T00:00:00.000Z\"&after="
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: link
          value: <https://okta-domain-from-config/api/v1/users?limit=2&filter=lastUpdated+gt+%221970-01-01T00%3A00%3A00.000Z%22>; rel="self", <https://okta-domain-from-config/api/v1/users?after=00u18gupu552EU005698&limit=2&filter=lastUpdated+gt+%221970-01-01T00%3A00%3A00.000Z%22>; rel="next"
      body:
        type: json
        data: |-
          [
            { "id": "00u176zmwbsJ1Uak8698", "lastUpdated": "2026-09-03T19:37:36.000Z" },
            { "id": "00u18gupu552EU005698", "lastUpdated": "2026-10-07T14:36:28.000Z" }
          ]
  - name: 200 - page 2 of 3, next after = last id (projection)
    request:
      url: "{{base_url}}/users?limit=2&filter=lastUpdated gt \"1970-01-01T00:00:00.000Z\"&after=00u18gupu552EU005698"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: link
          value: <https://okta-domain-from-config/api/v1/users?after=00u18gupu552EU005698&limit=2&filter=lastUpdated+gt+%221970-01-01T00%3A00%3A00.000Z%22>; rel="self", <https://okta-domain-from-config/api/v1/users?after=00u18gzxz10URexK9698&limit=2&filter=lastUpdated+gt+%221970-01-01T00%3A00%3A00.000Z%22>; rel="next"
      body:
        type: json
        data: |-
          [
            { "id": "00u18gut4epTYtsK2698", "lastUpdated": "2026-10-07T14:39:17.000Z" },
            { "id": "00u18gzxz10URexK9698", "lastUpdated": "2026-10-07T16:20:07.000Z" }
          ]
  - name: 200 - page 3 of 3, no next link (projection)
    request:
      url: "{{base_url}}/users?limit=2&filter=lastUpdated gt \"1970-01-01T00:00:00.000Z\"&after=00u18gzxz10URexK9698"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: link
          value: <https://okta-domain-from-config/api/v1/users?after=00u18gzxz10URexK9698&limit=2&filter=lastUpdated+gt+%221970-01-01T00%3A00%3A00.000Z%22>; rel="self"
      body:
        type: json
        data: |-
          [
            { "id": "00u18h00o173Yc9fV698", "lastUpdated": "2026-10-07T16:20:17.000Z" }
          ]

docs: |-
  **REFERENCE:** [Pagination](https://developer.okta.com/docs/api/#pagination)

  **WHY:** walks the filtered list two at a time by following the `Link`
  `rel="next"` header. It shows (a) the end-of-list signal, (b) whether the
  `after` token is the last returned id (which makes paging deletion-proof) or
  something positional, and (c) the order of `filter` results. Run with
  `--env-var users_after=` (empty) for page 1, then pass each `next` link's
  `after` value.

  **VERIFIED (2026-10-07):** pages of 2 + 2 + 1 reassemble the full set of 5 seen
  in `Users / deprovisioned coverage`, in the same id-ascending order with no
  gap or duplicate. The `next` link's `after` is the last returned user id, so
  paging seeks by key, not by position. The end of the list is the absence of a
  `rel="next"` link. The `next` URL echoes `limit` and `filter`, so following it
  verbatim keeps the query.

  **DOCUMENTED (2026-10-07):** "It's important to follow these Link header
  values instead of constructing your own URLs as query parameters or cursor
  formats may change without notice." https://developer.okta.com/docs/api/#link-header.
  The docs say nothing about cursor lifetime, so the connector follows `next`
  in memory and never checkpoints `after` (`GATE-OPAQUE-CURSOR`). That the
  token equals the last id is an observation, not a contract.
