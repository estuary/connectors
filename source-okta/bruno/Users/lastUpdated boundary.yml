docs: |-
  **REFERENCE:** [List all users](https://developer.okta.com/docs/api/openapi/okta-management/management/tag/User/#tag/User/operation/listUsers)

  **WHY:** pins the inclusivity of each `lastUpdated` operator and the
  timestamp's real resolution, using the bound set to a document's exact
  `lastUpdated` (`FETCH-SERVER-SIDE-BOUNDARIES`). Run it once per variant with
  `--env-var users_filter=…`; each variant's example is named for its filter.
  The anchor is user `00u18h00o173Yc9fV698`, `lastUpdated` 16:20:17.000Z, set by
  `Seeding / Update User Profile`.

  **VERIFIED (2026-10-07):** at the anchor's exact instant, `gt` and `lt` are
  exclusive and `ge` and `le` are inclusive. `gt 16:20:16.999Z` includes it, so
  the comparison is millisecond-precise. `gt 16:20:17.000Z` excludes it, so the
  stored value is exactly `.000` with no hidden sub-second part. Okta stamps
  whole seconds, so the tick is 1 s.

  **LIMITATION (VERIFIED 2026-10-07):** a filter timestamp without milliseconds
  (`"2026-10-07T16:20:16Z"`) is rejected with `400 E0000020 Bad request.` The
  connector must render every filter bound as `YYYY-MM-DDTHH:MM:SS.000Z`.
