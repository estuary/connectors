info:
  name: incremental window
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/users?limit=200&filter=lastUpdated gt \"{{users_since}}\" and lastUpdated le \"{{users_until}}\""
  params:
    - name: limit
      value: "200"
      type: query
    - name: filter
      value: lastUpdated gt "{{users_since}}" and lastUpdated le "{{users_until}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - (16:20:07, 16:20:17] narrows 5 to 1, both edges exact (projection)
    request:
      url: "{{base_url}}/users?limit=200&filter=lastUpdated gt \"2026-10-07T16:20:07.000Z\" and lastUpdated le \"2026-10-07T16:20:17.000Z\""
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          [
            { "id": "00u18h00o173Yc9fV698", "status": "STAGED", "lastUpdated": "2026-10-07T16:20:17.000Z" }
          ]

docs: |-
  **REFERENCE:** [List all users](https://developer.okta.com/docs/api/openapi/okta-management/management/tag/User/#tag/User/operation/listUsers)

  **WHY:** the connector's incremental window, a `(since, until]` range over
  `lastUpdated`, sent here under `filter`; the connector sends the same
  expression under `search` with `sortBy=id`. It proves the two-sided `and`
  narrows to the window. Run with
  `--env-var users_since=… --env-var users_until=…`.

  **VERIFIED (2026-10-07):** `lastUpdated gt "16:20:07.000Z" and lastUpdated le
  "16:20:17.000Z"` returns only the 16:20:17 user. It excludes the DEPROVISIONED
  user sitting exactly on the lower bound (16:20:07) and every older user, so it
  narrows 5 to 1. The window is `(since, until]` with both edges exact, so
  consecutive windows sharing a bound are gapless and non-overlapping.
