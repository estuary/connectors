docs: |-
  **REFERENCE:** [Retrieve a user](https://developer.okta.com/docs/api/openapi/okta-management/management/tag/User/#tag/User/operation/getUser)

  **WHY:** reads one user's `profile` and `lastUpdated` after each step of the
  custom-attribute lifecycle under `Seeding/`. It shows which profile changes
  move the Users cursor and how a set, cleared or schema-deleted custom
  attribute appears in `profile`. Run with `--env-var seed_user_id=<id>`; the
  fixture is `00u18h00o173Yc9fV698` (`Seeding / Create Active User`).

  **VERIFIED (2026-10-08), custom-attribute lifecycle on the fixture user:**

  | Step | User `lastUpdated` | `profile` |
  |---|---|---|
  | baseline | 2026-10-07T16:20:17 | no custom keys |
  | `Seeding / Set Custom Value` | **12:28:50** (moved) | `"estuarySeedCostCode": "CC-12"` |
  | `Seeding / Clear Custom Value` | **12:28:59** (moved) | key **omitted**, not `null` |
  | `Seeding / Add Temp Schema Attribute` (schema 12:29:16) | 12:28:59 (unchanged) | no new key |
  | `Seeding / Set Temp Attribute Value` | **12:29:33** (moved) | `"estuaryProbeTemp": "probe-value"` |
  | `Seeding / Remove Temp Schema Attribute` (schema 12:29:40) | **12:29:33 (unchanged)** | key gone |

  The set and the clear are both ordinary profile edits: they move
  `lastUpdated`, and `Users / incremental window` picks up the clear. A set
  custom value is a plain top-level `profile` key. A cleared one disappears
  from `profile`.

  **LIMITATION (VERIFIED 2026-10-08):** deleting an attribute from the user
  schema strips its values from every affected user's `profile` *without*
  moving their `lastUpdated`. `Users / incremental window` over
  `(12:29:33, 12:30:30]` returned 0 items. The Users collection keeps the
  deleted attribute's last value until that user's next unrelated change; only
  a full re-read (backfill) corrects it. Adding an attribute likewise leaves
  `lastUpdated` alone, which is harmless because no user has a value yet.
