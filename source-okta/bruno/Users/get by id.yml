info:
  name: get by id
  type: http
  seq: 7

http:
  method: GET
  url: "{{base_url}}/users/{{seed_user_id}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
