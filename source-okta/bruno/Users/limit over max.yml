info:
  name: limit over max
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/users?limit=201&filter=lastUpdated gt \"1970-01-01T00:00:00.000Z\""
  params:
    - name: limit
      value: "201"
      type: query
    - name: filter
      value: lastUpdated gt "1970-01-01T00:00:00.000Z"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - limit 201 clamped to 200 (self link rewritten), 5 items (projection)
    request:
      url: "{{base_url}}/users?limit=201&filter=lastUpdated gt \"1970-01-01T00:00:00.000Z\""
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: link
          value: <https://okta-domain-from-config/api/v1/users?limit=200&filter=lastUpdated+gt+%221970-01-01T00%3A00%3A00.000Z%22>; rel="self"
      body:
        type: json
        data: |-
          [
            { "id": "00u176zmwbsJ1Uak8698" },
            { "id": "00u18gupu552EU005698" },
            { "id": "00u18gut4epTYtsK2698" },
            { "id": "00u18gzxz10URexK9698" },
            { "id": "00u18h00o173Yc9fV698" }
          ]

docs: |-
  **REFERENCE:** [List all users](https://developer.okta.com/docs/api/openapi/okta-management/management/tag/User/#tag/User/operation/listUsers)

  **WHY:** checks whether `limit=201`, one past the documented default and
  maximum of 200, is rejected or accepted. That decides whether the connector
  must clamp its page size.

  **VERIFIED (2026-10-07):** silent clamp, not a rejection. The request returns
  200, and the `self` link comes back rewritten to `limit=200`. The connector
  sends `limit=200`.

  **UNOBSERVABLE:** whether a clamped page beyond 200 rows truncates in order.
  Observing it needs more than 200 users (bulk seeding, out of scope). The
  connector relies on the documented `next`-link contract: a clamped page still
  carries `next` whenever rows remain, and paging seeks by key (see
  `Users / after page`), so nothing is skipped either way.
