services:
  db:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    command: ["--protocol", "http", "--port", "8081"]
    ports: ["${COSMOSDB_PORT:-8091}:8081"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8081/ || wget -q -O /dev/null http://127.0.0.1:8081/ || exit 1"]
      interval: 3s
      retries: 60
    networks: [flow-test]

networks:
  flow-test:
    name: flow-test
    external: true
