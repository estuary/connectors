info:
  name: both bounds
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/conversations.history?channel={{channel_id}}&oldest={{oldest_ts}}&latest={{newest_ts}}&limit=2"
  params:
    - name: channel
      value: "{{channel_id}}"
      type: query
    - name: oldest
      value: "{{oldest_ts}}"
      type: query
    - name: latest
      value: "{{newest_ts}}"
      type: query
    - name: limit
      value: "2"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('newest_ts')) throw new Error('newest_ts not set — run `History / bare` first in this session');

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [conversations.history](https://docs.slack.dev/reference/methods/conversations.history)

  **WHY:** design question (a), part 2: the sort order with both bounds set,
  which is how every connector window queries. The backfill pages by moving
  `latest` down to the oldest `ts` it has seen, so it requires newest-first
  order here. Also shows both bounds are exclusive: neither `oldest_ts` nor
  `newest_ts` may appear.

  **PENDING:** run once credentials are in place.
