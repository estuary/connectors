info:
  name: oldest boundary
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/conversations.history?channel={{channel_id}}&oldest={{middle_ts}}&latest={{newest_ts}}&inclusive=false"
  params:
    - name: channel
      value: "{{channel_id}}"
      type: query
    - name: oldest
      value: "{{middle_ts}}"
      type: query
    - name: latest
      value: "{{newest_ts}}"
      type: query
    - name: inclusive
      value: "false"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('middle_ts')) throw new Error('middle_ts not set — run `History / bare` first in this session');

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [conversations.history](https://docs.slack.dev/reference/methods/conversations.history)

  **WHY:** design question (b): `oldest` set to a message's exact `ts`.
  Exclusive `oldest` is what lets the incremental cursor be `horizon - 1µs`
  with no gap or repeat at the seam. Expect `middle_ts` to be absent.

  **PENDING:** run once credentials are in place.
