info:
  name: limit over max
  type: http
  seq: 7

http:
  method: GET
  url: "{{base_url}}/conversations.history?channel={{channel_id}}&limit=1000"
  params:
    - name: channel
      value: "{{channel_id}}"
      type: query
    - name: limit
      value: "1000"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('channel_id')) throw new Error('channel_id not set — run `Channels / bare` first in this session');

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [conversations.history](https://docs.slack.dev/reference/methods/conversations.history)

  **WHY:** design question (c): the reference says "Maximum of 999", while the
  2025 changelog says the maximum for custom apps is 1,000. Learns which is
  enforced and how. The connector uses 999.

  **PENDING:** run once credentials are in place.
