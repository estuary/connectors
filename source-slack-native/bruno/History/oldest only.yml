info:
  name: oldest only
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/conversations.history?channel={{channel_id}}&oldest={{oldest_ts}}&limit=2"
  params:
    - name: channel
      value: "{{channel_id}}"
      type: query
    - name: oldest
      value: "{{oldest_ts}}"
      type: query
    - name: limit
      value: "2"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('oldest_ts')) throw new Error('oldest_ts not set — run `History / bare` first in this session');

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [conversations.history](https://docs.slack.dev/reference/methods/conversations.history)

  **WHY:** design question (a), part 1: the sort order when only `oldest` is
  set. The docs say "The most recent messages in the time range are returned
  first" without distinguishing bound combinations. With `limit=2`, a newest-
  first page returns `newest_ts` first; an oldest-first page returns the
  message just after `oldest_ts`. Also shows `oldest` exclusivity: `oldest_ts`
  itself must be absent.

  **PENDING:** run once credentials are in place.
