info:
  name: inclusive
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/conversations.history?channel={{channel_id}}&oldest={{middle_ts}}&latest={{middle_ts}}&inclusive=true"
  params:
    - name: channel
      value: "{{channel_id}}"
      type: query
    - name: oldest
      value: "{{middle_ts}}"
      type: query
    - name: latest
      value: "{{middle_ts}}"
      type: query
    - name: inclusive
      value: "true"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('middle_ts')) throw new Error('middle_ts not set — run `History / bare` first in this session');

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [conversations.history](https://docs.slack.dev/reference/methods/conversations.history)

  **WHY:** control for the two boundary probes: with `inclusive=true` and both
  bounds at `middle_ts`, exactly that message comes back. Proves the timestamp
  format the probes use matches the message, so an empty exclusive result
  means "excluded", not "malformed".

  **PENDING:** run once credentials are in place.
