info:
  name: latest boundary
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/conversations.history?channel={{channel_id}}&latest={{middle_ts}}&limit=1"
  params:
    - name: channel
      value: "{{channel_id}}"
      type: query
    - name: latest
      value: "{{middle_ts}}"
      type: query
    - name: limit
      value: "1"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('middle_ts')) throw new Error('middle_ts not set — run `History / bare` first in this session');

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [conversations.history](https://docs.slack.dev/reference/methods/conversations.history)

  **WHY:** design question (b): `latest` set to a message's exact `ts`. The
  docs say a message at either bound "will not be included" unless
  `inclusive=true`. Exclusive `latest` makes the backfill's page cursor (the
  oldest `ts` emitted) resume without re-reading or skipping a message, and
  makes the backfill end strictly before the cutoff. Expect the first item to be
  the message just older than `middle_ts`.

  **PENDING:** run once credentials are in place.
