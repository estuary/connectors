info:
  name: limit over max
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/conversations.members?channel={{channel_id}}&limit=1000"
  params:
    - name: channel
      value: "{{channel_id}}"
      type: query
    - name: limit
      value: "1000"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('channel_id')) throw new Error('channel_id not set — run `Channels / bare` first in this session');

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [conversations.members](https://docs.slack.dev/reference/methods/conversations.members)

  **WHY:** "specify a `limit` value under `1000`". Learns the enforcement mode
  at 1000. The connector uses 999.

  **PENDING:** run once credentials are in place.
