info:
  name: bare
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/conversations.members?channel={{channel_id}}&limit=999"
  params:
    - name: channel
      value: "{{channel_id}}"
      type: query
    - name: limit
      value: "999"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('channel_id')) throw new Error('channel_id not set — run `Channels / bare` first in this session');

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [conversations.members](https://docs.slack.dev/reference/methods/conversations.members)

  **WHY:** shape of `members[]` (bare user-ID strings, not objects), which the
  `channel_members` stream turns into `{channel_id, user_id}` documents.
  Run `Channels / bare` first in a fresh session.

  **PENDING:** run once credentials are in place.
