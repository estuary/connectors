info:
  name: bare
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/conversations.replies?channel={{channel_id}}&ts={{thread_ts}}&limit=999"
  params:
    - name: channel
      value: "{{channel_id}}"
      type: query
    - name: ts
      value: "{{thread_ts}}"
      type: query
    - name: limit
      value: "999"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('thread_ts')) throw new Error('thread_ts not set — run `History / bare` first in this session');
    - type: after-response
      code: |-
        const msgs = res.getBody()?.messages ?? [];
        const firstReply = msgs.find((m) => m.ts !== m.thread_ts);
        if (firstReply) bru.setVar('first_reply_ts', firstReply.ts);

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [conversations.replies](https://docs.slack.dev/reference/methods/conversations.replies)

  **WHY:** shape of the `threads` stream, and which item is the parent. The
  connector drops the item whose `ts` equals the parent's. The docs say replies
  come "earliest first", the reverse of history. Pins `first_reply_ts`.

  **PENDING:** run once credentials are in place.
