info:
  name: limit over max
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/conversations.replies?channel={{channel_id}}&ts={{thread_ts}}&limit=1000"
  params:
    - name: channel
      value: "{{channel_id}}"
      type: query
    - name: ts
      value: "{{thread_ts}}"
      type: query
    - name: limit
      value: "1000"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('thread_ts')) throw new Error('thread_ts not set — run `History / bare` first in this session');

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [conversations.replies](https://docs.slack.dev/reference/methods/conversations.replies)

  **WHY:** "specify a `limit` value under `1000`". Learns the enforcement mode
  at 1000. The connector uses 999.

  **PENDING:** run once credentials are in place.
