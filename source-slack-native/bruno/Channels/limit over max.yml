info:
  name: limit over max
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/conversations.list?types=public_channel&limit=1000"
  params:
    - name: types
      value: "public_channel"
      type: query
    - name: limit
      value: "1000"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [conversations.list](https://docs.slack.dev/reference/methods/conversations.list)

  **WHY:** "Must be an integer under 1000." Learns the enforcement mode at 1000.
  The connector uses 999.

  **PENDING:** run once credentials are in place.
