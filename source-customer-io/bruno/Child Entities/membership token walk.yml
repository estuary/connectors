info:
  name: membership token walk
  type: http
  seq: 12

http:
  method: GET
  url: "{{base_url}}/v1/segments/{{segment_id}}/membership?limit=1&start=MDox"
  params:
    - name: limit
      value: "1"
      type: query
    - name: start
      value: MDox
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    **REFERENCE:** https://docs.customer.io/integrations/api/app/#tag/segments/operation/listSegmentCustomers

    **WHY:** Close the walk started by `Child Entities / membership limit
    honored`: confirm the token actually advances (rather than re-serving page
    one, the `/v1/messages` failure mode) and that the walk terminates. `MDox`
    is the token that request returned; it decodes to the positional offset
    `0:1`.

    **VERIFIED (2026-09-22):** Following the token returns the **second**
    member — a different identifier from page one, not a repeat — with
    `next: ""`. The walk advances and terminates. Two `limit=1` pages reassemble
    exactly the 2 identifiers the bare request returned, in the same order, with
    no gap, duplicate or reorder.

    **VERIFIED (2026-09-22):** A token minted by this endpoint is **rejected by
    the two `actions` routes** with a 400 (`Child Entities / campaign actions
    start rejected`), which is the account-wide "tokens are per-endpoint" rule
    demonstrated across a route boundary rather than assumed.

    **VERIFIED (2026-09-22):** A token minted for **segment 1** and replayed
    against **segment 2** returns a 200 with `null` arrays rather than an error
    or segment 1's data. Harmless, but it means an offset is meaningless outside
    the segment it was issued for — another reason the token stays local to one
    generator invocation and is never checkpointed
    (`FETCH-CHECKPOINT-STABLE-STATE`).

    **On ordering:** the endpoint exposes no sort parameter, so paging relies on
    a stable default order. A 2-row walk is too small to establish that
    membership order is stable across a mutation, and it cannot be: segment
    membership changes whenever a profile's attributes change, so the row set
    under an offset is **not** frozen. That is an inherent property of this
    resource, not a gap in the probing, and it is a second independent reason
    the plan recommends dropping it — an offset walk over a mutating set drops
    rows between pages with no signal.

examples:
  - name: 200 - page two advances to the second member and terminates
    request:
      url: "https://api.customer.io/v1/segments/1/membership?limit=1&start=MDox"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "segment_id": 1,
            "ids": [
              "example_person_2"
            ],
            "identifiers": [
              {
                "cio_id": "aa0000000002",
                "email": "REDACTED",
                "id": "example_person_2"
              }
            ],
            "next": ""
          }
  - name: 200 - segment 1 token replayed against segment 2 yields null arrays
    request:
      url: "https://api.customer.io/v1/segments/2/membership?limit=1&start=MDox"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "segment_id": 2,
            "ids": null,
            "identifiers": null,
            "next": ""
          }
