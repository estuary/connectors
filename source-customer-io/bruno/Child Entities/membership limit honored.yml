info:
  name: membership limit honored
  type: http
  seq: 10

http:
  method: GET
  url: "{{base_url}}/v1/segments/{{segment_id}}/membership?limit=1"
  params:
    - name: limit
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    **REFERENCE:** https://docs.customer.io/integrations/api/app/#tag/segments/operation/listSegmentCustomers

    **WHY:** `Snapshots / segments limit ignored` established that the *parent*
    endpoint `/v1/segments` accepts `limit=1` with a 200 and returns all 9 rows.
    A 200 from this API is never evidence a parameter was applied, so the child
    route's `limit` needs its own positive control before any page walk is
    designed on it. Segment 1 has exactly 2 members, which makes `limit=1` a
    clean negative control: a narrowed response can only mean the parameter was
    honoured.

    **VERIFIED (2026-09-22):** `limit` **is honoured** here — `limit=1` against a
    2-member segment returns exactly 1 identifier and a **non-empty** `next`
    (`"MDox"`). The parent and child endpoints therefore disagree about the same
    parameter name, which is why this probe exists rather than inheriting the
    parent's finding.

    **VERIFIED (2026-09-22):** `limit=0` is accepted with a 200 and falls back to
    the default — all 2 members returned, `next: ""`. It is not rejected and not
    treated as "zero rows".

    **VERIFIED (2026-09-22):** the token `"MDox"` base64-decodes to `0:1` — a
    **positional offset**, not an opaque server token, and a *different* format
    from `/v1/messages`'s `v20:<n>` and `/v1/newsletters`'s bare `1`. Fourth
    token format in this API. Never checkpointed, never carried across
    endpoints; see `Child Entities / membership token walk`.

examples:
  - name: 200 - limit=1 narrows a 2-member segment and yields a token
    request:
      url: "https://api.customer.io/v1/segments/1/membership?limit=1"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "segment_id": 1,
            "ids": [
              "example_person_1"
            ],
            "identifiers": [
              {
                "cio_id": "aa0000000001",
                "email": "REDACTED",
                "id": "example_person_1"
              }
            ],
            "next": "MDox"
          }
