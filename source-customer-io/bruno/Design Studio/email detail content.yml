info:
  name: email detail content
  type: http
  seq: 13

http:
  method: GET
  url: "{{base_url}}/v1/design_studio/emails/{{design_studio_email_id}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    **REFERENCE:** https://docs.customer.io/integrations/api/app/#tag/Design-Studio-emails/operation/getEmail

    **WHY:** Settles the document **grain** for `design_studio_emails`: does the
    list response already carry template content, or would capturing content
    require a per-row detail fetch? The answer decides whether the stream is one
    request per window or 1 + N, and how large the collection gets.

    **VERIFIED (2026-09-22):** The two grains are entirely distinct.

    | | list row | detail document |
    |---|---|---|
    | fields | 8 | 11 |
    | content | **absent** | `content.{subject, preheader_text, html, amp, text}` |
    | also carries | — | `envelope`, `transformers`, `available_languages` |
    | size | ~180 bytes | **15306 bytes** |

    The detail document for one of the two *sample* emails in an otherwise empty
    trial workspace is **15 KB**, of which `content.html` alone is **12930
    characters**. `transformers` is a large nested settings object (accessibility,
    css_inliner, css_variables, encode_entities, formatter, prevent_widows,
    remove_unused_css, url_parameters) that is configuration, not content.

    **VERIFIED (2026-09-22):** `content.html` is raw HTML with Liquid template
    syntax in it; `subject`, `preheader_text`, `amp` and `text` were all empty
    strings on the sample email, so an email can carry a body with no subject —
    none of these are safe to model as required.

    **Consequence:** the connector captures the **list grain only**. Enriching
    would cost one extra request per email per window against a 10 req/s budget
    (an N+1 that scales with the customer's template library, not with change
    volume), and would write a multi-KB HTML blob per row on every poll — for a
    resource whose `updated` timestamp changes whenever anyone touches the
    template. If content is wanted later it belongs in a separate, explicitly
    opt-in stream, not folded into this one.

    **LIMITATION:** because content is excluded, `design_studio_emails` is a
    template **inventory**, not a template archive. A consumer cannot reconstruct
    what an email said from this collection — only that it exists, what it is
    named, where it is filed, whether it is linked to a workflow, and when it
    last changed.

examples:
  - name: 200 - detail grain carries content the list does not
    request:
      url: "https://api.customer.io/v1/design_studio/emails/11111111-1111-4111-8111-111111111111"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "email": {
              "id": "11111111-1111-4111-8111-111111111111",
              "name": "Example Code Editor Email",
              "is_template": false,
              "is_linked": false,
              "parent_folder_id": null,
              "created": 1789071558,
              "updated": 1789071558,
              "available_languages": [],
              "content": {
                "subject": "",
                "preheader_text": "",
                "html": "<!-- 12930 characters of HTML and Liquid, elided -->",
                "amp": "",
                "text": ""
              },
              "envelope": {
                "from_id": null,
                "reply_to_id": null,
                "recipient": "{{customer.email}}",
                "bcc": "",
                "fake_bcc": true,
                "headers": []
              },
              "transformers": {
                "accessibility": { "enabled": false },
                "css_inliner": { "enabled": true },
                "css_variables": { "enabled": false },
                "encode_entities": { "enabled": false },
                "formatter": { "type": "none" },
                "prevent_widows": { "enabled": false },
                "remove_unused_css": { "enabled": false },
                "url_parameters": { "enabled": false }
              }
            }
          }
