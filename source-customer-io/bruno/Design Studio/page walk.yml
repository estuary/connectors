info:
  name: page walk
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/v1/design_studio/emails?page=1&limit=1"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    **REFERENCE:** https://docs.customer.io/integrations/api/app/#tag/Design-Studio-emails/operation/listEmails

    **WHY:** Establishes that `limit` and `page` are actually applied, against
    the same negative-control standard as `updated_after`. `limit=1` on a
    2-row collection is the smallest request that can tell "paged" from
    "ignored", and it is the exact request that `Snapshots / segments limit
    ignored` showed Cluster B discarding.

    **VERIFIED (2026-09-22):** `limit=1` returns **1** row of the 2 that exist,
    with `meta.pagination` reporting `{page: 1, limit: 1, total: 2}`. Cluster D
    honours `limit`; Cluster B does not. The two clusters are served by
    different code paths and nothing learned about paging in B transfers here.

    **VERIFIED (2026-09-22):** `total` stays at the **full filtered result
    count** (2) while the page holds 1 row, so `total` is a collection-wide
    count and not a page count. See `page walk continued` for the walk itself.

