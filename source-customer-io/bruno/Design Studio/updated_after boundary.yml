info:
  name: updated_after boundary
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/v1/design_studio/emails?updated_after={{design_studio_email_updated}}"
  params:
    - name: updated_after
      value: "{{design_studio_email_updated}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    **REFERENCE:** https://docs.customer.io/integrations/api/app/#tag/Design-Studio-emails/operation/listEmails

    **WHY:** The decisive probe for the whole cluster, and the one that had to
    be run before any design was written.

    Every Cluster B endpoint in this API **silently ignores** `limit`, `start`
    and `sort` — `/v1/segments` accepts `limit=1` with a 200 and hands back all
    9 rows (`Snapshots / segments limit ignored`). In this API a 200 is
    demonstrably not evidence that a parameter was applied, and `meta.filters`
    echoing the value back is not either: the echo is built from the parsed
    request, so an endpoint that parsed and then discarded the filter would echo
    it identically.

    So this is run as a **negative control**: a bound that should exclude a
    known row must actually exclude it. If `updated_after` were ignored,
    Cluster D would collapse into three more snapshot streams and the connector
    would have no genuinely incremental stream but `messages`.

    Both sandbox emails carry `updated` == `created` == 1789071558, so the probe
    brackets that single instant from both sides.

    **VERIFIED (2026-09-22):** `updated_after` is **honoured, and is exclusive**.

    | `updated_after` | rows | `meta.pagination.total` |
    |---|---|---|
    | `1789071557` (T-1) | 2 | 2 |
    | `1789071558` (T)   | **0** | **0** |
    | `1789071559` (T+1) | 0 | 0 |

    The T-1 row is the positive control and the T row is the negative control:
    the same request one second apart returns everything and then nothing. This
    is real server-side filtering, the first in this API outside `/v1/messages`.

    Note that `meta.pagination.total` tracks the filter (2 -> 0) rather than
    reporting the collection size. `total` is the count of rows **matching the
    filters**, across all pages — which is what makes it usable in the
    termination test (see `page past end`).

    **VERIFIED (2026-09-22):** `created_after=1789071559` likewise returns 0
    rows, so the `created_*` pair is applied by the same code path.

    **Consequence:** the incremental cursor is `updated`, the filter is
    `updated_after`, and because the bound is **strictly exclusive** the
    connector passes the cursor value verbatim — no `+ 1s` tick arithmetic at
    the seam, and no re-emission of the boundary row. Contrast `/v1/messages`,
    whose `start_ts`/`end_ts` are both *inclusive* and where `fetch_deliveries`
    must therefore query `cursor + 1s` (`api.py:145`).

examples:
  - name: 200 - negative control, bound at the row's own timestamp excludes it
    request:
      url: "https://api.customer.io/v1/design_studio/emails?updated_after=1789071558"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "emails": [],
            "folders": [],
            "meta": {
              "pagination": {
                "page": 1,
                "limit": 1000,
                "total": 0
              },
              "filters": {
                "parent_folder_id": null,
                "direct_descendants_only": false,
                "sort_by": "created",
                "sort_order": "asc",
                "created_before": null,
                "created_after": null,
                "updated_before": null,
                "updated_after": 1789071558,
                "is_template": null,
                "has_translations": null,
                "is_linked": null
              }
            }
          }
  - name: 200 - positive control, bound one second earlier includes both
    request:
      url: "https://api.customer.io/v1/design_studio/emails?updated_after=1789071557"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "emails": [
              {
                "id": "11111111-1111-4111-8111-111111111111",
                "name": "Example Code Editor Email",
                "is_template": false,
                "is_linked": false,
                "has_translations": false,
                "parent_folder_id": null,
                "created": 1789071558,
                "updated": 1789071558
              },
              {
                "id": "22222222-2222-4222-8222-222222222222",
                "name": "Example Visual Editor Email",
                "is_template": false,
                "is_linked": false,
                "has_translations": false,
                "parent_folder_id": null,
                "created": 1789071558,
                "updated": 1789071558
              }
            ],
            "folders": [],
            "meta": {
              "pagination": {
                "page": 1,
                "limit": 1000,
                "total": 2
              },
              "filters": {
                "parent_folder_id": null,
                "direct_descendants_only": false,
                "sort_by": "created",
                "sort_order": "asc",
                "created_before": null,
                "created_after": null,
                "updated_before": null,
                "updated_after": 1789071557,
                "is_template": null,
                "has_translations": null,
                "is_linked": null
              }
            }
          }
