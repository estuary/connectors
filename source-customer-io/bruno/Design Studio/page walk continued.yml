docs:
  content: |-
    **REFERENCE:** https://docs.customer.io/integrations/api/app/#tag/Design-Studio-emails/operation/listEmails

    **WHY:** Confirms `page` advances the window rather than being parsed and
    discarded, and that page 2 holds a *different* row than page 1 — a paging
    parameter that is read but ignored would return page 1's row again.

    **VERIFIED (2026-09-22):** `page=2&limit=1` returns the **second** email
    ("Example Visual Editor Email"), disjoint from page 1's row, with
    `meta.pagination` echoing `{page: 2, limit: 1, total: 2}`.

    **Contrast with `/v1/messages`:** that endpoint's continuation token is a
    base64 `v20:<offset>`, a positional offset the connector must never
    checkpoint. Here the offset is not even disguised — `page` is a plain
    integer in the query string. The naked form does not make it any less
    positional, and `FETCH-CHECKPOINT-STABLE-STATE` applies to it identically.
    The connector keeps the page number **local to a single generator
    invocation**; see `plan.md` for the argument.

