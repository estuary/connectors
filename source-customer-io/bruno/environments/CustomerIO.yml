variables:
  - name: base_url
    value: https://api.customer.io
  - name: config_path
    value: ../config.yaml
  # Pinned from `Messages / bare`. `message_created` is that delivery's `created`
  # value verbatim (unix seconds) — the boundary probes query it exactly.
  - name: message_id
    value: dgSKmQ4DAAIBAaCNESMVaO-6zjnpCeH1pQ==
  - name: message_created
    value: "1789073105"
  # The sandbox's single one-time send (API `newsletter`, UI "Broadcasts >
  # One-time sends" since the July 2026 rename).
  - name: newsletter_id
    value: "1"
  - name: customer_id
    value: example_person_1
  # Pinned from `Design Studio / emails bare`. Both sandbox emails share this
  # `created` == `updated` instant, which is what the boundary probes bracket.
  - name: design_studio_email_id
    value: 3f7e2935-acdc-412e-8eaa-1e4b172a8008
  - name: design_studio_email_updated
    value: "1789071558"
  # Cluster E parents. Pinned from the `Snapshots/` bare listings.
  - name: campaign_id
    value: "1"
  - name: broadcast_id
    value: "2"
  - name: transactional_id
    value: "1"
  # Segment 1 ("All Users") has 2 members; segment 7 ("Invalid Email Address")
  # has none, and is what makes the null-array empty case observable.
  - name: segment_id
    value: "1"
  - name: segment_id_empty
    value: "7"
