info:
  name: offset pagination
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/v1/esp/suppression/bounces?limit=1&offset=99999"
  params:
    - name: limit
      value: "1"
      type: query
    - name: offset
      value: "99999"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    **WHY:** The pagination mechanism is the whole reason this endpoint left
    Cluster C, so it needs its own record. Cluster C pages by opaque-ish
    continuation token in `start`; this endpoint declares `offset` — a raw
    integer position — and returns no marker to terminate on.

    **DOCUMENTED (2026-09-21):** the spec's query parameters are `limit`
    (default 100, maximum 1000), `offset` (default 0, "The number of records to
    skip before retrieving results"), and `domain`. There is no `start` and no
    `sort`.

    **VERIFIED (2026-09-21):** `offset=99999`, `offset=-1`, `offset=0`,
    `limit=100000` and a stray `start=MQ==` **all** return 200 with
    `{"suppressions": null}`. Nothing is rejected, including the negative offset
    and the over-maximum limit. `start` is neither honoured nor refused — it is
    simply an unknown parameter and is dropped.

    **UNOBSERVABLE (2026-09-21) — and this is the load-bearing gap.** With zero
    rows in the workspace, every offset returns the same empty body, so **none
    of these probes shows that `offset` advances a walk**. What is established
    is only that the parameter is accepted. Specifically unestablished:

    - whether `offset` is honoured or silently ignored (Cluster B endpoints
      silently ignore `limit`/`start`/`sort`, so "accepted with a 200" is
      demonstrably not evidence of "honoured" in this API);
    - whether an out-of-range offset returns empty or **restarts at page 1**,
      the live-cycle failure `/v1/messages` exhibits;
    - what a short final page looks like, which is the only available
      termination signal given there is no `next`.

    **LIMITATION — offset pagination is the wrong shape for a checkpointed
    walk** even once it is verified, per `FETCH-VALUE-WATERMARK-RESUME`: a
    positional offset renumbers when a row is deleted mid-walk, so a row that
    was never touched gets skipped. Here the walk is a snapshot drained inside a
    single generator invocation and the offset never crosses a checkpoint, which
    is the exemption `FETCH-CHECKPOINT-STABLE-STATE` allows — but it means the
    binding must stay a snapshot and can never be promoted to a checkpointed
    backfill on this endpoint.

    **Recommendation:** do not ship this binding on this evidence. Seed it
    (`Seeding / C1`) and re-probe, or defer it.
