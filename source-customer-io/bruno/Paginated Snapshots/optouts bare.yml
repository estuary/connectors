info:
  name: optouts bare
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/v1/optouts"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    **REFERENCE:** https://docs.customer.io/integrations/api/app/#tag/Opt-outs

    **WHY:** Establishes the envelope key, the empty-state representation and —
    the finding that matters — the terminal-pagination convention, which is
    **not** the one the other two Cluster C endpoints use.

    **VERIFIED (2026-09-21):** 200 with body `{"optouts": []}`.

    - Envelope key is `optouts`, matching the path segment. Note the document
      *also* has a nested `optouts` array (a person's per-channel opt-outs), so
      the envelope key and a document field collide by name — read the envelope
      before descending.
    - Empty state is `[]`, not `null`.

    **LIMITATION (VERIFIED 2026-09-21) — third terminal convention.** The `next`
    key is **absent entirely** from this response — not `""`, not `null`.
    `/v1/newsletters` and `/v1/sender_identities` both return `next: ""` on a
    terminal page; `/v1/messages` returns `next: ""`;
    `/v1/customers/{id}/messages` omits it (`Messages Per Parent / customer`).
    That is now **three** conventions across this API for "no more pages", and
    two of them inside Cluster C alone. The spec agrees for once — it describes
    `next` as "Absent or empty when there are no more results", explicitly
    admitting both.

    Consequence: model `next` as `str | None = None` and terminate on
    **falsiness**. A `while "next" in body` loop terminates here and hangs on
    `newsletters`; a `while body["next"] is not None` loop hangs here and
    KeyErrors nowhere. Only `if not next: break` is correct on all three.

    **UNOBSERVABLE (2026-09-21):** No opt-out documents in the workspace. The
    document shape, the token format, and whether `next` appears at all on a
    *non-terminal* page are all unestablished. In particular: because the only
    response ever seen is terminal, it is **not known** whether this endpoint
    omits `next` always, or only when terminal.

    **DOCUMENTED (2026-09-21):** Per the spec a row is
    `{cio_id, customer_id, optouts: [{channel, from}]}`, one row per person,
    where `channel` is `sms`/`whatsapp` and `from` is the sender the person
    opted out of.

    **LIMITATION (DOCUMENTED 2026-09-21) — no timestamp of any kind.** Neither
    the row nor the nested opt-out carries a created, updated or opted-out-at
    field. There is no `deduplicate_id` either, so unlike `sender_identities`
    there is not even a de-facto one. This endpoint therefore cannot support
    *any* incremental strategy — not a filtered one, not a reverse-sorted
    incremental-only walk (there is no `sort` parameter either, and nothing to
    sort on). A snapshot is not merely the preferred strategy here, it is the
    only representable one.
