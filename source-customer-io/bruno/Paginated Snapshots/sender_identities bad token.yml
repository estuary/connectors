info:
  name: sender_identities bad token
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/v1/sender_identities?start=notbase64!!"
  params:
    - name: start
      value: "notbase64!!"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    **WHY:** Negative control for `sender_identities bare`. With an empty
    workspace, every well-formed request returns the same empty body, so
    nothing in that probe distinguishes "the endpoint parsed my parameters"
    from "the endpoint ignored them". A malformed token that draws a 400 proves
    `start` is really read.

    **VERIFIED (2026-09-21):** 400 with
    `{"errors":[{"detail":"bad request (reference ...)","status":"400"}]}`.
    `start` is parsed, not ignored.

    The same malformed token draws the same 400 from `/v1/newsletters`
    (`newsletters out of range token`) and `/v1/optouts`
    (`optouts bad token`) — all three Cluster C endpoints validate the token's
    encoding. That is worth knowing for the opposite reason to the usual one:
    it means a *corrupt* token fails loudly, while an *out-of-range* one does
    not (see `newsletters out of range token`). Only the second is a
    correctness hazard.
