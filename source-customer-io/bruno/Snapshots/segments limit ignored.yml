info:
  name: segments limit ignored
  type: http
  seq: 13

http:
  method: GET
  url: "{{base_url}}/v1/segments?limit=1&start=MTox&sort=desc"
  params:
    - name: limit
      value: "1"
      type: query
    - name: start
      value: "MTox"
      type: query
    - name: sort
      value: "desc"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    **REFERENCE:** https://docs.customer.io/integrations/api/app/#tag/Segments/operation/listSegments

    **WHY:** Negative control for the entire Cluster B grouping. `/v1/segments`
    is the only Cluster B endpoint this sandbox populates with more than one
    row, so it is the only place where "the paging parameters are ignored" can
    be demonstrated rather than assumed from an empty array. Sends the three
    parameters that the paginated endpoints in this API *do* accept (`limit`,
    `start`, `sort` — see `/v1/newsletters` and `/v1/sender_identities`)
    against an endpoint the OpenAPI spec declares parameterless.

    **VERIFIED (2026-09-14):** All three parameters are **silently ignored**.
    `limit=1` returned all **9** segments; `sort=desc` left them in ascending
    id order 1..9; `start=MTox` (a well-formed continuation token for the
    paginated endpoints) neither advanced nor errored. Status 200, response
    byte-identical in structure to the bare `segments` request, and still no
    `next` key.

    Note the three-way contrast with `/v1/messages`, established by Cluster A:
    there an over-max `limit` is accepted-and-clamped, and a malformed `start`
    400s. Here the parameters do not exist at all.

    **Consequence:** the Cluster B fetch function must send **no query
    parameters**. Sending `limit` would be inert here but is a live hazard if
    the endpoint ever gains pagination, because a silently-ignored `limit`
    today would become a silently-truncating `limit` tomorrow.

