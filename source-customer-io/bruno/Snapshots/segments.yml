info:
  name: segments
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/v1/segments"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    **REFERENCE:** https://docs.customer.io/integrations/api/app/#tag/Segments/operation/listSegments

    **WHY:** The only Cluster B endpoint this sandbox populates with more than one
    row, so it is the load-bearing shape evidence for the whole cluster: it is
    where "unbounded single response, no pagination, no filters" is actually
    demonstrated rather than inferred from the spec.

    **VERIFIED (2026-09-14):** 200, envelope key `segments`, 9 rows returned in a
    single response, ids 1..9 ascending. No `next`, no `total`, no `has_more`.

    **VERIFIED (2026-09-14):** Per-item keys observed: `id` (int), `deduplicate_id`,
    `name`, `description`, `state`, `progress` (null on every row here),
    `type`, `tags` (array of string), `conditions` (object), `created_at` (unix
    int), `updated_at` (unix int).

    **VERIFIED (2026-09-14):** `conditions` is **absent from the OpenAPI spec**
    entirely, yet returned on every row. It is a deeply nested, free-form
    predicate tree (`{"and": [{"event": {"filters": ...}}]}`) whose shape varies by
    segment. Third divergence between this API's spec and its responses (Cluster A
    found `msg_template_id` and `transactional_message_id`). Schema inference,
    not a hand-written model.

    **VERIFIED (2026-09-14):** Timestamps are `created_at`/`updated_at` here — note
    the `_at` suffix. `campaigns` and `broadcasts` use bare `created`/`updated`
    for the same concept. The naming is **not** consistent across Cluster B, so
    no shared cursor-field ClassVar can be assumed.

    **VERIFIED (2026-09-14):** All 9 rows are Customer.io's own sample segments
    (`tags: ["Sample"]`, identical `created_at == updated_at == 1789071557`).
    They are real rows for shape purposes, but they are not user-created data.
