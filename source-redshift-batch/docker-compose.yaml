services:
  db:
    image: 'postgres:latest'
    command: [ "postgres" ]
    ports:
      - "5432:5432"
    environment:
      {
        "POSTGRES_DB": "postgres",
        "POSTGRES_USER": "postgres",
        "POSTGRES_PASSWORD": "postgres"
      }
    healthcheck:
      # Probe over TCP rather than the unix socket. The entrypoint runs the
      # docker-entrypoint-initdb.d scripts against a temporary server which
      # listens on the socket only, so a socket probe goes green while
      # initialization is still in flight and the port isn't accepting yet.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 1s
      timeout: 5s
      retries: 60
    networks:
      - flow-test
    volumes:
      - type: bind
        source: ./docker-initdb.sh
        target: /docker-entrypoint-initdb.d/init-user-db.sh
      - postgres_data:/var/lib/postgresql/data

networks:
  flow-test:
    name: flow-test
    external: true

volumes:
  postgres_data: {}
