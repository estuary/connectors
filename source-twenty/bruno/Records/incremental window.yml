docs: |-
  **REFERENCE:** https://docs.twenty.com/developers/extend/api

  **WHY:** test the timestamp boundaries used for incremental capture's
  inclusive lower / exclusive upper `updatedAt` window (`[gte, lt)`) and its
  handoff from backfill. Both cursors are RFC3339 timestamps rendered in UTC
  `Z` to milliseconds; pages use the unchanged `(updatedAt, id)` keyset cursor
  from `Records / backfill page`.

  The runnable request matches the captured `gte` probe against `companies`.
  All five probes included `id[eq]` for
  `0769073a-d7b9-46ff-8475-286562f96e05` to keep the result small; they tested
  one timestamp comparison at a time, not a combined window. The connector's
  window reads are not scoped to this probe ID. Repin `probe_id` and `cursor`
  to a current test record before rerunning these historical captures.

  **VERIFIED (2026-11-03):** the saved self-hosted v2.52 responses display
  `updatedAt: 2026-11-03T19:01:16.500Z`. Their non-empty cursor decodes to
  `{"updatedAt":"2026-11-03 19:01:16.500474+00","id":"0769073a-d7b9-46ff-8475-286562f96e05"}`.
  The stored fractional timestamp is `.500474`, displayed as `.500Z`.
  At that displayed millisecond, `gte`, `eq`, and `lte` return the record
  with `totalCount: 1`; `gt` and `lt` return empty lists with `totalCount: 0`.
  The decoded cursor is a computed fact, not an additional response field.

  **LIMITATION (VERIFIED 2026-11-03):** these comparisons use millisecond
  precision even though keyset cursors retain microseconds. For this boundary,
  `[lt]` excludes the row and `[gte]` includes it. An exclusive lower bound
  would skip records at the checkpoint's displayed millisecond.

  The connector uses adjacent `[gte, lt)` windows to cover the boundary,
  floors its horizon to milliseconds, and holds recent writes back by one
  minute to let them settle. Its default poll interval is five minutes.
  A restart may replay a checkpoint's millisecond; the collection key `/id`
  identifies the same record across those emissions.
