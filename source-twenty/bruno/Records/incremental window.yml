info:
  name: incremental window
  type: http
  seq: 2

http:
  method: GET
  url: '{{base_url}}/rest/companies?limit=200&depth=0&order_by=updatedAt[AscNullsFirst],id[AscNullsFirst]&filter=and(id[eq]:"{{probe_id}}",updatedAt[gte]:"{{cursor}}",or(deletedAt[is]:NULL,deletedAt[is]:NOT_NULL))'
  params:
    - name: limit
      value: "200"
      type: query
    - name: depth
      value: "0"
      type: query
    - name: order_by
      value: updatedAt[AscNullsFirst],id[AscNullsFirst]
      type: query
    - name: filter
      value: 'and(id[eq]:"{{probe_id}}",updatedAt[gte]:"{{cursor}}",or(deletedAt[is]:NULL,deletedAt[is]:NOT_NULL))'
      type: query
  auth: inherit

runtime:
  variables:
    - name: probe_id
      value: "0769073a-d7b9-46ff-8475-286562f96e05"
    - name: cursor
      value: "2026-11-03T19:01:16.500Z"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

