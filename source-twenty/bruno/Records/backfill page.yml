info:
  name: backfill page
  type: http
  seq: 1

http:
  method: GET
  url: '{{base_url}}/rest/people?limit=200&depth=0&order_by=updatedAt[AscNullsFirst],id[AscNullsFirst]&filter=and(updatedAt[lt]:"{{cutoff}}",or(deletedAt[is]:NULL,deletedAt[is]:NOT_NULL))'
  params:
    - name: limit
      value: "200"
      type: query
    - name: depth
      value: "0"
      type: query
    - name: order_by
      value: updatedAt[AscNullsFirst],id[AscNullsFirst]
      type: query
    - name: filter
      value: 'and(updatedAt[lt]:"{{cutoff}}",or(deletedAt[is]:NULL,deletedAt[is]:NOT_NULL))'
      type: query
    - name: starting_after
      value: "{{starting_after}}"
      type: query
      disabled: true
  auth: inherit

runtime:
  variables:
    - name: cutoff
      value: "2026-11-03T18:58:54.000Z"
  scripts:
    - type: after-response
      code: |-
        const page = res.getBody()?.pageInfo;
        if (res.getStatus() === 200 && page?.hasNextPage && page.endCursor) {
          bru.setVar('starting_after', page.endCursor);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

