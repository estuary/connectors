docs: |-
  **REFERENCE:** https://docs.twenty.com/developers/extend/api

  **WHY:** test backfill pagination, inclusion of trash, and handoff to
  incremental capture at a shared cutoff. The RFC3339 `updatedAt` upper bound
  is exclusive (`[lt]`); there is no lower bound. Keep the cutoff fixed across
  all pages. These captures used `2026-11-03T18:58:54.000Z`.

  **VERIFIED (2026-11-03):** self-hosted v2.52 returns
  `{data: {people: [...]}, pageInfo, totalCount}` with the requested
  `updatedAt[AscNullsFirst],id[AscNullsFirst]` ordering. Page 2 uses page 1's
  `endCursor` as `starting_after`; both have `totalCount: 19248` and
  `hasNextPage: true`. The full responses each returned 200 rows, and their
  ID sets had zero overlap: page 1 to page 2 had no repeated IDs. Row counts
  and overlap are facts computed from the full responses, not response
  fields. Each saved body projects just the first and last rows.

  **VERIFIED (2026-11-03):** page 1's `endCursor` is base64-encoded JSON:
  `{"updatedAt":"2026-10-29 07:48:33.413898+00","id":"764c5c99-1546-49d1-ad1a-d5efd18c9447"}`.
  The cursor retains microseconds while that row displays
  `2026-10-29T07:48:33.413Z`. Pass the value-based `(updatedAt, id)` cursor
  unchanged as `starting_after`; do not reconstruct it from the displayed
  timestamp. The after-response script captures it. Enable the initially
  disabled query parameter for another page, keeping filter and sort fixed.

  **LIMITATION (VERIFIED 2026-11-03):** requesting `limit=201` returned 200
  rows in the full response, with the same projected endpoints, cursors, and
  `totalCount` as page 1 at `limit=200`. Pagination remained available through
  `hasNextPage: true`. This is a silent clamp to 200 for the tested request.

  Follow `pageInfo.hasNextPage`, not a comparison with the requested limit.
  The connector requests 200.

  **RUN HISTORY (2026-11-03):** a `limit=1&depth=1` probe with the same cutoff,
  filter, and ordering returned 200. Full-response checks found `companyId`
  present and `company` nested as an object; at `depth=0`, the `company` key
  was absent. Only these presence/type facts were supplied for depth 1, with
  no row values, so there is no saved depth-1 example. The connector uses
  `depth=0`. No nested company fields are inferred from those checks.

  Run history (2026-11-03, self-hosted v2.52, no saved example): paging
  inside one millisecond. 60 companies from one batch create shared a single
  microsecond `updatedAt`; 150 concurrent single creates gave 25 milliseconds
  holding 2 or 3 different microsecond values. Walking each set with
  `limit=1` and `starting_after` returned every id once, none missing, so the
  cursor compares `updatedAt` at microsecond precision with `id` as the tie
  break (a millisecond comparison would have skipped rows whose id sorts below
  the cursor's). All probe records were destroyed afterwards.
