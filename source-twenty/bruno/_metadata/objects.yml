info:
  name: objects
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/rest/metadata/objects?limit=200"
  params:
    - name: limit
      value: "200"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - live self-hosted v2.52, object eligibility flags and system joins (projection)
    request:
      url: '{{base_url}}/rest/metadata/objects?limit=200'
      method: GET
    response:
      status: 200
      statusText: OK
      headers: []
      body:
        type: json
        data: |-
          {
            "data": [
              {
                "namePlural": "taskTargets",
                "isActive": true,
                "isSystem": true,
                "isRemote": false
              },
              {
                "namePlural": "companies",
                "isActive": true,
                "isSystem": false,
                "isRemote": false
              },
              {
                "namePlural": "noteTargets",
                "isActive": true,
                "isSystem": true,
                "isRemote": false
              },
              {
                "namePlural": "people",
                "isActive": true,
                "isSystem": false,
                "isRemote": false
              },
              {
                "namePlural": "workspaceMembers",
                "isActive": true,
                "isSystem": true,
                "isRemote": false
              }
            ],
            "pageInfo": {
              "hasNextPage": false,
              "hasPreviousPage": false,
              "startCursor": "f2f8bfa7-3384-425c-a179-06604eba4130",
              "endCursor": "1669a808-6e6e-477e-8fdd-e9c4a32c3457"
            },
            "totalCount": 48
          }

docs: |-
  **REFERENCE:** https://docs.twenty.com/developers/extend/api

  **WHY:** discovery needs the object's plural API name and eligibility flags,
  not a hardcoded object list. The connector also uses `starting_after` with
  `pageInfo.endCursor` when metadata has another page.

  **VERIFIED (2026-11-03):** self-hosted v2.52 returns
  `{data: [objects], pageInfo, totalCount}`. The saved projection retains five
  objects' `namePlural`, `isActive`, `isSystem`, and `isRemote` flags, the
  original cursors, `hasNextPage: false`, and `totalCount: 48`.

  **LIMITATION (VERIFIED 2026-11-03):** `noteTargets` and `taskTargets` have
  `isSystem: true`, as does `workspaceMembers`. Excluding every system object
  would lose the note/task joins.

  Discovery includes active, non-remote objects that are non-system, plus
  `noteTargets` and `taskTargets`.

  **LIMITATION (run history 2026-11-03):** full-response checks on self-hosted
  v2.52 and Twenty Cloud both returned 200 for this path and found no
  `isCustom` key on any object. The `people.name` field metadata had
  `writability` on self-hosted but not on Cloud. These are supplied computed
  facts; neither field metadata nor a Cloud body was supplied for an example.
  Discovery must not require `isCustom` or `writability`.

  See `_metadata / validate` for the saved `limit=1` authentication probe.

  Run history (2026-11-03, no saved example): walking metadata with
  `limit=1` and `starting_after` returned the same object set as one
  `limit=200` read on both servers (48 objects self-hosted, 43 Cloud), each
  once. `limit=201` was accepted (HTTP 200, every object returned); neither workspace has more than 200
  objects, so the metadata page cap is unobserved. The connector raises an
  error if `endCursor` ever repeats, so paging can't loop.
