info:
  name: validate
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/rest/metadata/objects?limit=1"
  params:
    - name: limit
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - live self-hosted v2.52, limit 1 returns one metadata object (projection)
    request:
      url: '{{base_url}}/rest/metadata/objects?limit=1'
      method: GET
    response:
      status: 200
      statusText: OK
      headers: []
      body:
        type: json
        data: |-
          {
            "data": [
              {
                "namePlural": "taskTargets"
              }
            ],
            "pageInfo": {
              "hasNextPage": true,
              "hasPreviousPage": false,
              "startCursor": "f2f8bfa7-3384-425c-a179-06604eba4130",
              "endCursor": "f2f8bfa7-3384-425c-a179-06604eba4130"
            },
            "totalCount": 48
          }

docs: |-
  **REFERENCE:** https://docs.twenty.com/developers/extend/api

  **WHY:** match `validate_credentials` exactly: a small metadata read verifies
  the API key before discovery. See `_auth / bad key` for the failure shape.

  **VERIFIED (2026-11-03):** on self-hosted v2.52,
  `GET /rest/metadata/objects?limit=1` returns 200 with one object,
  `taskTargets`, `totalCount: 48`, and `hasNextPage: true`. The full response
  returned one row; that count is a computed fact, not a response field.
  The example keeps the object's plural name and the pagination envelope.
