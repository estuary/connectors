[project]
name = "source-twenty"
version = "0.1.0"
description = ""
authors = [
    { name = "Alex Wictor", email = "awictor@estuary.dev" },
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3,<4.0.0",
    "estuary-cdk",
    "ijson>=3.3.0,<4.0.0",
    "pydantic>=2,<3",
]

# The dependency is declared in [project.dependencies] above; this is where
# uv finds it.
[tool.uv.sources]
estuary-cdk = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
