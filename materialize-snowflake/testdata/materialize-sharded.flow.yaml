import:
  - ../../materialize-boilerplate/testdata/integration/collections.materialize.flow.yaml

materializations:
  acmeCo/tests/materialize-snowflake:
    endpoint:
      local:
        command: ["go", "run", "./cmd/connector"]
        protobuf: true
        config: config.yaml
    bindings:
    - resource:
        table: simple_standard
        schema: PUBLIC
      source: tests/simple
      fields:
        recommended: true
    - resource:
        table: not_simple
        schema: PUBLIC
      source: tests/not-simple
      fields:
        recommended: true
    - resource:
        table: data_types
        schema: PUBLIC
      source: tests/data-types
      fields:
        recommended: true
    - resource:
        table: merge_renamed
        schema: PUBLIC
      source: tests/merge-renamed
      fields:
        recommended: true
        exclude: [renamedString, renamedTotal]
        include:
          renamed_string: {}
          renamed_total: {}