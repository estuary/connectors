[project]
name = "snowpipe-sidecar"
version = "0.1.0"
description = "Snowpipe Streaming (high-performance) sidecar for materialize-snowflake"
requires-python = ">=3.9"
# The SDK is pinned exactly: the append path hands its channels one msgspec.Raw
# per row, which is an internal of the SDK rather than something it documents —
# see tests/test_sdk_raw_rows.py. msgspec is the SDK's own dependency, which
# pins it exactly in turn, and is listed here because this package imports it
# directly to frame those rows.
dependencies = ["snowpipe-streaming==1.6.2", "msgspec"]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["snowpipe_sidecar"]
