[tool.poetry]
name = "snowpipe_sidecar"
version = "0.1.0"
description = "Snowpipe Streaming (high-performance) sidecar for materialize-snowflake"
authors = ["Jacob Marble <jacob@estuary.dev>"]
packages = [{include = "snowpipe_sidecar"}]

[tool.poetry.dependencies]
python = "^3.12"
estuary-cdk = {path="../../estuary-cdk", develop = true}
# The SDK is pinned exactly: the append path hands its channels one msgspec.Raw
# per row, which is an internal of the SDK rather than something it documents —
# see tests/test_sdk_raw_rows.py. msgspec is the SDK's own dependency, which
# pins it exactly in turn, and is listed here because this package imports it
# directly to frame those rows.
snowpipe-streaming = "1.6.2"
msgspec = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
mypy = "^1.8.0"

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
files = ["snowpipe_sidecar", "tests"]

# The snowpipe-streaming SDK ships without type information.
[[tool.mypy.overrides]]
module = ["snowflake.ingest.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
