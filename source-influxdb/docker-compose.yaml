services:
  db:
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: test
      DOCKER_INFLUXDB_INIT_PASSWORD: testtest123
      DOCKER_INFLUXDB_INIT_ORG: estuary
      DOCKER_INFLUXDB_INIT_BUCKET: sensors
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: made-up-token
    ports: ["${INFLUXDB_PORT:-8087}:8086"]
    healthcheck:
      test: ["CMD", "influx", "bucket", "list", "--org", "estuary", "--token", "made-up-token"]
      interval: 2s
      timeout: 5s
      retries: 40
