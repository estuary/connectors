collections:
  tests/${CONNECTOR}/data:
    schema:
      properties:
        id: { type: ${ID_TYPE} }
        canary: {type: string}
      required: [id, canary]
      type: object
    key: [/id]

captures:
  tests/${CONNECTOR}/from-source:
    endpoint:
      connector:
        image: "${CONNECTOR_IMAGE}"
        config: ${CONNECTOR_CONFIG}
    bindings:
      - resource:
          <<: ${RESOURCE}
        target: tests/${CONNECTOR}/data
