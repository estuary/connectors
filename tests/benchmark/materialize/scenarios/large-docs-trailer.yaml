# large-docs plus a trailing tiny transaction. A post-commit apply connector
# commits transaction N's data during the Acknowledge that transaction N+1
# waits on, and the timed window ends at the last commit, so without the
# trailer the final transaction's destination work is never measured.
# 5_000 docs at 1MB each = ~5 GB.
collections:
  - name: bench/big
    schema:
      type: object
      if:
        properties:
          _meta:
            properties: { op: { const: d } }
      then:
        reduce: { delete: true, strategy: lastWriteWins }
      properties:
        id:      { type: integer }
        payload: { type: string }
        _meta:
          type: object
          properties: { op: { type: string } }
          required: [op]
      required: [id, _meta]
    key: [/id]

transactions:
  - doc_count: 5_000
    doc_size:  1MB
    op: c

  - doc_count: 5_000
    doc_size:  1MB
    overlaps:
      - { with: 0, fraction: 0.40, op: u }

  - doc_count: 10
    doc_size:  1MB
    op: c
