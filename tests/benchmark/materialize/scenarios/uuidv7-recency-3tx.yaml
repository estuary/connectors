# The key shape of a table that moved from random UUIDs to time-ordered ones:
# keys are UUIDv7-shaped and minted in order (key_type: uuid_ordered), so a
# transaction's fresh keys and any recency-biased updates occupy a narrow band
# of id space, while a trickle of updates to arbitrary old rows (0.2% here,
# drawn uniformly) stretches the transaction's min/max key bounds across the
# whole table. File-level pruning of the target then depends on dynamic file
# pruning from the staged keys rather than on the static bounds.
#
# The target is clustered on id like the reported table. Loads of the same
# runs are compared via the load-phase durations in phases.py and the
# read_files / pruned_files columns of system.query.history.
#
# Doc math (4KB docs, ~2.6M docs per 10GB):
#   tx1: 25% of 2.6M = 655K updates drawn from the last 40% of tx0's keys
#        (1.05M candidates), plus ~5K updates drawn from all of tx0; 1.96M fresh.
#   tx2: the same against tx1's 1.96M fresh keys (784K candidates).
#   tx3: a 10-document trailer so tx2's commit lands inside the logged window.
collections:
  - name: bench/wide_uuidv7
    schema:
      type: object
      if:
        properties:
          _meta:
            properties: { op: { const: d } }
      then:
        reduce: { delete: true, strategy: lastWriteWins }
      properties:
        id:      { type: string }
        val:     { type: integer }
        payload: { type: string }
        _meta:
          type: object
          properties: { op: { type: string } }
          required: [op]
      required: [id, _meta]
    key: [/id]
    key_type: uuid_ordered
    resource:
      table: wide_uuidv7
      additional_table_create_sql: ALTER TABLE wide_uuidv7 CLUSTER BY (id);

transactions:
  - total_size: 10GB
    doc_size:   4KB
    op: c

  - total_size: 10GB
    doc_size:   4KB
    overlaps:
      - { with: 0, fraction: 0.25, op: u, range: [0.6, 1.0] }
      - { with: 0, fraction: 0.002, op: u }

  - total_size: 10GB
    doc_size:   4KB
    overlaps:
      - { with: 1, fraction: 0.25, op: u, range: [0.6, 1.0] }
      - { with: 1, fraction: 0.002, op: u }

  - doc_count: 10
    doc_size: 4KB
    op: c
