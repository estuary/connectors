[project]
name = "source-zendesk-support"
version = "0.1.0"
description = ""
authors = [
    { name = "Alex Bair", email = "alexb@estuary.dev" },
]
requires-python = ">=3.14"
dependencies = [
    "estuary-cdk",
    "estuary-cdk-airbyte-shim",
    "pytz>=2026.5,<2027.0",
    "requests-futures>=1.0.1,<2.0.0",
    "urllib3>=2.7.0,<3.0.0",
    "requests>=2.33.0,<3.0.0",
    "aiohttp>=3.14.4,<4.0.0",
]

# The dependency is declared in [project.dependencies] above; this is where
# uv finds it.
[tool.uv.sources]
estuary-cdk = { workspace = true }
estuary-cdk-airbyte-shim = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
