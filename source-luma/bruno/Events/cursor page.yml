info:
  name: cursor page
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/v1/calendars/events/list?pagination_limit=1&sort_column=start_at&sort_direction=asc"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** https://docs.luma.com/reference/get_v1-calendars-events-list
  
  **WHY:** proves `pagination_limit` is honored and `has_more`/`next_cursor` are
  populated when the page is short, which is the loop condition in
  `source_luma/api.py`. The after-response script captures `next_cursor` for
  `Events / cursor page 2`.
  
  **LIMITATION (DOCUMENTED 2026-09-17):** `after`/`before` are the only date
  filters and `sort_column` accepts only `start_at`; both key on the event's
  scheduled start, not on creation or modification time. There is no way to ask
  for "events changed since X", which is why `events` is a snapshot stream.
  
  **VERIFIED (2026-09-17):** `200`, exactly 1 entry, `has_more: true`,
  `next_cursor` is an opaque base64 string.

runtime:
  scripts:
    - type: after-response
      code: |-
        // Non-secret pagination token, chained into `Events / cursor page 2`.
        const body = res.getBody();
        if (body?.next_cursor) bru.setVar('events_next_cursor', body.next_cursor);
