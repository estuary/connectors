info:
  name: approved partition
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/v1/events/guests/list?event_id={{event_id}}&approval_status=approved"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** https://docs.luma.com/reference/get_v1-events-guests-list

  **WHY:** silent-data-loss audit for the `approval_status` filter, paired
  with `Guests / declined partition`. The docs give the parameter no default;
  the connector omits it and needs to know the unfiltered listing is not
  itself a partition.

  **VERIFIED (2026-09-17):** `200`, 2 entries, both `approval_status:
  "approved"` — the same 2 guests `Guests / bare` returns unfiltered, and
  `declined` returns 0. The filter is honored and the unfiltered listing is at
  least the union of these two partitions. **UNOBSERVABLE:** the remaining
  statuses (`pending_approval`, `invited`, `waitlist`, `session`) are empty on
  every event of this calendar, so their inclusion in the unfiltered listing
  rests on the docs describing `approval_status` as an optional filter.
