import:
  - ../../materialize-boilerplate/testdata/integration/collections.migrate-base.flow.yaml

materializations:
  acmeCo/tests/materialize-oracle:
    endpoint:
      local:
        command: ["go", "run", "./cmd/connector"]
        protobuf: true
        config: config.local.yaml
    bindings:
    - resource:
        table: migrate
      source: key/value
      fields:
        recommended: true
        include:
          # Materialize the object field so it exercises the JSON->text migration
          # (objects are FIELD_OPTIONAL and skipped by recommended selection).
          objectToString: {}
        exclude:
          # These type changes have no migration in Oracle: integers stored as
          # VARCHAR2 to numbers (int128 and wider, or more than 38 digits), and
          # BLOB to or from CLOB, which needs base64 conversion that SQL can't do
          # for LOBs over 32 KB. Validate returns INCOMPATIBLE, which the control
          # plane would resolve by backfilling the binding. The test harness
          # doesn't emulate that resolution, so exclude them rather than let
          # Apply skip the migration and leave a column type the spec doesn't
          # expect.
          - int128ToNum
          - int128ToNumStr
          - int128ToIntStr128
          - int129ToNum
          - int129ToNumStr
          - int256ToNum
          - int256ToNumStr
          - int257ToNum
          - int257ToNumStr
          - intStr129ToNum
          - intStr129ToNumStr
          - intStr256ToNum
          - intStr256ToNumStr
          - intStr257ToNum
          - intStr257ToNumStr
          - binaryToMulti
          - binaryToString
          - stringToBinary
          - 'stringToBinary"With"Quote'
