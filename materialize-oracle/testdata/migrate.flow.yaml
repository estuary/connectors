import:
  - ../../materialize-boilerplate/testdata/integration/collections.migrate-base.flow.yaml

materializations:
  acmeCo/tests/materialize-oracle:
    endpoint:
      local:
        command: ["go", "run", "./cmd/connector"]
        protobuf: true
        config: config.local.yaml
    bindings:
    - resource:
        table: migrate
      source: key/value
      fields:
        recommended: true
        include:
          # Materialize the object field so it exercises the JSON->text migration
          # (objects are FIELD_OPTIONAL and skipped by recommended selection).
          objectToString: {}
        exclude:
          # int128 and wider integers are stored as VARCHAR2 because they don't
          # fit in Oracle's NUMBER type, so converting that VARCHAR2 back into a
          # numeric type is not possible.
          - int128ToNum
          - int128ToNumStr
          - int128ToIntStr128
          - int129ToNum
          - int129ToNumStr
          - int256ToNum
          - int256ToNumStr
          - int257ToNum
          - int257ToNumStr
          - intStr129ToNum
          - intStr129ToNumStr
          - intStr256ToNum
          - intStr256ToNumStr
          - intStr257ToNum
          - intStr257ToNumStr
          # Binary fields are BLOB and strings are CLOB. Oracle's base64 encode
          # and decode functions support up to 32 KB, so not all values can be
          # converted safely between the two types.
          - binaryToMulti
          - binaryToString
          - stringToBinary
          - 'stringToBinary"With"Quote'
