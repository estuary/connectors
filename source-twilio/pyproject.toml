[project]
name = "source_twilio"
version = "0.1.0"
description = ""
authors = [
    { name = "Luis Salomao", email = "luish1980@hotmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "estuary-cdk",
    "estuary-cdk-airbyte-shim",
    "pendulum>=3.0.0,<4.0.0",
    "certifi>=2024.7.4",
    "cryptography>=50.0.0",
    "peewee>=3.17.1",
    "requests>=2.32.4",
    "urllib3>=2.8.0",
]

# The dependency is declared in [project.dependencies] above; this is where
# uv finds it.
[tool.uv.sources]
estuary-cdk = { workspace = true }
estuary-cdk-airbyte-shim = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
