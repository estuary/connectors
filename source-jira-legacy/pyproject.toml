[project]
name = "source-jira-legacy"
version = "0.1.0"
description = ""
authors = [
    { name = "Luishfs", email = "luish1980@hotmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "estuary-cdk[airbyte-shim]",
    "pycares>=4.9.0",
    "pydantic>=2,<3",
    "requests>=2.32.4",
    "types-requests>=2.31,<3.0",
    "responses>=0.26,<0.27",
    "urllib3>=2.5.0",
]

# The dependency is declared in [project.dependencies] above; this is where
# uv finds it.
[tool.uv.sources]
estuary-cdk = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
