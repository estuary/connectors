[project]
name = "source_asana"
version = "0.1.0"
description = ""
authors = [
    { name = "Jonathan Wihl", email = "jonathan@estuary.dev" },
    { name = "Johnny Graettinger", email = "johnny@estuary.dev" },
]
requires-python = ">=3.14"
dependencies = [
    "estuary-cdk",
    # The vendored Airbyte CDK is pydantic v1 code; see estuary-cdk/vendor/README.md.
    "estuary-cdk-airbyte-shim",
    "types-requests>=2.31,<3.0",
]

# The dependency is declared in [project.dependencies] above; this is where
# uv finds it.
[tool.uv.sources]
estuary-cdk = { workspace = true }
estuary-cdk-airbyte-shim = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
