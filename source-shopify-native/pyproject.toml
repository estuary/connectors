[project]
name = "source_shopify_native"
version = "0.1.0"
description = ""
authors = [
    { name = "Alex Bair", email = "alexb@estuary.dev" },
]
requires-python = ">=3.14"
dependencies = [
    "estuary-cdk",
    "pydantic>=2,<3",
