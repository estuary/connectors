info:
  name: payout transactions
  type: graphql
  seq: 10

graphql:
  method: POST
  url: "{{base_url}}/graphql.json"
  headers:
    - name: Shopify-GraphQL-Cost-Debug
      value: "1"
  body:
    query: |-
      query PayoutTransactions {
        shopifyPaymentsAccount {
          balanceTransactions(
            first: 250
            query: "payments_transfer_id:1"
          ) {
            edges {
              node {
                id
                transactionDate
                type
                sourceType
                sourceId
                sourceOrderTransactionId
                test
                adjustmentReason
                amount { ...MoneyFields }
                fee { ...MoneyFields }
                net { ...MoneyFields }
                associatedOrder { id }
                associatedPayout { id }
              }
            }
            pageInfo { hasNextPage endCursor }
          }
        }
      }

      fragment MoneyFields on MoneyV2 {
        amount
        currencyCode
      }
    variables: |-
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [ShopifyPaymentsAccount.balanceTransactions](https://shopify.dev/docs/api/admin-graphql/2026-01/objects/ShopifyPaymentsAccount) and [ShopifyPaymentsBalanceTransaction](https://shopify.dev/docs/api/admin-graphql/2026-01/objects/ShopifyPaymentsBalanceTransaction)

  **WHY:** the `payouts` stream's daily read of one payout's transactions:
  `payments_transfer_id` set to the payout's `legacyResourceId`, a full page
  of 250 and no sort key. It selects the same fields as `Payments / balance
  transactions`, since both reads write to the `balance_transactions`
  collection. Answers: does Shopify accept the query as the connector sends
  it, and what does a full page request.

  **VERIFIED (2026-11-12):** Shopify accepts it with no search warning or
  error. A full page requests 36 points (actual 3), the same as the
  `processed_at` read. The list is empty: the account isn't activated
  (`Payments / account`), and `1` stands in for a payout's
  `legacyResourceId`.

  **UNOBSERVABLE:** what `payments_transfer_id` matches (`Payments / payout
  filters`), and whether every one of a payout's transactions comes back.
  The connector fails the daily read if a payout's first page holds none of
  its own transactions, unless the payout is failed or canceled or was
  issued within the last day.

examples:
  - name: "200 - accepted, empty, requested 36 (projection: data and cost totals)"
    request:
      url: "{{base_url}}/graphql.json"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "shopifyPaymentsAccount": {
                "balanceTransactions": {
                  "edges": [],
                  "pageInfo": {
                    "hasNextPage": false,
                    "endCursor": null
                  }
                }
              }
            },
            "extensions": {
              "cost": {
                "requestedQueryCost": 36,
                "actualQueryCost": 3
              }
            }
          }
