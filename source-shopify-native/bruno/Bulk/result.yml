info:
  name: result
  type: http
  seq: 2

http:
  method: GET
  url: "{{bulk_result_url}}"
  auth: none

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('bulk_result_url')) {
          throw new Error('bulk_result_url is not set: run `Bulk / status` first in the same run');
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [The JSONL data format](https://shopify.dev/docs/api/usage/bulk-operations/queries)

  **WHY:** the JSONL a bulk shipping-lines stream would parse. Shows how a
  `ShippingLine` line arrives: whether it carries an `id` and `__typename`,
  that its `__parentId` is the order, and that with `groupObjects: true` it
  follows its order. A stream's `process_result` raises on any line it can't
  place, so this decides how it recognises shipping lines (`orders.py`
  matches discount applications, also not `Node`s, by `__typename`). Bulk
  was rejected for the stream; see `Bulk / status`.

  **VERIFIED (2026-10-29):** with `groupObjects: true`, each order line is
  followed by its shipping lines. A shipping line arrives as its own line with
  `"__typename": "ShippingLine"`, its `id` (`gid://shopify/ShippingLine/<n>`)
  and `__parentId` set to its order's id. An order with no shipping has no
  child lines. Orders came in ascending id order, not by `updatedAt`. A
  `process_result` can therefore start a document at each `gid://shopify/Order/`
  line and append lines whose `__typename` is `ShippingLine` and whose
  `__parentId` matches, raising on anything else.

examples:
  - name: 200 - JSONL for A1 (7 orders, 3 shipping lines)
    request:
      url: "{{bulk_result_url}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/jsonl
      body:
        type: text
        data: |-
          {"id":"gid:\/\/shopify\/Order\/5714619858989","updatedAt":"2025-04-10T17:54:23Z"}
          {"id":"gid:\/\/shopify\/Order\/5714629820461","updatedAt":"2025-04-17T11:57:10Z"}
          {"__typename":"ShippingLine","id":"gid:\/\/shopify\/ShippingLine\/4692902215725","title":"International Shipping","code":"International Shipping","source":"shopify","isRemoved":false,"originalPriceSet":{"shopMoney":{"amount":"30.0","currencyCode":"USD"}},"currentDiscountedPriceSet":{"shopMoney":{"amount":"30.0","currencyCode":"USD"}},"__parentId":"gid:\/\/shopify\/Order\/5714629820461"}
