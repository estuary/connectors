info:
  name: by country
  type: graphql
  seq: 4

graphql:
  method: POST
  url: "{{base_url}}/graphql.json"
  headers:
    - name: Shopify-GraphQL-Cost-Debug
      value: "1"
  body:
    query: |-
      query ContextualPricingByCountry {
        productVariants(first: 20, sortKey: ID) {
          nodes {
            id
            legacyResourceId
            updatedAt
            price
            compareAtPrice
            product { id isGiftCard }
            US: contextualPricing(context: { country: US }) { ...Prices }
            MX: contextualPricing(context: { country: MX }) { ...Prices }
            GB: contextualPricing(context: { country: GB }) { ...Prices }
            DE: contextualPricing(context: { country: DE }) { ...Prices }
            CH: contextualPricing(context: { country: CH }) { ...Prices }
          }
          pageInfo { hasNextPage endCursor }
        }
      }

      fragment Prices on ProductVariantContextualPricing {
        price { amount currencyCode }
        compareAtPrice { amount currencyCode }
      }
    variables: |-
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [ProductVariant.contextualPricing](https://shopify.dev/docs/api/admin-graphql/2026-01/objects/ProductVariant) and [ProductVariantContextualPricing](https://shopify.dev/docs/api/admin-graphql/2026-01/objects/ProductVariantContextualPricing)

  **WHY:** the shape a per-country price stream reads, one alias per
  configured country. Countries, from `Pricing / markets`:
  - US: primary market, USD.
  - MX: Mexico market, converted to MXN, rounding on, a -5% price list with
    one fixed price.
  - GB, DE and CH: International market, USD, no price list. DE is in the
    EEA; GB and CH aren't.

  Shows whether a market's adjustment, conversion and rounding reach `price`
  and `compareAtPrice`. `product.isGiftCard` is there because gift cards
  price differently (below).

  **VERIFIED (2026-11-17):**
  - Each country gets the price a buyer there sees, in that market's
    currency. MX converts 699.95 USD to 12436.0 MXN: -5%, converted, then
    rounded up to a whole peso. Converted amounts follow the exchange rate,
    so they change between runs.
  - Gift cards aren't rounded. The store's four gift card variants are -5%
    and converted only: the 10.00 USD one (43217823334445) is 177.66 MXN.
  - A fixed price on the market's price list wins. Variant 43217823760429 is
    11000.0 / 15000.0 MXN in MX, its `Mexico Buyers` fixed price.
  - Rounding changes the markdown. 9.95 / 14.95 USD (33.44% off) becomes
    177.0 / 266.0 MXN (33.46% off).
  - GB and CH (International, USD, no price list) get the base price.
  - Requested cost 37 at 20 variants and 5 countries.

  **DOCUMENTED (2026-11-17):** "Rounding rules don't apply to gift cards." —
  https://help.shopify.com/en/manual/international/pricing/rounding

  **LIMITATION (VERIFIED 2026-11-17):** `compareAtPrice` is null in DE but
  present in CH and GB for the same variant, so the stream must allow a null
  `compareAtPrice`.

  **UNOBSERVABLE:** why DE hides it. The ProductVariant docs don't say. It
  matches hiding derived compare-at prices in EEA countries for a store
  whose primary market (here the US) is outside the EEA. A store with an EEA
  primary market can't be tested here. The stream passes Shopify's value
  through either way.

