info:
  name: catalogs
  type: graphql
  seq: 15

graphql:
  method: POST
  url: "{{base_url}}/graphql.json"
  body:
    query: |-
      query Catalogs {
        catalogs(first: 50) {
          nodes {
            __typename
            id
            title
            status
            priceList { id currency }
            publication { id }
          }
          pageInfo { hasNextPage }
        }
      }
    variables: |-
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [catalogs](https://shopify.dev/docs/api/admin-graphql/2026-01/queries/catalogs) and [Catalog](https://shopify.dev/docs/api/admin-graphql/2026-01/interfaces/Catalog)

  **WHY:** whether `price_lists` can carry its catalog inline or a separate
  `catalogs` stream is needed: how many catalogs of each type exist, and how
  many have no price list (which `price_lists` alone would never show).

  **VERIFIED (2026-11-13):** the store has five catalogs:
  - three AppCatalogs (Online Store, Shop, Point of Sale), with no price
    list;
  - the `Mexico` MarketCatalog and the `Snowdevil B2B (test)`
    CompanyLocationCatalog, each with its price list.

  Every catalog with a price list is reachable from that list's `catalog`
  field. So `price_lists` can carry its catalog inline, and a `catalogs`
  stream would only add catalogs with no prices.

