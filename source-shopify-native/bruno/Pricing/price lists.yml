info:
  name: price lists
  type: graphql
  seq: 13

graphql:
  method: POST
  url: "{{base_url}}/graphql.json"
  headers:
    - name: Shopify-GraphQL-Cost-Debug
      value: "1"
  body:
    query: |-
      query PriceLists {
        priceLists(first: 50, sortKey: ID) {
          nodes {
            id
            name
            currency
            fixedPricesCount
            createdAt
            parent {
              adjustment { type value }
              settings { compareAtMode }
            }
            catalog { __typename id title status }
          }
          pageInfo { hasNextPage endCursor }
        }
      }
    variables: |-
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [priceLists](https://shopify.dev/docs/api/admin-graphql/2026-01/queries/priceLists) and [PriceList](https://shopify.dev/docs/api/admin-graphql/2026-01/objects/PriceList)

  **WHY:** the fields a `price_lists` document would carry, which catalog
  types own a price list, whether a price list can have no catalog, and the
  cost of a page.

  **VERIFIED (2026-11-13):** the store has three price lists:
  - `Mexico Buyers` (MXN, 1 fixed price) belongs to the `Mexico`
    MarketCatalog.
  - `Snowdevil B2B (test)` (USD, 1 fixed price, created 2026-10-27) belongs
    to a CompanyLocationCatalog.
  - `Price List example Buyers` (USD) has `catalog: null`.

  All three are `PERCENTAGE_DECREASE` (5 or 10) with `compareAtMode:
  ADJUSTED`. A price list can exist without a catalog. Requested cost 37 at
  50 lists.

