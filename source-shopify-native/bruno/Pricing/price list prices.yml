info:
  name: price list prices
  type: graphql
  seq: 14

graphql:
  method: POST
  url: "{{base_url}}/graphql.json"
  headers:
    - name: Shopify-GraphQL-Cost-Debug
      value: "1"
  body:
    query: |-
      query PriceListPrices {
        mexico: priceList(id: "gid://shopify/PriceList/27592228909") { ...ListPrices }
        b2b: priceList(id: "gid://shopify/PriceList/28232679469") { ...ListPrices }
        noCatalog: priceList(id: "gid://shopify/PriceList/27592196141") { ...ListPrices }
      }

      fragment ListPrices on PriceList {
        id
        currency
        createdAt
        prices(first: 60) {
          nodes {
            originType
            price { amount currencyCode }
            compareAtPrice { amount currencyCode }
            variant { id updatedAt price compareAtPrice }
          }
          pageInfo { hasNextPage endCursor }
        }
      }
    variables: |-
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [PriceList](https://shopify.dev/docs/api/admin-graphql/2026-01/objects/PriceList) and [PriceListPrice](https://shopify.dev/docs/api/admin-graphql/2026-01/objects/PriceListPrice)

  **WHY:** sizes and shapes `price_list_prices`. The three price lists from
  `Pricing / price lists`: Mexico (MXN, market catalog, 1 fixed price), the
  B2B catalog's (USD, 1 fixed price) and one with no catalog. Answers:
  - does `prices` return a row for every variant, or only fixed ones;
  - are RELATIVE prices in another currency converted at an exchange rate;
  - did setting a fixed price move the variant's `updatedAt`;
  - what a page of prices costs, for paged vs bulk.

  **VERIFIED (2026-11-13):**
  - Each list returns a row for all 27 variants: FIXED rows for its fixed
    prices, RELATIVE rows for the rest. That includes the list with no
    catalog, so rows = price lists x variants.
  - RELATIVE rows are in the shop currency, not the list's. `Mexico Buyers`
    is MXN, but 10.00 USD becomes 9.5 USD (-5%). Only FIXED rows are in MXN
    (11000.0 / 15000.0).
  - So RELATIVE rows don't move with exchange rates, and they aren't the
    converted price a buyer sees: `Pricing / by country` gives that variant
    a converted MXN price in MX (177.66 MXN on 2026-11-17).
  - The B2B list was created 2026-10-27. Its fixed-price variant
    43217823891501 was last updated 2026-06-15, so setting a fixed price
    didn't move the variant's `updatedAt`.
  - Paging is cheap: a row costs 2 (itself and its variant), and
    `prices(first: 60)` requests 18 points per list.

