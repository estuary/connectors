info:
  name: variant updatedAt vs inventory
  type: graphql
  seq: 18

graphql:
  method: POST
  url: "{{base_url}}/graphql.json"
  body:
    query: |-
      query VariantUpdatedAtVsInventory {
        productVariants(first: 50, sortKey: ID) {
          nodes {
            id
            updatedAt
            inventoryQuantity
            product { updatedAt }
            inventoryItem {
              tracked
              updatedAt
              inventoryLevels(first: 5) {
                nodes {
                  updatedAt
                  quantities(names: ["available", "committed", "on_hand"]) {
                    name
                    quantity
                    updatedAt
                  }
                }
              }
            }
          }
        }
        orders(first: 25, sortKey: CREATED_AT, reverse: true) {
          nodes {
            name
            createdAt
            cancelledAt
            fulfillments { createdAt }
            lineItems(first: 10) {
              nodes {
                quantity
                variant { id updatedAt }
              }
            }
          }
        }
      }
    variables: |-
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [ProductVariant](https://shopify.dev/docs/api/admin-graphql/2026-01/objects/ProductVariant) and [InventoryLevel](https://shopify.dev/docs/api/admin-graphql/2026-01/objects/InventoryLevel)

  **WHY:** `product_variant_contextual_pricing` re-reads a variant whenever
  its `updatedAt` moves. This checks whether a sale or an inventory change
  moves it, since that decides how often unchanged prices are re-emitted.

  **VERIFIED (2026-11-17):**
  - None of the 27 variants has an inventory quantity newer than its own
    `updatedAt`.
  - Three variants were updated 2 to 4 seconds after an order that sold
    them, in the same second as their inventory quantity. Order #1004 was
    created at 2025-04-10T17:55:42Z; variant 43217824088109 and its
    quantity are both stamped 17:55:46Z. Order #1001 (17:42:58Z) and
    variants 43217823367213 and 43217823399981 (17:43:00Z) do the same.
  - 12 tracked variants were last updated 16 to 59 seconds after their last
    inventory change (2026-06-11 and 2026-06-15), and one 7 minutes after.
    That fits the same pattern, but separate edits made right after the
    stock was set would look the same.

  **UNOBSERVABLE:** whether a sale or a stock adjustment made now moves
  `updatedAt`. Making one would change records the capture snapshot reads,
  so this rests on past orders, not a controlled test.

