settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [GraphQL Admin API rate limits](https://shopify.dev/docs/apps/build/apis/graphql-admin/rate-limits): "A single query may not exceed a cost of 1,000 points"

  **WHY:** the one-past-the-limit probe for the number of configured
  countries. `Pricing / cost per country` gives a requested cost of
  (2 + countries) x 11 + 2 at 250 variants, so 90 countries should request
  1,014. Records how Shopify enforces the ceiling, which sets the connector's
  cap on countries.

  **LIMITATION (VERIFIED 2026-11-13):** 90 countries at 250 variants request
  1,014 points, as predicted. Shopify rejects the query with
  `MAX_COST_EXCEEDED` (`cost` 1014, `maxCost` 1000) and returns no data. The
  ceiling is checked on the requested cost before anything runs. So the
  connector must cap configured countries at 88 for a 250-variant page, or
  shrink the page.

examples:
  - name: "200 - MAX_COST_EXCEEDED at 90 countries"
    request:
      url: "{{base_url}}/graphql.json"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "errors": [
              {
                "message": "Query cost is 1014, which exceeds the single query max cost limit (1000).\n\nSee https://shopify.dev/docs/api/usage/rate-limits for more information on how the\ncost of a query is calculated.\n\nTo query larger amounts of data with fewer limits, bulk operations should be used instead.\nSee https://shopify.dev/docs/api/usage/bulk-operations/queries for usage details.\n",
                "extensions": {
                  "code": "MAX_COST_EXCEEDED",
                  "cost": 1014,
                  "maxCost": 1000,
                  "documentation": "https://shopify.dev/api/usage/rate-limits"
                }
              }
            ]
          }
