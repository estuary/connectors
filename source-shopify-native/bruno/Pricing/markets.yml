info:
  name: markets
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{base_url}}/graphql.json"
  body:
    query: |-
      query MarketsAndCountries {
        shop { currencyCode }
        markets(first: 10) {
          nodes {
            id
            name
            status
            type
            currencySettings {
              baseCurrency { currencyCode manualRate rateUpdatedAt }
              localCurrencies
              roundingEnabled
            }
            conditions {
              conditionTypes
              regionsCondition {
                regions(first: 250) {
                  nodes {
                    name
                    ... on MarketRegionCountry { code currency { currencyCode } }
                  }
                  pageInfo { hasNextPage }
                }
              }
            }
            catalogs(first: 5) {
              nodes { id title status priceList { id name currency } }
            }
          }
        }
      }
    variables: |-
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [markets](https://shopify.dev/docs/api/admin-graphql/2026-01/queries/markets) and [MarketRegionCountry](https://shopify.dev/docs/api/admin-graphql/2026-01/objects/MarketRegionCountry)

  **WHY:** the other `Pricing` requests need to know which countries sit in
  which market, in which currency, and whether a market converts and rounds
  prices. This picks the countries they query.

  **VERIFIED (2026-11-17):** the store's currency is USD. It has three active
  markets:
  - United States: US, USD.
  - International: 27 countries, including GB, DE, CH, CA and JP, all priced
    in USD. No catalog. All 27 fit one `regions(first: 250)` page.
  - Mexico: MX, converted to MXN, with rounding on.

  Only the Mexico market's catalog has a price list (`Mexico Buyers`, MXN).
  The other `Pricing` requests query US, MX, GB, DE and CH from here.

