info:
  name: shipping lines
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{base_url}}/graphql.json"
  headers:
    - name: Shopify-GraphQL-Cost-Debug
      value: "1"
  body:
    query: |-
      query ShippingLines {
        orders(first: 15, sortKey: UPDATED_AT, reverse: true) {
          edges {
            node {
              id
              name
              createdAt
              updatedAt
              displayFulfillmentStatus
              cancelledAt
              closed
              shippingLines(first: 5, includeRemovals: true) {
                edges {
                  node {
                    __typename
                    id
                    title
                    code
                    source
                    carrierIdentifier
                    deliveryCategory
                    custom
                    isRemoved
                    originalPriceSet { ...MoneyBagFields }
                    discountedPriceSet { ...MoneyBagFields }
                    currentDiscountedPriceSet { ...MoneyBagFields }
                  }
                }
                pageInfo { hasNextPage endCursor }
              }
            }
          }
          pageInfo { hasNextPage endCursor }
        }
      }

      fragment MoneyBagFields on MoneyBag {
        shopMoney { amount currencyCode }
        presentmentMoney { amount currencyCode }
      }
    variables: |-
      {}

runtime:
  scripts:
    - type: after-response
      code: |-
        // Hand `Orders / overflow page` the newest order with a shipping line and
        // its inline page's end cursor. Runtime vars live in memory only.
        const order = (res.getBody()?.data?.orders?.edges ?? [])
          .map((edge) => edge.node)
          .find((node) => node?.shippingLines?.edges?.length);
        if (order) {
          bru.setVar('overflow_order_id', order.id);
          bru.setVar('overflow_after', order.shippingLines.pageInfo.endCursor);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [Order.shippingLines](https://shopify.dev/docs/api/admin-graphql/2026-01/objects/Order) and [ShippingLine](https://shopify.dev/docs/api/admin-graphql/2026-01/objects/ShippingLine)

  **WHY:** the shape a new `order_shipping_lines` stream would capture, with
  the fields the plan picked (no `phone`, no `taxLines`, no
  `discountAllocations`). Answers: do real lines carry an `id` (the schema
  types it as nullable `ID`); does any order have more than one line, or a
  removed one; and what an order with its lines costs, which sets the
  stream's page sizes. Sorted newest first only so the probe sees recent
  orders; the stream sorts ascending.

  **DOCUMENTED (2026-10-29):** `includeRemovals` defaults to false: "Whether
  results should contain removed shipping lines." `ShippingLine` implements no
  interfaces, so it is not a `Node`.

  **VERIFIED (2026-10-29):** the test store has 7 orders: 3 with one
  shipping line ("International Shipping", source `shopify`), 4 with none, so
  an order with no shipping is common and a per-order document would carry an
  empty list. Every line has an `id` (`gid://shopify/ShippingLine/<n>`), none
  is removed, none is custom, and `deliveryCategory` is null. No order has two
  lines, and none will be seeded: the capture snapshot reads this store.
  Lines pass through as Shopify returns them, and fetching past the inline 5
  needs only the order's `id`, so a removed line or one without an `id` needs
  no handling.

  **VERIFIED (2026-10-29):** the requested cost doesn't grow linearly with
  page size. 15 orders, each with `shippingLines(first: 5)` and three money
  sets per line, request 32 points (actual 10). The breakdown prices each
  order at 6 (1 for the order, 5 for its shipping-line connection) and the
  money sets at 0, but the orders connection totals 32, not 15 × 6. See
  `Orders / cost at full page` for 250 orders.

