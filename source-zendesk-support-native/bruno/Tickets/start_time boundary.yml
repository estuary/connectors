docs: |-
  **REFERENCE:** [List Tickets](https://developer.zendesk.com/api-reference/ticketing/tickets/tickets/#list-tickets)

  **WHY:** V2. `tickets_boundary_epoch` is pinned to a ticket's exact `updated_at`
  (epoch seconds). If that ticket is returned, `start_time` is inclusive; if not, it
  is exclusive. The connector's resume logic depends on which.

  **VERIFIED (2026-10-07):** inclusivity is moot. `start_time` is ignored (see
  `Tickets / start_time with updated_at sort`); both boundary values return all 42 tickets.
