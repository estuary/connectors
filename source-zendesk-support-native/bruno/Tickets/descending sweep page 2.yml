docs: |-
  **REFERENCE:** [List Tickets](https://developer.zendesk.com/api-reference/ticketing/tickets/tickets/#list-tickets)

  **WHY:** V3, second half. `sweep_after_cursor` is pinned in the environment from
  a page-1 run (the cursor is a keyset value, not a session token); page 1's
  after-response script overrides it for the session when re-run. Run after `Tickets / descending sweep page 1` and
  `Seeding / B1 - Touch ticket mid-sweep`. The touched ticket should be absent here,
  because it moved ahead of the cursor, and the page should continue exactly where page 1 ended.

  **VERIFIED (2026-10-07):** identical before and after B1 updated ticket 41 (44, 2, 3). The
  pinned keyset cursor resumes exactly where page 1 ended; a record changed elsewhere
  in the list doesn't cause skips or duplicates. A record updated mid-sweep is missed by
  the in-flight sweep and caught by the next one (V3).
