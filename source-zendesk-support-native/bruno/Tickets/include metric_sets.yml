docs: |-
  **REFERENCE:** [List Tickets](https://developer.zendesk.com/api-reference/ticketing/tickets/tickets/#list-tickets)

  **WHY:** V4. Checks whether `/tickets` accepts the `metric_sets` sideload that the
  `ticket_metrics` stream currently gets from the incremental ticket export.

  **VERIFIED (2026-10-07):** `/tickets` accepts `include=metric_sets` and returns a top-level
  `metric_sets` array (one per ticket) alongside `tickets`, with the full metric-set
  fields (`reply_time_in_minutes`, `solved_at`, etc.). The current `ticket_metrics`
  approach carries over to `/tickets`.
