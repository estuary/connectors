docs: |-
  **REFERENCE:** [List Tickets](https://developer.zendesk.com/api-reference/ticketing/tickets/tickets/#list-tickets)

  **WHY:** V1 control. Shows what `start_time` does without `sort` (default order is
  documented as `id`), so `start_time with updated_at sort` can be compared against it.

  **VERIFIED (2026-10-07):** returns 42 tickets with or without `start_time`. Default order is
  ticket id. The 5 tickets missing from the 47 the incremental export returns (ids
  26-30, closed August 2024) are archived. A ticket deleted by
  `Seeding / A6 - Delete ticket` (id 48) is also excluded.
