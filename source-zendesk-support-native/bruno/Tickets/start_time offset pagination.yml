info:
  name: start_time offset pagination
  type: http
  seq: 9

http:
  method: GET
  url: "{{base_url}}/tickets?start_time={{tickets_start_time}}&sort_by=updated_at&sort_order=asc&per_page=100"
  params:
    - name: "start_time"
      value: "{{tickets_start_time}}"
      type: query
    - name: "sort_by"
      value: "updated_at"
      type: query
    - name: "sort_order"
      value: "asc"
      type: query
    - name: "per_page"
      value: "100"
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

