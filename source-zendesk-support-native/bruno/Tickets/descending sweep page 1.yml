info:
  name: descending sweep page 1
  type: http
  seq: 10

http:
  method: GET
  url: "{{base_url}}/tickets?sort=-updated_at&page[size]=3"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Chain: page 2 reads from this page's cursor; B1 touches a ticket page 2 would
        // otherwise reach. Runtime vars only (non-secret ids and cursors).
        if (res.status === 200 && res.body?.meta?.after_cursor) {
          bru.setVar('sweep_after_cursor', res.body.meta.after_cursor);
        }

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - before B1 (projection)"
    request:
      url: "{{base_url}}/tickets?sort=-updated_at&page[size]=3"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: "content-type"
          value: "application/json; charset=utf-8"
        - name: "x-rate-limit"
          value: "700"
        - name: "ratelimit-limit"
          value: "700"
        - name: "x-rate-limit-remaining"
          value: "699"
        - name: "ratelimit-remaining"
          value: "699"
        - name: "ratelimit-reset"
          value: "34"
        - name: "zendesk-ratelimit-tickets-index"
          value: "total=100000; remaining=99999; resets=34"
      body:
        type: json
        data: |-
          {
            "tickets": [
              {
                "id": 47,
                "updated_at": "2026-09-23T22:12:34Z",
                "status": "open"
