docs: |-
  **REFERENCE:** [List Tickets](https://developer.zendesk.com/api-reference/ticketing/tickets/tickets/#list-tickets)

  **WHY:** V3, first half of a two-page sweep. Captures `meta.after_cursor` for
  `Tickets / descending sweep page 2`, and picks a ticket from further down the
  sweep for `Seeding / B1 - Touch ticket mid-sweep` to update between the two pages.

  **VERIFIED (2026-10-07):** before `Seeding / B1 - Touch ticket mid-sweep`: 47, 46, 45. After
  B1: 41, 47, 46. The touched ticket moves to the front of a fresh sweep, so a
  stop-at-cursor sweep picks it up next time. `/tickets` reflected the update
  immediately, with no index lag.
