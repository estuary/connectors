info:
  name: bare
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/tickets?page[size]=2"
  params:
    - name: page[size]
      value: "2"
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - cursor page (projection)"
    request:
      url: "{{base_url}}/tickets?page[size]=2"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: "content-type"
          value: "application/json; charset=utf-8"
        - name: "x-rate-limit"
          value: "700"
        - name: "ratelimit-limit"
          value: "700"
        - name: "x-rate-limit-remaining"
          value: "699"
        - name: "ratelimit-remaining"
          value: "699"
        - name: "ratelimit-reset"
          value: "10"
        - name: "zendesk-ratelimit-tickets-index"
          value: "total=100000; remaining=99999; resets=10"
      body:
        type: json
        data: |-
          {
            "tickets": [
              {
                "id": 1,
                "updated_at": "2026-05-08T14:08:44Z",
                "status": "open"
              },
              {
                "id": 2,
                "updated_at": "2026-05-08T15:00:15Z",
                "status": "open"
              }
            ],
            "meta": {
              "has_more": true,
              "after_cursor": "eyJvIjoibmljZV9pZCIsInYiOiJhUUlBQUFBQUFBQUEifQ==",
              "before_cursor": "eyJvIjoibmljZV9pZCIsInYiOiJhUUVBQUFBQUFBQUEifQ=="
            }
          }

docs: |-
  **REFERENCE:** [List Tickets](https://developer.zendesk.com/api-reference/ticketing/tickets/tickets/#list-tickets)

  **WHY:** baseline shape of `/tickets` under cursor pagination (envelope keys,
  `meta.has_more`, `links.next`) and the rate-limit headers it returns. It is
  the replacement Zendesk suggests for `/incremental/tickets/cursor`.

  **VERIFIED (2026-10-07):** envelope is `tickets`, `meta` (`has_more`, `after_cursor`,
  `before_cursor`), `links`. The default cursor decodes to `{"o":"nice_id",...}`: a
  keyset on ticket id, not an offset. Responses carry a dedicated
  `zendesk-ratelimit-tickets-index: total=100000` bucket alongside the account-wide
  `x-rate-limit: 700`.
