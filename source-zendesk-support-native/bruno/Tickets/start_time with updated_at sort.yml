docs: |-
  **REFERENCE:** [List Tickets](https://developer.zendesk.com/api-reference/ticketing/tickets/tickets/#list-tickets)

  **WHY:** V1. Proves whether `start_time` and cursor `sort=updated_at` combine on
  `/tickets`: the filter must narrow the result and the order must be ascending
  `updated_at`. This is the candidate replacement (A1) for the incremental ticket export.

  **LIMITATION (VERIFIED 2026-10-07):** `start_time` is silently ignored. `start_time=0` and
  `start_time=1778249324` (after all but 3 tickets' `updated_at`) both return the same
  42 tickets. `sort=updated_at` itself works: ascending order, cursor decodes to
  keyset `{"o":"updated_at,id",...}`. The OpenAPI spec documents `start_time` on this
  endpoint, but it has no effect. `/tickets` has no server-side time filter, so A1 in the
  plan is not viable.
