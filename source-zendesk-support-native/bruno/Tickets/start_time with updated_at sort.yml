info:
  name: start_time with updated_at sort
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/tickets?start_time={{tickets_start_time}}&sort=updated_at&page[size]=100"
  params:
    - name: "start_time"
      value: "{{tickets_start_time}}"
      type: query
    - name: "sort"
      value: "updated_at"
      type: query
    - name: "page[size]"
      value: "100"
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

