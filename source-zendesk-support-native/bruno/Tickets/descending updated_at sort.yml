docs: |-
  **REFERENCE:** [List Tickets](https://developer.zendesk.com/api-reference/ticketing/tickets/tickets/#list-tickets)

  **WHY:** A2. Checks that `sort=-updated_at` returns newest-first under cursor
  pagination, which the stop-at-cursor sweep relies on.

  **VERIFIED (2026-10-07):** strictly newest-first by `updated_at`. The cursor decodes to keyset
  `{"o":"-updated_at,-id",...}`, so A2 (descending sweep, stop at the saved cursor) is
  viable for tickets.
