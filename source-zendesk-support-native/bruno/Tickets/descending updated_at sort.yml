info:
  name: descending updated_at sort
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/tickets?sort=-updated_at&page[size]=10"
  params:
    - name: "sort"
      value: "-updated_at"
      type: query
    - name: "page[size]"
      value: "10"
      type: query
  auth: inherit

settings:
