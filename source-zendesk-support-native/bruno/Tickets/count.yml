info:
  name: count
  type: http
  seq: 8

http:
  method: GET
  url: "{{base_url}}/tickets/count"
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - 42 tickets"
    request:
      url: "{{base_url}}/tickets/count"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: "content-type"
          value: "application/json; charset=utf-8"
        - name: "x-rate-limit"
          value: "700"
        - name: "ratelimit-limit"
          value: "700"
        - name: "x-rate-limit-remaining"
          value: "699"
        - name: "ratelimit-remaining"
          value: "699"
        - name: "ratelimit-reset"
          value: "60"
      body:
        type: json
        data: |-
          {
            "count": {
              "value": 42,
              "refreshed_at": "2026-10-07T15:43:00+00:00"
            }
          }

docs: |-
  **REFERENCE:** [Count Tickets](https://developer.zendesk.com/api-reference/ticketing/tickets/tickets/#count-tickets)

  **WHY:** V11. Count Tickets excludes archived tickets. Compared with the
  incremental export's total, the difference approximates the archived (plus
  deleted) ticket population the list endpoint can't reach.

  **VERIFIED (2026-10-07):** 42, against 47 in `Incremental / tickets cursor`. The 5-ticket
  gap is the archived tickets (ids 26-30). The test account has 5 archived tickets.
