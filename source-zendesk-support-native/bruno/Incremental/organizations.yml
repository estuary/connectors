info:
  name: organizations
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/incremental/organizations?start_time=0"
  params:
    - name: "start_time"
      value: "0"
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - after A3/A4, deleted organization present (projection)"
    request:
      url: "{{base_url}}/incremental/organizations?start_time=0"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: "content-type"
          value: "application/json; charset=utf-8"
        - name: "x-rate-limit"
          value: "700"
        - name: "ratelimit-limit"
          value: "700"
        - name: "x-rate-limit-remaining"
          value: "692"
        - name: "ratelimit-remaining"
          value: "692"
        - name: "ratelimit-reset"
          value: "38"
        - name: "zendesk-ratelimit-incremental-exports"
          value: "total=10; remaining=9; resets=38"
      body:
        type: json
        data: |-
          {
            "organizations": [
              {
                "id": 28835714737428,
                "name": "Estuary",
                "updated_at": "2024-09-24T21:05:34Z",
                "deleted_at": null
              },
              {
                "id": 54337481956884,
                "name": "54337481956884_deleted_Bruno probe V7 deleted organization",
                "updated_at": "2026-10-07T15:52:07Z",
                "deleted_at": "2026-10-07T15:52:07Z"
              }
            ],
            "count": 2,
            "end_of_stream": true,
            "end_time": 1791388327
          }

docs: |-
  **REFERENCE:** [Incremental Organization Export](https://developer.zendesk.com/api-reference/ticketing/ticket-management/incremental_exports/#incremental-organization-export)

  **WHY:** V7. Shows how the export represents deleted organizations today, to
  compare with what `/organizations` returns.

  **VERIFIED (2026-10-07):** a deleted organization stays in the export with `deleted_at` set,
  and its `name` is rewritten to `{id}_deleted_{original name}`. Bucket header:
  `zendesk-ratelimit-incremental-exports: total=10`.
