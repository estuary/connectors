docs: |-
  **REFERENCE:** [List Ticket Metric Events](https://developer.zendesk.com/api-reference/ticketing/tickets/ticket_metric_events/#list-ticket-metric-events)

  **WHY:** V8. Event `time` values are compared with each ticket's `updated_at`.
  Events later than the ticket's `updated_at` prove that metric events occur
  without updating the ticket, which breaks a per-ticket refetch driven by ticket changes.

  **VERIFIED (2026-10-07):** 715 events across the account. None has a `time` later than its
  ticket's `updated_at`, but the only `breach` event (ticket 1) fired before the ticket's
  later updates, so existing data does not settle V8. See `Seeding / C2 - Create SLA ticket`.

  **VERIFIED (2026-10-07):** the export includes ticket 49's `breach` event (15:56:19)
  even though the ticket's `updated_at` did not change. The export covers events that a
  ticket-driven refetch would miss.
