docs: |-
  **REFERENCE:** [Incremental Ticket Export, Cursor Based](https://developer.zendesk.com/api-reference/ticketing/ticket-management/incremental_exports/#incremental-ticket-export-cursor-based)

  **WHY:** Baseline of what the connector reads today, including archived and
  deleted tickets. Compared against `/tickets` to measure what the replacement loses
  (V11). This endpoint ends for third-party developers in December 2026.

  **VERIFIED (2026-10-07):** 47 tickets, including the 5 archived ones (ids 26-30, `closed`) that
  `/tickets` excludes. After `Seeding / A6 - Delete ticket`, the deleted ticket appears
  with `status: "deleted"`, once past the export's roughly 60-second hold-back (absent
  from an immediate read, present 75 seconds later). Bucket header:
  `zendesk-ratelimit-incremental-exports-cursor` is not sent here; this response
  carries `zendesk-ratelimit-incremental-exports: total=10`.
