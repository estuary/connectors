http:
  method: POST
  url: "{{base_url}}/organizations/create_many"
  body:
    type: json
    data: |-
      {
        "organizations": [
          { "name": "Bruno probe keyset organization 1" },
          { "name": "Bruno probe keyset organization 2" },
          { "name": "Bruno probe keyset organization 3" }
