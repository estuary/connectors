info:
  name: A1 - Create user to delete
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/users"
  body:
    type: json
    data: |-
      {
        "user": {
          "name": "Bruno probe V7 deleted user",
          "email": "bruno-probe-v7-deleted-user@example.com"
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Chain: `Seeding / A2 - Delete user` consumes this id as {{seed_user_id}}.
        // Runtime var only (a resource id, not a credential).
        if (res.status >= 200 && res.status < 300 && res.body?.user?.id) {
          bru.setVar('seed_user_id', res.body.user?.id);
        }

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [Create User](https://developer.zendesk.com/api-reference/ticketing/users/users/#create-user)

  SEEDING REQUEST: only the user runs this; never the assistant.

  **WHY:** V7. Creates an end user that `A2 - Delete user` deletes, so the
  incremental user export, `/users`, and `/deleted_users` can be compared for how a
  deleted user is represented. The test account has no deleted users today.

  **Outcome:** Ran 2026-10-07 (user 54337475674900); V7 VERIFIED in `Incremental / users cursor`, `Users / bare`, `Deleted / deleted_users`.
