info:
  name: D4 - Delete ticket A
  type: http
  seq: 14

http:
  method: DELETE
  url: "{{base_url}}/tickets/{{seed_ticket_a_id}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // seed_ticket_a_id normally arrives from `Seeding / D1 - Create ticket A`'s after-response capture. Fail
        // loudly out of session rather than sending a malformed URL.
        if (!bru.getVar('seed_ticket_a_id') && !bru.getEnvVar('seed_ticket_a_id')) {
          throw new Error('seed_ticket_a_id not set: run `Seeding / D1 - Create ticket A` first in this session, or bru.setVar it');
        }
        // Separate the two deletions by more than a second so their deleted_at differ.
        await new Promise((resolve) => setTimeout(resolve, 2000));

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [Delete Ticket](https://developer.zendesk.com/api-reference/ticketing/tickets/tickets/#delete-ticket)

  SEEDING REQUEST: only the user runs this; never the assistant.

  **WHY:** Deletion ordering for `/deleted_tickets` under `sort=updated_at`. D1 and D2
  create tickets A then B; D3 deletes B, then D4 deletes A at least a second later.
  Creation order, id order (A < B), and deletion order (B before A) then disagree, so
  `Keyset Cursors / deleted_tickets crafted seek` can show which order
  `/deleted_tickets` follows, and whether each deletion stamps `updated_at` with the
  deletion time.

  **Outcome:** Ran 2026-10-07 (A = ticket 50, B = ticket 51; B deleted 19:57:21, A 19:57:24); VERIFIED in `Keyset Cursors / deleted_tickets crafted seek`.
