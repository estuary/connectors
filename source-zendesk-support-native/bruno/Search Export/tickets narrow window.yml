info:
  name: tickets narrow window
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/search/export?filter[type]=ticket&query=updated>={{search_window_start}} updated<{{search_window_end}}&page[size]=100"
  params:
    - name: "filter[type]"
      value: "ticket"
      type: query
    - name: "query"
      value: "updated>={{search_window_start}} updated<{{search_window_end}}"
      type: query
    - name: "page[size]"
      value: "100"
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - window [14:08:44, 14:08:54) (projection)"
    request:
      url: "{{base_url}}/search/export?filter[type]=ticket&query=updated>=2026-05-08T14:08:44Z updated<2026-05-08T14:08:54Z&page[size]=100"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: "content-type"
          value: "application/json; charset=utf-8"
        - name: "x-rate-limit"
          value: "700"
        - name: "ratelimit-limit"
          value: "700"
        - name: "x-rate-limit-remaining"
          value: "692"
        - name: "ratelimit-remaining"
          value: "692"
        - name: "ratelimit-reset"
          value: "4"
      body:
        type: json
        data: |-
          {
            "results": [
              {
                "id": 1,
                "result_type": "ticket",
                "updated_at": "2026-05-08T14:08:44Z",
                "status": "open",
                "created_at": "2024-07-26T15:41:04Z"
              }
            ],
            "meta": {
              "has_more": false,
              "after_cursor": "",
              "before_cursor": null
            }
          }

docs: |-
  **REFERENCE:** [Export Search Results](https://developer.zendesk.com/api-reference/ticketing/ticket-management/search/#export-search-results)

  **WHY:** A3. Checks that `updated>=` / `updated<` datetime bounds narrow to the
  second, and whether each bound is inclusive. Pinned to ticket updated_at values
  10 seconds apart.

  **VERIFIED (2026-10-07):** filters to the second. With `updated>=2026-05-08T14:08:44Z
  updated<2026-05-08T14:08:54Z`, ticket 1 (`updated_at` 14:08:44) is returned and
  ticket 3 (14:08:54) is not: `>=` is inclusive and `<` is exclusive.
