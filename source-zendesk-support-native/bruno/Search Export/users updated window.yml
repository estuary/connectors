      value: "user"
      type: query
    - name: "query"
      value: "updated>=2000-01-01T00:00:00Z"
      type: query
    - name: "page[size]"
      value: "1000"
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

