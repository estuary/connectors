info:
  name: organizations updated window
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/search/export?filter[type]=organization&query=updated>=2000-01-01T00:00:00Z&page[size]=1000"
  params:
    - name: "filter[type]"
      value: "organization"
      type: query
    - name: "query"
      value: "updated>=2000-01-01T00:00:00Z"
      type: query
    - name: "page[size]"
      value: "1000"
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - after A3/A4, deleted organization excluded (projection)"
    request:
      url: "{{base_url}}/search/export?filter[type]=organization&query=updated>=2000-01-01T00:00:00Z&page[size]=1000"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: "content-type"
          value: "application/json; charset=utf-8"
        - name: "x-rate-limit"
          value: "700"
        - name: "ratelimit-limit"
          value: "700"
        - name: "x-rate-limit-remaining"
          value: "683"
        - name: "ratelimit-remaining"
          value: "683"
        - name: "ratelimit-reset"
          value: "28"
      body:
        type: json
        data: |-
          {
            "results": [
              {
                "id": 28835714737428,
                "result_type": "organization",
                "updated_at": "2024-09-24T21:05:34Z",
                "created_at": "2024-07-26T15:41:00Z"
              }
            ],
            "meta": {
              "has_more": false,
              "after_cursor": "",
              "before_cursor": null
            }
          }

docs: |-
  **REFERENCE:** [Export Search Results](https://developer.zendesk.com/api-reference/ticketing/ticket-management/search/#export-search-results)

  **WHY:** A3. Confirms datetime-windowed search export works for organizations.

  **VERIFIED (2026-10-07):** datetime `updated>=` accepted. A deleted organization is excluded.
