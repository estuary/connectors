info:
  name: tickets updated window
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/search/export?filter[type]=ticket&query=updated>=2000-01-01T00:00:00Z&page[size]=1000"
  params:
    - name: "filter[type]"
      value: "ticket"
      type: query
    - name: "query"
      value: "updated>=2000-01-01T00:00:00Z"
      type: query
    - name: "page[size]"
      value: "1000"
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

