docs: |-
  **REFERENCE:** [Export Search Results](https://developer.zendesk.com/api-reference/ticketing/ticket-management/search/#export-search-results)

  **WHY:** V6 / A3. A window covering all time, compared ticket-by-ticket with the
  incremental export, shows whether search export returns archived tickets. It also
  confirms that datetime `updated>=` queries are accepted.

  **VERIFIED (2026-10-07):** returns all 47 tickets, including the 5 archived ones (ids 26-30)
  that `/tickets` excludes. A deleted ticket is excluded (still 47 after
  `Seeding / A6 - Delete ticket`). Results are ordered `created_at` descending; the
  cursor decodes to `{"field":"created_at","desc":true,...}`. No dedicated
  rate-limit bucket header (docs: 100 requests per minute).
