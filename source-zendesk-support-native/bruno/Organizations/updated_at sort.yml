docs: |-
  **REFERENCE:** [List Organizations](https://developer.zendesk.com/api-reference/ticketing/organizations/organizations/#list-organizations)

  **WHY:** V5. Whether `/organizations` accepts `sort=updated_at` under cursor pagination.

  **VERIFIED (2026-10-07):** accepted; cursor decodes to keyset `{"o":"updated_at,id",...}`. The
  account has only one live organization, so ordering is confirmed by the cursor's
  order key, not by multiple records.
