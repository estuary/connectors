docs: |-
  **REFERENCE:** [List Ticket Metric Events by Ticket](https://developer.zendesk.com/api-reference/ticketing/tickets/ticket_metric_events/)

  **WHY:** A4. Response shape of the per-ticket alternative for `ticket_metric_events`
  (grouped by metric name), compared with the same ticket's events in the
  incremental export.

  **VERIFIED (2026-10-07):** returns an object keyed by metric name, each holding that metric's
  events. For ticket 1 the 17 events match the incremental export exactly: same ids,
  same fields (including `sla` on `apply_sla`).

  **LIMITATION (VERIFIED 2026-10-07):** SLA breach events occur without updating the ticket.
  Ticket 49's `reply_time` `breach` event has `time` 15:56:19, while the ticket's
  `updated_at` stayed at 15:55:19 (`Tickets / show probe ticket`). A per-ticket refetch
  triggered by ticket changes would never re-read this ticket after the breach.

  **VERIFIED (2026-10-07):** breach events are written in advance. Ticket 52 (SLA
  applied 20:28:14, 1-minute target) already had its `reply_time` `breach` event, with
  the future `time` 20:29:14, when read at 20:28:26. A read at 20:29:28, after the
  breach, returned the same event (same id, `deleted: false`) and no new events. A
  per-ticket refetch triggered by ticket changes captures breach events when the SLA
  is applied, so the gap described in the LIMITATION above does not lose events.

  **VERIFIED (2026-10-07):** when the SLA is fulfilled before its breach time, no
  breach event appears. Ticket 53 (`Seeding / C2`, then `Seeding / G1 - Reply to SLA
  ticket` one second later) ends with `reply_time` `activate`, `apply_sla`, `fulfill`,
  and `update_status` events, and no `breach`. Whether a breach event was written and
  then removed can't be observed, because no events were visible before the reply was
  processed.

  **LIMITATION (VERIFIED 2026-10-07):** metric events can be written long after the
  ticket change that produced them. Ticket 53 last changed at 20:39:11; it had no
  events at 20:50:21, and all 17 appeared by 20:52:17, 11 to 13 minutes later, stamped
  with their original 20:39:10 to 20:39:11 times. The incremental export didn't have
  them at about 20:50 either. Ticket 52's events appeared within 12 seconds, so the
  delay varies. A per-ticket refetch done `INCREMENTAL_LAG` (5 minutes) after a ticket
  change misses events written later, if the ticket doesn't change again. Today's
  export-based stream has the same exposure: it reads by event time with the same
  5-minute horizon (`fetch_incremental_cursor_paginated_resources`).
