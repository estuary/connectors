docs: |-
  **REFERENCE:** [List Deleted Users](https://developer.zendesk.com/api-reference/ticketing/users/users/#list-deleted-users)

  **WHY:** Finds which `sort` values `/deleted_users` accepts (it rejects `updated_at`),
  and the order its cursor encodes for each. This decides whether user deletions can be
  read incrementally by time.

  **LIMITATION (VERIFIED 2026-10-07):** only `sort=id` and `sort=-id` are accepted. `updated_at`,
  `-updated_at`, `created_at`, `deleted_at`, and `name` are rejected with
  `400 InvalidPaginationParameter` ("sort is not valid"). User deletions can't be read
  incrementally by time: each sweep reads the whole list and filters on `updated_at`
  client-side.
