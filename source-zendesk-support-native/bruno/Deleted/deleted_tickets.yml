docs: |-
  **REFERENCE:** [List Deleted Tickets](https://developer.zendesk.com/api-reference/ticketing/tickets/tickets/#list-deleted-tickets)

  **WHY:** A5. What `/deleted_tickets` returns compared with deleted tickets in the
  incremental export (30-day window, not archived, not scrubbed).

