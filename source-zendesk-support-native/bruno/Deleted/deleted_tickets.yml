info:
  name: deleted_tickets
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/deleted_tickets?page[size]=100"
  params:
    - name: "page[size]"
      value: "100"
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - empty before seeding"
    request:
      url: "{{base_url}}/deleted_tickets?page[size]=100"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: "content-type"
          value: "application/json; charset=utf-8"
        - name: "x-rate-limit"
          value: "700"
        - name: "ratelimit-limit"
          value: "700"
        - name: "x-rate-limit-remaining"
          value: "689"
        - name: "ratelimit-remaining"
          value: "689"
        - name: "ratelimit-reset"
          value: "49"
        - name: "zendesk-ratelimit-deleted-tickets-index"
          value: "total=10; remaining=9; resets=49"
      body:
        type: json
        data: |-
          {
            "deleted_tickets": [],
            "meta": {
              "has_more": false,
              "after_cursor": null,
              "before_cursor": null
            }
          }
  - name: "200 - after A5/A6, deleted ticket 48 (projection)"
    request:
      url: "{{base_url}}/deleted_tickets?page[size]=100"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: "content-type"
          value: "application/json; charset=utf-8"
        - name: "x-rate-limit"
          value: "700"
        - name: "ratelimit-limit"
          value: "700"
        - name: "x-rate-limit-remaining"
          value: "688"
        - name: "ratelimit-remaining"
          value: "688"
        - name: "ratelimit-reset"
          value: "34"
        - name: "zendesk-ratelimit-deleted-tickets-index"
          value: "total=10; remaining=9; resets=34"
      body:
