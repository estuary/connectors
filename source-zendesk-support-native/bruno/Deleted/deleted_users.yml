info:
  name: deleted_users
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/deleted_users?page[size]=100"
  params:
    - name: "page[size]"
      value: "100"
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - after E1/E2: updated_at is the deletion time (projection)"
    request:
      url: "{{base_url}}/deleted_users?page[size]=100"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: "content-type"
          value: "application/json; charset=utf-8"
        - name: "x-rate-limit"
          value: "700"
        - name: "ratelimit-limit"
          value: "700"
        - name: "x-rate-limit-remaining"
          value: "697"
        - name: "ratelimit-remaining"
          value: "697"
        - name: "ratelimit-reset"
          value: "36"
      body:
        type: json
        data: |-
          {
            "deleted_users": [
              {
                "id": 54337475674900,
                "name": "Bruno probe V7 deleted user",
                "created_at": "2026-10-07T15:52:04Z",
                "updated_at": "2026-10-07T15:52:05Z",
                "active": false
              },
              {
                "id": 54348627179924,
                "name": "Bruno probe deletion time user",
                "created_at": "2026-10-07T20:04:09Z",
                "updated_at": "2026-10-07T20:04:15Z",
                "active": false
              }
            ],
            "meta": {
              "has_more": false,
              "after_cursor": "eyJvIjoiaWQiLCJ2IjoiYVpUNW5RWnVNUUFBIn0=",
              "before_cursor": "eyJvIjoiaWQiLCJ2IjoiYVJTRDcyMXJNUUFBIn0="
            }
          }

docs: |-
  **REFERENCE:** [List Deleted Users](https://developer.zendesk.com/api-reference/ticketing/users/users/#list-deleted-users)

  **WHY:** A5 / V7. What `/deleted_users` returns compared with deleted users in the
  incremental user export.

  **VERIFIED (2026-10-07):** returns the deleted user (`active: false`, `email: null`).

  **VERIFIED (2026-10-07):** a deleted user's `updated_at` is its deletion time. The user from
  `Seeding / E1 - Create user to delete later` was created at 20:04:09 and deleted by
  E2 after a 5-second wait; its `updated_at` is 20:04:15.
