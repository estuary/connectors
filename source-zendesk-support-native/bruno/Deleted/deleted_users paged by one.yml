info:
  name: deleted_users paged by one
  type: http
  seq: 7

http:
  method: GET
  url: "{{base_url}}/deleted_users?sort=id&page[size]=1"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Pass the previous page's after_cursor as --env-var deleted_users_page_after=<cursor>
        // to read the next page. Without it, this reads the first page.
        const after = bru.getEnvVar('deleted_users_page_after');
        if (after) {
          req.setUrl(`${req.getUrl()}&page[after]=${after}`);
        }

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [List Deleted Users](https://developer.zendesk.com/api-reference/ticketing/users/users/#list-deleted-users)

  **WHY:** Whether following each page's `after_cursor` with `page[size]=1` visits
  every deleted user exactly once. The deletion subtask reads the whole list this way
  on every run, because `/deleted_users` can't filter or sort by time.

  **VERIFIED (2026-11-13):** with two deleted users, the first page returned the lower
  id with `has_more: true`, and its `after_cursor` returned the other with
  `has_more: false`. Each user appeared exactly once.

  **OBSERVED (2026-11-13):** both users' `updated_at` had moved to 2026-11-07, about
  31 days after they were deleted on 2026-10-07. So a deleted user's `updated_at` is
  its deletion time only until Zendesk updates it again.
