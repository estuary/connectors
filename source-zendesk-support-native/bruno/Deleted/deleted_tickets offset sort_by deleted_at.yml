info:
  name: deleted_tickets offset sort_by deleted_at
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/deleted_tickets?sort_by=deleted_at&sort_order=asc&per_page=100"
  params:
    - name: "sort_by"
      value: "deleted_at"
      type: query
    - name: "sort_order"
      value: "asc"
      type: query
    - name: "per_page"
      value: "100"
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - deletion order under offset pagination (projection)"
    request:
      url: "{{base_url}}/deleted_tickets?sort_by=deleted_at&sort_order=asc&per_page=100"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: "content-type"
          value: "application/json; charset=utf-8"
        - name: "x-rate-limit"
          value: "700"
        - name: "ratelimit-limit"
          value: "700"
        - name: "x-rate-limit-remaining"
          value: "692"
        - name: "ratelimit-remaining"
          value: "692"
        - name: "ratelimit-reset"
          value: "20"
        - name: "zendesk-ratelimit-deleted-tickets-index"
          value: "total=10; remaining=6; resets=20"
      body:
        type: json
        data: |-
          {
            "deleted_tickets": [
              {
                "id": 48,
                "subject": "Bruno probe deleted ticket",
                "deleted_at": "2026-10-07T15:52:09Z"
              },
              {
                "id": 51,
                "subject": "Bruno probe deletion order B",
                "deleted_at": "2026-10-07T19:57:21Z"
              },
              {
                "id": 50,
                "subject": "Bruno probe deletion order A",
                "deleted_at": "2026-10-07T19:57:24Z"
              }
            ],
            "count": 3
          }

docs: |-
  **REFERENCE:** [List Deleted Tickets](https://developer.zendesk.com/api-reference/ticketing/tickets/tickets/#list-deleted-tickets)

  **WHY:** The documented combination: offset pagination with `sort_by=deleted_at`.
  Offset pagination stops at 100 pages (10,000 records) and an offset can't be
  checkpointed safely, so this is the fallback if cursor sorting doesn't work.

  **VERIFIED (2026-10-07):** honored under offset pagination (48, B, A). It isn't needed,
  because `sort=updated_at` works under cursor pagination.
