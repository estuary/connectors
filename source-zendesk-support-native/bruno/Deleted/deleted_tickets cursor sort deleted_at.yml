info:
  name: deleted_tickets cursor sort deleted_at
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/deleted_tickets?sort=deleted_at&page[size]=100"
  params:
    - name: "sort"
      value: "deleted_at"
      type: query
    - name: "page[size]"
      value: "100"
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - deletion order 48, B, A (projection)"
    request:
      url: "{{base_url}}/deleted_tickets?sort=deleted_at&page[size]=100"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: "content-type"
          value: "application/json; charset=utf-8"
        - name: "x-rate-limit"
          value: "700"
        - name: "ratelimit-limit"
          value: "700"
        - name: "x-rate-limit-remaining"
          value: "693"
        - name: "ratelimit-remaining"
          value: "693"
        - name: "ratelimit-reset"
          value: "21"
        - name: "zendesk-ratelimit-deleted-tickets-index"
          value: "total=10; remaining=7; resets=21"
      body:
        type: json
        data: |-
          {
            "deleted_tickets": [
              {
                "id": 48,
                "subject": "Bruno probe deleted ticket",
                "deleted_at": "2026-10-07T15:52:09Z"
              },
              {
                "id": 51,
                "subject": "Bruno probe deletion order B",
                "deleted_at": "2026-10-07T19:57:21Z"
              },
              {
                "id": 50,
                "subject": "Bruno probe deletion order A",
                "deleted_at": "2026-10-07T19:57:24Z"
              }
            ],
            "meta": {
              "has_more": false,
              "after_cursor": "eyJvIjoidXBkYXRlZF9hdCxpZCIsInYiOiJaQ1NreG1vQUFBQUFhWlRjSk85dE1RQUEifQ==",
              "before_cursor": "eyJvIjoidXBkYXRlZF9hdCxpZCIsInYiOiJaS2xxeG1vQUFBQUFhWlI1VTI1ck1RQUEifQ=="
            }
          }

docs: |-
  **REFERENCE:** [List Deleted Tickets](https://developer.zendesk.com/api-reference/ticketing/tickets/tickets/#list-deleted-tickets)

  **WHY:** Same question using the generic cursor `sort` parameter, which other list
  endpoints accept.

  **VERIFIED (2026-10-07):** `sort=deleted_at` orders by deletion time (48, B, A) with a keyset
  cursor on `(updated_at, internal id)`. A deleted ticket's `updated_at` equals its
  `deleted_at`.
