info:
  name: show_many with metric_sets
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/tickets/show_many?ids={{show_many_ticket_ids}}&include=metric_sets"
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [Show Multiple Tickets](https://developer.zendesk.com/api-reference/ticketing/tickets/tickets/#show-multiple-tickets)

  **WHY:** Whether `/tickets/show_many` sideloads `metric_sets` for the tickets it
  returns. The keyset `ticket_metrics` stream collects changed ticket ids and fetches
  their metric sets this way, because `/tickets` returns them in a separate array after
  the tickets.
  Pass a comma-separated list of ticket ids as `--env-var show_many_ticket_ids=<ids>`.

  **VERIFIED (2026-11-13):** for tickets 14-18, it returned a top-level `metric_sets`
  array with one metric set per ticket alongside `tickets`, and `next_page: null`.
