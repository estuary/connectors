docs: |-
  **REFERENCE:** [List Ticket Metrics](https://developer.zendesk.com/api-reference/ticketing/tickets/ticket_metrics/#list-ticket-metrics)

  **WHY:** Whether `/ticket_metrics` accepts `sort=updated_at` with a keyset cursor, so
  changed metric sets can be swept with A8.

  **LIMITATION (VERIFIED 2026-10-07):** `sort=updated_at` is silently ignored. The cursor
  decodes to `{"o":"-created_at,id",...}` (newest-created first), so metric-set changes
  can't be swept with A8.
