info:
  name: updated_at sort
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/ticket_metrics?sort=updated_at&page[size]=100"
  params:
    - name: "sort"
      value: "updated_at"
      type: query
    - name: "page[size]"
      value: "100"
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - sort ignored: cursor stays -created_at,id (projection)"
    request:
      url: "{{base_url}}/ticket_metrics?sort=updated_at&page[size]=100"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: "content-type"
