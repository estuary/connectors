info:
  name: per ticket
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/tickets/{{metric_ticket_id}}/metrics"
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - ticket 49 metric set after its 15:56:19 breach (projection)"
    request:
      url: "{{base_url}}/tickets/49/metrics"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: "content-type"
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "ticket_metric": {
              "ticket_id": 49,
              "created_at": "2026-10-07T15:55:19Z",
              "updated_at": "2026-10-07T15:55:19Z",
              "status_updated_at": "2026-10-07T15:55:19Z"
            }
          }

docs: |-
  **REFERENCE:** [Show Ticket Metrics](https://developer.zendesk.com/api-reference/ticketing/tickets/ticket_metrics/#show-ticket-metrics)

  **WHY:** Whether an SLA breach updates the ticket's metric set. Compares the metric
  set's `updated_at` for ticket 49 with its breach time (15:56:19) and its ticket
  `updated_at` (15:55:19). If the metric set moves at breach time, metric-set changes
  could drive refetching `ticket_metric_events` per ticket.

  **VERIFIED (2026-10-07):** an SLA breach does not update the ticket's metric set. Ticket 49's
  metric set still has `updated_at` 15:55:19 (its creation time) after its
  `reply_time` breach at 15:56:19, matching the ticket's own `updated_at`.
