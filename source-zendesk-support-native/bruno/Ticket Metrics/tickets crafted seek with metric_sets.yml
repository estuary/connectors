info:
  name: tickets crafted seek with metric_sets
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/tickets?sort=updated_at&support_type_scope=all&include=metric_sets&page[size]=100&page[after]={{crafted_cursor}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Build a keyset cursor for (seek_updated_at, 0), the same way the
        // connector does. Not a credential, so a runtime var is fine.
        const T = BigInt(bru.getEnvVar('seek_updated_at'));
        const buf = Buffer.alloc(18);
        buf.write('d', 0); buf.writeBigInt64LE(T, 1);
        buf.write('i', 9); buf.writeBigInt64LE(BigInt(0), 10);
        const cursor = Buffer.from(JSON.stringify({ o: 'updated_at,id', v: buf.toString('base64') })).toString('base64');
        bru.setVar('crafted_cursor', cursor);

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** [List Tickets](https://developer.zendesk.com/api-reference/ticketing/tickets/tickets/#list-tickets)

  **WHY:** The keyset `ticket_metrics` stream sweeps `/tickets` with a client-built
  seek cursor, `support_type_scope=all`, and `include=metric_sets` together, and reads
  each page's metric sets from a top-level `metric_sets` array after the tickets.
  Run it once with `seek_updated_at` before the oldest ticket and once past the
  newest, to check whether an empty page still includes `metric_sets`.
  Pass `--env-var seek_updated_at=<epoch seconds>`.

  **VERIFIED (2026-11-17):** Zendesk accepts all three parameters together. Seeking
  from 0 returned all 46 tickets in ascending `updated_at` order, then a top-level
  `metric_sets` array with one metric set per ticket, each with `id` and `ticket_id`.
  Seeking past the newest ticket returned empty `tickets` and `metric_sets` arrays
  with `has_more: false`.

  **PENDING:** whether AI agent tickets get metric sets. The test account has none.
