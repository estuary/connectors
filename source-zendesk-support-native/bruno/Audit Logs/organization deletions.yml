docs: |-
  **REFERENCE:** [List Audit Logs](https://developer.zendesk.com/api-reference/ticketing/account-configuration/audit_logs/#list-audit-logs)

  **WHY:** `/organizations` and search export both exclude deleted organizations, and
  there is no deleted-organizations endpoint. Checks whether the audit log (Enterprise
  plans only) records organization deletions, using the organization deleted by
  `Seeding / A4 - Delete organization`, and what the entry contains.

  **VERIFIED (2026-10-07):** the audit log records organization deletions. The organization
  deleted by `Seeding / A4 - Delete organization` appears with `action: "destroy"`,
  `source_type: "organization"`, `source_id` = the organization id (54337481956884),
  and `created_at` = the deletion time (15:52:07). A deletion document can be built from
  `source_id` and `created_at`. Audit logs are Enterprise-only; the connector already
  detects Enterprise accounts (`_is_enterprise_account`) and reads `/audit_logs` with
  `sort=created_at` and a `filter[created_at][]` range (`fetch_audit_logs`).
