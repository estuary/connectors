info:
  name: announcement calls path
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/channels/voice/incremental/calls?start_time=0"
  params:
    - name: "start_time"
      value: "0"
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - same 19 calls (projection)"
    request:
      url: "{{base_url}}/channels/voice/incremental/calls?start_time=0"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: "content-type"
          value: "application/json; charset=utf-8"
        - name: "x-rate-limit"
          value: "700"
        - name: "x-rate-limit-remaining"
          value: "698"
      body:
        type: json
        data: |-
          {
            "calls": [
              {
                "id": 32274722703636,
                "updated_at": "2024-11-19T17:36:34Z"
              },
              {
                "id": 32274723903636,
                "updated_at": "2024-11-19T17:42:01Z"
              },
              {
                "id": 32274699328148,
                "updated_at": "2024-11-19T17:42:58Z"
              }
            ],
            "calls_total": 19,
            "count": 19,
            "end_time": 1790208758
          }

docs: |-
  **REFERENCE:** [Announcement]( https://support.zendesk.com/hc/en-us/articles/11249701485338)

  **WHY:** V9. The path the announcement lists. If it is not a valid endpoint, the
  announcement's table names our path imprecisely, not a different API.

  **VERIFIED (2026-10-07):** valid and returns the same 19 calls as `Talk / stats incremental
  calls`. The announcement's path is an alias of the API the connector uses, so `calls`
  and `call_legs` are affected.
