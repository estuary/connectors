info:
  name: users crafted seek
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/users?sort={{seek_sort}}&page[size]=100&page[after]={{crafted_cursor}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Build a keyset cursor from plain values instead of one Zendesk returned:
        // base64(JSON {"o": <order>, "v": base64(type byte + int64 LE, ...)}), with
        // type 'd' = epoch-seconds updated_at and 'i' = id. Not a credential, so a
        // runtime var is fine.
        const T = BigInt(bru.getEnvVar('seek_updated_at'));
        const id = BigInt(bru.getEnvVar('seek_id'));
        const order = bru.getEnvVar('seek_order');
        const buf = Buffer.alloc(18);
        buf.write('d', 0); buf.writeBigInt64LE(T, 1);
        buf.write('i', 9); buf.writeBigInt64LE(id, 10);
        const cursor = Buffer.from(JSON.stringify({ o: order, v: buf.toString('base64') })).toString('base64');
        bru.setVar('crafted_cursor', cursor);

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - seek (1784068265, 0) (projection)"
    request:
      url: "{{base_url}}/users?sort=updated_at&page[size]=100&page[after]=eyJvIjoidXBkYXRlZF9hdCxpZCIsInYiOiJaS200Vm1vQUFBQUFhUUFBQUFBQUFBQUEifQ=="
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: "content-type"
          value: "application/json; charset=utf-8"
        - name: "x-rate-limit"
          value: "700"
        - name: "ratelimit-limit"
          value: "700"
        - name: "x-rate-limit-remaining"
          value: "697"
        - name: "ratelimit-remaining"
          value: "697"
        - name: "ratelimit-reset"
          value: "10"
      body:
        type: json
        data: |-
          {
            "users": [
