docs: |-
  **REFERENCE:** [List Users](https://developer.zendesk.com/api-reference/ticketing/users/users/#list-users)

  **WHY:** Same as `Keyset Cursors / tickets crafted seek`, for `/users`. User cursors
  carry the public user id, so a cursor built from the last emitted user's
  `(updated_at, id)` resumes exactly after that user.

  **VERIFIED (2026-10-07):** a client-built `(updated_at, id)` cursor works on `/users`, and the
  id is the public user id. A cursor built from the last emitted user resumes exactly
  after that user, with no boundary re-read.
