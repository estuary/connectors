docs: |-
  **REFERENCE:** [List Organizations](https://developer.zendesk.com/api-reference/ticketing/organizations/organizations/#list-organizations)

  **WHY:** Whether `/organizations` accepts client-built `(updated_at, id)` cursors, and
  whether the tie-break is the public organization id. If so, a resume cursor built
  from the last emitted organization resumes exactly (A8). Seeks: `(T, 0)` and
  `(T, id - 1)` should include the organization at T; `(T, id)` and `(T + 1, 0)` should not.

  **VERIFIED (2026-10-07):** `/organizations` accepts client-built `(updated_at, id)` cursors, and
  the tie-break is the public organization id. For the organization at
  `2024-09-24T21:05:34Z` (id 28835714737428): `(T, 0)` and `(T, id - 1)` include it,
  while `(T, id)` and `(T + 1, 0)` return nothing. A cursor built from the last emitted
  organization's `(updated_at, id)` resumes exactly after it. Ordering across multiple
  organizations is not observable on this account (one live organization); it rests on
  the same keyset mechanism verified with multiple records on `/tickets` and `/users`.
