info:
  name: tickets mid-second resume
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/tickets?sort=updated_at&page[size]={{seek_page_size}}&page[after]={{crafted_cursor}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Build a keyset cursor from plain values instead of one Zendesk returned:
        // base64(JSON {"o": <order>, "v": base64(type byte + int64 LE, ...)}), with
        // type 'd' = epoch-seconds updated_at and 'i' = id. Not a credential, so a
        // runtime var is fine.
        const T = BigInt(bru.getEnvVar('seek_updated_at'));
        const id = BigInt(bru.getEnvVar('seek_id'));
        const order = bru.getEnvVar('seek_order');
        const buf = Buffer.alloc(18);
        buf.write('d', 0); buf.writeBigInt64LE(T, 1);
        buf.write('i', 9); buf.writeBigInt64LE(id, 10);
        const cursor = Buffer.from(JSON.stringify({ o: order, v: buf.toString('base64') })).toString('base64');
        bru.setVar('crafted_cursor', cursor);

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
