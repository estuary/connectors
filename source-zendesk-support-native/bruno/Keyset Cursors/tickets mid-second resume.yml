docs: |-
  **REFERENCE:** [List Tickets](https://developer.zendesk.com/api-reference/ticketing/tickets/tickets/#list-tickets)

  **WHY:** Checks that a ticket cursor rebuilt from a returned cursor's decoded
  `(updated_at, internal id)` resumes exactly in the middle of a second. Run 1:
  `seek_id=0`, `seek_page_size=1` at a second holding several tickets; capture its
  `after_cursor`. Run 2: `seek_id` = the internal id decoded from that cursor,
  `seek_page_size=100`. Run 2 must start at the second ticket of that second. The
  connector relies on this to resume an interrupted poll without duplicates.

  **VERIFIED (2026-10-07):** second 2024-07-26T15:42:09Z holds tickets 19, 20, and 21. Run 1
  returned ticket 19 with an `after_cursor` that decodes to
  `(1722008529, 28835719774868)`. A cursor rebuilt from those decoded values is
  byte-for-byte identical to the returned one, and resuming from it returns 20, 21,
  then later seconds, without repeating 19. Resuming from the returned cursor directly
  (`Keyset Cursors / tickets resume from returned cursor`) gave the same page.
  Persisting the decoded `(updated_at, internal id)` resumes exactly mid-second.
