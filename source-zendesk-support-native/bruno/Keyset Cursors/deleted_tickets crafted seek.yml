docs: |-
  **REFERENCE:** [List Deleted Tickets](https://developer.zendesk.com/api-reference/ticketing/tickets/tickets/#list-deleted-tickets)

  **WHY:** Whether `/deleted_tickets` accepts client-built `(updated_at, id)` cursors
  under `sort=updated_at` / `sort=deleted_at`. If so, deletions can be read with the
  same ascending keyset sweep (A8) as `/tickets`, which the `tickets` deletion
  subtask needs.

  **VERIFIED (2026-10-07):** `/deleted_tickets` accepts client-built `(updated_at, id)` cursors
  under `sort=updated_at` (and `sort=deleted_at`, which is identical). `(T, 0)` is
  inclusive of second T. After `Seeding / D1`–`D4` deleted B three seconds before A,
  results come back in deletion order (48, B, A), and the final cursor decodes to A's
  exact `deleted_at`. A deleted ticket's `updated_at` is its deletion time, so the A8
  ascending keyset sweep reads deletions incrementally. The tie-break id is internal,
  as on `/tickets`.
