info:
  name: tickets resume from returned cursor
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/tickets?sort=updated_at&page[size]=100&page[after]={{returned_cursor}}"
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - cursor from ~15:46 returns the 2 tickets updated since (projection)"
    request:
      url: "{{base_url}}/tickets?sort=updated_at&page[size]=100&page[after]=eyJvIjoidXBkYXRlZF9hdCxpZCIsInYiOiJaTkpPdEdvQUFBQUFhUlFURFRyL01BQUEifQ=="
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: "content-type"
          value: "application/json; charset=utf-8"
        - name: "x-rate-limit"
          value: "700"
        - name: "ratelimit-limit"
          value: "700"
        - name: "x-rate-limit-remaining"
          value: "699"
        - name: "ratelimit-remaining"
          value: "699"
        - name: "ratelimit-reset"
          value: "59"
        - name: "zendesk-ratelimit-tickets-index"
          value: "total=100000; remaining=99999; resets=59"
      body:
        type: json
        data: |-
          {
            "tickets": [
              {
                "id": 41,
                "updated_at": "2026-10-07T15:54:20Z",
                "status": "open"
              },
              {
                "id": 49,
                "updated_at": "2026-10-07T15:55:19Z",
                "status": "open"
              }
            ],
            "meta": {
              "has_more": false,
              "after_cursor": "eyJvIjoidXBkYXRlZF9hdCxpZCIsInYiOiJaR2RyeG1vQUFBQUFhUlJWc0hkck1RQUEifQ==",
              "before_cursor": "eyJvIjoidXBkYXRlZF9hdCxpZCIsInYiOiJaQ3hyeG1vQUFBQUFhWlJweFcwU0t3QUEifQ=="
            }
          }

docs: |-
  **REFERENCE:** [List Tickets](https://developer.zendesk.com/api-reference/ticketing/tickets/tickets/#list-tickets)

  **WHY:** Stability of a cursor Zendesk returned. `returned_cursor` is the
  `after_cursor` of an end-of-list ascending page (`has_more: false`) captured
  earlier. Resuming from it later should return exactly the tickets updated since
  then, in ascending order.

  **VERIFIED (2026-10-07):** the end-of-list `after_cursor` captured at about 15:46 (from
  `Tickets / start_time with updated_at sort`, `start_time=0` run) still worked about
  40 minutes later. It returned exactly the tickets updated since then (41 and 49), in
  ascending order; deleted ticket 48 was excluded.

  **PENDING:** durability over days. Re-run this request after several days. If the
  connector stores values it derives from documents (see
  `Keyset Cursors / tickets crafted seek`) instead of the returned token, this no longer matters.
