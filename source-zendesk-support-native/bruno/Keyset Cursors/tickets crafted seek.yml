docs: |-
  **REFERENCE:** [List Tickets](https://developer.zendesk.com/api-reference/ticketing/tickets/tickets/#list-tickets)

  **WHY:** Tests whether a cursor built from `(seek_updated_at, seek_id)` is accepted,
  so the connector could resume or seek from values it derives from documents
  instead of storing Zendesk's opaque token. With `seek_id=0` it should return every
  ticket with `updated_at >= seek_updated_at`; with `seek_id` at the int64 max it
  should skip that second. `seek_order` must match `seek_sort`
  (`updated_at,id` for `sort=updated_at`).

  **VERIFIED (2026-10-07):** a cursor built by the client is accepted. The format is
  `base64(JSON {"o": <order>, "v": base64(type byte + int64 little-endian, ...)})`,
  with `d` = epoch-seconds `updated_at` and `i` = id. It decodes identically to every
  cursor Zendesk returned in this collection.

  - `(T, 0)` returns every ticket with `updated_at >= T` in ascending order: ticket 3,
    updated exactly at T, is included.
  - `(T, int64 max)` skips second T.
  - Descending order works with `o: "-updated_at,-id"`.
  - A cursor whose order doesn't match `sort` is rejected loudly with
    `400 InvalidPaginationParameter`.
  - Seeking past the newest record returns an empty page with `has_more: false` and
    `after_cursor: null`. A connector storing returned cursors must keep its previous
    cursor when a page comes back empty.

  **LIMITATION (VERIFIED 2026-10-07):** the ticket tie-break id is an internal id that ticket
  responses don't expose anywhere (ticket 47's is 53872748729108). A client-built ticket
  cursor can only seek to the start or end of a second. To resume mid-second,
  use the internal id decoded from a returned `after_cursor`
  (`Keyset Cursors / tickets mid-second resume`).

  **UNOBSERVABLE:** the cursor format is undocumented and could change. The failure
  mode observed for an unusable cursor is a loud 400, not silent misbehavior.
