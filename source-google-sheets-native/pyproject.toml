[project]
name = "source_google_sheets_native"
version = "0.1.0"
description = ""
authors = [
    { name = "Johnny Graettinger", email = "johnny@estuary.dev" },
]
requires-python = ">=3.14"
dependencies = [
    "estuary-cdk",
    "pydantic>=2,<3",
    "aiohttp>=3.13.4,<4.0.0",
]

