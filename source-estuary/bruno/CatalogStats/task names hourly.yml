info:
  name: task names hourly
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/graphql"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {"query":"query($names:[String!]!,$grain:CatalogStatsGrain!,$start:DateTime!,$end:DateTime!){ catalogStats(by:{names:$names,grain:$grain,start:$start,end:$end}){ pageInfo{hasNextPage} edges{ node{ catalogName grain timestamp statsSummary{ readByMe{docsTotal bytesTotal} readFromMe{docsTotal bytesTotal} writtenByMe{docsTotal bytesTotal} writtenToMe{docsTotal bytesTotal} warnings errors failures usageSeconds txnCount lastPublishedAt } taskStats{ capture{collection right{docsTotal bytesTotal} out{docsTotal bytesTotal} lastPublishedAt} derive{ transforms{transform source input{docsTotal bytesTotal} lastSourcePublishedAt bytesBehind} published{docsTotal bytesTotal} out{docsTotal bytesTotal} lastPublishedAt } materialize{collection left{docsTotal bytesTotal} right{docsTotal bytesTotal} out{docsTotal bytesTotal} lastSourcePublishedAt bytesBehind} } } } } }","variables":{"names":"{{task_names_json}}","grain":"HOURLY","start":"2026-10-06T00:00:00Z","end":"2026-10-08T00:00:00Z"}}
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // `names` must be a JSON array; the body template holds a string
        // placeholder, so splice the chained var in as real JSON.
        const names = bru.getVar("task_names_json");
        if (!names) throw new Error("run `Enumeration / liveSpecs bare` first");
        const body = req.getBody();
        body.variables.names = JSON.parse(names);
        req.setBody(body);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** flow origin/master `crates/control-plane-api/src/server/public/graphql/catalog_stats/mod.rs` (`CatalogStatsQuery::catalog_stats`, `MAX_BUCKETS = 10_000`, 30 s timeout)
  
  **WHY:** per-task rows — confirms `taskStats` is populated on exact task
  names and which breakout (capture / materialize / derive) appears. Run
  `Enumeration / liveSpecs bare` first in a fresh session: it sets
  `task_names_json`.

  **VERIFIED (2026-10-07):** 0 rows — the 4 capture/materialization specs under
  `Jonathan_Wihl/` were idle. All of that tenant's task activity comes from
  derivations, which liveSpecs types as `collection`; see
  `CatalogStats / all live names hourly`.

examples:
  - name: "200 — 0 rows for the 4 idle capture/materialization tasks"
    request:
      url: "{{base_url}}/api/graphql"
      method: POST
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "data": {
              "catalogStats": {
                "pageInfo": {
                  "hasNextPage": false
                },
                "edges": []
              }
            }
          }
