info:
  name: rollup hourly
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/graphql"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {"query":"query($names:[String!]!,$grain:CatalogStatsGrain!,$start:DateTime!,$end:DateTime!){ catalogStats(by:{names:$names,grain:$grain,start:$start,end:$end}){ pageInfo{hasNextPage} edges{ node{ catalogName grain timestamp statsSummary{ readByMe{docsTotal bytesTotal} readFromMe{docsTotal bytesTotal} writtenByMe{docsTotal bytesTotal} writtenToMe{docsTotal bytesTotal} warnings errors failures usageSeconds txnCount lastPublishedAt } taskStats{ capture{collection right{docsTotal bytesTotal} out{docsTotal bytesTotal} lastPublishedAt} derive{ transforms{transform source input{docsTotal bytesTotal} lastSourcePublishedAt bytesBehind} published{docsTotal bytesTotal} out{docsTotal bytesTotal} lastPublishedAt } materialize{collection left{docsTotal bytesTotal} right{docsTotal bytesTotal} out{docsTotal bytesTotal} lastSourcePublishedAt bytesBehind} } } } } }","variables":{"names":["Jonathan_Wihl/","Artificial-Industries/"],"grain":"HOURLY","start":"2026-10-06T00:00:00Z","end":"2026-10-08T00:00:00Z"}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** flow origin/master `crates/control-plane-api/src/server/public/graphql/catalog_stats/mod.rs` (`CatalogStatsQuery::catalog_stats`, `MAX_BUCKETS = 10_000`, 30 s timeout)
  
  **WHY:** the shape probe — the full node field set the connector will
  request, on the two tenant rollups. Confirms rollup rows carry
  `taskStats: null`, UInt64-as-string, ordering (name, then ts asc), that an
  `end` in the future is accepted, and whether the current (open) hour
  already has a row. Re-run minutes apart to see the open bucket change.

  **VERIFIED (2026-10-07):** 94 rows = 47 per tenant (10-06T00 … 10-07T22, the
  open hour at run time 22:45Z), ordered by name then timestamp ascending; an
  `end` in the future is accepted. Rollup rows carry `taskStats: null`.
  UInt64 fields are decimal strings; `timestamp` is `+00:00`-offset RFC3339.
  Row size ≈ 490 bytes.

  **VERIFIED (2026-10-07) — bucket finality / lag:** read at 22:45Z and again at
  23:06Z. The 21:00 bucket (closed 45 min before the first read) was
  byte-identical in both. The 22:00 bucket was open at 22:45Z (51,873 docs for
  Artificial-Industries/) and had grown to 77,796 by 23:06Z. The 23:00 bucket
  already held data stamped 23:06:35Z when read at 23:06:43Z, so pipeline lag is
  seconds. A 1-day lookback therefore re-reads well past the observed settle time.

