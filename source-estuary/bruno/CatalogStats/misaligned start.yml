info:
  name: misaligned start
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}/api/graphql"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {"query":"query { catalogStats(by:{names:[\"Jonathan_Wihl/\"],grain:DAILY,start:\"2026-10-06T06:00:00Z\",end:\"2026-10-08T00:00:00Z\"}){ edges{ node{ timestamp } } } }"}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** flow origin/master `crates/control-plane-api/src/server/public/graphql/catalog_stats/mod.rs` (`CatalogStatsQuery::catalog_stats`, `MAX_BUCKETS = 10_000`, 30 s timeout)
  
  **WHY:** a DAILY query starting 06:00 must be rejected, not silently drop the
  06 Oct bucket. The connector must floor every window bound to its grain.

  **LIMITATION (VERIFIED 2026-10-07):** HTTP 200 with `errors`:
  `'start' (2026-10-06T06:00:00+00:00) is not aligned to the daily grain`.
  Rejected, not floored. The connector floors every bound to its grain.

examples:
  - name: "200 — errors: start not aligned to daily grain"
    request:
      url: "{{base_url}}/api/graphql"
      method: POST
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "data": null,
            "errors": [
              {
                "message": "`start` (2026-10-06T06:00:00+00:00) is not aligned to the daily grain; a bucket that straddles it would be omitted from the results",
                "locations": [
                  {
                    "line": 1,
                    "column": 9
                  }
                ],
                "path": [
                  "catalogStats"
                ]
              }
            ]
          }
