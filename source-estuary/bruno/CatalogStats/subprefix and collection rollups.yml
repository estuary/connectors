info:
  name: subprefix and collection rollups
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/api/graphql"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {"query":"query($names:[String!]!){ catalogStats(by:{names:$names,grain:DAILY,start:\"2026-10-01T00:00:00Z\",end:\"2026-10-08T00:00:00Z\"}){ edges{ node{ catalogName timestamp statsSummary{ writtenByMe{docsTotal} writtenToMe{docsTotal} readByMe{docsTotal} readFromMe{docsTotal} usageSeconds } taskStats{ capture{collection} } } } } }","variables":{"names":["Artificial-Industries/","Artificial-Industries/databricks/"]}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** flow origin/master `crates/control-plane-api/src/server/public/graphql/catalog_stats/mod.rs` (`CatalogStatsQuery::catalog_stats`, `MAX_BUCKETS = 10_000`, 30 s timeout)
  
  **WHY:** settles whether sub-prefix rollups are separate rows that overlap
  the tenant rollup (double-count hazard), per `catalogPrefixes` in flow's
  `ops-catalog/catalog-stats.ts` which emits a rollup for every path prefix.

  **VERIFIED (2026-10-07):** 7 DAILY rows, all for `Artificial-Industries/`;
  `Artificial-Industries/databricks/` returned none in this window (no
  activity), so overlap could not be observed live here. Per flow's
  `catalogPrefixes` (ops-catalog/catalog-stats.ts) every path prefix gets its
  own rollup row when active — the connector requests only the outermost
  prefix rollup.

