info:
  name: retention
  type: http
  seq: 11

http:
  method: POST
  url: "{{base_url}}/api/graphql"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {"query":"query { h: catalogStats(by:{names:[\"Artificial-Industries/\"],grain:HOURLY,start:\"2026-01-01T00:00:00Z\",end:\"2026-06-08T00:00:00Z\"}){ edges{ node{ timestamp } } } d: catalogStats(by:{names:[\"Jonathan_Wihl/\",\"Artificial-Industries/\"],grain:DAILY,start:\"2020-01-01T00:00:00Z\",end:\"2026-10-08T00:00:00Z\"}){ edges{ node{ catalogName timestamp } } } m: catalogStats(by:{names:[\"Jonathan_Wihl/\",\"Artificial-Industries/\"],grain:MONTHLY,start:\"2020-01-01T00:00:00Z\",end:\"2026-11-01T00:00:00Z\"}){ edges{ node{ catalogName timestamp } } } }"}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** flow origin/master `crates/control-plane-api/src/server/public/graphql/catalog_stats/mod.rs`

  **WHY:** how far back each grain's stored history reaches, which bounds what
  a `start_date` backfill can actually return per grain. Projection:
  name + timestamp only.

  **UNOBSERVABLE (cause) / VERIFIED (2026-10-07) (effect):** HOURLY rows begin at
  2026-06-06T16:00Z; DAILY from 2025-02-18 / 2025-02-21 and MONTHLY from
  2025-02-01 for both tenants. No TTL is declared in flow's repo, so whether
  hourly is GC'd or simply started then is not determinable from here; either
  way an earlier `start_date` yields empty hourly windows, not errors.

examples:
  - name: "200 — hourly from 2026-06-06T16, daily/monthly from 2025-02 (projection: first + last per alias/name)"
