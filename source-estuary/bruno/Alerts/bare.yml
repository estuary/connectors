info:
  name: bare
  type: graphql
  seq: 1
graphql:
  method: POST
  url: "{{base_url}}/api/graphql"
  body:
    query: |-
      query Alerts($prefix: String!) {
        alerts(by: { prefix: $prefix }) {
          pageInfo { hasPreviousPage hasNextPage startCursor endCursor }
          edges { cursor node { alertType catalogName firedAt resolvedAt arguments resolvedArguments } }
        }
      }
    variables: |-
      {
        "prefix": "{{test_prefix}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **REFERENCE:** https://github.com/estuary/flow/blob/master/crates/control-plane-api/src/server/public/graphql/alerts.rs

  **WHY:** Baseline shape with no paging args. Server source says this takes the
  backward branch (`last` defaulting to 20, `before` = now+1m) and returns edges
  newest-first. Confirms the node key set (no `id`), the cursor format
  `firedAt;alertType;catalogName`, and which pageInfo flag signals more.

  **VERIFIED (2026-10-07):** 15 alerts for `Jonathan_Wihl/`, newest-first by `firedAt`. Node has no `id`. Cursor = `<firedAt RFC3339 µs, +00:00>;<alertType>;<catalogName>`. `arguments.recipients` exists (redacted here; it holds subscriber emails). With no paging args `hasPreviousPage` is the more-flag; `hasNextPage` is always false.

