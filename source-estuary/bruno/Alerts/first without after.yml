info:
  name: first without after
  type: graphql
  seq: 4
graphql:
  method: POST
  url: "{{base_url}}/api/graphql"
  body:
    query: |-
      query Alerts($prefix: String!) {
        alerts(by: { prefix: $prefix }, first: 3) {
          pageInfo { hasPreviousPage hasNextPage startCursor endCursor }
          edges { node { catalogName alertType firedAt } }
        }
      }
    variables: |-
      {
        "prefix": "{{test_prefix}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **REFERENCE:** https://github.com/estuary/flow/blob/master/crates/control-plane-api/src/server/public/graphql/alerts.rs

  **WHY:** Server source says `first` is ignored unless `after` is set (the
  resolver branches on `after`, then uses `last.unwrap_or(20)`). If true, a
  connector that pages forward with `first` would silently get 20 rows and no
  `hasNextPage` — a data-loss trap. Expect 20 edges (or all, if fewer), not 3.

  **LIMITATION (VERIFIED 2026-10-07):** `first: 3` without `after` is **ignored**: 15 alerts came back (all of them, under the default 20). Forward paging with `first` alone would silently cap at 20 with no more-flag. Page backward with `last` + `before`.

