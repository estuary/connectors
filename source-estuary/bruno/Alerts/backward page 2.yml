info:
  name: backward page 2
  type: graphql
  seq: 3
graphql:
  method: POST
  url: "{{base_url}}/api/graphql"
  body:
    query: |-
      query Alerts($prefix: String!, $before: String!) {
        alerts(by: { prefix: $prefix }, last: 3, before: $before) {
          pageInfo { hasPreviousPage hasNextPage startCursor endCursor }
          edges { cursor node { catalogName alertType firedAt resolvedAt } }
        }
      }
    variables: |-
      {
        "prefix": "{{test_prefix}}",
        "before": "{{alerts_before}}"
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('alerts_before')) throw new Error('run `Alerts / backward page 1` first');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **REFERENCE:** https://github.com/estuary/flow/blob/master/crates/control-plane-api/src/server/public/graphql/alerts.rs

  **WHY:** Continuation of `Alerts / backward page 1` (run it first in a fresh
  session — it sets `alerts_before`). Expect the next 3 strictly-older alerts,
  no overlap with page 1, contiguous with it.

  **VERIFIED (2026-10-07):** `before: <page-1 endCursor>` returns the next 3 strictly-older alerts, contiguous with page 1 and no overlap (compare with `Alerts / bare`).

examples:
  - name: 200 - next 3 older, contiguous
    request:
      url: "{{base_url}}/api/graphql"
      method: POST
    response:
      status: 200
      statusText: OK
