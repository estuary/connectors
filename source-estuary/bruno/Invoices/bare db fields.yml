info:
  name: bare db fields
  type: graphql
  seq: 1
graphql:
  method: POST
  url: "{{base_url}}/api/graphql"
  body:
    query: |-
      query Invoices($tenant: String!) {
        tenant(name: $tenant) {
          name
          billing {
            invoices(first: 100) {
              pageInfo { hasNextPage endCursor }
              edges { cursor node { dateStart dateEnd invoiceType subtotal lineItems extra } }
            }
          }
        }
      }
    variables: |-
      {
        "tenant": "{{test_tenant}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **REFERENCE:** https://github.com/estuary/flow/blob/master/crates/control-plane-api/src/server/public/graphql/billing/invoices.rs

  **WHY:** Invoice rows from the DB only — no Stripe round trips. Confirms shape,
  newest-first order, cursor `dateEnd;dateStart;invoiceType`, and presence of
  PREVIEW invoices (mutable until finalized).

  **VERIFIED (2026-10-07):** 42 invoices for `Jonathan_Wihl/`, **newest-first**. The first is the current month's `PREVIEW` (mutable; `extra.daily_usage` grows daily); the rest are `FINAL`. Cursor = `<dateEnd>;<dateStart>;<invoicetype lowercase>`. `extra` duplicates `line_items`/`subtotal` and adds `billed_prefix`, `daily_usage`, `processed_data_gb`… — about 0.5 MB for 42 invoices, mostly `daily_usage`. Key = (tenant, dateStart, dateEnd, invoiceType); the tenant isn't on the node and must be stamped.

