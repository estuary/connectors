info:
  name: after boundary probe
  type: http
  seq: 3

http:
  method: POST
  url: "{{graphql_url}}"
  body:
    type: json
    data: |-
      {
        "query": "query PubHistoryAfter($name: Name!, $after: String!) {\n  liveSpecs(by: { names: [$name] }) {\n    edges { node {\n      catalogName\n      publicationHistory(after: $after, first: 1000) {\n        pageInfo { hasNextPage }\n        edges { cursor node { publicationId publishedAt } }\n      }\n    } }\n  }\n}",
        "variables": {
          "name": "{{ph_spec}}",
          "after": "{{ph_after}}"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 — after = item #2 publishedAt returns items #3..#10"
    request:
      url: "{{graphql_url}}"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
