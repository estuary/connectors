docs: |-
  **REFERENCE:** [publicationHistory resolver](https://github.com/estuary/flow/blob/master/crates/control-plane-api/src/server/public/graphql/publication_history.rs)

  **WHY:** Pins the inclusivity of the only server-side boundary that forward
  pagination offers. `after` = the exact `publishedAt` of item #2 from
  `Publication History / full history` should return items #3..n, which means
  `after` is exclusive (`published_at > after`). This is the incremental
  cursor's filter param (`FETCH-SERVER-SIDE-BOUNDARIES`).

  Run `Publication History / full history` first.

  **LIMITATION (VERIFIED 2026-10-07):** `after: "2024-06-27T14:23:35.129414+00:00"` (item #2's exact `publishedAt`) returned 8 items starting at item #3, so `after` is **exclusive** (`published_at > after`). Forward mode has no upper-bound param, so the incremental horizon must be enforced client-side.
