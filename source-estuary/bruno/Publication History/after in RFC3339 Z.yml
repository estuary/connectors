info:
  name: after in RFC3339 Z
  type: http
  seq: 4

http:
  method: POST
  url: "{{graphql_url}}"
  body:
    type: json
    data: |-
      {
        "query": "query PubHistoryAfterZ($name: Name!, $after: String!) {\n  liveSpecs(by: { names: [$name] }) {\n    edges { node {\n      catalogName\n      publicationHistory(after: $after, first: 1000) {\n        pageInfo { hasNextPage }\n        edges { node { publicationId publishedAt } }\n      }\n    } }\n  }\n}",
        "variables": {
          "name": "{{ph_spec}}",
          "after": "2024-09-01T00:00:00Z"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 — after 2024-09-01T00:00:00Z narrows 10 → 6"
    request:
      url: "{{graphql_url}}"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "liveSpecs": {
                "edges": [
                  {
                    "node": {
                      "catalogName": "Jonathan_Wihl/gpt-notion",
                      "publicationHistory": {
                        "pageInfo": {
                          "hasNextPage": false
                        },
                        "edges": [
                          {
                            "node": {
                              "publicationId": "0e9f7c2947630800",
                              "publishedAt": "2024-09-06T08:15:23.226595+00:00"
                            }
                          },
                          {
                            "node": {
                              "publicationId": "0e9fb56c568b6c00",
                              "publishedAt": "2024-09-06T10:20:26.509431+00:00"
                            }
                          },
                          {
                            "node": {
                              "publicationId": "0ea02950a670a000",
                              "publishedAt": "2024-09-06T14:33:41.124214+00:00"
                            }
                          },
                          {
                            "node": {
                              "publicationId": "0f04f706ba8001d4",
                              "publishedAt": "2024-10-15T18:06:58.247852+00:00"
                            }
                          },
                          {
                            "node": {
