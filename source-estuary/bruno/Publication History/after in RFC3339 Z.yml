docs: |-
  **REFERENCE:** [publicationHistory resolver](https://github.com/estuary/flow/blob/master/crates/control-plane-api/src/server/public/graphql/publication_history.rs)

  **WHY:** The connector emits its cursor in canonical UTC `Z` form, not the
  `+00:00` form the server's edge cursors use (`DateTime::to_rfc3339`). This
  confirms that `TimestampCursor::decode_cursor` (`parse_from_rfc3339`) accepts a
  client-made `Z` timestamp and narrows to `publishedAt > 2024-09-01`.

  Run `Publication History / nested bare` first.

  **VERIFIED (2026-10-07):** a client-formatted `Z` timestamp is accepted and narrows the 10-item history to the 6 publications after 2024-09-01.
