info:
  name: nested bare
  type: http
  seq: 1

http:
  method: POST
  url: "{{graphql_url}}"
  body:
    type: json
    data: |-
      {
        "query": "query PubHistoryNested($prefix: Prefix!) {\n  liveSpecs(by: { prefix: $prefix }, first: 5) {\n    pageInfo { hasNextPage endCursor }\n    edges { node {\n      catalogName\n      publicationHistory(first: 3) {\n        pageInfo { hasNextPage endCursor }\n        edges { cursor node { publicationId catalogType publishedAt userId userEmail userFullName detail } }\n      }\n    } }\n  }\n}",
        "variables": {
          "prefix": "{{test_prefix}}"
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Pin the spec with the most history on this page for the boundary probes.
        const edges = res.getBody()?.data?.liveSpecs?.edges ?? [];
        let best = null;
        for (const e of edges) {
          const n = e.node.publicationHistory?.edges?.length ?? 0;
          if (!best || n > best.n) best = { name: e.node.catalogName, n };
        }
        if (best) bru.setVar('ph_spec', best.name);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

