docs: |-
  **REFERENCE:** [publicationHistory resolver](https://github.com/estuary/flow/blob/master/crates/control-plane-api/src/server/public/graphql/publication_history.rs)

  **WHY:** Proves that `publicationHistory` can be nested inside a `liveSpecs`
  page, resolved per ref in one request. This is how the connector fetches
  history for a whole page of specs per round trip. It also shows the item shape:
  the item does **not** carry the parent `catalogName`, so the connector stamps it
  from the enclosing ref.

  **VERIFIED (2026-10-07):** `publicationHistory` resolves per ref inside one `liveSpecs` page. Items carry no `catalogName`, so the connector stamps it from the enclosing ref. `gpt-notion` shows `hasNextPage: true` with `endCursor` = the third item's `publishedAt` (the nested connection paginates independently). Auto-publications are authored by the `support@estuary.dev` system user with `userFullName: null`. `detail` is nullable.
