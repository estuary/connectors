  - name: "200 — PermissionDenied for unreadable name (whole request fails)"
    request:
      url: "{{graphql_url}}"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": null,
            "errors": [
              {
                "message": "PermissionDenied: REDACTED is not authorized to access prefix or name '{{ph_spec}}' with required capability read",
                "locations": [
                  {
                    "line": 2,
                    "column": 3
                  }
                ],
                "path": [
                  "liveSpecs"
                ]
              }
            ]
          }

docs: |-
  **REFERENCE:** [publicationHistory resolver](https://github.com/estuary/flow/blob/master/crates/control-plane-api/src/server/public/graphql/publication_history.rs)

  **WHY:** Full history for one spec, using the `names` form of `liveSpecs`. This
  is the same shape the connector uses to drain a single spec whose nested
  history page came back with `hasNextPage: true`. It shows that forward order is
  oldest-first, that the edge `cursor` round-trips `publishedAt` at full
  (microsecond) precision, and how `publicationId` orders relative to
  `publishedAt`. Sets `ph_after` to the **second** item's `publishedAt` for
  `Publication History / after boundary probe`.

  Run `Publication History / nested bare` first (it sets `ph_spec`).

  **VERIFIED (2026-10-07):** forward order is oldest-first. Edge `cursor` == `publishedAt`, with microseconds and `+00:00`. `publicationId` ascends in lockstep with `publishedAt` here, but it is not filterable. The last item's id equals `liveSpec.lastPubId`. With `first: 1000` over 10 items, `hasNextPage` is false (exact: this resolver fetches `limit + 1`, so no trailing empty page).


  **LIMITATION (VERIFIED 2026-10-07):** a `names` entry (or `prefix`) that the key cannot read fails the **whole** request: HTTP 200, `data: null`, `errors[0].message` = `PermissionDenied: … is not authorized to access prefix or name '…' with required capability read`. The second example was captured when the chain var was unset. A configured prefix that loses its grant therefore raises `GraphQLError` for the whole sweep, never a silent partial.