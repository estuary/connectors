info:
  name: full history
  type: http
  seq: 2

http:
  method: POST
  url: "{{graphql_url}}"
  body:
    type: json
    data: |-
      {
        "query": "query PubHistoryFull($name: Name!) {\n  liveSpecs(by: { names: [$name] }) {\n    edges { node {\n      catalogName\n      publicationHistory(first: 1000) {\n        pageInfo { hasNextPage endCursor }\n        edges { cursor node { publicationId publishedAt } }\n      }\n    } }\n  }\n}",
        "variables": {
          "name": "{{ph_spec}}"
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const h = res.getBody()?.data?.liveSpecs?.edges?.[0]?.node?.publicationHistory?.edges ?? [];
        if (h.length >= 2) { bru.setVar('ph_after', h[1].cursor); bru.setVar('ph_count', h.length); }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

