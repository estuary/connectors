info:
  name: A1 - Create Service Account
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{base_url}}/api/graphql"
  body:
    query: |-
      mutation Seed($name: Name!, $prefix: Prefix!) {
        createServiceAccount(catalogName: $name, grants: [{ prefix: $prefix, capability: read }]) {
          catalogName createdAt grants { prefix capability }
        }
      }
    variables: |-
      {
        "name": "Jonathan_Wihl/source-estuary-test-sa",
        "prefix": "Jonathan_Wihl/"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **REFERENCE:** https://github.com/estuary/flow/blob/master/crates/control-plane-api/src/server/public/graphql/service_accounts.rs

  **MUTATION — only the user runs this; never the assistant.**

  **WHY:** `ServiceAccounts / bare` returned zero accounts for this key, so the
  node shape (grants, apiKeys, lastUsedAt) and ordering can't be observed.
  Creates one read-only service account under `Jonathan_Wihl/`. Feeds
  `ServiceAccounts / bare`.

  There is **no delete mutation** for service accounts: this row persists.
  Cleanup is `A3` (revoke keys) plus optionally `removeAllServiceAccountGrants`
  in the UI; the account then holds no access.
