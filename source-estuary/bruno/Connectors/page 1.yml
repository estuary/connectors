info:
  name: page 1
  type: graphql
  seq: 1
graphql:
  method: POST
  url: "{{base_url}}/api/graphql"
  body:
    query: |-
      query Connectors {
        connectors(first: 2) {
          pageInfo { hasNextPage endCursor }
          edges { cursor node { id imageName title detail protocol recommended externalUrl logoUrl createdAt defaultImageTag } }
        }
      }
    variables: |-
      {}

runtime:
  scripts:
    - type: after-response
      code: |-
        const ec = res.getBody()?.data?.connectors?.pageInfo?.endCursor;
        if (ec) bru.setVar('connectors_after', ec);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **REFERENCE:** https://github.com/estuary/flow/blob/master/crates/control-plane-api/src/server/public/graphql/connectors.rs

  **WHY:** Shape + forward Relay contract (`id` asc; cursor = id). Captures
  `endCursor` into `connectors_after` for `Connectors / page 2`. `spec` /
  `defaultSpec` deliberately not selected (large endpoint/resource JSON schemas
  per connector; not needed for a catalog listing).

  **VERIFIED (2026-10-07):** `first: 2` gives 2 connectors in ascending `id`, `hasNextPage: true`, `endCursor` = last id (hex `Id`). `defaultImageTag` is populated (e.g. `:v3`).

examples:
  - name: 200 - first 2, hasNextPage true
    request:
      url: "{{base_url}}/api/graphql"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: "application/json"
      body:
        type: json
        data: |-
