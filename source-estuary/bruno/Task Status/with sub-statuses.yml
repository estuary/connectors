docs: |-
  **REFERENCE:** [status resolver](https://github.com/estuary/flow/blob/master/crates/control-plane-api/src/server/public/graphql/status.rs) (the `Controller` flattens `models::status::ControllerStatus`)

  **WHY:** The gate (2026-10-07) chose to include the controller sub-statuses in
  `task_status`. GraphQL has no wildcard, so every leaf must be selected. This is
  the full selection the connector will send, as `TaskStatus.NODE_SELECTION`,
  via fragments. It is probed over two tenants to cover captures,
  materializations, derivations, and collections, and to check that no
  sub-selection errors for any catalog type.

  **VERIFIED (2026-10-07):** 121 refs across `Jonathan_Wihl/` + `Artificial-Industries/`, `errors` absent. The full fragment selection resolves for every catalog type. Types: OK 48, TASK_DISABLED 29, WARNING 43, ERROR 1. Non-null on: activation and publications (all 121), abandon 62, nextRun 45, inferredSchema 33 (collections), connector 22, autoDiscover 12, alerts 6, sourceCapture 6, error 1. Per-type sub-statuses are `null` where they don't apply. `publications.history` holds 0–5 entries (controller-bounded). Status object 598 B min / 973 B median / 5.7 KB max. No null `status` (no tombstones present). Re-run after the credential swap; the first attempt returned 401 `ExpiredSignature` on a JWT access token (see root docs).
