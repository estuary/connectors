info:
  name: with sub-statuses
  type: http
  seq: 2

http:
  method: POST
  url: "{{graphql_url}}"
  body:
    type: json
    data: |-
      {
        "query": "query TaskStatusFull($a: Prefix!, $b: Prefix!) {\n  a: liveSpecs(by: { prefix: $a }, first: 200) { pageInfo { hasNextPage } edges { node { catalogName status { ...S } } } }\n  b: liveSpecs(by: { prefix: $b }, first: 200) { pageInfo { hasNextPage } edges { node { catalogName status { ...S } } } }\n}\nfragment Shard on ShardRef { name keyBegin rClockBegin build }\nfragment Job on JobStatus { type lockFailures { catalogName expected actual } }\nfragment Err on Error { catalogName scope detail }\nfragment Change on DiscoverChange { resourcePath target disable }\nfragment Outcome on AutoDiscoverOutcome { ts added { ...Change } modified { ...Change } removed { ...Change } errors { ...Err } publishResult { ...Job } }\nfragment S on LiveSpecStatus {\n  type summary\n  connector { shard { ...Shard } ts message fields }\n  controller {\n    nextRun error failures updatedAt alerts\n    activation { lastActivated lastActivatedAt recentFailureCount nextRetry\n      shardStatus { count lastTs firstTs status }\n      lastFailure { shard { ...Shard } ts message fields } }\n    publications { nextAfter maxObservedPubId\n      history { id created completed detail isTouch count result { ...Job } errors { ...Err } }\n      pendingRepublish { receivedAt reason lastBuildId } }\n    autoDiscover { nextAt pendingPublish { ...Outcome } lastSuccess { ...Outcome } failure { count firstTs lastOutcome { ...Outcome } } }\n    sourceCapture { upToDate addBindings }\n    inferredSchema { schemaLastUpdated schemaMd5 nextMd5 nextUpdateAfter }\n    configUpdate { nextAttempt build }\n    abandon { lastEvaluated }\n  }\n}",
        "variables": {
          "a": "{{test_prefix}}",
          "b": "{{nested_parent_prefix}}"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

