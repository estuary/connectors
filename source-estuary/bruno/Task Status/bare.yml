info:
  name: bare
  type: http
  seq: 1

http:
  method: POST
  url: "{{graphql_url}}"
  body:
    type: json
    data: |-
      {
        "query": "query TaskStatus($prefix: Prefix!) {\n  liveSpecs(by: { prefix: $prefix }, first: 5) {\n    pageInfo { hasNextPage endCursor }\n    edges { node {\n      catalogName\n      status {\n        type\n        summary\n        controller { nextRun error failures updatedAt }\n        connector { shard { name keyBegin rClockBegin build } ts message fields }\n      }\n    } }\n  }\n}",
        "variables": {
          "prefix": "{{test_prefix}}"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 — 5 statuses (OK, TASK_DISABLED, WARNING)"
    request:
      url: "{{graphql_url}}"
      method: POST
    response:
