docs: |-
  **REFERENCE:** [status resolver](https://github.com/estuary/flow/blob/master/crates/control-plane-api/src/server/public/graphql/status.rs)

  **WHY:** Shape of the `task_status` snapshot document, as a minimal field set:
  the summary `type`/`summary`, the controller run bookkeeping, and the
  connector's last status log. It omits the flattened per-controller sub-statuses
  (`activation`, `publications`, `autoDiscover`, …), which are deep and large.
  Also confirms that collections and tests carry `status` with `connector: null`.

  **VERIFIED (2026-10-07):** collections carry `status` with `controller` set and `connector: null`. The disabled materialization reports `TASK_DISABLED` and still carries its last `connector` log (`ts` 2026-04-20). `controller.nextRun` is null when nothing is scheduled. `connector.fields` is a free-form object.
