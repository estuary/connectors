info:
  name: unfiltered
  type: graphql
  seq: 1
graphql:
  method: POST
  url: "{{base_url}}/api/graphql"
  body:
    query: |-
      query DataPlanes {
        dataPlanes(first: 100) {
          pageInfo { hasNextPage endCursor }
          edges { cursor node { id name fqdn reactorAddress cloudProvider region tag isPublic closed cidrBlocks gcpServiceAccountEmail awsIamUserArn azureApplicationName azureApplicationClientId } }
        }
      }
    variables: |-
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **REFERENCE:** https://github.com/estuary/flow/blob/master/crates/control-plane-api/src/server/public/graphql/data_planes.rs

  **WHY:** Data planes are not prefix-scoped: the resolver returns every plane the
  key can read (public planes plus private planes under tenants it can read).
  Baseline shape and volume. Private-link fields are omitted (empty unless the
  caller has ViewDataPlanePrivateNetworking; volatile controller output).

  **VERIFIED (2026-10-07):** 15 planes sorted by `name`: 9 `ops/dp/public/*` plus 6 private `ops/dp/private/estuary|solutions/*`. The private ones are readable only because this key has read on `ops/dp/private/...`. So **unfiltered output depends on the key's grants, not on configured prefixes**. Cursor = `name`.

