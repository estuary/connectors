info:
  name: tenant filter
  type: graphql
  seq: 2
graphql:
  method: POST
  url: "{{base_url}}/api/graphql"
  body:
    query: |-
      query DataPlanes($tenant: String!) {
        dataPlanes(filter: { tenant: { eq: $tenant } }, first: 100) {
          pageInfo { hasNextPage endCursor }
          edges { node { id name isPublic } }
        }
      }
    variables: |-
      {
        "tenant": "{{test_prefix_nested}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **REFERENCE:** https://github.com/estuary/flow/blob/master/crates/control-plane-api/src/server/public/graphql/data_planes.rs

  **WHY:** Does `filter.tenant` narrow to (public planes + that tenant's private
  planes)? If so, the connector can honor configured prefixes for this stream by
  querying per tenant and de-duplicating public planes by `id`.

  **VERIFIED (2026-10-07):** `filter.tenant.eq: "Artificial-Industries/"` returns only the 9 public planes, because that tenant has no private plane. The filter narrows private planes to the tenant and passes all public planes.

