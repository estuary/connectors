info:
  name: authorized prefixes
  type: http
  seq: 1

http:
  method: POST
  url: "{{graphql_url}}"
  body:
    type: json
    data: |-
      {
        "query": "query AuthorizedPrefixes {\n  prefixes(by: { minCapability: read }) {\n    edges { node { prefix userCapability } }\n  }\n}",
        "variables": {}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 — 15 prefixes, nested under Artificial-Industries/"
    request:
      url: "{{graphql_url}}"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
