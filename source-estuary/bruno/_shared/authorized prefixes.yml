docs: |-
  **REFERENCE:** [prefixes resolver](https://github.com/estuary/flow/blob/master/crates/control-plane-api/src/server/public/graphql/prefixes.rs)

  **WHY:** Every stream in the spec-graph cluster walks `liveSpecs(by: {prefix})`
  once per configured prefix (or per authorized prefix when `prefixes` is empty).
  Authorized prefixes can nest (`Artificial-Industries/` and
  `Artificial-Industries/databricks/`); the connector must collapse nested
  prefixes to their outermost ancestor before walking, or every spec under the
  child is read twice.

  **VERIFIED (2026-10-07):** 15 readable prefixes. `Artificial-Industries/` is listed alongside its children `Artificial-Industries/databricks/` and `Artificial-Industries/postgres-shipments/`, and `ops/` appears as several sibling sub-prefixes. **LIMITATION:** the empty-`prefixes` default must collapse nested prefixes to their outermost ancestor before walking `liveSpecs`.
