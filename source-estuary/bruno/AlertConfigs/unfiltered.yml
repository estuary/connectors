info:
  name: unfiltered
  type: graphql
  seq: 2
graphql:
  method: POST
  url: "{{base_url}}/api/graphql"
  body:
    query: |-
      query AlertConfigs {
        alertConfigs(first: 100) {
          pageInfo { hasNextPage endCursor }
          edges { node { id catalogPrefixOrName } }
        }
      }
    variables: |-
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **REFERENCE:** https://github.com/estuary/flow/blob/master/crates/control-plane-api/src/server/public/graphql/alert_configs.rs

  **WHY:** Shows what an unscoped call returns for this key (15 authorized
  prefixes, under the 20 cap) — i.e. whether rows from outside the configured
  prefixes would leak in without a filter, and whether the call succeeds at all.

  **VERIFIED (2026-10-07):** With 15 authorized prefixes (<= 20) an unfiltered call succeeds and returns the one config across all readable prefixes, so without a filter the connector would capture outside the configured prefixes. The >20-prefix error is **UNOBSERVABLE** with this key (only 15 prefixes); read from source `alert_configs.rs` MAX_PREFIXES. The connector always passes `startsWith`.

examples:
  - name: 200 - unfiltered, 15 authorized prefixes, no error
    request:
      url: "{{base_url}}/api/graphql"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: "application/json"
      body:
        type: json
        data: |-
          {
            "data": {
              "alertConfigs": {
                "pageInfo": {
                  "hasNextPage": false,
                  "endCursor": "Artificial-Industries/"
                },
                "edges": [
                  {
                    "node": {
                      "id": "15373da214d8a400",
                      "catalogPrefixOrName": "Artificial-Industries/"
                    }
                  }
                ]
              }
            }
          }
