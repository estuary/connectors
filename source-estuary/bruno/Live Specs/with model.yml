docs: |-
  **REFERENCE:** [liveSpecs resolver](https://github.com/estuary/flow/blob/master/crates/control-plane-api/src/server/public/graphql/live_spec_refs.rs)

  **WHY:** `model` is the user-authored catalog spec. For tasks it includes
  `endpoint.<connector>.config`, which holds SOPS ciphertext for secret fields.
  This probe shows what would land in the destination if `live_specs` kept
  `model`, which is the input to the keep/drop/strip decision in the plan.
  The saved example redacts `config` values.

  **VERIFIED (2026-10-07):** a capture's `model` carries `endpoint.connector.config` with SOPS ciphertext (`password_sops`, plus a `sops` block holding the GCP KMS `resource_id`, `enc`, and `mac`). Raw 1.5 KB for a small Postgres capture. **LIMITATION:** keeping `model` lands encrypted secrets and KMS key ids in the destination.
