info:
  name: bare
  type: http
  seq: 1

http:
  method: POST
  url: "{{graphql_url}}"
  body:
    type: json
    data: |-
      {
        "query": "query LiveSpecsBare($prefix: Prefix!) {\n  liveSpecs(by: { prefix: $prefix }, first: 3) {\n    pageInfo { hasNextPage endCursor }\n    edges { cursor node { catalogName liveSpec { liveSpecId catalogName catalogType lastBuildId lastPubId createdAt updatedAt isDisabled dataPlaneId } } }\n  }\n}",
        "variables": {
          "prefix": "{{test_prefix}}"
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody();
        const e = b?.data?.liveSpecs?.edges ?? [];
        if (e.length) bru.setVar('ls_first_name', e[0].node.catalogName);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
