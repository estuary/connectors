docs: |-
  **REFERENCE:** [liveSpecs resolver](https://github.com/estuary/flow/blob/master/crates/control-plane-api/src/server/public/graphql/live_spec_refs.rs)

  **WHY:** Shape of the `live_specs` snapshot document — the exact field set the
  connector will request (no `builtSpec`, no `model`; see
  `Live Specs / with model`). Confirms the edge `cursor` equals `catalogName`,
  `Id` scalars are 16-hex strings, and `DateTime` is RFC3339.

  **VERIFIED (2026-10-07):** edges ascend by `catalogName`; edge `cursor` == `catalogName`; `Id` scalars are 16-hex strings; `createdAt`/`updatedAt` are RFC3339 with microseconds and `+00:00`. `updatedAt` moves without a publication (`Jonathan_Wihl/gpt-notion`: `updatedAt` 2026-10-05, but `lastPubId` is the 2025-03-27 publication), because controller/build activity bumps it.

  **UNOBSERVABLE:** tombstoned (deleted) specs. A deletion publication sets
  `live_specs.spec_type = NULL` but keeps the row until the spec's controller
  hard-deletes it (`agent/src/controllers/executor.rs`, `hard_delete_live_spec`;
  `publication_specs` cascades away with it). During that window (normally
  seconds to minutes) the name still appears in `liveSpecs(prefix)` (the list
  query has no `spec_type` filter), but `liveSpec` and `status` resolve to
  `null` (their loaders filter `spec_type is not null`). The flow test
  `publication_history.rs::publication_for_id` asserts this shape. We cannot
  provoke it without deleting a spec, and the window is too short to probe
  reliably. The connector relies on the source: skip refs whose `liveSpec`
  (or `status`) is null. Fallback if wrong: a null-`liveSpec` ref would fail
  model validation loudly, never silently.
