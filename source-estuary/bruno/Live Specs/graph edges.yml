info:
  name: graph edges
  type: http
  seq: 8

http:
  method: POST
  url: "{{graphql_url}}"
  body:
    type: json
    data: |-
      {
        "query": "query LiveSpecEdges($prefix: Prefix!) {\n  liveSpecs(by: { prefix: $prefix }, first: 200) {\n    edges { node {\n      catalogName\n      liveSpec {\n        catalogType\n        readsFrom { pageInfo { hasNextPage } edges { node { catalogName } } }\n        writesTo { pageInfo { hasNextPage } edges { node { catalogName } } }\n        sourceCapture { catalogName }\n      }\n    } }\n  }\n}",
        "variables": {
          "prefix": "{{test_prefix}}"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 — edge names (projection: 3 tasks + 1 derivation)"
    request:
      url: "{{graphql_url}}"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "liveSpecs": {
                "refCount": 55,
                "sample": [
                  {
                    "node": {
                      "catalogName": "Jonathan_Wihl/motherduck/materialize-motherduck",
                      "liveSpec": {
                        "catalogType": "materialization",
                        "readsFrom": {
                          "pageInfo": {
                            "hasNextPage": false
                          },
                          "edges": [
                            {
                              "node": {
                                "catalogName": "Artificial-Industries/postgres-shipments/public/shipments"
                              }
                            }
                          ]
                        },
                        "writesTo": null,
                        "sourceCapture": null
                      }
                    }
                  },
                  {
                    "node": {
                      "catalogName": "Jonathan_Wihl/notion-to-pinecone-demo/materialize-pinecone",
                      "liveSpec": {
                        "catalogType": "materialization",
                        "readsFrom": {
                          "pageInfo": {
                            "hasNextPage": false
                          },
                          "edges": [
                            {
                              "node": {
                                "catalogName": "Jonathan_Wihl/notion-input"
                              }
                            }
                          ]
                        },
                        "writesTo": null,
                        "sourceCapture": null
                      }
                    }
                  },
                  {
                    "node": {
                      "catalogName": "Jonathan_Wihl/pinecone_notion/materialize-pinecone",
                      "liveSpec": {
