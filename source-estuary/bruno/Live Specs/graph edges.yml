docs: |-
  **REFERENCE:** [LiveSpec resolver (readsFrom / writesTo / sourceCapture)](https://github.com/estuary/flow/blob/master/crates/control-plane-api/src/server/public/graphql/live_specs.rs)

  **WHY:** These are the alternative to shipping `model` in `live_specs`. They
  are the spec graph's edges as catalog names: the collections a task reads
  from or writes to, and a materialization's `sourceCapture`. They come from
  the `live_specs.reads_from` / `writes_to` arrays, not the model. With no
  `first`, the nested connection returns every edge
  (`paginate_live_specs_refs`, `first.unwrap_or(usize::MAX)`). Fields are null
  when empty (`if self.reads_from.is_empty() { return Ok(None) }`).

  **VERIFIED (2026-10-07):** 55 refs in one request. Materializations and derivations return `readsFrom` as full catalog names, including names under prefixes outside the walked one (`Jonathan_Wihl/motherduck/materialize-motherduck` reads `Artificial-Industries/postgres-shipments/public/shipments`). The capture returns `writesTo`. Empty edge lists are `null`, not `{edges: []}`. `sourceCapture` is null for every spec here (none use `source`). With no `first`, `hasNextPage` was false everywhere: the nested connection returns all edges.
