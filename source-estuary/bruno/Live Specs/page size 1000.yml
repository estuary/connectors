info:
  name: page size 1000
  type: http
  seq: 3

http:
  method: POST
  url: "{{graphql_url}}"
  body:
    type: json
    data: |-
      {
        "query": "query LiveSpecsCount($prefix: Prefix!) {\n  liveSpecs(by: { prefix: $prefix }, first: 1000) {\n    pageInfo { hasNextPage endCursor }\n    edges { node { catalogName } }\n  }\n}",
        "variables": {
          "prefix": "{{test_prefix}}"
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const e = res.getBody()?.data?.liveSpecs?.edges ?? [];
        bru.setVar('ls_total', e.length);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 — first 1000 accepted, 55 edges (projection: count + first/last names)"
    request:
      url: "{{graphql_url}}"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "liveSpecs": {
                "pageInfo": {
                  "hasNextPage": false,
                  "endCursor": "Jonathan_Wihl/wikipedia/user-summary-limit"
                },
                "edgeCount": 55,
                "firstName": "Jonathan_Wihl/gen_ai_demo_1/blocks",
                "lastName": "Jonathan_Wihl/wikipedia/user-summary-limit"
              }
            }
          }

docs: |-
  **REFERENCE:** [liveSpecs resolver](https://github.com/estuary/flow/blob/master/crates/control-plane-api/src/server/public/graphql/live_spec_refs.rs)

  **WHY:** The resolver has a default page size of 50 and no maximum
  (`DEFAULT_PAGE_SIZE`, `limit = first.or(last).unwrap_or(50)`). This probes an
  oversized `first` to show that it is accepted unclamped, and it records the
  prefix's total spec count, which feeds `Live Specs / exact multiple page`.

  **VERIFIED (2026-10-07):** `first: 1000` is accepted without error; all 55 specs under `Jonathan_Wihl/` came back in one page with `hasNextPage: false`. Clamping above 55 is unobservable on this account, but the resolver has no maximum (`DEFAULT_PAGE_SIZE = 50` only).
