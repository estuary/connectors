info:
  name: liveSpecs bare
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/graphql"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {"query":"query { liveSpecs(by: {prefix: \"Jonathan_Wihl/\"}, first: 500) { pageInfo { hasNextPage endCursor } edges { node { catalogName liveSpec { catalogType } } } } }"}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Chain up to 5 capture/materialization names into `CatalogStats / task names hourly`.
        const edges = res.getBody()?.data?.liveSpecs?.edges ?? [];
        const names = edges
          .filter((e) => ["capture", "materialization"].includes(e.node.liveSpec?.catalogType))
          .slice(0, 5).map((e) => e.node.catalogName);
        if (names.length) bru.setVar("task_names_json", JSON.stringify(names));
        // Chain every live name (tasks + collections, incl. derivations) into
        // `CatalogStats / all live names hourly`.
        bru.setVar("live_names_json", JSON.stringify(edges.map((e) => e.node.catalogName)));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** flow origin/master `crates/control-plane-api/src/server/public/graphql/live_spec_refs.rs` (`LiveSpecsQuery::live_specs`, `DEFAULT_PAGE_SIZE = 50`)
  
  **WHY:** the name source for per-task `catalogStats` rows. Proves the
  envelope, that `first: 500` is honored (no max), and what `catalogType`
  values come back (tests must be dropped — they have no stats).

  **VERIFIED (2026-10-07):** 55 specs under `Jonathan_Wihl/` in one page with
  `first: 500` (default page size is 50, so `first` above it is honored):
  51 `collection`, 3 `materialization`, 1 `capture`. The task-name chain picks
  up only those 4, which turn out to be idle — see `CatalogStats / task names hourly`.

