import:
- acmeCo/flow.yaml
captures:
  acmeCo/source-tiktok-ads-native:
    endpoint:
      local:
        command:
        - python
        - -m
        - source_tiktok_ads_native
        config: config.yaml
    bindings:
    - resource:
        name: advertisers
        interval: PT12H
      target: acmeCo/advertisers
    - resource:
        name: locations
        interval: PT12H
      target: acmeCo/locations
    - resource:
        name: campaigns
        interval: PT30M
      target: acmeCo/campaigns
    - resource:
        name: ad_groups
        interval: PT30M
      target: acmeCo/ad_groups
    - resource:
        name: ads
        interval: PT30M
      target: acmeCo/ads
    - resource:
        name: videos
        interval: PT30M
      target: acmeCo/videos
    - resource:
        name: images
        interval: PT30M
      target: acmeCo/images
    - resource:
        name: campaign_report_daily
        interval: PT12H
      target: acmeCo/campaign_report_daily
    - resource:
        name: campaign_report_hourly
        interval: PT12H
      target: acmeCo/campaign_report_hourly
    - resource:
        name: campaign_report_lifetime
        interval: PT12H
      target: acmeCo/campaign_report_lifetime
    - resource:
        name: adgroup_report_daily
        interval: PT12H
      target: acmeCo/adgroup_report_daily
    - resource:
        name: adgroup_report_hourly
        interval: PT12H
      target: acmeCo/adgroup_report_hourly
    - resource:
        name: adgroup_report_lifetime
        interval: PT12H
      target: acmeCo/adgroup_report_lifetime
    - resource:
        name: ad_report_daily
        interval: PT12H
      target: acmeCo/ad_report_daily
    - resource:
        name: ad_report_hourly
        interval: PT12H
      target: acmeCo/ad_report_hourly
    - resource:
        name: ad_report_lifetime
        interval: PT12H
      target: acmeCo/ad_report_lifetime
    - resource:
        name: campaign_age_gender_report
        interval: PT12H
      target: acmeCo/campaign_age_gender_report
    - resource:
        name: campaign_country_report
        interval: PT12H
      target: acmeCo/campaign_country_report
    - resource:
        name: campaign_language_report
        interval: PT12H
      target: acmeCo/campaign_language_report
    - resource:
        name: campaign_platform_report
        interval: PT12H
      target: acmeCo/campaign_platform_report
    - resource:
        name: ad_age_gender_report
        interval: PT12H
      target: acmeCo/ad_age_gender_report
    - resource:
        name: ad_country_report
        interval: PT12H
      target: acmeCo/ad_country_report
    - resource:
        name: ad_language_report
        interval: PT12H
      target: acmeCo/ad_language_report
    - resource:
        name: ad_platform_report
        interval: PT12H
      target: acmeCo/ad_platform_report
    - resource:
        name: gmv_advertiser_country_report_daily
        interval: PT12H
      target: acmeCo/gmv_advertiser_country_report_daily
    - resource:
        name: gmv_campaign_country_report_daily
        interval: PT12H
      target: acmeCo/gmv_campaign_country_report_daily
