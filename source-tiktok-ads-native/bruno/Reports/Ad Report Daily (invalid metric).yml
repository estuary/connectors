docs: |-
  **REFERENCE:** TikTok API for Business, "Run a synchronous report"
  (`GET /open_api/v1.3/report/integrated/get/`).

  **WHY:** what TikTok returns for an unknown metric name; the connector's validate-time check relies on it naming the field.

  **VERIFIED (2026-10-13, sandbox):** rejected, `code 40002`: "Invalid metric fields: ['not_a_real_metric']". TikTok names the offending metric, so a validate-time test request can report typos precisely.
