http:
  method: GET
  url: '{{base_url}}/report/integrated/get/?advertiser_id={{advertiser_id}}&report_type=BASIC&data_level=AUCTION_AD&dimensions=["ad_id","stat_time_day"]&metrics=["spend","not_a_real_metric"]&page=1&page_size=1000&start_date=2026-10-12&end_date=2026-10-12'
