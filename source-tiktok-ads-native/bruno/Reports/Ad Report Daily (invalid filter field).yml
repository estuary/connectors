info:
  name: Ad Report Daily (invalid filter field)
  type: http
  seq: 12

http:
  method: GET
  url: '{{base_url}}/report/integrated/get/?advertiser_id={{advertiser_id}}&report_type=BASIC&data_level=AUCTION_AD&dimensions=["ad_id","stat_time_day"]&metrics=["spend"]&page=1&page_size=1000&start_date=2026-10-12&end_date=2026-10-12&filtering=[{"field_name":"not_a_real_status","filter_type":"IN","filter_value":"[\"STATUS_ALL\"]"}]'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** TikTok API for Business, "Run a synchronous report"
  (`GET /open_api/v1.3/report/integrated/get/`).

  **WHY:** whether an unknown filter field is rejected or, like entity filters, silently ignored.

  **VERIFIED (2026-10-13, sandbox):** rejected, `code 40002`: "Invalid value for filter field: not_a_real_status is not supported." Unlike entity `filtering`, report filters are validated, so a wrong status field fails loudly.
