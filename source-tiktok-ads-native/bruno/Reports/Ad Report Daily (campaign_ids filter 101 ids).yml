docs: |-
  **REFERENCE:** TikTok API for Business, "Run a synchronous report"
  (`GET /open_api/v1.3/report/integrated/get/`).

  **WHY:** one ID over the documented maximum, to learn whether TikTok rejects the batch or silently drops IDs.

  **UNOBSERVABLE (2026-10-14, sandbox):** `code 0` rather than a rejection; with no rows it can't show whether TikTok drops IDs past 100 or the sandbox doesn't enforce the **DOCUMENTED** limit. The connector keeps to 100.
