info:
  name: Ad Report Daily (31-day window over limit)
  type: http
  seq: 2

http:
  method: GET
  url: '{{base_url}}/report/integrated/get/?advertiser_id={{advertiser_id}}&report_type=BASIC&data_level=AUCTION_AD&dimensions=["ad_id","stat_time_day"]&metrics=["spend"]&page=1&page_size=1000&start_date=2026-09-13&end_date=2026-10-13'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** TikTok API for Business, "Run a synchronous report"
  (`GET /open_api/v1.3/report/integrated/get/`).

  **WHY:** how TikTok enforces its documented 30-day limit for daily reports (an inclusive 31-day range).

  **UNOBSERVABLE (2026-10-13, sandbox):** `code 0` rather than a rejection; the sandbox does not enforce the documented 30-day limit (or short-circuits an account with no data). The connector keeps to the **DOCUMENTED** 30-day limit.
