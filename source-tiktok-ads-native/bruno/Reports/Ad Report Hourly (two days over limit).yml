info:
  name: Ad Report Hourly (two days over limit)
  type: http
  seq: 4

http:
  method: GET
  url: '{{base_url}}/report/integrated/get/?advertiser_id={{advertiser_id}}&report_type=BASIC&data_level=AUCTION_AD&dimensions=["ad_id","stat_time_hour"]&metrics=["spend"]&page=1&page_size=1000&start_date=2026-10-11&end_date=2026-10-12'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** TikTok API for Business, "Run a synchronous report"
  (`GET /open_api/v1.3/report/integrated/get/`).

  **WHY:** how TikTok enforces the one-day limit for hourly reports.

  **UNOBSERVABLE (2026-10-13, sandbox):** `code 0`; the sandbox does not enforce the **DOCUMENTED** one-day hourly limit, which the connector keeps to.
