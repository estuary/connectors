info:
  name: Ad Report Hourly (one day)
  type: http
  seq: 3

http:
  method: GET
  url: '{{base_url}}/report/integrated/get/?advertiser_id={{advertiser_id}}&report_type=BASIC&data_level=AUCTION_AD&dimensions=["ad_id","stat_time_hour"]&metrics=["spend","impressions"]&page=1&page_size=1000&start_date=2026-10-12&end_date=2026-10-12'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** TikTok API for Business, "Run a synchronous report"
  (`GET /open_api/v1.3/report/integrated/get/`).

  **WHY:** an hourly report over a single day, the documented maximum for hourly.

  **VERIFIED (2026-10-13, sandbox):** `code 0`, accepted.
