info:
  name: Advertiser Report Daily (include deleted)
  type: http
  seq: 11

http:
  method: GET
  url: '{{base_url}}/report/integrated/get/?advertiser_id={{advertiser_id}}&report_type=BASIC&data_level=AUCTION_ADVERTISER&dimensions=["advertiser_id","stat_time_day"]&metrics=["spend"]&page=1&page_size=1000&start_date=2026-09-14&end_date=2026-10-13&filtering=[{"field_name":"campaign_status","filter_type":"IN","filter_value":"[\"STATUS_ALL\"]"}]'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** TikTok API for Business, "Run a synchronous report"
  (`GET /open_api/v1.3/report/integrated/get/`).

  **WHY:** which include-deleted filter, if any, an advertiser-level report accepts.

  **UNOBSERVABLE (2026-10-13, sandbox):** rejected, `code 40009`: "Unsupported data_level in sandbox environment: AUCTION_ADVERTISER". Advertiser-level reports, and which include-deleted filter they accept, need production.

  **DOCUMENTED:** TikTok's "Supported filters" page (doc 1751443975608321) lists `campaign_status`, `adgroup_status` and `ad_status` each at its own level only, and none for the advertiser level, so advertiser-level reports send no status filter, as the legacy connector did. When unset, each status filter defaults to non-deleted objects at its own level.
