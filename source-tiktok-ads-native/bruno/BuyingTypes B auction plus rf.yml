info:
  name: BuyingTypes B auction plus rf
  type: http
  seq: 10

http:
  method: GET
  url: '{{base_url}}/campaign/get/?advertiser_id={{advertiser_id}}&filtering={"buying_types":["AUCTION","RESERVATION_RF"],"primary_status":"STATUS_ALL"}&page=1&page_size=1000'

  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Establishes whether the two non-TOP_VIEW buying types may be combined, which decides whether
  reservation coverage needs one extra request or several.
