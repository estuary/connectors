info:
  name: Create Ad To Delete
  type: http
  seq: 9

http:
  method: POST
  url: "{{base_url}}/ad/create/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "advertiser_id": "{{advertiser_id}}",
        "adgroup_id": "{{seed_deleted_adgroup_id}}",
        "creatives": [
          {
            "ad_name": "Estuary Seed Ad (deleted)",
            "ad_format": "SINGLE_VIDEO",
            "video_id": "{{seed_video_id}}",
            "image_ids": [
              "{{seed_cover_image_id}}"
            ],
            "identity_id": "{{seed_identity_id}}",
            "identity_type": "CUSTOMIZED_USER",
            "ad_text": "Estuary connector test ad",
            "call_to_action": "LEARN_MORE",
            "landing_page_url": "https://estuary.dev",
            "operation_status": "DISABLE"
          }
        ]
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('seed_deleted_adgroup_id') && !bru.getEnvVar('seed_deleted_adgroup_id')) await bru.runRequest('Seeding/Create Ad Group To Delete');
        if (!bru.getVar('seed_video_id') && !bru.getEnvVar('seed_video_id')) await bru.runRequest('Seeding/Upload Video');
        if (!bru.getVar('seed_cover_image_id') && !bru.getEnvVar('seed_cover_image_id')) await bru.runRequest('Seeding/Upload Cover Image');
        if (!bru.getVar('seed_identity_id') && !bru.getEnvVar('seed_identity_id')) await bru.runRequest('Seeding/Create Identity');

settings:
  encodeUrl: true
  timeout: 0

docs: |-
  **REFERENCE:** TikTok API for Business, "Create an ad" (`POST /open_api/v1.3/ad/create/`).

  **WHY:** the ad under the deleted campaign; it shows whether a campaign
  delete cascades to its ads.

  **PENDING:** not yet run.
