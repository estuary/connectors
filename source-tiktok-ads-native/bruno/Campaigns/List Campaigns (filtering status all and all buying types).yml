info:
  name: List Campaigns (filtering status all and all buying types)
  type: http
  seq: 4

http:
  method: GET
  url: '{{base_url}}/campaign/get/?advertiser_id={{advertiser_id}}&page=1&page_size=1000&filtering={"secondary_status":"CAMPAIGN_STATUS_ALL","buying_types":["AUCTION","RESERVATION_TOP_VIEW","RESERVATION_RF"]}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** TikTok API for Business, "Get campaigns"
  (`GET /open_api/v1.3/campaign/get/`).

  **WHY:** the combined filter the Campaigns stream would use, if both filters are accepted together.

  **VERIFIED (2026-10-08, sandbox):** rejected, `code 40002`, for the same
  `RESERVATION_TOP_VIEW` reason.
