info:
  name: List Campaigns (creation end bound at exact create_time)
  type: http
  seq: 12

http:
  method: GET
  url: '{{base_url}}/campaign/get/?advertiser_id={{advertiser_id}}&page=1&page_size=1000&filtering={"creation_filter_start_time":"2026-10-08 00:00:00","creation_filter_end_time":"2026-10-08 23:07:56"}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** TikTok API for Business, "Get campaigns"
  (`GET /open_api/v1.3/campaign/get/`).

  **WHY:** pins whether `creation_filter_end_time` is inclusive: the bound equals the live seed campaign's exact `create_time` (2026-10-08 23:07:56).

  **VERIFIED (2026-10-12, sandbox):** `total_number 0`: the campaign whose
  `create_time` equals the bound is excluded, so
  **`creation_filter_end_time` is exclusive** (`create_time < end`).
