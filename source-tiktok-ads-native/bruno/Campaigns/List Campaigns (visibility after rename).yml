info:
  name: List Campaigns (visibility after rename)
  type: http
  seq: 18

http:
  method: GET
  url: '{{base_url}}/campaign/get/?advertiser_id={{advertiser_id}}&page=1&page_size=10&filtering={"campaign_ids":["1878524808566049"],"secondary_status":"CAMPAIGN_STATUS_ALL"}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** TikTok API for Business, "Get campaigns"
  (`GET /open_api/v1.3/campaign/get/`).

  **WHY:** times how long the listing the Campaigns poll reads takes to show a
  change. Polled every few seconds around `Seeding / Rename Campaign For Lag
  Probe`: the lag is the response `Date` of the first listing showing the new
  name, less the `modify_time` it shows. Entity polls stop
  `EVENTUAL_CONSISTENCY_DELAY` (5 minutes) behind the present, so a lag near
  or above that loses changes.

  **VERIFIED (2026-10-24, sandbox):** the `campaign_ids` filter narrows the
  all-status listing to the one campaign (`total_number 1` of 2). Across four
  changes (three runs of `Seeding / Rename Campaign For Lag Probe`, then
  `Seeding / Restore Campaign Name`), polled every 5 s, the listing showed
  each new name and `modify_time` within 0-4 s of that `modify_time` (the
  poll interval; one showed it in the same second):

  | `modify_time` | last old | first new | lag |
  |---|---|---|---|
  | 03:39:02 | 03:39:01 | 03:39:06 | 0-4 s |
  | 03:41:04 | 03:41:02 | 03:41:07 | 0-3 s |
  | 03:43:07 | 03:43:03 | 03:43:07 | 0 s |
  | 03:45:09 | 03:45:06 | 03:45:11 | 0-2 s |

  Times are UTC response `Date` headers; the send time embedded in each name
  was 1 s before its `modify_time`, so the clocks agree.

  **UNOBSERVABLE:** production's lag, and ad groups' and ads' (the sandbox
  can't create ads). The sandbox is a separate host, so this bounds only it.
