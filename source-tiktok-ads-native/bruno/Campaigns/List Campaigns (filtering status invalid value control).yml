info:
  name: List Campaigns (filtering status invalid value control)
  type: http
  seq: 17

http:
  method: GET
  url: '{{base_url}}/campaign/get/?advertiser_id={{advertiser_id}}&page=1&page_size=1000&filtering={"secondary_status":"CAMPAIGN_STATUS_NOT_A_REAL_VALUE"}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** TikTok API for Business, "Get campaigns"
  (`GET /open_api/v1.3/campaign/get/`).

  **WHY:** control: unknown filtering keys are silently ignored, so this checks whether an unknown value for a known key is rejected or also ignored.

  **VERIFIED (2026-10-12, sandbox):** rejected, `code 40002`, with the list of
  accepted `secondary_status` values. Unknown filtering **keys** are ignored,
  but unknown **values** of a known key are rejected.
