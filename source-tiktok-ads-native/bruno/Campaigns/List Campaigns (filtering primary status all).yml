info:
  name: List Campaigns (filtering primary status all)
  type: http
  seq: 8

http:
  method: GET
  url: '{{base_url}}/campaign/get/?advertiser_id={{advertiser_id}}&page=1&page_size=1000&filtering={"primary_status":"STATUS_ALL"}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** TikTok API for Business, "Get campaigns"
  (`GET /open_api/v1.3/campaign/get/`).

  **WHY:** the spike branch uses `primary_status: STATUS_ALL` instead of `secondary_status` to include deleted objects; checks whether it returns the seeded deleted campaign.

  **VERIFIED (2026-10-12, sandbox):** accepted, `code 0`, `total_number 2`:
  `primary_status: STATUS_ALL` also returns the deleted campaign, like
  `secondary_status: CAMPAIGN_STATUS_ALL`. It adds no status field to the
  documents.
