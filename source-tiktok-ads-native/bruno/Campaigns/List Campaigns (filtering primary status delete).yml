info:
  name: List Campaigns (filtering primary status delete)
  type: http
  seq: 16

http:
  method: GET
  url: '{{base_url}}/campaign/get/?advertiser_id={{advertiser_id}}&page=1&page_size=1000&filtering={"primary_status":"STATUS_DELETE"}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** TikTok API for Business, "Get campaigns"
  (`GET /open_api/v1.3/campaign/get/`).

  **WHY:** the `primary_status` form of the deleted-only filter; it should return only the seeded deleted campaign.

  **VERIFIED (2026-10-12, sandbox):** `total_number 1`: same result as the
  `secondary_status: CAMPAIGN_STATUS_DELETE` form.
