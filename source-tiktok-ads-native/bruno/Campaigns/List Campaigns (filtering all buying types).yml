info:
  name: List Campaigns (filtering all buying types)
  type: http
  seq: 3

http:
  method: GET
  url: '{{base_url}}/campaign/get/?advertiser_id={{advertiser_id}}&page=1&page_size=1000&filtering={"buying_types":["AUCTION","RESERVATION_TOP_VIEW","RESERVATION_RF"]}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** TikTok API for Business, "Get campaigns"
  (`GET /open_api/v1.3/campaign/get/`).

  **WHY:** checks whether the endpoint accepts every buying type in one request, so the connector need not make one request per buying type as the ATF connector does.

  **VERIFIED (2026-10-08, sandbox):** rejected, `code 40002`: "The value
  'RESERVATION_TOP_VIEW' cannot be combined with other enum values".
