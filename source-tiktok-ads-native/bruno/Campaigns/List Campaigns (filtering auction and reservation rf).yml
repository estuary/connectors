info:
  name: List Campaigns (filtering auction and reservation rf)
  type: http
  seq: 5

http:
  method: GET
  url: '{{base_url}}/campaign/get/?advertiser_id={{advertiser_id}}&page=1&page_size=1000&filtering={"secondary_status":"CAMPAIGN_STATUS_ALL","buying_types":["AUCTION","RESERVATION_RF"]}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** TikTok API for Business, "Get campaigns"
  (`GET /open_api/v1.3/campaign/get/`).

  **WHY:** checks which buying types can share one request, after `RESERVATION_TOP_VIEW` was rejected in combination.

  **VERIFIED (2026-10-08, sandbox):** accepted, `code 0`, both seeded campaigns
  returned. `AUCTION` and `RESERVATION_RF` combine; with `RESERVATION_TOP_VIEW`
  alone, full buying-type coverage takes two requests per advertiser.
  **UNOBSERVABLE (sandbox):** whether the unfiltered default omits reservation
  campaigns; the sandbox account only holds auction campaigns.
