info:
  name: List Campaigns (creation window wide control)
  type: http
  seq: 13

http:
  method: GET
  url: '{{base_url}}/campaign/get/?advertiser_id={{advertiser_id}}&page=1&page_size=1000&filtering={"creation_filter_start_time":"2026-10-01 00:00:00","creation_filter_end_time":"2026-10-31 00:00:00"}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** TikTok API for Business, "Get campaigns"
  (`GET /open_api/v1.3/campaign/get/`).

  **WHY:** control for the creation bound probes: a month-wide window around both seed campaigns' `create_time`, to confirm the creation filter matches anything at all.

  **VERIFIED (2026-10-12, sandbox):** `total_number 1`: the creation filter
  matches. Only the live campaign comes back because the default status filter
  hides the deleted one.
