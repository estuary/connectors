info:
  name: List Campaigns (filtering status all)
  type: http
  seq: 2

http:
  method: GET
  url: '{{base_url}}/campaign/get/?advertiser_id={{advertiser_id}}&page=1&page_size=1000&filtering={"secondary_status":"CAMPAIGN_STATUS_ALL"}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** TikTok API for Business, "Get campaigns"
  (`GET /open_api/v1.3/campaign/get/`).

  **WHY:** checks whether `secondary_status: CAMPAIGN_STATUS_ALL` returns campaigns the bare list hides, such as the seeded deleted campaign.

  **VERIFIED (2026-10-08, sandbox):** `total_number 2`: returns the deleted
  campaign too. The deleted campaign carries `operation_status: DISABLE`, the
  same as the paused one, and no `secondary_status`, so nothing in the default
  fields marks it deleted.
