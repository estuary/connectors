  url: '{{base_url}}/adgroup/get/?advertiser_id={{advertiser_id}}&page=1&page_size=1000&filtering={"creation_filter_start_time":"2026-10-09 00:00:00","creation_filter_end_time":"2026-10-10 00:00:00"}'
