docs: |-
  **REFERENCE:** TikTok API for Business, "Get ad groups"
  (`GET /open_api/v1.3/adgroup/get/`).

  **WHY:** effect check for the creation-time filter on ad groups: the seed ad group was created on 2026-10-08, so 0 results means the filter is honored.

  **VERIFIED (2026-10-12, sandbox):** `total 0`: the creation-time filter is
  honored for ad groups.
