info:
  name: List Ad Groups (filtering status all)
  type: http
  seq: 3

http:
  method: GET
  url: '{{base_url}}/adgroup/get/?advertiser_id={{advertiser_id}}&page=1&page_size=1000&filtering={"secondary_status":"ADGROUP_STATUS_ALL"}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** TikTok API for Business, "Get ad groups"
  (`GET /open_api/v1.3/adgroup/get/`).

  **WHY:** checks the ad-group all-status filter value: it should return the live seed ad group and the one under the deleted campaign.

  **VERIFIED (2026-10-12, sandbox):** `total 2`: the live seed ad group and the
  one under the deleted campaign.

  **VERIFIED (2026-10-13, sandbox):** `total 3` after the direct delete, in
  descending id order (1878945492011522, 1878524819318882, 1878524737350722):
  **listings are newest-id-first**, as documented.
