docs: |-
  **REFERENCE:** TikTok API for Business, "Get ad account details"
  (`GET /open_api/v1.3/advertiser/info/`).

  **WHY:** the configured advertiser plus 100 made-up ids, to see how TikTok enforces its documented 100-id limit (hard reject, silent truncation, or per-id errors).

  **VERIFIED (2026-10-13, sandbox):** **hard reject**, `code 40002`:
  "advertiser_ids: Length must be between 1 and 100." Requests must batch at
  most 100 ids.
