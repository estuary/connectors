info:
  name: List Ads (filtering status all)
  type: http
  seq: 3

http:
  method: GET
  url: '{{base_url}}/ad/get/?advertiser_id={{advertiser_id}}&page=1&page_size=1000&filtering={"secondary_status":"AD_STATUS_ALL"}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** TikTok API for Business, "Get ads"
  (`GET /open_api/v1.3/ad/get/`).

  **WHY:** checks the ad all-status value is accepted.

  **VERIFIED (2026-10-13, sandbox):** accepted, `code 0` (no ads exist).
