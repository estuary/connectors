info:
  name: List Ads (bare)
  type: http
  seq: 1

http:
  method: GET
  url: '{{base_url}}/ad/get/?advertiser_id={{advertiser_id}}&page=1&page_size=1000'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** TikTok API for Business, "Get ads"
  (`GET /open_api/v1.3/ad/get/`).

  **WHY:** the Ads stream's backing endpoint, unfiltered. The sandbox cannot create ads (see `Seeding/Create Ad`), so this shows the empty response shape only.

  **VERIFIED (2026-10-12, sandbox):** `code 0`, empty `data.list`, with the
  same `page_info` shape as campaigns and ad groups.
  **UNOBSERVABLE (sandbox):** a populated ad document, its timestamp format, and
  how deletions and cascades stamp `modify_time`; the sandbox cannot create ads.

  **DOCUMENTED:** unlike `campaign/get` and `adgroup/get`, `ad/get` offers a
  server-side **`modified_after`** filter (TikTok SDK `FilteringAdGet`).
  **PENDING:** its inclusivity (see `List Ads (filtering modified after)`).
