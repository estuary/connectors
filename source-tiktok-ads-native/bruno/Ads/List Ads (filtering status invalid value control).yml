info:
  name: List Ads (filtering status invalid value control)
  type: http
  seq: 2

http:
  method: GET
  url: '{{base_url}}/ad/get/?advertiser_id={{advertiser_id}}&page=1&page_size=1000&filtering={"secondary_status":"AD_STATUS_NOT_A_REAL_VALUE"}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** TikTok API for Business, "Get ads"
  (`GET /open_api/v1.3/ad/get/`).

  **WHY:** an invalid value is rejected with the list of accepted `secondary_status` values, giving the all, deleted, and parent-deleted (cascade) values the connector needs.

  **VERIFIED (2026-10-13, sandbox):** rejected with 44 accepted values,
  including `AD_STATUS_ALL`, `AD_STATUS_DELETE`, `AD_STATUS_NOT_DELETE`, and
  two cascade statuses: **`AD_STATUS_ADGROUP_DELETE`** and
  **`AD_STATUS_CAMPAIGN_DELETE`**.
