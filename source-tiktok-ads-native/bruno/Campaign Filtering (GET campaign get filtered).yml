info:
  name: Campaign Filtering (GET campaign get filtered)
  type: http
  seq: 7

http:
  method: GET
  url: '{{base_url}}/campaign/get/?advertiser_id={{advertiser_id}}&filtering={"buying_types":["AUCTION","RESERVATION_RF","RESERVATION_TOP_VIEW"],"primary_status":"STATUS_ALL"}&page=1&page_size=1000'

  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Sends the exact `filtering` object the connector builds: `buying_types` covering auction
  and both reservation types, plus `primary_status: STATUS_ALL` so deleted objects are
  visible. Establishes that TikTok accepts both keys together in one filtering object.
