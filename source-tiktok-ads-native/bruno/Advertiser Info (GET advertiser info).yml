info:
  name: Advertiser Info (GET advertiser info)
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/advertiser/info/?advertiser_ids=[\"{{advertiser_id}}\"]"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** TikTok API for Business, "Get ad account details"
  (`GET /open_api/v1.3/advertiser/info/`).

  **WHY:** candidate `validate_credentials` probe when `advertiser_ids` is
  configured, because the sandbox rejects `oauth2/advertiser/get` (see
  `Auth Sanity`).

  **VERIFIED (2026-10-08, sandbox):** `code 0`; `data.list[]` holds one entry per
  requested ID with `advertiser_id`, `name`, `status` (`STATUS_PENDING_CONFIRM`
  for the new sandbox account), `currency`, `timezone` and `create_time` as
  **Unix seconds** (an integer, not a date string). `advertiser_ids` is a
  JSON-encoded array in the query string.
