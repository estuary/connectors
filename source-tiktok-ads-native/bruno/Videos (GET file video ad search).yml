info:
  name: Videos (GET file video ad search)
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/file/video/ad/search/?advertiser_id={{advertiser_id}}&sort_field=MODIFY_TIME&sort_type=DESC&page=1&page_size=100"

  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Lists video creative assets for one advertiser. `/file/image/ad/search/` behaves the same
  way and backs the `images` stream.

  **LIMITATION — only the 10,000 most recently modified assets are reachable.** TikTok: the
  response "will only include the 10,000 most recently modified videos"; the image endpoint
  says "Only the first 10000 images (ordered by modify_time) will be returned." There is no
  filter or offset that reaches past it, so an advertiser holding more than 10,000 assets has
  older ones that no request can retrieve. Fivetran documents inheriting the same cap. The
  connector logs a warning when an advertiser returns at least this many. **DOCUMENTED.**
  https://business-api.tiktok.com/portal/docs?id=1740050472224769

  **LIMITATION — no time filter.** These endpoints offer `sort_field` but no
  `modified_after`-style parameter, so incremental narrowing relies on the modify-time
  ordering: the walk stops at the first asset at or behind the cursor. That makes the
  ordering load-bearing for correctness. **DOCUMENTED.**

  **DOCUMENTED — `page_size` caps at 100 here**, not the 1000 the ad-object endpoints allow.

  Because history arrives on the first sweep rather than through a separate backfill, these
  streams seed their cursor from the configured start date instead of the present.

  Probe to run when credentials exist: confirm `sort_type=DESC` with `sort_field=MODIFY_TIME`
  actually orders newest-first. The early-exit depends on it, and a reversed or ignored sort
  would silently truncate every sync to the first page.
