info:
  name: Report Metric Legality (AUDIENCE bundle)
  type: http
  seq: 6

http:
  method: GET
  url: '{{base_url}}/report/integrated/get/?advertiser_id={{advertiser_id}}&report_type=AUDIENCE&data_level=AUCTION_CAMPAIGN&dimensions=["campaign_id","stat_time_day","country_code"]&metrics=["spend","impressions","clicks","cpc","cpm","ctr","reach","frequency","conversion","cost_per_conversion","conversion_rate","conversion_rate_v2","real_time_conversion","real_time_cost_per_conversion","real_time_conversion_rate","real_time_conversion_rate_v2","result","cost_per_result","result_rate","real_time_result","real_time_cost_per_result","real_time_result_rate"]&start_date=2026-07-01&end_date=2026-07-30&page=1&page_size=1000'

  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Requests the connector's exact default AUDIENCE metric bundle with a country breakdown,
  the shape backing `campaign_country_report`.

  Audience reports support a narrower metric set than basic reports, so this is a separate
  question from the BASIC bundle rather than a repeat of it.
