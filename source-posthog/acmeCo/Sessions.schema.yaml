$defs:
  Meta:
    properties:
      op:
        default: u
        description: 'Operation type (c: Create, u: Update, d: Delete)'
        enum:
        - c
        - u
        - d
        title: Op
        type: string
      row_id:
        default: -1
        description: Row ID of the Document, counting up from zero, or -1 if not known
        title: Row Id
        type: integer
      project_id:
        default: -1
        description: The PostHog project this document belongs to
        title: Project Id
        type: integer
    title: Meta
    type: object
additionalProperties: true
description: |-
  One visit to your site or app, aggregated from the events that carry its id.

  PostHog recalculates a session as more events arrive for it, so the same
  `session_id` is captured several times and converges on its final values.
  `session_id` joins to `$session_id` on Events, and `distinct_id` to
  `distinct_id` on Events.
properties:
  _meta:
    $ref: '#/$defs/Meta'
    description: Document metadata
  session_id:
    title: Session Id
    type: string
  end_timestamp:
    format: date-time
    title: End Timestamp
    type: string
  max_inserted_at:
    anyOf:
    - format: date-time
      type: string
    - type: 'null'
    default: null
    title: Max Inserted At
required:
- session_id
- end_timestamp
title: Session
type: object
x-infer-schema: true
if:
  required:
  - _meta
  properties:
    _meta:
      required:
      - op
      properties:
        op:
          const: d
then:
  reduce:
    strategy: merge
    delete: true
