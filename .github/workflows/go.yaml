name: Go Connectors

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Don't cancel in progress builds of main, since that can result in connector
  # specs not being updated.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No `paths-ignore`: the `Go connectors gate` check below has to report on
# every PR to be usable as a required check. The classifier already skips the
# builds for paths that build nothing.
on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  # Push runs only build the connectors a change touches, so a deploy that
  # failed, or a queued run a newer push replaced, stays missed until the
  # connector changes again. The nightly run builds and deploys every Go
  # connector, fixing those within a day and picking up base image updates.
  # A manual run does the same; it only moves `dev` and version tags on main.
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  # Which connectors did this change touch? This job classifies every changed
  # path, and the build jobs below gate on its answer.
  #
  # It can't be a `paths` filter because dynamically telling a Python connector
  # from a Go or Rust one means looking for a pyproject.toml, which needs the
  # checked out tree & nothing is checked out when `paths` filters are evaluated.
  classify_changes:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.matrix.outputs.run }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v4

      # Runs here rather than in the classifier's workflow so that it also
      # runs on the change adding a connector.
      - name: Check the connector lists
        run: cd .github/scripts && python3 -m unittest test_connector_lists -v

      - id: classify
        uses: ./.github/actions/classify-changes

      # The connector list lives in its own file so it can be read as data.
      # The matrix is the connectors the classifier reported, or all of them.
      - id: matrix
        uses: ./.github/actions/select-connectors
        with:
          list: .github/go-connectors.yaml
          connectors: ${{ steps.classify.outputs.go_connectors }}

      # build_go_connectors compiles in up to four jobs, each a share of the
      # connectors: what limits it is linking, one binary per core.
      - id: shards
        env:
          MATRIX: ${{ steps.matrix.outputs.matrix }}
        run: |
          N=$(jq length <<< "$MATRIX")
          S=$(( (N + 15) / 16 )); [ "$S" -le 4 ] || S=4; [ "$S" -ge 1 ] || S=1
          echo "shards=$(jq -cn --argjson s "$S" '[range($s)]')" >> "$GITHUB_OUTPUT"

  fetch_flow:
    needs: classify_changes
    if: needs.classify_changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Only what the tests run: flowctl, flowctl-v1 for the runtime v1
      # tests, sops for flowctl's and the tests' config decryption, and the
      # binaries flowctl runs connectors with.
      - name: Fetch Flow binaries
        uses: ./.github/actions/fetch-flow-artifact
        with:
          paths: |
            flow-bin/flowctl
            flow-bin/flowctl-v1
            flow-bin/sops
            flow-bin/flow-connector-init
            flow-bin/flow-parser

  build_base_image:
    needs: classify_changes
    if: needs.classify_changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.base_image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: base_image
        uses: ./.github/actions/build-base-image
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # Saves the Go cache the build jobs restore. A cache key is written once, so a
  # build job saving it would store only what its own connector compiled, and
  # every other connector would compile the rest cold until go.sum next changed.
  # Module zips are deleted before saving: builds read the extracted sources,
  # and the zips would add to what every build job downloads.
  #
  # This job compiles every package and test, and every package again with the
  # `nozstd` tag most connector binaries build with, and saves only when no
  # cache under the key exists. It doesn't run on PRs: their caches are visible
  # only to the same PR, and each one could evict main's. A PR that changes go.sum
  # restores main's previous cache through restore-keys.
  warm_go_cache:
    needs: classify_changes
    if: needs.classify_changes.outputs.run == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-cache-v2-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          lookup-only: true

      # A package that fails to compile here (source-db2 needs IBM's headers)
      # fails its own connector's job, so it must not keep everything else out
      # of the cache, nor annotate this job with its errors.
      - name: Compile every package and test
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: 1 # See 'Database Tests' step comment
        run: |
          go build ./... > /dev/null 2>&1 || true
          go test -count=1 -run '^$' ./... > /dev/null 2>&1 || true
          go build -tags nozstd ./... > /dev/null 2>&1 || true
          find ~/go/pkg/mod/cache/download -name '*.zip' -delete
          du -sh ~/go/pkg/mod ~/.cache/go-build

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-cache-v2-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}

      # Image builds compile in a golang image at /builder, where the runner's
      # cache doesn't match. So this also publishes each golang image that more
      # than one Dockerfile builds in, with every package and test compiled in
      # it, once per tag set (`-tags nozstd` changes every package's cache key).
      # The build jobs substitute it for the golang image. An image is rebuilt
      # when go.mod, go.sum or its Go version changes, but not for the Debian
      # updates that move its digest almost daily. Its layers are zstd, which
      # decompresses several times faster than gzip: pulling it is most of
      # what it costs a build job.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Publish golang images with a compiled Go cache
        # Build jobs substitute these images for their golang base, so only
        # main may publish them.
        if: github.ref == 'refs/heads/main'
        env:
          GIT_LFS_SKIP_SMUDGE: 1 # See 'Database Tests' step comment
        run: |
          for f in */Dockerfile; do .github/scripts/golang-cache-image.sh $f; done \
            | sort | uniq -c | awk '$1 > 1 { print $2, $3 }' \
            | while read image tags; do
            GOV=$(docker buildx imagetools inspect $image \
              --format '{{json (index .Image "linux/amd64").Config.Env}}' \
              | jq -r '.[] | select(startswith("GOLANG_VERSION=")) | ltrimstr("GOLANG_VERSION=")')
            NAME=ghcr.io/estuary/build-cache:golang-${image#golang:}-$tags
            KEY=$NAME-$GOV-${{ hashFiles('go.mod', 'go.sum') }}
            if docker buildx imagetools inspect $KEY > /dev/null 2>&1; then continue; fi
            docker buildx build --platform linux/amd64 --provenance=false \
              --build-arg IMAGE=$image --build-arg TAGS=${tags#default} --tag $KEY --tag $NAME-latest \
              --output type=image,push=true,oci-mediatypes=true,compression=zstd,force-compression=true \
              -f - . <<'EOF'
          ARG IMAGE
          FROM $IMAGE
          ARG TAGS
          WORKDIR /builder
          RUN --mount=type=bind,target=/builder go mod download
          RUN --mount=type=bind,target=/builder,rw \
              go build -tags "$TAGS" ./... > /dev/null 2>&1; \
              go test -tags "$TAGS" -count=1 -run '^$' ./... > /dev/null 2>&1; \
              du -sh /go/pkg/mod /root/.cache/go-build
          EOF
          done

      # Only the -latest tags are used, so the images they've moved off are
      # deleted. Each holds about 2 GB.
      - name: Delete superseded golang images
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate /orgs/estuary/packages/container/build-cache/versions \
            --jq '.[] | select(.metadata.container.tags as $t
              | ($t | length) > 0
              and all($t[]; startswith("golang-"))
              and all($t[]; endswith("-latest") | not)) | .id' \
            | while read id; do
              echo "Deleting version $id"
              gh api -X DELETE /orgs/estuary/packages/container/build-cache/versions/$id
            done

  # Compiles the connectors once, outside Docker, for the jobs below: each
  # connector's binaries as its Dockerfile builds them and a test binary per
  # package with tests, in one artifact per connector (see go_build.py). The
  # jobs below have no Go toolchain; .github/scripts/prebuilt-go stands in for
  # `go` with these binaries.
  build_go_connectors:
    needs: classify_changes
    if: needs.classify_changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    name: build_go_connectors (${{ matrix.shard }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.classify_changes.outputs.shards) }}
    env:
      GIT_LFS_SKIP_SMUDGE: 1 # See 'Database Tests' step comment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go module and build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-cache-v2-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-cache-v2-${{ runner.os }}-

      - name: Compile connectors and their tests
        env:
          MATRIX: ${{ needs.classify_changes.outputs.matrix }}
          SHARDS: ${{ needs.classify_changes.outputs.shards }}
        run: |
          # The upload step's artifact client, installed meanwhile: upload-artifact
          # uploads one artifact per step, and each test job downloads only its
          # own connector's.
          npm install --silent --no-save --prefix "$RUNNER_TEMP/artifact" @actions/artifact@2.3.2 &
          CONNECTORS=$(jq -r --argjson n "$(jq length <<< "$SHARDS")" --argjson s ${{ matrix.shard }} \
            'to_entries[] | select(.key % $n == $s) | .value.name' <<< "$MATRIX")
          python3 -I .github/scripts/go_build.py build --out .build/go $CONNECTORS
          wait $!

      # zstd is several times faster than the artifact's own zip compression.
      - name: Pack each connector's binaries
        run: |
          shopt -s nullglob
          mkdir -p .build/bundles
          for dir in .build/go/*/; do
            c=$(basename $dir)
            tar -C .build/go -cf - $c | zstd -q -T0 -3 -o .build/bundles/$c.tar.zst
          done
          ls -lhS .build/bundles

      - name: Upload each connector's binaries
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { DefaultArtifactClient } = require(`${process.env.RUNNER_TEMP}/artifact/node_modules/@actions/artifact`);
            const client = new DefaultArtifactClient();
            const dir = path.resolve('.build/bundles');
            await Promise.all(fs.readdirSync(dir).map(async (f) => {
              const name = `go-${path.basename(f, '.tar.zst')}`;
              await client.uploadArtifact(name, [path.join(dir, f)], dir,
                { retentionDays: 1, compressionLevel: 0 });
              core.info(`uploaded ${name}`);
            }));

  # Tests the in-repo packages the connectors depend on, each once, rather than
  # in every connector's job (see go_build.py helper-tests).
  test_go_packages:
    needs: [classify_changes, fetch_flow]
    if: needs.classify_changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60
    env:
      GIT_LFS_SKIP_SMUDGE: 1 # See 'Database Tests' step comment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go module and build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-cache-v2-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-cache-v2-${{ runner.os }}-

      - name: Restore Flow binaries
        uses: ./.github/actions/restore-flow-binaries

      - name: Authenticate with GCloud
        uses: google-github-actions/auth@v2
        with:
          project_id: estuary-theatre
          workload_identity_provider: projects/417581116910/locations/global/workloadIdentityPools/github/providers/connectors
          service_account: storage-testing@estuary-theatre.iam.gserviceaccount.com

      # tables_gen.go is generated from the TPC-DS DDL; a stale copy would let
      # column types or keys drift from the spec.
      - name: Verify generated table definitions for source-tpc-ds
        if: contains(fromJSON(needs.classify_changes.outputs.matrix).*.name, 'source-tpc-ds')
        run: |
          go generate ./source-tpc-ds/...
          git diff --exit-code -- source-tpc-ds

      - name: Test shared Go packages
        env:
          MATRIX: ${{ needs.classify_changes.outputs.matrix }}
        run: |
          set -euo pipefail
          python3 -I .github/scripts/go_build.py helper-tests $(jq -r '.[].name' <<< "$MATRIX") > "$RUNNER_TEMP/tests.sh"
          cat "$RUNNER_TEMP/tests.sh"
          bash -ex "$RUNNER_TEMP/tests.sh"

  build_connectors:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
      pull-requests: read
    # Without this a wedged job runs to GitHub's six-hour default. The slowest
    # connector observed is ~25m.
    timeout-minutes: 60
    needs: [classify_changes, build_base_image, fetch_flow, build_go_connectors, test_go_packages]
    if: needs.classify_changes.outputs.run == 'true'
    name: ${{ matrix.connector.name }}
    strategy:
      fail-fast: false
      matrix:
        connector: ${{ fromJSON(needs.classify_changes.outputs.matrix) }}
    env:
      DOCKER_BUILD_SUMMARY: false
      DOCKER_BUILD_RECORD_UPLOAD: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare
        id: prep
        run: |
          TAG=$(echo $GITHUB_SHA | head -c7)
          echo ::set-output name=tag::${TAG}
          VERSION=$(cat ${{ matrix.connector.name }}/VERSION | tr -d '\n')
          echo ::set-output name=version::${VERSION}
          VARIANTS="$(cat ${{ matrix.connector.name }}/VARIANTS 2>/dev/null || true)"
          echo ::set-output name=variants::${VARIANTS}
          echo "mode=$(python3 -I .github/scripts/go_build.py mode ${{ matrix.connector.name }})" >> $GITHUB_OUTPUT

      - name: Download ${{ matrix.connector.name }} binaries
        if: steps.prep.outputs.mode == 'prebuilt'
        uses: actions/download-artifact@v4
        with:
          name: go-${{ matrix.connector.name }}
          path: .build/bundles

      - name: Put the prebuilt binaries in place of Go
        if: steps.prep.outputs.mode == 'prebuilt'
        run: |
          mkdir -p .build/go
          zstd -q -d -c .build/bundles/${{ matrix.connector.name }}.tar.zst | tar -C .build/go -xf -
          echo "PREBUILT_GO=$PWD/.build/go/${{ matrix.connector.name }}/go.txt" >> $GITHUB_ENV
          echo "$PWD/.github/scripts/prebuilt-go" >> $GITHUB_PATH

      - name: Restore Flow binaries
        uses: ./.github/actions/restore-flow-binaries

      - name: Authenticate with GCloud
        uses: google-github-actions/auth@v2
        with:
          project_id: estuary-theatre
          workload_identity_provider: projects/417581116910/locations/global/workloadIdentityPools/github/providers/connectors
          service_account: storage-testing@estuary-theatre.iam.gserviceaccount.com

      # tests/source-gcs's setup and cleanup run gcloud.
      - name: Set up Cloud SDK
        if: matrix.connector.name == 'source-gcs'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: estuary-theatre

      - name: Login to GitHub package docker registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host

      - name: Create docker network flow-test
        run: docker network create flow-test

      - name: Start Dockerized test infrastructure
        if: |
          contains(fromJson('[
            "source-db2-batch",
            "source-dynamodb",
            "source-kinesis",
            "source-mysql",
            "source-mysql-batch",
            "source-postgres",
            "source-postgres-batch",
            "source-sftp",
            "source-sqlserver",
            "source-sqlserver-batch",
            "source-sqlserver-ct",
            "source-sqs",
            "source-mongodb"
            ]'), matrix.connector.name)
        run: |
          set +e # Show logs even if startup fails
          # --wait blocks until every service's healthcheck passes. Bound it:
          # without a timeout a healthcheck which never goes green hangs the
          # job until the workflow-level limit rather than failing here.
          docker compose --file ${{ matrix.connector.name }}/docker-compose.yaml up --wait --wait-timeout 300
          docker logs ${{ matrix.connector.name }}-db-1

      - name: Test setup
        if: matrix.connector.name == 'source-mongodb'
        run: |
          bash source-mongodb/docker-compose-init.sh

      # A prebuilt connector's image is its Dockerfile's runtime stage, with the
      # builder stage replaced by build_go_connectors' output. Any other
      # connector compiles in Docker, in warm_go_cache's copy of the golang
      # image with every package compiled in it when there's one.
      - name: Find ${{ matrix.connector.name }}'s build contexts
        id: contexts
        run: |
          if [ "${{ steps.prep.outputs.mode }}" = prebuilt ]; then
            echo "context=builder=.build/go/${{ matrix.connector.name }}/ctx" >> $GITHUB_OUTPUT
            exit 0
          fi
          read image tags < <(.github/scripts/golang-cache-image.sh ${{ matrix.connector.name }}/Dockerfile) || true
          [ -n "$image" ] || exit 0
          CACHE=ghcr.io/estuary/build-cache:golang-${image#golang:}-$tags-latest
          if docker buildx imagetools inspect $CACHE > /dev/null 2>&1; then
            echo "context=$image=docker-image://$CACHE" >> $GITHUB_OUTPUT
          fi

      - name: Build ${{ matrix.connector.name }} Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.connector.name }}/Dockerfile
          load: true
          build-args: |
            BASE_IMAGE=ghcr.io/estuary/base-image:${{ needs.build_base_image.outputs.tag }}
            CONNECTOR_VERSION=${{ steps.prep.outputs.version }}-${{ steps.prep.outputs.tag }}
          tags: ghcr.io/estuary/${{ matrix.connector.name }}:local
          build-contexts: ${{ steps.contexts.outputs.context }}
          # Layers come from the connector's build-cache tag and only main writes
          # it back, so PR builds can't overwrite each other's cache. The GitHub
          # Actions cache is too small for every connector's builder stage.
          cache-from: type=registry,ref=ghcr.io/estuary/build-cache:${{ matrix.connector.name }}
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('type=registry,ref=ghcr.io/estuary/build-cache:{0},mode=max,ignore-error=true', matrix.connector.name) || '' }}

      # Tools the Dockerfile's tests use, which its image carries.
      - name: Put ${{ matrix.connector.name }}'s test tools on PATH
        if: contains(fromJSON('["source-mongodb", "source-tpc-ds"]'), matrix.connector.name)
        run: |
          mkdir -p .build/tools
          ID=$(docker create ghcr.io/estuary/${{ matrix.connector.name }}:local)
          case ${{ matrix.connector.name }} in
            source-mongodb) docker cp $ID:/usr/bin/bson-transcoder .build/tools/ ;;
            source-tpc-ds) docker cp $ID:/connector/dsdgen .build/tools/; docker cp $ID:/connector/tpcds.idx .build/tools/ ;;
          esac
          docker rm $ID
          echo "$PWD/.build/tools" >> $GITHUB_PATH

      # The `go test` runs of the connector's own packages its Dockerfile makes.
      - name: Go Connector ${{ matrix.connector.name }} Unit Tests
        if: steps.prep.outputs.mode == 'prebuilt'
        run: bash -x .build/go/${{ matrix.connector.name }}/unit-tests.sh

      # Go connector tests which aren't run as part of Dockerfile builds. Most Go connectors
      # run their tests as part of the Docker build, but running the tests outside of there
      # makes GCP credentials plumbing for encrypted configs significantly simpler.
      - name: Go Connector ${{ matrix.connector.name }} Database Tests
        if: |
          contains(fromJson('[
            "source-ga4-bigquery",
            "source-postgres",
            "source-redshift-batch",
            "source-sqlserver",
            "source-sqlserver-ct",
            "source-sqs"
            ]'), matrix.connector.name)
        run: |
          ${{ matrix.connector.name }}/run_tests.sh
        env:
          # The estuary/flow repository contains a few large files in Git LFS. This can
          # present an issue with Go module checksums when using a commit-tagged version,
          # because a commit-tagged version will be fetched from VCS using `git archive`
          # and the resulting data will differ depending on whether Git LFS is installed
          # on the machine running the build, and so there are two "valid" checksums but
          # only one can match what's in go.sum / sum.golang.org
          #
          # When we're using a proper release version this isn't an issue, because there's
          # a prebuilt zip file available from proxy.golang.org which will be the same for
          # everyone. But we set this here so that the behavior in the GitHub CI runner
          # (which has LFS installed) will match the Docker builder we use (which doesn't)
          # even when using a commit pseudo-version.
          GIT_LFS_SKIP_SMUDGE: 1

      # Fetch the spec from the built image, to catch images which are entirely
      # broken. This is the only image-level coverage for connectors whose real
      # tests drive the connector as a local command or in-process driver.
      #
      # TODO(johnny): ungate this step so it runs for every connector in the
      # matrix. The gate below is conservatism to keep the scope of the
      # preview-next test migration small, not a statement that other
      # connectors' images don't merit a smoke test -- they do, and the check
      # costs about a second.
      - name: Source connector ${{ matrix.connector.name }} image smoke test
        if: |
          contains(fromJson('[
            "source-dynamodb",
            "source-gcs",
            "source-kinesis",
            "source-mysql",
            "source-postgres",
            "source-s3",
            "source-sftp",
            "source-sqlserver"
            ]'), matrix.connector.name)
        run: CONNECTOR=${{ matrix.connector.name }} VERSION=local ./tests/smoke.sh;

      - name: Source connector ${{ matrix.connector.name }} integration tests
        if: |
          contains(fromJson('[
            "source-gcs",
            "source-kinesis",
            "source-s3",
            "source-sftp"
            ]'), matrix.connector.name)
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

        run: CONNECTOR=${{ matrix.connector.name }} VERSION=local ./tests/run.sh;

      # On failure, hand back what the capture actually produced. A snapshot
      # mismatch isn't actionable without it, and these fixtures -- localstack,
      # rustfs, a real GCS bucket -- aren't reachable from a developer's
      # machine, so CI is the only place that output exists. It's also how a
      # snapshot gets generated in the first place: let the test fail, then
      # review the uploaded actual.jsonl and commit it as the snapshot.
      #
      # Uploads the documents only, never the generated catalog: that embeds
      # CONNECTOR_CONFIG, which for source-gcs is a live service account key,
      # and artifacts on a public repo are world-downloadable.
      - name: Upload ${{ matrix.connector.name }} capture output
        if: |
          failure() && contains(fromJson('[
            "source-gcs",
            "source-kinesis",
            "source-s3",
            "source-sftp"
            ]'), matrix.connector.name)
        uses: actions/upload-artifact@v4
        with:
          name: capture-output-${{ matrix.connector.name }}
          path: |
            .build/tests/${{ matrix.connector.name }}/actual.jsonl
            .build/tests/${{ matrix.connector.name }}/raw.jsonl
          retention-days: 7
          if-no-files-found: warn

      - name: Install duckdb
        if: matrix.connector.name == 'materialize-motherduck'
        uses: opt-nc/setup-duckdb-action@v1.2.9
        with:
          version: v1.3.1

      - name: Materialization connector ${{ matrix.connector.name }} integration tests
        if: startsWith(matrix.connector.name, 'materialize-')

        env:
          # test_go_packages tested them.
          SKIP_SHARED_PACKAGE_TESTS: true
        run: |
          CONNECTOR=${{ matrix.connector.name }} VERSION=local tests/materialize/run.sh;

      # The step above drives the connector through runtime-next. This one checks
      # runtime v1 liveness: the same tests through legacy `flowctl preview` as a
      # single session with no drain, requiring every binding to hold data after
      # it. Runtime v1's Acknowledge never carries statePatches, so a connector
      # that only learns its own staged work from that echo applies nothing
      # within a v1 session -- while every runtime-next test passes. It uses
      # `flowctl-v1`, a tagged release pinned in fetch-flow.sh, because the
      # rolling `dev-next` flowctl tracks runtime-next and legacy preview is
      # slated to be rewired onto it. The liveness check needs no golden, so this
      # runs for every materialization connector; a drained run is then required
      # to match the runtime-next snapshot with its output-only lines removed --
      # both runtimes must leave the same destination -- and is snapshotted as
      # `<test>-runtime-v1` where the connector has one (see testutil's
      # runtimeV1Liveness, requireMatchesRuntimeNextSnapshot, runtimeV1SnapshotName).
      # Only the materialize tests drive runtime v1, so this runs just the
      # TestIntegration* tests that hold them, and everything in there that
      # drives the connector directly or through preview-next skips itself
      # (testutil.SkipRuntimeV1).
      - name: Materialization connector ${{ matrix.connector.name }} integration tests (runtime v1)
        if: startsWith(matrix.connector.name, 'materialize-')
        env:
          FLOW_TEST_RUNTIME: v1
          FLOW_TEST_FLOWCTL: flowctl-v1
        run: |
          cd ${{ matrix.connector.name }}
          go test -v ./... -run '^TestIntegration' -timeout 20m

      # On a snapshot mismatch the harness writes this run's value beside the
      # snapshot as `<name>.actual`. Hand it back: a cloud-credentialed
      # connector's snapshot can only be regenerated where its endpoint is
      # reachable, and the job log is no substitute, since secret redaction
      # rewrites the connector state these snapshots embed. The files hold
      # destination schemas and fixture rows, never endpoint configuration.
      - name: Upload ${{ matrix.connector.name }} snapshot mismatches
        if: failure() && startsWith(matrix.connector.name, 'materialize-')
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-mismatch-${{ matrix.connector.name }}
          path: ${{ matrix.connector.name }}/.snapshots/*.actual
          # `.snapshots` is hidden, and upload-artifact skips hidden files.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Deployment
        uses: ./.github/actions/deploy
        with:
          connector: ${{ matrix.connector.name }}
          rt_id: ${{ secrets.CONNECTOR_REFRESH_RT_ID }}
          rt_secret: ${{ secrets.CONNECTOR_REFRESH_RT_SECRET }}
          tag_sha: ${{ steps.prep.outputs.tag }}
          tag_version: ${{ steps.prep.outputs.version }}
          variants: ${{ steps.prep.outputs.variants }}
          name_variants: "true"

  # One status check covering every job above, whichever connectors ran, so it
  # can be made a required check. It must run with `always()`: GitHub counts a
  # skipped job as passing a required check.
  go_gate:
    name: Go connectors gate # the check's name; keep it fixed
    needs: [classify_changes, fetch_flow, build_base_image, build_go_connectors, test_go_packages, build_connectors]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Reads the same `run` output the build jobs gate on.
      - uses: ./.github/actions/connectors-gate
        with:
          results: ${{ join(needs.*.result, ' ') }}
          run: ${{ needs.classify_changes.outputs.run }}
          build_result: ${{ needs.build_connectors.result }}
