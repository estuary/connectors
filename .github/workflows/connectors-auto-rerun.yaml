name: Connectors auto-rerun

# A connector workflow run on main that fails for a transient reason (a test
# flake, a runner problem) leaves the connectors it would have deployed on their
# old images, and a connector a change touched isn't deployed again until it
# next changes or the nightly run. This re-runs the failed jobs once, when the
# first attempt fails. A second failure is left for a person.
#
# A rerun that lands after a newer deploy of the same connector can't move its
# `dev` or version tag back: the deploy action only moves them forward.
on:
  workflow_run:
    workflows: [Python Connectors, Go Connectors, Rust Connectors]
    types: [completed]
    # Filters on the run's head branch, so PR runs don't start this workflow
    # at all instead of showing up as skipped runs.
    branches: [main]

permissions:
  actions: write

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Re-run the failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --repo "${{ github.repository }}" --failed
