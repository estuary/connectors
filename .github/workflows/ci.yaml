name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore: &non_code_paths
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - ".github/workflows/python.yaml"
      - ".github/workflows/estuary-cdk.yaml"

  pull_request:
    branches: [main]
    paths-ignore: *non_code_paths

jobs:
  # Which connectors did this change touch? This job classifies every changed
  # path, and the build jobs below gate on its answer.
  #
  # It can't be a `paths` filter because dynamically telling a Python connector
  # from a Go or Rust one means looking for a pyproject.toml, which needs the
  # checked out tree & nothing is checked out when `paths` filters are evaluated.
  classify_changes:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.classify.outputs.go_rust }}
    steps:
      - uses: actions/checkout@v4

      - id: classify
        uses: ./.github/actions/classify-changes

  fetch_flow:
    needs: classify_changes
    if: needs.classify_changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Flow binaries
        uses: ./.github/actions/fetch-flow-artifact

  build_base_image:
    needs: classify_changes
    if: needs.classify_changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare
        id: prep
        run: |
          TAG=$(echo $GITHUB_SHA | head -c7)
          echo ::set-output name=tag::${TAG}
          VERSION=$(cat base-image/VERSION | tr -d '\n')
          echo ::set-output name=version::${VERSION}

      - name: Login to GitHub package docker registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host

      - name: Build base-image Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: base-image/Dockerfile
          load: true
          tags: ghcr.io/estuary/base-image:local

      - name: Push base-image image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: base-image/Dockerfile
          push: true
          tags: ghcr.io/estuary/base-image:${{ steps.prep.outputs.tag }}

      - name: Push base-image image with 'dev' tag
        if: ${{ github.event_name == 'push' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: base-image/Dockerfile
          push: true # See 'if' above
          tags: ghcr.io/estuary/base-image:dev,ghcr.io/estuary/base-image:${{ steps.prep.outputs.version }}

  build_connectors:
    runs-on: ubuntu-24.04
    # Without this a wedged job runs to GitHub's six-hour default. The slowest
    # connector observed is ~25m.
    timeout-minutes: 60
    needs: [classify_changes, build_base_image, fetch_flow]
    if: needs.classify_changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        connector:
          - source-alpaca
          - source-bigquery-batch
          - source-db2-batch
          - source-dropbox
          - source-dynamodb
          - source-firestore
          - source-ga4-bigquery
          - source-gcs
          - source-google-drive
          - source-google-pubsub
          - source-hello-world
          - source-http-file
          - source-http-ingest
          - source-kafka
          - source-kinesis
          - source-mongodb
          - source-mysql
          - source-mysql-batch
          - source-onedrive
          - source-oracle
          - source-oracle-batch
          - source-postgres
          - source-postgres-batch
          - source-redshift-batch
          - source-s3
          - source-sftp
          - source-sharepoint
          - source-snowflake
          - source-sqlserver
          - source-sqlserver-batch
          - source-sqlserver-ct
          - source-sqs
          - source-test
          - source-azure-blob-storage
          - materialize-azure-blob-parquet
          - materialize-azure-fabric-warehouse
          - materialize-bigquery
          - materialize-bigtable
          - materialize-clickhouse
          - materialize-databricks
          - materialize-dynamodb
          - materialize-elasticsearch
          - materialize-eventbridge
          - materialize-gcs-csv
          - materialize-gcs-parquet
          - materialize-google-pubsub
          - materialize-google-sheets
          - materialize-hubspot
          - materialize-iceberg
          - materialize-kafka
          - materialize-mongodb
          - materialize-motherduck
          - materialize-mysql
          - materialize-pinecone
          - materialize-postgres
          - materialize-redshift
          - materialize-s3-csv
          - materialize-s3-iceberg
          - materialize-s3-parquet
          - materialize-slack
          - materialize-snowflake
          - materialize-sns
          - materialize-spanner
          - materialize-sqlite
          - materialize-sqlserver
          - materialize-webhook

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare
        id: prep
        run: |
          TAG=$(echo $GITHUB_SHA | head -c7)
          echo ::set-output name=tag::${TAG}
          VERSION=$(cat ${{ matrix.connector }}/VERSION | tr -d '\n')
          echo ::set-output name=version::${VERSION}
          VARIANTS="${{ matrix.connector }} $(cat ${{ matrix.connector }}/VARIANTS 2>/dev/null || true)"
          echo ::set-output name=variants::${VARIANTS}

      # Several steps below run `go test` on the runner instead of inside a Dockerfile, and
      # without this they fetch the module graph and compile it cold. Gate on the same
      # condition as the helper package test step.
      - name: Set up Go with module and build caching
        if: hashFiles(format('{0}/*.go', matrix.connector)) != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Restore Flow binaries
        uses: ./.github/actions/restore-flow-binaries

      - name: Authenticate with GCloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Login to GitHub package docker registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host

      - name: Create docker network flow-test
        run: docker network create flow-test

      - name: Start Dockerized test infrastructure
        if: |
          contains(fromJson('[
            "source-db2-batch",
            "source-dynamodb",
            "source-kafka",
            "source-kinesis",
            "source-mysql",
            "source-mysql-batch",
            "source-postgres",
            "source-postgres-batch",
            "source-sftp",
            "source-sqlserver",
            "source-sqlserver-batch",
            "source-sqlserver-ct",
            "source-sqs",
            "source-mongodb"
            ]'), matrix.connector)
        run: |
          set +e # Show logs even if startup fails
          # --wait blocks until every service's healthcheck passes. Bound it:
          # without a timeout a healthcheck which never goes green hangs the
          # job until the workflow-level limit rather than failing here.
          docker compose --file ${{ matrix.connector }}/docker-compose.yaml up --wait --wait-timeout 300
          docker logs ${{ matrix.connector }}-db-1

      - name: Test setup
        if: matrix.connector == 'source-mongodb'
        run: |
          bash source-mongodb/docker-compose-init.sh

      # Run the tests of every in-repo helper package which this connector
      # transitively depends on. This list is computed on the fly so that we
      # don't have to keep an explicit list up-to-date. Likewise instead of
      # having an explicit `contains()` clause governing Go connectors we'll
      # just identify them as connectors whose subdirectory contains Go files.
      - name: Test Go helper packages for ${{ matrix.connector }}
        if: hashFiles(format('{0}/*.go', matrix.connector)) != ''
        env:
          GIT_LFS_SKIP_SMUDGE: 1 # See 'Database Tests' step comment
        run: |
          set -euo pipefail
          DEPS=$(go list -deps -test \
            -f '{{if and (not .ForTest) .Module (eq .Module.Path "github.com/estuary/connectors")}}{{.ImportPath}}{{end}}' \
            './${{ matrix.connector }}/...')
          PKGS=$(echo "$DEPS" \
            | grep -v '\.test$' \
            | grep -Ev '^github.com/estuary/connectors/${{ matrix.connector }}(/|$)' \
            | sort -u || true)
          [ -n "$PKGS" ] || exit 0
          go test -short -count=1 $PKGS

      # Go connector tests which aren't run as part of Dockerfile builds. Most Go connectors
      # run their tests as part of the Docker build, but running the tests outside of there
      # makes GCP credentials plumbing for encrypted configs significantly simpler.
      - name: Go Connector ${{ matrix.connector }} Database Tests
        if: |
          contains(fromJson('[
            "source-ga4-bigquery",
            "source-postgres",
            "source-redshift-batch",
            "source-sqlserver",
            "source-sqlserver-ct",
            "source-sqs"
            ]'), matrix.connector)
        run: |
          ${{ matrix.connector }}/run_tests.sh
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          # The estuary/flow repository contains a few large files in Git LFS. This can
          # present an issue with Go module checksums when using a commit-tagged version,
          # because a commit-tagged version will be fetched from VCS using `git archive`
          # and the resulting data will differ depending on whether Git LFS is installed
          # on the machine running the build, and so there are two "valid" checksums but
          # only one can match what's in go.sum / sum.golang.org
          #
          # When we're using a proper release version this isn't an issue, because there's
          # a prebuilt zip file available from proxy.golang.org which will be the same for
          # everyone. But we set this here so that the behavior in the GitHub CI runner
          # (which has LFS installed) will match the Docker builder we use (which doesn't)
          # even when using a commit pseudo-version.
          GIT_LFS_SKIP_SMUDGE: 1

      - name: Install system dependencies for Rust connectors
        if: |
          contains(fromJson('[
            "materialize-kafka",
            "source-kafka"
            ]'), matrix.connector)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake libssl-dev libsasl2-dev libclang-dev

      # source-kafka's integration tests drive the connector as a local command
      # against the broker and schema registry started above. They cover seven
      # topic encodings and capture resumption, and are not run by the Docker
      # build (which copies only src/).
      - name: Rust Connector ${{ matrix.connector }} tests
        if: matrix.connector == 'source-kafka'
        timeout-minutes: 20
        run: cargo test --locked --manifest-path source-kafka/Cargo.toml

      - name: Build ${{ matrix.connector }} Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.connector }}/Dockerfile
          load: true
          build-args: BASE_IMAGE=ghcr.io/estuary/base-image:${{ steps.prep.outputs.tag }}
          tags: ghcr.io/estuary/${{ matrix.connector }}:local

      # Fetch the spec from the built image, to catch images which are entirely
      # broken. This is the only image-level coverage for connectors whose real
      # tests drive the connector as a local command or in-process driver.
      #
      # TODO(johnny): ungate this step so it runs for every connector in the
      # matrix. The gate below is conservatism to keep the scope of the
      # preview-next test migration small, not a statement that other
      # connectors' images don't merit a smoke test -- they do, and the check
      # costs about a second.
      - name: Source connector ${{ matrix.connector }} image smoke test
        if: |
          contains(fromJson('[
            "source-dynamodb",
            "source-gcs",
            "source-kinesis",
            "source-mysql",
            "source-postgres",
            "source-kafka",
            "source-s3",
            "source-sftp",
            "source-sqlserver"
            ]'), matrix.connector)
        run: CONNECTOR=${{ matrix.connector }} VERSION=local ./tests/smoke.sh;

      - name: Source connector ${{ matrix.connector }} integration tests
        if: |
          contains(fromJson('[
            "source-gcs",
            "source-kinesis",
            "source-s3",
            "source-sftp"
            ]'), matrix.connector)
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

        run: CONNECTOR=${{ matrix.connector }} VERSION=local ./tests/run.sh;

      # On failure, hand back what the capture actually produced. A snapshot
      # mismatch isn't actionable without it, and these fixtures -- localstack,
      # rustfs, a real GCS bucket -- aren't reachable from a developer's
      # machine, so CI is the only place that output exists. It's also how a
      # snapshot gets generated in the first place: let the test fail, then
      # review the uploaded actual.jsonl and commit it as the snapshot.
      #
      # Uploads the documents only, never the generated catalog: that embeds
      # CONNECTOR_CONFIG, which for source-gcs is a live service account key,
      # and artifacts on a public repo are world-downloadable.
      - name: Upload ${{ matrix.connector }} capture output
        if: |
          failure() && contains(fromJson('[
            "source-gcs",
            "source-kinesis",
            "source-s3",
            "source-sftp"
            ]'), matrix.connector)
        uses: actions/upload-artifact@v4
        with:
          name: capture-output-${{ matrix.connector }}
          path: |
            .build/tests/${{ matrix.connector }}/actual.jsonl
            .build/tests/${{ matrix.connector }}/raw.jsonl
          retention-days: 7
          if-no-files-found: warn

      - name: Install duckdb
        if: matrix.connector == 'materialize-motherduck'
        uses: opt-nc/setup-duckdb-action@v1.2.9
        with:
          version: v1.3.1

      - name: Materialization connector ${{ matrix.connector }} integration tests
        if: startsWith(matrix.connector, 'materialize-')

        run: |
          CONNECTOR=${{ matrix.connector }} VERSION=local tests/materialize/run.sh;

      # The step above drives the connector through runtime-next. This one repeats
      # the connector's own tests through legacy `flowctl preview`, i.e. the
      # runtime v1 protocol, whose Acknowledge never carries statePatches: a
      # connector that only learns its own staged work from that echo applies
      # nothing within a v1 session, and every other check passes. It uses
      # `flowctl-v1`, a tagged release pinned in fetch-flow.sh, because the rolling
      # `dev-next` flowctl tracks runtime-next and legacy preview is slated to be
      # rewired onto it -- at which point this step would silently test v2 twice.
      # Allowlisted because a v1 run is single-shard and omits the apply/state
      # output, so it only matches the golden of a connector whose snapshot
      # already omits them (a `Shards: 2` run); add a connector once verified on v1.
      - name: Materialization connector ${{ matrix.connector }} integration tests (runtime v1)
        if: |
          contains(fromJson('[
            "materialize-redshift"
            ]'), matrix.connector)
        env:
          FLOW_TEST_RUNTIME: v1
          FLOW_TEST_FLOWCTL: flowctl-v1
        run: |
          cd ${{ matrix.connector }} && go test -v ./... -timeout 20m

      # On a snapshot mismatch the harness writes this run's value beside the
      # snapshot as `<name>.actual`. Hand it back: a cloud-credentialed
      # connector's snapshot can only be regenerated where its endpoint is
      # reachable, and the job log is no substitute, since secret redaction
      # rewrites the connector state these snapshots embed. The files hold
      # destination schemas and fixture rows, never endpoint configuration.
      - name: Upload ${{ matrix.connector }} snapshot mismatches
        if: failure() && startsWith(matrix.connector, 'materialize-')
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-mismatch-${{ matrix.connector }}
          path: ${{ matrix.connector }}/.snapshots/*.actual
          # `.snapshots` is hidden, and upload-artifact skips hidden files.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Push ${{ matrix.connector }} image(s) with commit SHA tag
        run: |
          for VARIANT in ${{ steps.prep.outputs.variants }}; do
            echo "Building and pushing ${VARIANT}:${{ steps.prep.outputs.tag }}...";
            docker build --build-arg BASE_CONNECTOR=ghcr.io/estuary/${{ matrix.connector }}:local \
                         --build-arg DOCS_URL=https://go.estuary.dev/${VARIANT} \
                         --tag ghcr.io/estuary/${VARIANT}:${{ steps.prep.outputs.tag }} \
                         --label org.opencontainers.image.revision=$GITHUB_SHA \
                         --file connector-variant.Dockerfile .;
            docker image push ghcr.io/estuary/${VARIANT}:${{ steps.prep.outputs.tag }};
          done

      - name: Push ${{ matrix.connector }} image(s) with 'dev' and '${{ steps.prep.outputs.version }}' tags
        if: ${{ github.event_name == 'push' }}
        run: |
          for VARIANT in ${{ steps.prep.outputs.variants }}; do
            docker image tag ghcr.io/estuary/${VARIANT}:${{ steps.prep.outputs.tag }} ghcr.io/estuary/${VARIANT}:dev;
            docker image tag ghcr.io/estuary/${VARIANT}:${{ steps.prep.outputs.tag }} ghcr.io/estuary/${VARIANT}:${{ steps.prep.outputs.version }};
            docker image push ghcr.io/estuary/${VARIANT}:dev;
            docker image push ghcr.io/estuary/${VARIANT}:${{ steps.prep.outputs.version }};
          done

      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            connector:
              - "${{ matrix.connector }}/**"

      # Re-queue connector tag publishing over PostgREST (HTTPS) instead of a direct
      # psql connection from CI.
      - name: Re-queue connector tags for ${{ matrix.connector }}
        if: github.event_name == 'push' && steps.filter.outputs.connector == 'true'
        env:
          RT_ID: ${{ secrets.CONNECTOR_REFRESH_RT_ID }}
          RT_SECRET: ${{ secrets.CONNECTOR_REFRESH_RT_SECRET }}
        run: |
          set -euo pipefail
          SUPABASE_URL="https://eyrcnmuzzyriypdajwdk.supabase.co"
          # Public anon key, used only as the PostgREST apikey header.
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5cmNubXV6enlyaXlwZGFqd2RrIiwicm9sZSI6ImFub24iLCJpYXQiOjE2NDg3NTA1NzksImV4cCI6MTk2NDMyNjU3OX0.y1OyXD3-DYMz10eGxzo1eeamVMMUwIIeOoMryTRAoco"

          access_token=$(curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/generate_access_token" \
            -H "apikey: $ANON_KEY" -H "Content-Type: application/json" \
            -d "{\"refresh_token_id\": \"$RT_ID\", \"secret\": \"$RT_SECRET\"}" | jq -r '.access_token')
          if [ -z "$access_token" ] || [ "$access_token" = "null" ]; then
            echo "failed to obtain control-plane access token"; exit 1
          fi

          for VARIANT in ${{ steps.prep.outputs.variants }}; do
            echo "Re-queuing tags for ghcr.io/estuary/${VARIANT}";
            curl -sS --fail-with-body -X POST "$SUPABASE_URL/rest/v1/rpc/requeue_connector_tag" \
              -H "apikey: $ANON_KEY" -H "Authorization: Bearer $access_token" \
              -H "Content-Type: application/json" \
              -d "{\"image_name\": \"ghcr.io/estuary/${VARIANT}\", \"image_tags\": [\":${{ steps.prep.outputs.version }}\", \":dev\"]}";
          done
