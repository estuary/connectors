name: estuary-cdk Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "estuary-cdk/**"
      - ".github/workflows/estuary-cdk.yaml"
      - "ruff.toml"

  pull_request:
    branches: [main]
    paths:
      - "estuary-cdk/**"
      - ".github/workflows/estuary-cdk.yaml"
      - "ruff.toml"

concurrency:
  group: estuary-cdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-estuary-cdk:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1

      # Report-only: findings show up as PR annotations without failing the
      # job. One Python version is enough to report them, and running it once
      # keeps them from being reported twice. The version must match
      # `required-version` in ruff.toml.
      - name: Lint
        if: matrix.python-version == '3.12'
        run: pipx run ruff==0.16.9 check --exit-zero --output-format=github estuary-cdk

      - name: Install dependencies and run tests
        run: |
          cd estuary-cdk
          poetry install
          source $(poetry env info --path)/bin/activate
          python -m compileall -q estuary_cdk
          pytest
