name: estuary-cdk Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "estuary-cdk/**"
      - ".github/workflows/estuary-cdk.yaml"

  pull_request:
    branches: [main]
    paths:
      - "estuary-cdk/**"
      - ".github/workflows/estuary-cdk.yaml"

concurrency:
  group: estuary-cdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-estuary-cdk:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        if: matrix.python-version != '3.14'
        uses: snok/install-poetry@v1

      - name: Install dependencies and run tests
        if: matrix.python-version != '3.14'
        run: |
          cd estuary-cdk
          poetry install
          source $(poetry env info --path)/bin/activate
          python -m compileall -q estuary_cdk
          pytest

      # poetry.lock pins the airbyte-cdk dev dependency, whose own dependencies
      # (e.g. pandas) have no Python 3.14 wheels. Instead, test 3.14 as
      # capture-python consumes the CDK: resolved fresh by uv, without the
      # airbyte shim.
      - name: Install dependencies and run tests (uv)
        if: matrix.python-version == '3.14'
        run: |
          python -m pip install uv
          cd estuary-cdk
          uv venv --python python
          uv pip install -e . "pytest>=7.4.3,<8" "pytest-insta>=0.3.0,<0.4" "pytest-asyncio==0.23.8"
          source .venv/bin/activate
          python -m compileall -q estuary_cdk
          pytest --ignore=tests/test_airbyte_cdk.py
