name: Python Connectors

on:
  push:
    branches: [main]
    paths-ignore: &non_code_paths
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - ".github/workflows/ci.yaml"
      - ".github/workflows/estuary-cdk.yaml"

  pull_request:
    branches: [main]
    paths-ignore: *non_code_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which connectors did this change touch? This job classifies every changed
  # path, and the build jobs below gate on its answer.
  #
  # It can't be a `paths` filter because dynamically telling a Python connector
  # from a Go or Rust one means looking for a pyproject.toml, which needs the
  # checked out tree & nothing is checked out when `paths` filters are evaluated.
  classify_changes:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.classify.outputs.python }}
    steps:
      - uses: actions/checkout@v4

      - id: classify
        uses: ./.github/actions/classify-changes

  fetch_flow:
    needs: classify_changes
    if: needs.classify_changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # These tests only invoke flowctl, but flowctl shells out to sops to
      # decrypt each test.flow.yaml's encrypted config, so both are uploaded.
      - name: Fetch flowctl and sops
        uses: ./.github/actions/fetch-flow-artifact
        with:
          paths: |
            flow-bin/flowctl
            flow-bin/sops

  py_connector:
    runs-on: ubuntu-24.04
    needs: [classify_changes, fetch_flow]
    if: needs.classify_changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        connector:
          # Note that every entry here must specify usage_rate. We're unable to
          # set a default and selectively override it with `0.0`, because GH actions
          # considers zero values to be "unset" (which is bs and I'm salty about it).
          - name: source-airtable
            type: capture
            version: v1
            usage_rate: "1.0"
          - name: source-asana
            type: capture
            version: v1
            usage_rate: "1.0"
          - name: source-gladly
            type: capture
            version: v1
            usage_rate: "1.0"
          - name: source-google-ads
            type: capture
            version: v2
            usage_rate: "1.0"
          - name: source-google-sheets-native
            type: capture
            version: v1
            usage_rate: "0.0"
          - name: source-hubspot-native
            type: capture
            version: v1
            usage_rate: "1.0"
          - name: source-hubspot
            type: capture
            version: v5
            usage_rate: "1.0"
          - name: source-notion
            type: capture
            version: v2
            usage_rate: "1.0"
          - name: source-linkedin-pages
