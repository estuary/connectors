name: Build Base Image
description: >-
  Build base-image and push it under this commit's SHA tag, for the connector
  images of this run to build on.

inputs:
  github_token:
    description: GitHub token used to push to ghcr.io.
    required: true
  push_dev_tags:
    description: >-
      Whether a push to main also moves base-image's `dev` and version tags.
      Only one workflow should, so that two workflows building the same commit
      don't race on them.
    default: "true"

outputs:
  tag:
    description: >-
      The base-image tag connector builds should use. PRs from dependabot don't
      have access to repository secrets and cannot push new images, so for them
      this is the existing version tag instead of the image built here.
    value: ${{ github.actor == 'dependabot[bot]' && steps.prep.outputs.version || steps.prep.outputs.tag }}

runs:
  using: "composite"
  steps:

    - name: Prepare
      id: prep
      shell: bash
      run: |
        TAG=$(echo $GITHUB_SHA | head -c7)
        echo "tag=${TAG}" >> $GITHUB_OUTPUT
        VERSION=$(cat base-image/VERSION | tr -d '\n')
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Login to GitHub package docker registry
      uses: docker/login-action@v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1
      with:
        driver-opts: |
          network=host

    - name: Build base-image Docker Image
      uses: docker/build-push-action@v6.19.2
      with:
        context: .
        file: base-image/Dockerfile
        load: true
        tags: ghcr.io/estuary/base-image:local

    # BuildKit fails a whole push on the first request GHCR's rate limit
    # rejects, so it writes the image to an OCI layout instead, and oras, which
    # retries each rejected request, pushes it.
    - name: Export base-image image
      id: export
      if: ${{ github.actor != 'dependabot[bot]' }}
      uses: docker/build-push-action@v6.19.2
      with:
        context: .
        file: base-image/Dockerfile
        outputs: type=oci,dest=${{ runner.temp }}/base-image-oci,tar=false

    - if: ${{ github.actor != 'dependabot[bot]' }}
      uses: oras-project/setup-oras@v2.0.4
      with:
        version: 1.3.6

    - name: Push base-image image
      if: ${{ github.actor != 'dependabot[bot]' }}
      shell: bash
      env:
        LAYOUT: ${{ runner.temp }}/base-image-oci@${{ steps.export.outputs.digest }}
        IMAGE: ghcr.io/estuary/base-image:${{ steps.prep.outputs.tag }}
      run: bash .github/actions/deploy/push-with-retry.sh "$IMAGE" oras cp --from-oci-layout "$LAYOUT" "$IMAGE"

    - name: Push base-image image with 'dev' tag
      if: github.event_name == 'push' && inputs.push_dev_tags == 'true'
      shell: bash
      env:
        IMAGE: ghcr.io/estuary/base-image
        DIGEST: ${{ steps.export.outputs.digest }}
        VERSION: ${{ steps.prep.outputs.version }}
      run: bash .github/actions/deploy/push-with-retry.sh "${IMAGE}:dev" oras tag "${IMAGE}@${DIGEST}" dev "$VERSION"
