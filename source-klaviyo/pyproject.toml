[project]
name = "source-klaviyo"
version = "0.1.0"
description = ""
authors = [
    { name = "Luishfs", email = "luish1980@hotmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "estuary-cdk",
    "estuary-cdk-airbyte-shim",
    "pydantic>=2,<3",
]

# The dependency is declared in [project.dependencies] above; this is where
# uv finds it.
[tool.uv.sources]
estuary-cdk = { workspace = true }
estuary-cdk-airbyte-shim = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
