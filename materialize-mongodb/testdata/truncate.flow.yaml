collections:
  tests/truncate:
    schema:
      properties:
        id: {type: integer}
        _meta: {type: object}
      required: [id, _meta]
      type: object
    key: [/id]

materializations:
  acmeCo/tests/materialize-mongodb-truncate:
    endpoint:
      local:
        command: ["go", "run", "./cmd/connector"]
        protobuf: true
        config: config.local.yaml
    bindings:
    - resource:
        collection: truncate_standard
      source: tests/truncate
      fields:
        recommended: true
    - resource:
        collection: truncate_delta
        delta_updates: true
      source: tests/truncate
      fields:
        recommended: true
