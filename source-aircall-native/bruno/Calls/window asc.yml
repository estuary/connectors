docs:
  content: |-
    **REFERENCE:** https://developers.aircall.io/api-references#list-all-calls

    **WHY:** the connector's fetch shape: `from`/`to` unix seconds + `order=asc`
    over a recent window `[now-30d, now-1s]` (computed in `Calls/folder.yml`).
    Proves (a) the filter narrows (`meta.total` < `Calls / bare`'s), (b) which
    timestamp it filters on — every returned `started_at` should fall inside
    the window, and (c) whether `asc` sorts by `started_at`. Its after-response
    script pins `pin_call_id` / `pin_started_at` for `Calls / from bound probe`
    and `Calls / to bound probe` — run this first in a fresh session.


    **VERIFIED (2026-09-28):** the `from`/`to` window returns all 3 seeded calls,
    ascending by `started_at` (`…050 → …087 → …116`), nothing outside the
    window (`OUT_OF_WINDOW []`). An earlier run with `to = now-300s` returned 0
    because the calls were under 5 minutes old — that is the filter working,
    not a gap. Narrowing is proven by the bound probes below.

    **LIMITATION (VERIFIED 2026-09-28): calls are rewritten after they end —
    including the filtered field.** Between a read ~1.5 min after the calls
    ended (unchanged) and one ~20 min after, Aircall finalized all 3 calls:
    `cost` `"0.0"` → `"3.0"`, `pricing_type` `null` → `"in_bundle"`,
    `duration` recomputed to `ended_at - started_at` (22 → 21, 10 → 9), and
    call 4186784158's **`started_at` moved 1790603087 → 1790603088**. So
    `started_at` is not immutable in the first minutes of a call's life. A
    window read before finalization can see a call at a pre-final second; the
    connector's lookback subtask re-reads every window after `now - LAG`,
    once calls are final, so it alone tiles the final `started_at` timeline
    (plan §3). Observed shift: +1s, one sample. **UNOBSERVABLE:** whether
    shifts can be larger or backwards, or finalization slower than ~20 min
    under load. The fallback is the lookback lag's large margin (hours vs
    minutes).

    **VERIFIED (2026-09-28): mutations surface on re-read with no update
    marker.** After `Seeding / K2 - Comment a Call` the call carries
    `comments[]` (`posted_at` is a **unix int**, not the documented String;
    `posted_by: null` for API-posted comments), and after
    `Seeding / K4 - Archive a Call` it carries `archived: true`. Neither
    changes any timestamp on the call, and the Call has no `updated_at`, so
    there is no update cursor. **Archived calls stay listed** (`meta.total`
    still 3) — the list endpoint's defaults hide no partition.
  type: text/markdown
