info:
  name: window asc
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/calls?from={{calls_window_from}}&to={{calls_window_to}}&order=asc&per_page=50"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Pin a call from this window for the boundary probes. Choose one whose
        // started_at is not shared with a neighbour so membership is unambiguous.
        const calls = res.getBody()?.calls || [];
        const counts = {};
        for (const c of calls) counts[c.started_at] = (counts[c.started_at] || 0) + 1;
        // `--env-var calls_pin_index=N` overrides the choice, to repeat the boundary
        // probes against every call in the window.
        const forced = bru.getEnvVar('calls_pin_index');
        const pick = forced != null && forced !== '' ? calls[Number(forced)]
          : calls.slice(Math.floor(calls.length / 2)).find(c => counts[c.started_at] === 1)
            || calls.find(c => counts[c.started_at] === 1);
        if (pick) {
          bru.setVar('pin_call_id', String(pick.id));
          bru.setVar('pin_started_at', String(pick.started_at));
          console.log('PIN', pick.id, pick.started_at, 'answered', pick.answered_at, 'ended', pick.ended_at);
        }
        // Out-of-window check (client-side, for the report only).
        const lo = Number(bru.getVar('calls_window_from')), hi = Number(bru.getVar('calls_window_to'));
        console.log('OUT_OF_WINDOW', JSON.stringify(calls.filter(c => c.started_at < lo || c.started_at > hi).map(c => [c.id, c.started_at])));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

