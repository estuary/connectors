docs:
  content: |-
    **REFERENCE:** https://developers.aircall.io/api-references#list-all-calls

    **WHY:** baseline shape of the Call object and the `meta` envelope with no
    filters, default ordering. Answers: per-item key set (no `created_at` /
    `updated_at` expected; `started_at`/`answered_at`/`ended_at` unix ints),
    `id` type, `meta.total` for the whole retention window (tells us whether the
    account is past the 10k cap and whether `total` is reported above 10,000),
    and the documented-but-contradictory default order ("ordered by ascending
    IDs" vs `order` "Reorder entries by created_at").

    **VERIFIED (2026-09-28):** the account has **no calls** in the retention window:
    `calls: []`, `meta.total: 0`, `next_page_link: null`. The envelope matches
    the docs (`calls` + `meta{count,total,current_page,per_page,next_page_link,
    previous_page_link}`). After seeding (see below), per-item shape and
    default order were observed. `total` above 10k stays **UNOBSERVABLE** for a test
    account (needs >10k real calls); the connector design does not rely on it
    being exact above 10k (see `Calls / page past cap`).

    **VERIFIED (2026-09-28, after seeding 3 outbound calls by hand):** item key set —
    `id` (Int64-sized, e.g. `4186780376`), `sid`, `direct_link`, `direction`,
    `status`, `missed_call_reason`, `started_at` / `answered_at` / `ended_at`
    (unix-second ints), `duration`, `archived`, `cost`, `voicemail`,
    `recording`, `recording_short_url`, `voicemail_short_url`, `asset`,
    `raw_digits`, `user` (embedded), `contact`, `assigned_to`,
    `transferred_by`, `transferred_to`, `comments`, `number` (embedded, incl.
    its greeting `messages`), `teams`, `tags`, `country_code_a2`,
    `pricing_type`. **No `created_at` / `updated_at`** — nothing on the call
    moves when it's mutated. Without `fetch_short_urls` the `*_short_url` keys
    are present but `null`; without `fetch_contact` `contact` is `null`.
    Default order is ascending (`id` and `started_at` both ascend — they can't
    be told apart here). The example shows 1 of 3 full items.

    **PENDING:** inbound / missed (`missed_call_reason`, `answered_at: null`) /
    voicemail shapes — all 3 seeded calls are answered outbound. Not
    load-bearing for the fetch logic (only `id` is required); close by placing
    a missed inbound call with a voicemail and re-running.
  type: text/markdown
