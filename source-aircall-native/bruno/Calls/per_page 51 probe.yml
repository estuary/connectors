info:
  name: per_page 51 probe
  type: http
  seq: 9

http:
  method: GET
  url: "{{base_url}}/calls?per_page=51"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - per_page 51 silently clamped to 50 (empty account)
    request:
      url: "{{base_url}}/calls?per_page=51"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "calls": [],
            "meta": {
              "count": 0,
              "total": 0,
              "current_page": 1,
              "per_page": 50,
              "next_page_link": null,
              "previous_page_link": null
            }
          }

docs:
  content: |-
    **REFERENCE:** https://developers.aircall.io/api-references#pagination

    **WHY:** documented max `per_page` is 50. Push one past it to learn the
    enforcement mode (400 reject vs silent clamp to 50 vs silent truncation) —
    the connector sends 50 either way, but the probe records the contract.

    **VERIFIED (2026-09-28):** **silent clamp** — `per_page=51` is accepted (200) and
    `meta.per_page` comes back `50`. No 4xx. The connector sends 50.
    Clamp-vs-truncation beyond 50 items is not distinguishable on an empty
    account; it doesn't matter here because completion is signalled by
    `next_page_link: null`, not by a short page.
  type: text/markdown
