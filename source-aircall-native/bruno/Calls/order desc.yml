info:
  name: order desc
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/calls?per_page=50&order=desc"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - desc reverses both id and started_at (projection)
    request:
      url: "{{base_url}}/calls?per_page=50&order=desc"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "calls": [
              {
                "id": 4186787210,
                "started_at": 1790603116,
                "status": "done"
              },
              {
                "id": 4186784158,
                "started_at": 1790603087,
                "status": "done"
              },
              {
                "id": 4186780376,
                "started_at": 1790603050,
                "status": "done"
              }
            ],
            "meta": {
              "count": 3,
              "total": 3,
              "current_page": 1,
              "per_page": 50,
              "next_page_link": null,
              "previous_page_link": null
            }
          }

docs:
  content: |-
    **REFERENCE:** https://developers.aircall.io/api-references#list-all-calls

    **WHY:** `order` is documented as sorting by `created_at`, a field the Call
    object doesn't expose. Compare the returned sequence of `id` vs `started_at`
    under `desc`: if both are monotonic the sort key is ambiguous but harmless;
    if they diverge, it tells us which one the server sorts on. The connector
    does not depend on sort order within a window (it walks a bounded
    `[from, to]` set to exhaustion), so this is informational.


    **VERIFIED (2026-09-28):** `order=desc` returns `4186787210 (…116) → 4186784158
    (…087) → 4186780376 (…050)`, i.e. both `id` and `started_at` descend. On
    this data the sort key (id vs `started_at` vs a hidden creation time) is
    indistinguishable. The connector does not rely on it: it drains each
    bounded window completely and advances its cursor to the window's `to`.
  type: text/markdown
