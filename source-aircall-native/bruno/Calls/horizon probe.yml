info:
  name: horizon probe
  type: http
  seq: 8

http:
  method: GET
  url: "{{base_url}}/calls?from={{calls_old_from}}&to={{calls_old_to}}&per_page=50"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - window older than 6 months returns empty, no error
    request:
      url: "{{base_url}}/calls?from=1759066706&to=1774186706&per_page=50"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "calls": [],
            "meta": {
              "count": 0,
              "total": 0,
              "current_page": 1,
              "per_page": 50,
              "next_page_link": null,
              "previous_page_link": null
            }
          }

docs:
  content: |-
    **REFERENCE:** https://developers.aircall.io/api-references#list-all-calls

    **WHY:** docs: "Only six months of history is available." Query a window
    entirely older than that (`[now-365d, now-190d]`) to learn whether old
    `from` values are rejected (4xx) or silently return empty — which decides
    whether the connector must clamp `start_date` before sending. `Calls / bare`
    (default ascending) shows the oldest call actually served.

    **VERIFIED (2026-09-28):** a window entirely older than six months
    (`[now-365d, now-190d]`) is **accepted (200) and returns empty** — old
    `from` values are not rejected, so clamping `start_date` is an efficiency
    measure (skip provably-empty windows), not a correctness requirement.
    **UNOBSERVABLE:** the exact retention edge (180 days? six calendar
    months?) — a test account cannot hold calls older than its own creation
    (the only calls are the 2026-09-28 seeds), so "empty because of retention"
    can't be told apart from "empty because no calls". The connector clamps
    the backfill start inside the documented horizon with a safety margin
    (plan §3.4); if the real horizon is shorter, the only cost is an empty
    window. The retention statement itself stays DOCUMENTED (2026-09-28, "Only six months of history is available."
    on the List all Calls reference).
  type: text/markdown
