info:
  name: page at cap
  type: http
  seq: 10

http:
  method: GET
  url: "{{base_url}}/calls?per_page=50&page=200"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - page 200 x 50 accepted with total 3
    request:
      url: "{{base_url}}/calls?per_page=50&page=200"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "calls": [],
            "meta": {
              "count": 0,
              "total": 3,
              "current_page": 200,
              "per_page": 50,
              "next_page_link": null,
              "previous_page_link": "https://api.aircall.io/v1/calls?order=asc&page=199&per_page=50"
            }
          }
  - name: 200 - page 200 x 50 accepted (empty account)
    request:
      url: "{{base_url}}/calls?per_page=50&page=200"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "calls": [],
            "meta": {
              "count": 0,
              "total": 0,
              "current_page": 200,
              "per_page": 50,
              "next_page_link": null,
              "previous_page_link": "https://api.aircall.io/v1/calls?order=asc&page=199&per_page=50"
            }
          }

docs:
  content: |-
    **REFERENCE:** https://developers.aircall.io/api-references#pagination

    **WHY:** page 200 × 50 covers items 9,951–10,000 — the last page that is
    inside the 10k cap. Paired with `Calls / page past cap` it pins the exact
    rejection rule the connector's page loop must respect
    (`page * per_page <= 10000`).

    **VERIFIED (2026-09-28):** `page=200&per_page=50` → 200 (empty page,
    `next_page_link: null`, `previous_page_link` shows the server's default
    `order=asc`). Together with `Calls / page past cap` this pins the rule.
  type: text/markdown
