    value: '50'
    type: query
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs:
  content: |-
    **REFERENCE:** https://developers.aircall.io/api-references#list-all-numbers
    **WHY:** the `numbers` stream; confirms envelope and key set (volatile `availability_status`/`open` that change without a cursor).

    **VERIFIED (2026-09-28):** envelope `{numbers:[…], meta:{full meta}}`. Item keys match the docs: `id`, `direct_link`, `name`, `digits`, `country`, `time_zone`, `open`, `availability_status`, `is_ivr`, `live_recording_activated`, `priority`, `messages`, `created_at`. `open`/`availability_status`/`messages` change with no update cursor, which is why this is a snapshot and not Airbyte's created_at incremental.
  type: text/markdown
examples:
- name: 200 - populated list (1 number)
  request:
    url: '{{base_url}}/numbers?per_page=50'
    method: GET
  response:
    status: 200
