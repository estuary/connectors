info:
  name: page walk
  type: http
  seq: 2
http:
  method: GET
  url: '{{base_url}}/users/availabilities?per_page=1&page=2'
  params:
  - name: per_page
    value: '1'
    type: query
  - name: page
    value: '2'
    type: query
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs:
  content: |-
    **REFERENCE:** https://developers.aircall.io/api-references#retrieve-list-of-users-availability
    **WHY:** proves pagination is actually honored here (Airbyte's missing paginator would silently cap at 20).

    **VERIFIED (2026-09-28):** `page=2&per_page=1` with total=1 → 200, `users: []`, `next_page_link: null`, `previous_page_link` set. Pagination params are honored. Past-the-end below the 10k offset is an empty page, not an error.
  type: text/markdown
examples:
- name: 200 - page past last (total=1)
  request:
    url: '{{base_url}}/users/availabilities?per_page=1&page=2'
    method: GET
  response:
    status: 200
    statusText: OK
    headers:
    - name: content-type
      value: application/json
    body:
      type: json
      data: |-
        {
          "users": [],
          "meta": {
            "count": 0,
            "total": 1,
            "current_page": 2,
            "per_page": 1,
            "next_page_link": null,
            "previous_page_link": "https://api.aircall.io/v1/users/availabilities?order=asc&page=1&per_page=1"
          }
        }
