docs:
  content: |-
    **REFERENCE:** https://developers.aircall.io/api-references#search-contacts

    **WHY:** Does `/contacts/search` offer anything `/contacts` lacks?

    **VERIFIED (2026-09-28):** accepts a bare call (no phone/email); same envelope, same
    items, same `updated_at` ordering as `Contacts / order_by updated_at desc`, and
    its `from` is also creation-based (`Contacts / search from with order_by
    updated_at`). No advantage → the connector uses `/contacts` only.
  type: text/markdown
