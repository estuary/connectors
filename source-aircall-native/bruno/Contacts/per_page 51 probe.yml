docs:
  content: |-
    **REFERENCE:** https://developers.aircall.io/api-references#list-all-contacts

    **WHY:** Documented max is 50 — enforcement mode.

    **VERIFIED (2026-09-28):** not rejected; `meta.per_page` echoes 51. Clamp vs honor
    is **UNOBSERVABLE** with 3 contacts (seeding > 50 exceeds the ~10-request
    seeding budget). Connector sends `per_page=50`, the documented max, and pages by
    `next_page_link` / `count`, so either mode is safe.
  type: text/markdown
