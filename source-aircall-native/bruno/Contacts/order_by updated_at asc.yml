info:
  name: order_by updated_at asc
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/contacts?order_by=updated_at&order=asc&per_page=50"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - projection id/created_at/updated_at"
    request:
      url: "{{base_url}}/contacts?order_by=updated_at&order=asc&per_page=50"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "contacts": [
              {
                "id": 518690461,
