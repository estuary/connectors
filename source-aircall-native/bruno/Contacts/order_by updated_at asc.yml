docs:
  content: |-
    **REFERENCE:** https://developers.aircall.io/api-references#list-all-contacts

    **WHY:** Control for `Contacts / order_by updated_at desc`.

    **VERIFIED (2026-09-28):** exact reverse of the desc order (Echo, Charlie, Alpha) —
    the parameter is honored, not ignored. `from`/`to` still filter `created_at`
    under this sort (`Contacts / from with order_by updated_at`), so asc gives no
    way to start at the cursor; the desc walk is the only sound incremental.
  type: text/markdown
