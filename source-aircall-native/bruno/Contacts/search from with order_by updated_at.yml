info:
  name: search from with order_by updated_at
  type: http
  seq: 12

http:
  method: GET
  url: "{{base_url}}/contacts/search?from={{updated_floor}}&order_by=updated_at&order=desc&per_page=50"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - from=1790603983 -> empty (projection)"
    request:
      url: "{{base_url}}/contacts/search?from={{updated_floor}}&order_by=updated_at&order=desc&per_page=50"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "contacts": [],
            "meta": {
              "count": 0,
              "total": 0,
              "current_page": 1,
              "per_page": 50,
              "next_page_link": null,
              "previous_page_link": null
            }
          }

