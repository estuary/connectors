docs:
  content: |-
    **REFERENCE:** https://developers.aircall.io/api-references#list-all-contacts

    **WHY:** Full representative shape: envelope key, `meta`, per-item keys, cursor
    field types, default order, `is_shared`.

    **VERIFIED (2026-09-28):** envelope `{contacts: [...], meta: {count, total,
    current_page, per_page, next_page_link, previous_page_link}}`. Item keys:
    `id` (int), `created_at` / `updated_at` (**int unix seconds**), `first_name`,
    `last_name`, `information`, `company_name` (nullable), `is_shared` (bool),
    `direct_link`, `phone_numbers[] {id, label, value}`, `emails[]`.
    Default order is `order_by=created_at&order=asc` (echoed in `previous_page_link`
    of `Contacts / page just past end`).

    **VERIFIED (2026-09-28):** a deleted contact (`Seeding / C6 - Delete Contact Bravo`)
    simply disappears — no tombstone, no `deleted` flag. **LIMITATION:** deletions
    are invisible to incremental capture.

    **DOCUMENTED (2026-09-28):** only *shared* contacts are returned by the Public API
    (every observed item has `is_shared: true`). **LIMITATION:** users' private
    contacts are never captured.
  type: text/markdown
