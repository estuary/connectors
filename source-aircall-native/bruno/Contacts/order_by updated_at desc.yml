info:
  name: order_by updated_at desc
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/contacts?order_by=updated_at&order=desc&per_page=50"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - projection id/created_at/updated_at"
    request:
      url: "{{base_url}}/contacts?order_by=updated_at&order=desc&per_page=50"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "contacts": [
              {
                "id": 518778628,
                "created_at": 1790603975,
                "updated_at": 1790603985
              },
              {
                "id": 518778695,
                "created_at": 1790603982,
                "updated_at": 1790603982
              },
              {
                "id": 518690461,
                "created_at": 1790590869,
                "updated_at": 1790590869
              }
            ],
            "meta": {
              "count": 3,
              "total": 3,
              "current_page": 1,
              "per_page": 50,
              "next_page_link": null,
              "previous_page_link": null
            }
          }

docs:
  content: |-
    **REFERENCE:** https://developers.aircall.io/api-references#list-all-contacts

    **WHY:** Is `order_by=updated_at` honored? The incremental design walks this
    newest-first and stops at the cursor.

    **VERIFIED (2026-09-28):** honored. Alpha (created 1790603975, updated 1790603985 by
    `Seeding / C4 - Update Contact Alpha`) sorts first, ahead of Charlie (created
    and updated 1790603982) — i.e. ordered by `updated_at`, not `created_at`.

    **LIMITATION (VERIFIED 2026-09-28):** pagination is positional (`page`/`per_page`)
    and capped at `page * per_page <= 10000` (`Contacts / page past end`); a walk
    can only see the 10,000 most-recently-updated contacts per poll.
  type: text/markdown
