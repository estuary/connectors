info:
  name: page just past end
  type: http
  seq: 8

http:
  method: GET
  url: "{{base_url}}/contacts?per_page=50&page=2"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - page 2 of 1 -> empty page (projection)"
    request:
      url: "{{base_url}}/contacts?per_page=50&page=2"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "contacts": [],
            "meta": {
              "count": 0,
              "total": 3,
              "current_page": 2,
              "per_page": 50,
              "next_page_link": null,
              "previous_page_link": "https://api.aircall.io/v1/contacts?order=asc&order_by=created_at&per_page=50&page=1"
            }
          }

docs:
  content: |-
    **REFERENCE:** https://developers.aircall.io/api-references#list-all-contacts

    **WHY:** Completion signal one page past the last.

    **VERIFIED (2026-09-28):** 200 with `count: 0`, `next_page_link: null`. The last real
    page also has `next_page_link: null` — the connector stops on
    `next_page_link is None` and never requests past it.
  type: text/markdown
