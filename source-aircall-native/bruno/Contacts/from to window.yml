info:
  name: from to window
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/contacts?from={{window_from}}&to={{window_to}}&order=asc&per_page=50"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - [1790603975, 1790603982] -> Alpha + Charlie (projection)"
    request:
      url: "{{base_url}}/contacts?from={{window_from}}&to={{window_to}}&order=asc&per_page=50"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "contacts": [
              {
                "id": 518778628,
                "created_at": 1790603975,
                "updated_at": 1790603985
              },
              {
                "id": 518778695,
                "created_at": 1790603982,
                "updated_at": 1790603982
              }
            ],
            "meta": {
              "count": 2,
              "total": 2,
              "current_page": 1,
              "per_page": 50,
              "next_page_link": null,
              "previous_page_link": null
            }
          }

docs:
  content: |-
    **REFERENCE:** https://developers.aircall.io/api-references#list-all-contacts

    **WHY:** Backfill cursor. Pin `from`/`to` inclusivity at exact `created_at`
    values: `window_from` = Alpha `created_at`, `window_to` = Charlie `created_at`.

    **VERIFIED (2026-09-28):** both returned → `from` and `to` are **inclusive**
    (`[from, to]`) on `created_at`. Alpha's `updated_at` (1790603985) is past `to`
    and it is still returned → the filter is on creation, not modification.
    Note this differs from calls, whose `from` is exclusive
    (`Calls / to bound minus 1 probe`). See `Contacts / from to window inner`.
  type: text/markdown
