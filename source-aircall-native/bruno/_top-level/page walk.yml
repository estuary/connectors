info:
  name: page walk
  type: http
  seq: 3
http:
  method: GET
  url: '{{base_url}}/{{resource}}?per_page=1&page=2'
  params:
  - name: per_page
    value: '1'
    type: query
  - name: page
    value: '2'
    type: query
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs:
  content: |-
    **REFERENCE:** https://developers.aircall.io/api-references#pagination
    **WHY:** proves the shared page/per_page contract on a v1 list: 1-indexed `page`, `meta.next_page_link` populated mid-walk and null on the last page (the connector's completion signal).

    **VERIFIED (2026-09-28) (tags):** `page=2&per_page=1` → 1 item, `total: 9`, `next_page_link` = `…/v1/tags?order=asc&page=3&per_page=1`, `previous_page_link` = page 1. 1-indexed pages. Mid-walk `next_page_link` is non-null; on the last page it's null (see `User Availability / page walk`). The link carries the server-applied `order=asc` default.
  type: text/markdown
examples:
- name: tags - page 2 of 9 at per_page=1
  request:
    url: '{{base_url}}/{{resource}}?per_page=1&page=2'
    method: GET
  response:
    status: 200
    statusText: OK
    headers:
    - name: content-type
      value: application/json
    body:
      type: json
      data: |-
        {
          "tags": [
            {
              "id": 3037354,
              "name": "Called Back",
              "color": "#B285D1",
              "description": "queue_called_back"
            }
          ],
          "meta": {
            "count": 1,
            "total": 9,
            "current_page": 2,
            "per_page": 1,
            "next_page_link": "https://api.aircall.io/v1/tags?order=asc&page=3&per_page=1",
            "previous_page_link": "https://api.aircall.io/v1/tags?order=asc&page=1&per_page=1"
          }
        }
