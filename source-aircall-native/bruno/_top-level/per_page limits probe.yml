info:
  name: per_page limits probe
  type: http
  seq: 2
http:
  method: GET
  url: '{{base_url}}/{{resource}}?per_page=51'
  params:
  - name: per_page
    value: '51'
    type: query
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs:
  content: |-
    **REFERENCE:** https://developers.aircall.io/api-references#pagination
    **WHY:** docs say per_page max is 50. Push to 51 to learn the enforcement mode (reject / clamp / truncate) — the connector hardcodes the page size. Set `resource` in the env (tags, teams, numbers, webhooks, users/availabilities).

    **VERIFIED (2026-09-28) (tags):** 200, `meta.per_page: 50`, all 9 returned. Silent clamp. The connector sends 50.
  type: text/markdown
