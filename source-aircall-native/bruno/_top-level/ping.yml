info:
  name: ping
  type: http
  seq: 1
http:
  method: GET
  url: '{{base_url}}/ping'
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs:
  content: |-
    **REFERENCE:** https://developers.aircall.io/api-references#ping
    **WHY:** the credential probe `validate_credentials` uses (`api.py`). Also the cheapest request for reading the account's `X-AircallApi-*` rate-limit headers.

    **VERIFIED (2026-09-28):** 200 `{"ping":"pong"}` with the configured API ID/token. No `X-AircallApi-*` headers on the response (see root docs, rate limits).
  type: text/markdown
examples:
- name: 200 - pong
  request:
    url: '{{base_url}}/ping'
    method: GET
  response:
    status: 200
    statusText: OK
    headers:
    - name: content-type
      value: application/json
    body:
      type: json
      data: |-
        {
          "ping": "pong"
        }
