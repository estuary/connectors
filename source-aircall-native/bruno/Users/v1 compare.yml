info:
  name: v1 compare
  type: http
  seq: 2
http:
  method: GET
  url: '{{base_url}}/users?per_page=1'
  params:
  - name: per_page
    value: '1'
    type: query
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs:
  content: |-
    **REFERENCE:** https://developers.aircall.io/api-references#list-all-users
    **WHY:** schema diff vs v2 — which fields (e.g. `numbers`) the imported/Airbyte connector had that v2 drops. Not used by the connector.

    **VERIFIED (2026-09-28):** v1 list item keys = v2 minus `default_number_id` and `substatus`. Contrary to the docs, v1 list items carry **no** `numbers` array either, so the move to v2 loses no fields.
  type: text/markdown
examples:
- name: 200 - v1 shape (per_page=1)
  request:
    url: '{{base_url}}/users?per_page=1'
    method: GET
  response:
    status: 200
    statusText: OK
    headers:
    - name: content-type
      value: application/json
    body:
      type: json
      data: |-
        {
          "users": [
            {
              "id": 2078847,
              "name": "Jonathan Wihl",
              "email": "jonathan@estuary.dev",
              "direct_link": "https://api.aircall.io/v1/users/2078847",
              "language": "en-US",
