docs:
  content: |-
    **REFERENCE:** https://developers.aircall.io/api-references#list-all-tags
    **WHY:** the `tags` stream; confirms envelope and key set.

    **VERIFIED (2026-09-28):** envelope `{tags:[…], meta:{full meta}}`. Item keys are **only** `id`, `name`, `color`, `description`, which contradicts the docs (no `direct_link`, no `created_at`). So there's no cursor of any kind.
  type: text/markdown
