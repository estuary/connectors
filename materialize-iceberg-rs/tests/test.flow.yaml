materializations:
  acmeCo/materialize-iceberg-rs:
    endpoint:
      local:
        command:
          - cargo
          - run
        protobuf: true
        config:
          store:
            type: S3
            bucket: test-bucket
            prefix: warehouse
            region: us-east-1
            credentials:
              awsAccessKeyId: test_key
              awsSecretAccessKey: test_secret
            endpoint: http://localhost:9603
    bindings:
      - resource:
          table: test_table
        source: test/collection
        fields:
          recommended: true
          include:
            flow_document: {}

  acmeCo/materialize-iceberg-rs/restart:
    endpoint:
      local:
        command:
          - cargo
          - run
        protobuf: true
        config:
          store:
            type: S3
            bucket: test-bucket
            prefix: warehouse
            region: us-east-1
            credentials:
              awsAccessKeyId: test_key
              awsSecretAccessKey: test_secret
            endpoint: http://localhost:9603
    bindings:
      - resource:
          table: test_table_restart
        source: test/collection
        fields:
          recommended: true
          include:
            flow_document: {}

collections:
  test/collection:
    schema:
      type: object
      properties:
        id: { type: integer }
        value: { type: string }
      required: [id]
    key: [/id]
