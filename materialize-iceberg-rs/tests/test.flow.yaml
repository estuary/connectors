collections:
  test/collection:
    schema:
      type: object
      # Merge-on-read upsert materializations (like this connector's Load,
      # which injects `_meta.file_path`/`_meta.positional_delete` into the
      # Loaded document) rely on Flow carrying an LHS-only property forward
      # through reduction untouched when the RHS delta doesn't mention it —
      # that only happens under `reduce: {strategy: merge}`, not the default
      # last-write-wins whole-document replace.
      reduce: { strategy: merge }
      properties:
        id: { type: integer }
        value: { type: string }
        # Flow auto-populates `_meta` (e.g. `_meta.uuid`) on every document,
        # including the fresh delta, so it exists on both sides of the
        # reduction and needs its own merge annotation too — otherwise the
        # root-level merge still replaces `_meta` wholesale with the delta's
        # fresh one, dropping `_meta.file_path`/`_meta.positional_delete`.
        _meta:
          type: object
          reduce: { strategy: merge }
      required: [id]
    key: [/id]
