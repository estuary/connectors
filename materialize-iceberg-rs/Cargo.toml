[package]
name = "materialize-iceberg-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
proto-flow = { git = "https://github.com/estuary/flow", rev = "8898a170a1cc979711b2efc0ed35c25b81ade1ce" }

anyhow = "1.0"
axum = "0.8"
bytes = "1.11"
prost = "0.14"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "json",
    "env-filter",
    "time",
] }
object_store = { version = "0.14.2", features = ["aws"] }
parquet = { version = "60.0.0", features = ["arrow"] }
arrow = "60.0.0"
uuid = { version = "1.26.1", features = ["v4"] }
tuple = { git = "https://github.com/estuary/flow", rev = "8898a170a1cc979711b2efc0ed35c25b81ade1ce" }

[dev-dependencies]
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1.149.0", features = ["behavior-version-latest"] }
insta = { version = "1", features = ["json", "serde"] }
parquet = { version = "60.0.0", features = ["json"] }
