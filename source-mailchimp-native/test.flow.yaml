import:
- acmeCo/flow.yaml
captures:
  acmeCo/source-mailchimp-native:
    endpoint:
      local:
        command:
        - python
        - -m
        - source_mailchimp_native
        config: config.yaml
    bindings:
    - resource:
        name: lists
        interval: PT1H
        schedule: ''
      target: acmeCo/lists
    - resource:
        name: automations
        interval: PT1H
        schedule: ''
      target: acmeCo/automations
    - resource:
        name: interests
        interval: PT1H
        schedule: ''
      target: acmeCo/interests
    - resource:
        name: segment_members
        interval: PT1H
        schedule: ''
      target: acmeCo/segment_members
    - resource:
        name: interest_categories
        interval: PT1H
        schedule: ''
      target: acmeCo/interest_categories
    - resource:
        name: tags
        interval: PT1H
        schedule: ''
      target: acmeCo/tags
    - resource:
        name: automation_emails
        interval: PT1H
        schedule: ''
      target: acmeCo/automation_emails
    - resource:
        name: campaigns
        interval: PT5M
        schedule: 0 0 * * *
      target: acmeCo/campaigns
    - resource:
        name: email_activity
        interval: PT15M
        schedule: ''
      target: acmeCo/email_activity
    - resource:
        name: list_members
        interval: PT5M
        schedule: ''
      target: acmeCo/list_members
    - resource:
        name: segments
        interval: PT5M
        schedule: ''
      target: acmeCo/segments
