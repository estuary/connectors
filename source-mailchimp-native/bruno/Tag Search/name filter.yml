info:
  name: name filter
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/lists/{{list_id}}/tag-search?name=estuary"
  params:
    - name: name
      value: estuary
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - name=estuary prefix-matched all 3
    request:
      url: "{{base_url}}/lists/{{list_id}}/tag-search?name=estuary"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "tags": [
              {
                "id": 2225593,
                "name": "Estuary Test Segment"
              },
              {
                "id": 2225592,
                "name": "estuary-other-tag"
              },
              {
                "id": 2225591,
                "name": "estuary-test-tag"
              }
            ],
            "total_items": 3
          }
  - name: 200 - name=other matched 0 of 3
    request:
      url: "{{base_url}}/lists/{{list_id}}/tag-search?name=other"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "tags": [],
            "total_items": 0
          }

docs: |-
  **REFERENCE:** [API reference](https://mailchimp.com/developer/marketing/api/list-tag-search/search-for-tags-on-a-list-by-name/)

  **WHY:** match-semantics probe for the `name` query — the connector itself
  passes no `name`; these runs only rule out a hidden default filter on the
  no-name run and pin prefix-vs-substring matching. Two runs, one saved example
  each (edit `name` between runs): `name=estuary` (a prefix of every seeded tag
  name) and `name=other` (a substring of the seeded "estuary-other-tag" but a
  prefix of no tag name — the discriminating case).

  **VERIFIED (2026-06-30):** case-insensitive PREFIX match, not substring.
  `name=estuary` matched all 3 seeded tags (each name starts with
  "estuary"/"Estuary"); `name=other` returned 0 of 3 even though "other" is a
  substring of estuary-other-tag, because no tag NAME begins with "other".
  Together the two runs prove the filter is a prefix match that excludes
  non-prefix names.

  **LIMITATION (VERIFIED 2026-06-30):** `tags` are Mailchimp static segments
  under the hood — the stream is the `{id, name}` projection of segments with
  `type: static`, so it overlaps a `segments` stream (same underlying rows,
  narrower shape). The offset/count pagination this endpoint honors (see
  `_list-child / offset page`, tag-search example) is undocumented by the
  provider, so treat it as observed, not contracted.
