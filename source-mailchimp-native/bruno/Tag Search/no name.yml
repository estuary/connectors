info:
  name: no name
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/lists/{{list_id}}/tag-search"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - empty, name omitted accepted
    request:
      url: "{{base_url}}/lists/{{list_id}}/tag-search"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "tags": [],
            "total_items": 0
          }
  - name: 200 - populated, all static segments returned
    request:
      url: "{{base_url}}/lists/{{list_id}}/tag-search"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "tags": [
              {
                "id": 2225593,
                "name": "Estuary Test Segment"
              },
              {
                "id": 2225592,
                "name": "estuary-other-tag"
              },
              {
                "id": 2225591,
                "name": "estuary-test-tag"
              }
            ],
            "total_items": 3
          }

docs: |-
  **REFERENCE:** [API reference](https://mailchimp.com/developer/marketing/api/list-tag-search/search-for-tags-on-a-list-by-name/)

  **WHY:** the open question this probe answers: with `name` omitted entirely,
  does tag-search return ALL tags on the list (making it usable as the `tags`
  stream's listing)? Also teaches the items key, whether total_items is present,
  and whether the endpoint accepts offset+count at all (none are documented). If
  omitting `name` errors, re-run with an explicit empty `name=` param before
  concluding.

  **VERIFIED (2026-06-30):** `name` omitted is accepted and returns ALL tags on
  the list — items key `tags`, items shaped {id, name}, total_items present
  (see the populated example). Offset/count support is proven in `_list-child /
  offset page` (tag-search example) — undocumented, so treat it as observed,
  not contracted.
