info:
  name: bare
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/lists/{{list_id}}/interest-categories/{{interest_category_id}}/interests?count=60"
  params:
    - name: count
      value: "60"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - populated, subscriber_count is string
    request:
      url: "{{base_url}}/lists/{{list_id}}/interest-categories/{{interest_category_id}}/interests?count=60"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "interests": [
              {
                "category_id": "1d3affa9d2",
                "list_id": "f34247943d",
                "id": "6fbed1c079",
                "name": "Estuary Test Interest",
                "subscriber_count": "0",
                "display_order": 1,
                "_links": "REDACTED"
              }
            ],
            "list_id": "f34247943d",
            "category_id": "1d3affa9d2",
            "total_items": 1,
            "_links": "REDACTED"
          }

docs: |-
  **REFERENCE:** [API reference](https://mailchimp.com/developer/marketing/api/interests/list-interests-in-category/)

  **WHY:** grandchild list (lists → interest-categories → interests). Teaches
  the envelope and per-item field set. No date filters documented; snapshot
  fanned out over (list_id, interest_category_id) pairs.

  **VERIFIED (2026-06-30):** envelope `{interests: [...], list_id, category_id,
  total_items, _links}`; items carry `id`, `category_id`, `list_id`, `name`,
  `subscriber_count`, `display_order` — and `subscriber_count` is a *string* in
  this payload, so the document model must not assume int.
