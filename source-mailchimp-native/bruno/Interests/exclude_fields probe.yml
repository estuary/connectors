info:
  name: exclude_fields probe
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/lists/{{list_id}}/interest-categories/{{interest_category_id}}/interests?count=1&exclude_fields=interests._links,_links"
  params:
    - name: count
      value: "1"
      type: query
    - name: exclude_fields
      value: "interests._links,_links"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - _links absent from items and envelope
    request:
      url: "{{base_url}}/lists/{{list_id}}/interest-categories/{{interest_category_id}}/interests?count=1&exclude_fields=interests._links,_links"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "interests": [
              {
                "category_id": "1d3affa9d2",
                "list_id": "f34247943d",
                "id": "6fbed1c079",
                "name": "Estuary Test Interest",
                "subscriber_count": "0",
                "display_order": 1
              }
            ],
            "list_id": "f34247943d",
            "category_id": "1d3affa9d2",
            "total_items": 1
          }

docs: |-
  **REFERENCE:** `exclude_fields` semantics from
  [Methods and Parameters](https://mailchimp.com/developer/marketing/docs/methods-parameters/).

  **WHY:** proves server-side `_links` stripping on the two-level interests
  URL shape (see `_top-level / exclude_fields probe` for the rationale).

  **VERIFIED (2026-07-29):** 200 with `_links` absent from both the interest
  rows and the envelope.
