docs: |-
  **REFERENCE:** [API reference](https://mailchimp.com/developer/marketing/api/list-segments/list-segments/)

  **WHY:** exercises the `segments` stream's incremental filter:
  `since_updated_at` (ISO 8601). The endpoint documents no sort parameter, so
  the connector advances its cursor only after a filtered walk completes.
  Teaches that the filter narrows results vs. `Segments / bare` (run the
  `D3 - Update Segment` seed first to put one segment's updated_at past the
  threshold). The threshold is pinned between the seeded segments' creation
  updated_at values (13:12:xx) and the renamed segment's post-update value
  (14:26:44), so it must return exactly the renamed segment (1 of 4).

  **VERIFIED (2026-06-30):** honored — narrowed 4 → 1, returning only the
  renamed segment (see the saved example), so `since_updated_at` is applied
  server-side and D3's rename advanced `updated_at` as expected.
