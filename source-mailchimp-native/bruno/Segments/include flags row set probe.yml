docs: |-
  **REFERENCE:** [API reference](https://mailchimp.com/developer/marketing/api/list-segments/list-segments/)

  **WHY:** hidden-partition audit, flag arm: the segments listing also takes
  `include_cleaned` / `include_transactional` / `include_unsubscribed`
  (documented as "Include cleaned/transactional/unsubscribed members in
  response" — member-counting semantics, not segment visibility). Teaches
  whether the flags change WHICH segments are listed.

  **VERIFIED (2026-07-02):** with all three flags on, the segment ROW SET is
  identical to `Segments / bare` (same 4 ids) — no hidden segments surface.
  Only `member_count` moves: segment 2225593 reports 3 here vs 2 bare, the
  delta being the unsubscribed member 3 (see `Seeding/B7 - Unsubscribe Member
  3`). So the flags change how members are COUNTED per segment, not which
  segments are listed — and, corollary, the bare listing's `member_count`
  silently excludes unsubscribed/cleaned/transactional members.
