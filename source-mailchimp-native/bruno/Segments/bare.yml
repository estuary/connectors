docs: |-
  **REFERENCE:** [API reference](https://mailchimp.com/developer/marketing/api/list-segments/list-segments/)

  **WHY:** parent-ID probe only — the `segments` stream itself is planned by a
  sibling session. This run pins a segment_id for the Segment Members probes and
  documents how the segment_members fan-out will enumerate its parents (GET
  /lists/{list_id}/segments, items key `segments`, offset/count).

  **VERIFIED (2026-07-02, archived-segments audit):** Mailchimp segments have NO
  archived/hidden state, and this bare listing is the full population. Evidence:
  (a) the API's whole segment surface is create/get/update/delete — no archive
  action exists (unlike members' `DELETE .../members/{hash}` archive and
  automations' archive action), and the segment schema carries no `status`-like
  field; (b) the UI offers edit/re-run/delete only ("Save and Manage Segments"
  help doc — deletion is the only removal, and it deletes); (c) the listing's
  full documented param set (fields, exclude_fields, count, offset, type,
  since/before_created_at, since/before_updated_at,
  include_cleaned/transactional/unsubscribed) contains no state partition param;
  (d) live: `type` partitions union back to this bare set (`Segments / type
  filter partition probe`), `type=archived` behaves as garbage, not a sentinel
  (same probe, archived-sentinel arm), and the include_* flags change
  member counting only (`Segments / include flags row set probe`). Consumers of
  this listing (the `snapshot_segment_members` parent-ID drain and the planned
  `segments` stream) therefore need NO archived sweep. Unlike the members
  listing, the bare sweep here is complete.
