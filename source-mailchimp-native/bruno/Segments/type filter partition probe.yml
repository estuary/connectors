info:
  name: type filter partition probe
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/lists/{{list_id}}/segments?count=1000&type=static"
  params:
    - name: count
      value: "1000"
      type: query
    - name: type
      value: static
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

