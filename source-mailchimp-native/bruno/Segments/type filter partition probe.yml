docs: |-
  **REFERENCE:** [API reference](https://mailchimp.com/developer/marketing/api/list-segments/list-segments/)

  **WHY:** hidden-partition audit for the archived-segments bugfix session: is
  the bare segments listing the FULL population, or does a `type` partition hide
  rows by default (the way `status` hides archived members — see `Members /
  status archived`)? The documented `type` values are `saved`, `static`,
  `fuzzy` (fuzzy = Mailchimp's pre-built/predicted segments); the audit also
  probes the undocumented `type=archived` — does the listing accept an archived
  sentinel the way the members listing does? — against a garbage `type` value
  as the control. Run once per value (edit the `type` param between runs; one
  saved example each) and check the union of the filtered row sets against
  `Segments / bare` by segment id.

  **VERIFIED (2026-07-02):** union holds exactly — bare listing returned ids
  {2225591, 2225592, 2225593, 2225594}; type=static returned {2225591, 2225592,
  2225593}, type=saved returned {2225594}, type=fuzzy returned the empty set.
  static ∪ saved ∪ fuzzy == bare, so the bare listing hides no `type` partition
  on this account state.

  **VERIFIED (2026-07-02, archived sentinel):** `type=archived` returns 200
  with an empty set — but so does a garbage value
  (`type=zz-definitely-not-a-type`, the control example). The endpoint does not
  validate `type` against an enum; any unmatched string simply filters to
  nothing. `archived` is therefore NOT a recognized sentinel — its empty result
  is indistinguishable from garbage and is no evidence of an archived
  partition. Note for connector authors: because unknown `type` values fail
  SILENTLY (200-empty, no 4xx), a typo'd `type` param in a sweep would zero the
  stream without an error — keep any `type` literal covered by tests.

  **UNOBSERVABLE:** fuzzy's inclusion in the bare listing is proven only
  vacuously — the account has no fuzzy/pre-built segments and one cannot be
  seeded via the API, which offers only `static` and `saved` on create
  (Mailchimp generates pre-built segments itself). Trust the docs' description
  of `type` as a filter, not a visibility gate.
