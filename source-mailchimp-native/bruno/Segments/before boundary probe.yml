info:
  name: before boundary probe
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/lists/{{list_id}}/segments?count=10&before_updated_at=2026-06-12T13:12:38Z&fields=segments.id,segments.updated_at,total_items"
  params:
    - name: count
      value: "10"
      type: query
    - name: before_updated_at
      value: 2026-06-12T13:12:38Z
      type: query
    - name: fields
      value: segments.id,segments.updated_at,total_items
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - two rows, before is INCLUSIVE of the exact timestamp
    request:
      url: "{{base_url}}/lists/{{list_id}}/segments?count=10&before_updated_at=2026-06-12T13:12:38Z&fields=segments.id,segments.updated_at,total_items"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "segments": [
              {
                "id": 2225591,
                "updated_at": "2026-06-12T13:12:06+00:00"
              },
              {
                "id": 2225592,
                "updated_at": "2026-06-12T13:12:38+00:00"
              }
            ],
            "total_items": 2
          }

docs: |-
  **REFERENCE:** [API reference](https://mailchimp.com/developer/marketing/api/list-segments/list-segments/)

  **WHY:** boundary-semantics probe, segments counterpart of `Members / before
  boundary probe`: the threshold equals segment 2225592's updated_at EXACTLY.
  Account state at probe time (see `Segments / bare`): 2225591 at 13:12:06,
  2225592 at 13:12:38 (the threshold), 2225594 at 13:12:59, 2225593 at 14:26:44
  (all 2026-06-12). One row back means `before_*` is EXCLUSIVE of the exact
  timestamp; two rows (2225592 included) means inclusive, matching the members
  endpoint. The docs don't state the semantics either way.

  **VERIFIED (2026-07-06):** `before_updated_at` is INCLUSIVE of the exact
  timestamp — two rows returned, 2225592 (== threshold) among them. Matches the
  members endpoint (`Members / before boundary probe`); asymmetric with the
  exclusive `since_*`. See that probe's docs for the connector consequences.
