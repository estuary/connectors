docs: |-
  **REFERENCE:** [List email activity](https://mailchimp.com/developer/marketing/api/email-activity-reports/list-email-activity/)

  **WHY:** bare per-campaign email-activity list, against the seeded sent
  campaign `5dfc22e163` (3 recipients; opened + clicked 2026-07-08). Teaches the
  envelope, the per-recipient row shape, the nested event shape per action, and
  what `total_items` counts.

  **VERIFIED (2026-07-08):** envelope `{emails, campaign_id, total_items,
  _links}`; each `emails[]` entry carries `campaign_id`, `list_id`,
  `list_is_active`, `email_id`, `email_address`, and nested `activity[]`.
  `total_items` counts RECIPIENTS (members), not flattened events. Event shape:
  opens are `{action: "open", timestamp, ip}` (no url), clicks are
  `{action: "click", timestamp, url, ip}`. Repeat same-action events per member
  appear with distinct timestamps. Recipients with no events return an empty
  `activity[]`, not an absent field. Events recorded while the campaign was
  still sending (timestamps 19s after `send_time`) do appear — automated
  image-proxy prefetch registered as opens seconds after delivery.

  **LIMITATION (VERIFIED 2026-07-13):** `activity[].action` is only `open` /
  `click` / `bounce`. Unsubscribes are NOT reported here — after a recipient
  unsubscribed, their `activity[]` still showed only opens, no `unsub` event.
  So this stream does not capture unsubscribes; they surface as an
  `unsubscribed` count on `/reports` and as a `status`/`last_changed` change
  on the (sibling) list-members stream, or via a separate
  `/reports/{id}/unsubscribed` report (out of scope for email_activity).
