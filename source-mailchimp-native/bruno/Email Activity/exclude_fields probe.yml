docs: |-
  **REFERENCE:** [List email activity](https://mailchimp.com/developer/marketing/api/email-activity-reports/list-email-activity/);
  `exclude_fields` semantics from [Methods and Parameters](https://mailchimp.com/developer/marketing/docs/methods-parameters/).

  **WHY:** the connector wants to strip Mailchimp's HATEOAS `_links` blocks
  server-side — `emails[]._links` currently rides through the `extra="allow"`
  member model into `_meta` of every flattened event document, and the
  envelope `_links` is dead transfer bytes. Two runs prove (1) the exclusion
  removes `_links` from both the member rows and the top-level envelope, and
  (2) it composes with the params the connector actually sends (`since`,
  `count`, `offset`). Diff run 1 against `Email Activity / since filter` run 1
  (identical params minus the exclusion). Note: the collection's redaction
  script replaces `_links` values with "REDACTED" but never removes keys, so
  key ABSENCE in these examples is the API's doing, not the redactor's.

  **VERIFIED (2026-07-29):** `exclude_fields=emails._links,_links` removes
  `_links` from BOTH levels — no `_links` key on any member row and none on
  the envelope. Run 1 (count=10 + since, minus the exclusion identical to
  `Email Activity / since filter` run 1): all 3 member rows returned,
  `total_items` 3, member 2's `activity[]` narrowed to the 3 post-since
  events — `since` unaffected by the exclusion. (Member 1 shows 8 opens
  absent from the 2026-07-08 `since filter` example: genuine post-since
  activity accrued between the two capture dates, not a filter change.)

  **VERIFIED (2026-07-29):** composes with pagination. Run 2
  (count=2&offset=1&since&exclude_fields) returned exactly rows 2-3 of run 1,
  same order, `total_items` still 3. Safe for the connector to add
  `exclude_fields` to `fetch_email_activity` and `backfill_email_activity`
  unchanged otherwise.

  **DOCUMENTED (2026-07-29):** `fields` and `exclude_fields` are mutually
  exclusive and error when combined (Methods and Parameters page). Irrelevant
  to this stream's fetchers (they pass no `fields`), but a constraint on ever
  merging the exclusion into `_EMAIL_CAMPAIGN_REPORT_FIELDS`-style requests.
