  name: exclude_fields probe
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/reports/{{campaign_id}}/email-activity?count=2&offset=1&since={{since}}&exclude_fields={{exclude_fields}}"
  params:
    - name: count
      value: "2"
      type: query
    - name: offset
      value: "1"
      type: query
    - name: since
      value: "{{since}}"
      type: query
    - name: exclude_fields
      value: "{{exclude_fields}}"
      type: query
  auth: inherit

runtime:
  variables:
    - name: since
      value: 2026-07-08T18:01:00Z
    - name: exclude_fields
      value: emails._links,_links

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

