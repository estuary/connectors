docs: |-
  **REFERENCE:** [List email activity](https://mailchimp.com/developer/marketing/api/email-activity-reports/list-email-activity/)

  **WHY:** the connector's incremental cursor filter. Two runs, one saved
  example each (edit `since` between runs): pinned strictly between the seeded
  campaign's two activity bursts (18:00:xx and 18:01:xx) to teach whether
  `since` filters events, rows, or both — and pinned EXACTLY on the newest
  event's timestamp (2026-07-08T18:01:39Z, a click on the seeded campaign
  `5dfc22e163`) to pin the boundary's inclusivity.

  **VERIFIED (2026-07-08):** `since` IS honored, with a twist:

  1. The nested `activity[]` IS filtered — of 8 events on the campaign, only
     the 3 strictly-after-since events return; a member's pre-since events
     vanish from their array.
  2. Member rows are NOT dropped — all 3 recipients still return (members with
     zero post-since events come back with an empty `activity[]`), and
     `total_items` stays 3. Pagination cost per campaign therefore scales with
     RECIPIENTS, not with matching events, even under `since` — the /reports
     recency gate is what keeps sweeps cheap.
  3. Boundary: EXCLUSIVE of the exact timestamp — the exact-timestamp run
     returned zero events, with member rows still present (empty
     `activity[]`), matching the `since_*` family on members/segments. The
     connector's emit window suppresses at-or-before-cursor client-side
     anyway, so inclusivity is not load-bearing; this pin removes the
     ambiguity.
