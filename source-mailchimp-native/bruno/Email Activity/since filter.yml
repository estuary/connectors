info:
  name: since filter
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/reports/{{campaign_id}}/email-activity?count=10&since={{since}}"
  params:
    - name: count
      value: "10"
      type: query
    - name: since
      value: "{{since}}"
      type: query
  auth: inherit

runtime:
  variables:
    - name: since
      value: 2026-07-08T18:01:00Z

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

