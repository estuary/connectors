info:
  name: offset page
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/reports/{{campaign_id}}/email-activity?count=1&offset=1"
  params:
    - name: count
      value: "1"
      type: query
    - name: offset
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - offset past end returns empty, total_items unchanged
    request:
      url: "{{base_url}}/reports/{{campaign_id}}/email-activity?count=1&offset=1"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "emails": [],
            "campaign_id": "61cc0c44a6",
            "total_items": 1
          }
  - name: 200 - count 1000 accepted (fields-projected)
    request:
      url: "{{base_url}}/reports/{{campaign_id}}/email-activity?count=1000&fields=emails.email_id,total_items"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "emails": [
              { "email_id": "4c172e0eb420fb2c5678834e0b5e55b4" }
            ],
            "total_items": 1
          }

docs: |-
  **REFERENCE:** [API reference](https://mailchimp.com/developer/marketing/api/email-activity-reports/list-email-activity/)

  **WHY:** pagination contract on email activity — its own request because the
  path (`reports/{{campaign_id}}/email-activity`) sits under `/reports`, not
  `/lists`. Requires `campaign_id` in the environment. Two arms, one saved
  example each (edit the params between runs): `count=1&offset=1` (offset
  honored / completion signal) and `count=1000` (the max page size the
  connector requests — reports endpoints sometimes cap lower than the
  documented 1000; that run's `fields=` projection keeps the payload tiny, and
  the connector itself does **not** use `fields=`).

  **VERIFIED (2026-06-30):** offset honored. With 1 recipient,
  `count=1&offset=1` returns an empty `emails[]` with `total_items` still 1 —
  offset past the end yields a short page (the completion signal).

  **VERIFIED (2026-06-30):** `count=1000` accepted (`200`) on
  `/reports/{id}/email-activity` specifically. And past the documented max does
  **not** `400` — `count=1001` returns `200` here too, matching `/lists` and
  `/lists/{id}/members`. See `_top-level / count limits probe` for the full
  sweep.
