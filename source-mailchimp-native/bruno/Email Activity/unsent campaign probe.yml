info:
  name: unsent campaign probe
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/reports/524c905696/email-activity?count=10"
  params:
    - name: count
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - unsent draft returns empty emails[], not an error
    request:
      url: "{{base_url}}/reports/524c905696/email-activity?count=10"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "emails": [],
            "campaign_id": "524c905696",
            "total_items": 0,
            "_links": "REDACTED"
          }

docs: |-
  **REFERENCE:** [List email activity](https://mailchimp.com/developer/marketing/api/email-activity-reports/list-email-activity/)

  **WHY:** the email_activity sweep drains ALL campaigns and skips
  `save`/`schedule` client-side. This probe pins what
  /reports/{id}/email-activity does when the campaign is an unsent draft
  (`524c905696`, status=save): a 404 means the status skip is load-bearing (the
  fetch must not request drafts, or must tolerate 404); an empty 200 means the
  skip is purely a request-count optimization.

  **VERIFIED (2026-07-08):** `200` with `{"emails": [], "campaign_id":
  "524c905696", "total_items": 0}` — a normal empty page. The save/schedule
  skip is purely a request-count optimization; no special error handling is
  needed if a draft slips through.
