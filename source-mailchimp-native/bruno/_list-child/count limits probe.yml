docs: |-
  **WHY:** count-limit probe for list-child endpoints under
  `/lists/{{list_id}}/`. Set `child` to one of: members, segments,
  interest-categories, tag-search (`list_id` from the environment). Two arms,
  one saved example per run (edit `count` between runs): `count=1000` — the
  documented max and the page size the connector requests — and `count=1001` to
  learn the enforcement mode past the documented max. Collapsed from the
  per-resource count-cap probes (members, segments).

  **VERIFIED (2026-06-30):** `count=1000` accepted (`200`) on members and
  segments — see the saved examples.

  **VERIFIED (2026-06-30):** `count=1001` returns `200` on
  `/lists/{id}/members` — no `400`, matching the top-level endpoints (see
  `_top-level / count limits probe`). Mailchimp does not enforce the documented
  max as a hard reject on child paths either. The saved example is the members
  run on the unseeded account (3 members).

  **UNOBSERVABLE:** cap truncation order. When `total_items > 1000`, two things
  cannot be observed here: (a) whether the page is server-clamped at 1000 at
  all, and (b) the property that matters most — that a clamp returns the *first*
  1000 in the requested sort and omits exactly the sort-order **tail** (not an
  arbitrary middle row), so that resuming from `offset=1000` / `cursor = max
  sort value seen` recovers precisely the omitted rows. Observing either needs
  >1000 seeded members (a bulk-subscribe seeder + per-item delete-loop cleanup),
  which we decline to add — clarity over coverage. We trust Mailchimp's
  documented sorted pagination for the cap. (If the clamp ever truncated the
  middle instead of the tail, offset/cursor continuation would skip those rows —
  silent loss.)
