docs: |-
  **REFERENCE:** `exclude_fields` semantics from
  [Methods and Parameters](https://mailchimp.com/developer/marketing/docs/methods-parameters/).

  **WHY:** proves server-side `_links` stripping on the list-child URL shape
  (see `_top-level / exclude_fields probe` for the rationale). Set
  (`child`, `child_items_key`) to: (members, members),
  (interest-categories, categories), (tag-search, tags). The pairs where the
  two differ are the point: the exclusion path must name the RESPONSE items
  key, not the URL segment — exactly what the connector's
  `fetch_collection_page` injection keys on. The tag-search run additionally
  probes whether excluding a field the items never carry (`tags` rows have no
  `_links`) errors or is ignored.

  **VERIFIED (2026-07-29):** all three pairs return 200 with `_links` absent
  from items and envelope. interest-categories confirms the items-key rule
  (`categories._links` works against the `/interest-categories` path).
  tag-search: rows carry no `_links` and excluding it anyway is silently
  ignored — no invalid-field error — so the connector's blanket injection is
  safe on endpoints whose rows lack the field. (The Methods and Parameters
  page's "will throw an error if a field isn't valid" did not bite here;
  `_links` is presumably schema-valid even where the response omits it.)
