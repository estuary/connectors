info:
  name: exclude_fields probe
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/lists/{{list_id}}/{{child}}?count=1&exclude_fields={{child_items_key}}._links,_links"
  params:
    - name: count
      value: "1"
      type: query
    - name: exclude_fields
      value: "{{child_items_key}}._links,_links"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - members - _links absent from items and envelope
    request:
      url: "{{base_url}}/lists/{{list_id}}/members?count=1&exclude_fields=members._links,_links"
