docs: |-
  **REFERENCE:** [List campaigns](https://mailchimp.com/developer/marketing/api/campaigns/list-campaigns/)

  **WHY:** bare list for the `campaigns` stream. Teaches the envelope, the
  per-campaign field set, and the baseline `total_items` for the silent-default
  audit — compare against `Campaigns / status filter` to prove the bare list
  doesn't default-filter by status. The connector must capture **all** statuses
  (`save`, `paused`, `schedule`, `sending`, `sent`).

  **VERIFIED (2026-06-30):** envelope `{campaigns, total_items, _links}`;
  per-campaign fields include `id`, `create_time`, `send_time`, `status`,
  `report_summary`. `total_items` = **3** (one `sent`, two `save`); `save` +
  `sent` already sum back to 3, so the bare list does **not** silently drop any
  partition (see `Campaigns / status filter` for the partition run).
