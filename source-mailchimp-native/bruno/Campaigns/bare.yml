info:
  name: bare
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/campaigns?count=10"
  params:
    - name: count
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - 3 campaigns; full shape of the sent one (1 of 3 shown)
    request:
      url: "{{base_url}}/campaigns?count=10"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "campaigns": [
              {
                "id": "61cc0c44a6",
                "web_id": 6783366,
                "type": "regular",
                "create_time": "2026-06-10T18:28:42+00:00",
                "status": "sent",
                "emails_sent": 1,
                "send_time": "2026-06-10T18:41:10+00:00",
                "content_type": "html",
                "resendable": true,
                "recipients": {
                  "list_id": "f34247943d",
                  "list_is_active": true,
                  "list_name": "Estuary",
                  "segment_text": "",
                  "recipient_count": 1
                },
                "settings": {
                  "subject_line": "[estuary test] email-activity seed",
