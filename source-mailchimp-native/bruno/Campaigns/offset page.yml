info:
  name: offset page
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/campaigns?count=1&offset=1&sort_field=create_time&sort_dir=ASC"
  params:
    - name: count
      value: "1"
      type: query
    - name: offset
      value: "1"
      type: query
    - name: sort_field
      value: create_time
      type: query
    - name: sort_dir
      value: ASC
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - second-oldest row, total_items unchanged at 3
    request:
      url: "{{base_url}}/campaigns?count=1&offset=1&sort_field=create_time&sort_dir=ASC"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "campaigns": [
              { "id": "524c905696", "status": "save", "create_time": "2026-06-10T18:40:54+00:00" }
            ],
            "total_items": 3
          }

docs: |-
  **REFERENCE:** [List campaigns](https://mailchimp.com/developer/marketing/api/campaigns/list-campaigns/)

  **WHY:** pagination contract probe under the sort the connector uses: `count=1`
  + `offset=1` must return the **second-oldest** campaign with `total_items`
  unchanged — offset paging composing with an explicit sort.

  **VERIFIED (2026-06-30):** returns `524c905696` (the 2nd-oldest under
  `create_time` ASC) with `total_items` still **3** — offset paging honored,
  count doesn't alter the total.
