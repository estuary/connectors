info:
  name: status filter
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/campaigns?count=10&status=save"
  params:
    - name: count
      value: "10"
      type: query
    - name: status
      value: save
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - status=save returns the 2 drafts, excludes the sent one
    request:
      url: "{{base_url}}/campaigns?count=10&status=save"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "campaigns": [
              { "id": "524c905696", "status": "save", "create_time": "2026-06-10T18:40:54+00:00" },
              { "id": "cff6ca453b", "status": "save", "create_time": "2026-06-11T17:13:33+00:00" }
            ],
            "total_items": 2
          }

docs: |-
  **REFERENCE:** [List campaigns](https://mailchimp.com/developer/marketing/api/campaigns/list-campaigns/)

  **WHY:** silent-default-filter audit — proves the `status` partition parameter
  is honored. If the bare list's `total_items` equals the sum over statuses, the
  bare list already covers every partition and the connector needs **no**
  per-status sweep.

  **VERIFIED (2026-06-30):** `status=save` returns **2** (`524c905696`,
  `cff6ca453b`) and excludes the `sent` one. Since bare = 3 and `save` (2) +
  `sent` (1) = 3, the bare list covers all partitions — **no status sweep
  required**.

  **LIMITATION (VERIFIED 2026-06-30):** `status=save` rows are drafts, and
  drafts carry `send_time: ""` — an empty string, not `null` and not absent.
  Left unmodeled (the field is typed as a date-time elsewhere); a strict RFC3339
  date-time parse would reject `""`, so any consumer must tolerate the
  empty-string sentinel.
