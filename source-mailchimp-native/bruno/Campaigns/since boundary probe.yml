info:
  name: since boundary probe
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/campaigns?count=10&since_create_time=2026-06-10T18:28:42Z&sort_field=create_time&sort_dir=ASC&fields=campaigns.id,campaigns.create_time,total_items"
  params:
    - name: count
      value: "10"
      type: query
    - name: since_create_time
      value: 2026-06-10T18:28:42Z
      type: query
    - name: sort_field
      value: create_time
      type: query
    - name: sort_dir
      value: ASC
      type: query
    - name: fields
      value: campaigns.id,campaigns.create_time,total_items
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - narrowed 5 to 4, since is EXCLUSIVE of the exact timestamp
    request:
      url: "{{base_url}}/campaigns?count=10&since_create_time=2026-06-10T18:28:42Z&sort_field=create_time&sort_dir=ASC&fields=campaigns.id,campaigns.create_time,total_items"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "campaigns": [
              { "id": "524c905696", "create_time": "2026-06-10T18:40:54+00:00" },
              { "id": "cff6ca453b", "create_time": "2026-06-11T17:13:33+00:00" },
              { "id": "5dfc22e163", "create_time": "2026-07-08T17:55:46+00:00" },
              { "id": "3f69f3a595", "create_time": "2026-07-13T13:15:41+00:00" }
            ],
            "total_items": 4
          }

docs: |-
  **REFERENCE:** [List campaigns](https://mailchimp.com/developer/marketing/api/campaigns/list-campaigns/)

  **WHY:** the missing half of `Campaigns / before boundary probe`. That probe
  established `before_create_time` is INCLUSIVE of the exact timestamp;
  `Campaigns / since_create_time` only established that `since_create_time`
  *narrows* (its threshold sat at 18:30:00, between two campaigns, so it never
  touched the boundary). This pins the threshold to campaign `61cc0c44a6`'s
  `create_time` EXACTLY (2026-06-10T18:28:42, the account's oldest), the same
  anchor the `before` probe used, so the two are directly comparable.

  Because the anchor is the *oldest* campaign, the arms are unambiguous:
  INCLUSIVE returns every campaign in the account; EXCLUSIVE returns every
  campaign except `61cc0c44a6`. Any other result means the filter is not being
  applied as understood.

  What depends on it: `fetch_campaigns` drops docs with
  `create_time <= log_cursor` client-side specifically so that `since_*`
  inclusivity doesn't matter. If `since_create_time` is EXCLUSIVE the server
  already guarantees that, and the drop is dead code; if INCLUSIVE the drop is
  load-bearing and must stay (without it the cursor doc is re-emitted on every
  poll, forever). Either way this probe converts a defensive guard into a
  documented decision.

  **VERIFIED (2026-07-30):** `since_create_time` is EXCLUSIVE of the exact
  timestamp. The threshold narrowed **5 → 4** — `61cc0c44a6`, whose
  `create_time` equals it exactly, is the only campaign excluded; the other
  four (`524c905696` 06-10 18:40, `cff6ca453b` 06-11, `5dfc22e163` 07-08,
  `3f69f3a595` 07-13) all remain. Run unfiltered as a control in the same
  session (`Campaigns / since_create_time`, 2026-06-01 threshold): the account
  holds 5 campaigns and `61cc0c44a6` is still present at exactly
  2026-06-10T18:28:42, so this is boundary exclusion and not a deleted record.

  So the campaigns window is **half-open**: `since_create_time` exclusive,
  `before_create_time` inclusive (`Campaigns / before boundary probe`) — i.e.
  `(since, before]`. Same asymmetry `before_last_changed` / `since_last_changed`
  show on the members family (`Members / before boundary probe`), so it looks
  like an API-wide convention rather than a per-endpoint quirk.

  Consequence for `fetch_campaigns`: its `create_time <= log_cursor` client-side
  drop was the unverified-semantics fallback, and this probe retires it — the
  server already withholds the cursor second, so the drop could never fire. It
  was removed when this probe landed, per `FETCH-SERVER-SIDE-BOUNDARIES`; the
  emitted window is now the queried window, with no second boundary-logic layer
  to keep in sync. Re-run this probe before widening the campaigns window
  further: correctness of that removal rests on the exclusivity established
  here, which Mailchimp's docs do not state.
