docs: |-
  **REFERENCE:** [API reference](https://mailchimp.com/developer/marketing/api/list-members/list-members-info/)

  **WHY:** the exact query shape of the connector's archived sweep:
  `status=archived` combined with `since_last_changed`. Archiving advances
  last_changed, so if the unfiltered list drops archived members, the connector
  runs this second filtered walk per list off the same cursor — this probe
  teaches whether the two parameters compose. Run after `D2 - Archive Member`;
  expect the archived seeded member (archived 2026-06-12 > threshold).

  **VERIFIED (2026-06-30):** the two parameters compose — the archived member
  returns under `status=archived&since_last_changed=...` (see the saved
  example).
