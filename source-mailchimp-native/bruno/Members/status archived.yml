  name: status archived
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/lists/{{list_id}}/members?count=10&status=archived"
  params:
    - name: count
      value: "10"
      type: query
    - name: status
      value: archived
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

