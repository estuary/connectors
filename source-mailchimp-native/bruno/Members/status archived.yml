docs: |-
  **REFERENCE:** [API reference](https://mailchimp.com/developer/marketing/api/list-members/list-members-info/)

  **WHY:** silent-data-loss audit: `status` partitions members
  (subscribed|unsubscribed|cleaned|pending|transactional|archived) and the docs
  don't state whether the unfiltered list includes archived members. Compare
  this partition's total_items against `Members / bare` after `D2 - Archive
  Member` runs — if archived members are excluded from the unfiltered list, the
  connector needs an explicit archived sweep.

  **VERIFIED (2026-06-30):** archived members ARE excluded from the unfiltered
  list — the archived seed member returns here under `status=archived` but is
  absent from `Members / bare` (see the example). The connector therefore runs
  an explicit archived sweep per list.
