docs: |-
  **REFERENCE:** [API reference](https://mailchimp.com/developer/marketing/api/list-members/list-members-info/)

  **WHY:** pagination contract probe: count=1&offset=1 under a stable sort must
  return the second member. Completion signal for the connector is the
  short-page sentinel (a page smaller than the requested count) — total_items is
  NOT used in this connector (it undercounts under include_* flags elsewhere;
  see the Segment Members limitation).

  **VERIFIED (2026-06-30):** honored — returns exactly the second row under
  `last_changed` ASC with `total_items` unchanged (see the saved example).
