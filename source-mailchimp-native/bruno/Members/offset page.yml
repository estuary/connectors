info:
  name: offset page
  type: http
  seq: 7

http:
  method: GET
  url: "{{base_url}}/lists/{{list_id}}/members?count=1&offset=1&sort_field=last_changed&sort_dir=ASC"
  params:
    - name: count
      value: "1"
      type: query
    - name: offset
      value: "1"
      type: query
    - name: sort_field
      value: last_changed
      type: query
    - name: sort_dir
      value: ASC
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - second row under ASC sort, stable total_items
    request:
