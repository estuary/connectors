info:
  name: before boundary probe
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/lists/{{list_id}}/members?count=10&before_last_changed=2026-06-12T14:26:23Z&sort_field=last_changed&sort_dir=ASC&fields=members.email_address,members.last_changed,total_items"
  params:
    - name: count
      value: "10"
      type: query
    - name: before_last_changed
      value: 2026-06-12T14:26:23Z
      type: query
    - name: sort_field
      value: last_changed
      type: query
    - name: sort_dir
      value: ASC
      type: query
    - name: fields
      value: members.email_address,members.last_changed,total_items
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - three rows, before is INCLUSIVE of the exact timestamp
    request:
      url: "{{base_url}}/lists/{{list_id}}/members?count=10&before_last_changed=2026-06-12T14:26:23Z&sort_field=last_changed&sort_dir=ASC&fields=members.email_address,members.last_changed,total_items"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "members": [
              {
                "email_address": "connector-dev+mailchimp@estuary.dev",
                "last_changed": "2026-06-09T15:12:24+00:00"
              },
              {
                "email_address": "nicolas+estuary-test-3@estuary.dev",
                "last_changed": "2026-06-12T13:32:42+00:00"
              },
              {
                "email_address": "nicolas+estuary-test-1@estuary.dev",
                "last_changed": "2026-06-12T14:26:23+00:00"
              }
            ],
            "total_items": 3
          }

docs: |-
  **REFERENCE:** [API reference](https://mailchimp.com/developer/marketing/api/list-members/list-members-info/)

  **WHY:** boundary-semantics probe, mirror of `Members / since boundary probe`:
  the threshold equals the test-1 member's last_changed EXACTLY. Account state
  at probe time (see `Members / bare`): connector-dev 2026-06-09T15:12:24,
  test-3 2026-06-12T13:32:42, test-1 2026-06-12T14:26:23 (the threshold), test-2
  2026-07-02T18:19:54. Two rows back means `before_*` is EXCLUSIVE of the exact
  timestamp; three rows (test-1 included) means inclusive. The connector caps
  incremental windows with `before_*` at the current-second horizon and
  suppresses boundary docs client-side, so either answer is safe — this pins
  which one is true. The docs don't state the semantics either way.

  **VERIFIED (2026-07-06):** `before_last_changed` is INCLUSIVE of the exact
  timestamp — three rows returned, test-1 (== threshold) among them. Asymmetric
  with `since_*`, which is exclusive (`Members / since boundary probe`). Same
  result on segments (`Segments / before boundary probe`). Consequences for the
  connector: the incremental client-side filter must keep dropping docs at the
  horizon (they'd otherwise ride in from the in-progress second), and a
  backfill's `before_*=cutoff` window includes the cutoff second, which the
  first incremental poll re-emits — a benign, key-deduped one-second overlap.
