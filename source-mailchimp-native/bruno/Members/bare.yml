docs: |-
  **REFERENCE:** [API reference](https://mailchimp.com/developer/marketing/api/list-members/list-members-info/)

  **WHY:** bare list for the `list_members` stream. Teaches the envelope, that
  each member carries its parent `list_id` in the body (so no parent-ID
  injection is needed), and the identity/cursor fields the stream design leans
  on. Each member's `id` is the MD5 subscriber hash that the D1/D2 mutation
  seeds reference directly in their URLs.

  **VERIFIED (2026-06-30):** envelope is `{members, list_id, total_items,
  _links}`; each member carries `id` (MD5 of lowercase email), `last_changed`,
  `status`, and `list_id` in the body.

  **VERIFIED (2026-07-06):** unarchiving advances `last_changed` — after
  `Seeding/D4 - Unarchive Member`, the member rejoins the bare list with its
  `last_changed` advanced past the archive instant (see the "after D4
  unarchive" example), so a since-filtered sweep picks the member back up and
  its `status` heals downstream.
