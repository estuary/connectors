docs: |-
  **REFERENCE:** [API reference](https://mailchimp.com/developer/marketing/api/list-members/list-members-info/)

  **WHY:** exercises the exact incremental query the connector will issue:
  `since_last_changed` (ISO 8601) + `sort_field=last_changed&sort_dir=ASC` —
  and, with the threshold moved between two members' last_changed values,
  proves the filter actually *narrows*. Two thresholds, one saved example each
  (edit `since_last_changed` between runs): `2026-06-05`, below every member
  (accept + sort arm), and `2026-06-10`, which falls AFTER the account's
  original member's last_changed (2026-06-09) and BEFORE the seeded members'
  (2026-06-12) (narrowing arm; its pre-seeding empty run is also saved).

  **VERIFIED (2026-06-30, accept + sort):** honored — all 3 members return in
  ascending `last_changed` order under the `2026-06-05` threshold (see the
  saved example).

  **VERIFIED (2026-06-30, narrowing):** narrows — 2 items vs. bare's 3 under
  the `2026-06-10` threshold, and `total_items` tracks the FILTERED count.
  Recorded as evidence the filter is server-side, though the connector itself
  never consumes total_items (short-page sentinel only).
