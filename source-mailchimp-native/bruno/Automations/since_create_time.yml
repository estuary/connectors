info:
  name: since_create_time
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/automations?since_create_time=2026-06-01T00:00:00Z"
  params:
    - name: since_create_time
      value: 2026-06-01T00:00:00Z
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - param accepted; empty (account has 0 automations)
    request:
      url: "{{base_url}}/automations?since_create_time=2026-06-01T00:00:00Z"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "automations": [],
            "total_items": 0
          }

docs: |-
  **REFERENCE:** [List automations](https://mailchimp.com/developer/marketing/api/automation/list-automations/)

  **WHY:** filter probe — the release notes claim `since_create_time` /
  `before_create_time` and `since_start_time` / `before_start_time` exist on
  `/automations`. Teaches whether the param is at least accepted. `create_time`
  is created-only, so even if honored it cannot catch updates (status
  pause/start, settings edits).

  **VERIFIED (2026-06-30):** the param is **accepted** — returns `200` with the
  `{automations, total_items, _links}` envelope, no `400`.

  **UNOBSERVABLE:** whether the filter actually *narrows*. The account has **0**
  automations (classic automations is feature-gated and UI-only to create — see
  `Automations / bare`), so the filter returns an empty set either way. Trust
  the release-notes claim; re-probe if an account with classic automations ever
  becomes available.
