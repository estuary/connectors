http:
  method: GET
  url: "{{base_url}}/lists/{{list_id}}/segments/{{segment_id}}/members?count=1000&include_cleaned=true&include_transactional=true&include_unsubscribed=true"
  params:
    - name: count
      value: "1000"
      type: query
    - name: include_cleaned
      value: "true"
      type: query
    - name: include_transactional
      value: "true"
      type: query
    - name: include_unsubscribed
      value: "true"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

