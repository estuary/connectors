docs: |-
  **REFERENCE:** [API reference](https://mailchimp.com/developer/marketing/api/list-segment-members/list-members-in-segment/)

  **WHY:** silent-data-loss audit — the provider schema
  (Parameters/SegmentInclude_*.json) describes include_cleaned /
  include_transactional / include_unsubscribed as "Include <state> members in
  response", i.e. those partitions are EXCLUDED by default. Teaches that the
  three flags are accepted and what they do to the item set; the connector must
  decide explicitly whether to pass them (it does — all three).

  **VERIFIED (2026-06-30):** the three flags are accepted (200, not 400), and
  with them on the unsubscribed member 3 joins the item set (3 members vs. the
  bare run's 2 — see the examples). An earlier note here claimed the item set
  matched the bare run; that predated the B5–B7 unsubscribe seeds and is
  superseded by the saved examples.

  **LIMITATION (VERIFIED 2026-06-30):** the connector passes all three
  include_* flags so full membership is captured, but under those flags
  `total_items` *undercounts* the returned rows (see the "200 - 3 members but
  total_items still 2" example: 3 members returned, `total_items` reported as
  2). Offset pagination therefore can't trust `total_items` as the stop
  condition — it completes on a short page (a page smaller than the requested
  `count`) instead.
