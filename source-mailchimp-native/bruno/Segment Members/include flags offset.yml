docs: |-
  **REFERENCE:** [API reference](https://mailchimp.com/developer/marketing/api/list-segment-members/list-members-in-segment/)

  **WHY:** offset pagination on segment members — its own request because the
  path (lists/{{list_id}}/segments/{{segment_id}}/members) is a unique
  two-parent depth that no other endpoint shares. Probed under the include_*
  flags the connector always passes: with them the expanded response carries
  MORE items than total_items reports (3 members vs total_items=2 — total_items
  counts only the default population), so the load-bearing question is what
  `offset` indexes — the expanded set or the default population. A flagless
  `count=1&offset=1` control run is saved alongside.

  **VERIFIED (2026-06-30):** offset=2&count=1 under the flags returns exactly
  the third (unsubscribed) member — offset indexes the EXPANDED set, so
  offset/count paging works. But completion MUST use the short-page signal,
  never offset >= total_items, or flag-included members beyond total_items are
  silently dropped. The flagless control (`count=1&offset=1`, second example)
  is likewise honored.
