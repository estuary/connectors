docs: |-
  **REFERENCE:** [API reference](https://mailchimp.com/developer/marketing/api/list-segment-members/list-members-in-segment/)

  **WHY:** grandchild list (lists → segments → members). Teaches the envelope,
  the per-item field set, that count=1000 is accepted (max page size), that NO
  date filters exist (snapshot classification), and — the silent-data-loss audit
  — whether members in cleaned/transactional/unsubscribed states appear in the
  bare response (the docs define include_* params, implying they don't).

  **VERIFIED (2026-06-30):** envelope `{members: [...], total_items, _links}`;
  items carry `id` (MD5 subscriber hash), `email_address`, `status`,
  `last_changed`; `count=1000` accepted; no date filters. Default exclusion
  confirmed: the bare run returns 2 of 3 members — the unsubscribed member 3 is
  excluded by the endpoint's defaults (compare `Segment Members / include
  flags`).

  **VERIFIED (2026-07-02, cross-stream note, archived-segments audit):** the
  concern was that the parent-ID sweep feeding this stream (GET
  /lists/{list_id}/segments) might hide archived segments the way the members
  listing hides archived members (see `Members / status archived`). Audited and
  closed: Mailchimp segments have NO archived state — see the finding in
  `Segments / bare` and the two `Segments / * probe` requests. The parent
  drain here needs no change.
