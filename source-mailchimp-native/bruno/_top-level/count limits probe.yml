info:
  name: count limits probe
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/{{resource}}?count=1001"
  params:
    - name: count
      value: "1001"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - count 1001 accepted, over documented max (lists)
    request:
      url: "{{base_url}}/lists?count=1001"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "lists": [
              {
                "id": "f34247943d"
              }
            ],
            "total_items": 1
          }
  - name: lists - count 1000 accepted
    request:
      url: "{{base_url}}/lists?count=1000"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "lists": [
              { "id": "f34247943d" }
            ],
            "total_items": 1
          }

docs: |-
  **WHY:** count-limit probe for top-level list endpoints. Set `resource` to:
  lists, campaigns, automations. Two arms, one saved example each (edit `count`
  between runs): `count=1000` — the documented max and the page size the
  connector requests — and `count=1001` (and beyond) to learn the enforcement
  mode past the documented max: a hard 400, a silent clamp, or nothing.
  Collapsed from the per-resource count-cap probes (lists, campaigns).

  **VERIFIED (2026-06-30):** `count=1000` returns `200` on `/lists` (1 list,
  `total_items` 1). And Mailchimp does NOT reject over-limit `count` —
  `count=1001` returns 200, and on /lists even count=2000, 100000, and
  1,000,000 return 200 with no error and no body-level clamp signal (the
  `constraints` object on /lists is an account list-creation limit, present at
  count=10 too — unrelated to paging). The documented max is therefore not a
  hard reject.

  **UNOBSERVABLE:** whether the page is server-clamped at 1000 when
  `total_items > 1000`. The test account holds <1000 items per collection, and
  seeding >1000 rows just to watch the clamp is machinery we decline to add —
  trust the docs. The connector must still page on the short-page / total_items
  signal and never assume one over-sized request returns the whole collection.
