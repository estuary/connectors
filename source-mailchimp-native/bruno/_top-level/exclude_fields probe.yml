  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/{{resource}}?count=1&exclude_fields={{resource}}._links,_links"
  params:
    - name: count
      value: "1"
      type: query
    - name: exclude_fields
      value: "{{resource}}._links,_links"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

