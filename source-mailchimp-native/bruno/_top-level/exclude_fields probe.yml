docs: |-
  **REFERENCE:** `exclude_fields` semantics from
  [Methods and Parameters](https://mailchimp.com/developer/marketing/docs/methods-parameters/).

  **WHY:** the connector strips HATEOAS `_links` server-side on every
  collection request (`fetch_collection_page` injects
  `exclude_fields=<items_key>._links,_links`). `Email Activity /
  exclude_fields probe` proved the mechanism on one deep endpoint; this run
  proves it on the top-level URL shape. Set `resource` to: lists, campaigns,
  automations (items key == resource name for all three). One saved example
  per resource. Key ABSENCE in examples is the API's doing — the collection
  redaction script replaces `_links` values but never removes keys.

  **VERIFIED (2026-07-29):** all three resources return 200 with `_links`
  absent from both the items and the envelope. The automations run (empty
  collection on this account) still proves the envelope-level exclusion. The
  `/lists` envelope's `constraints` object is untouched — the exclusion
  removes only the named paths.
