docs: |-
  **REFERENCE:** [API reference](https://mailchimp.com/developer/marketing/api/lists/get-lists-info/)

  **WHY:** bare list for the `lists` stream, and the source of the parent
  `list_id` every child probe uses. Teaches the response envelope and the
  per-list field set — in particular whether any updated_at-like field exists
  that could serve as an incremental cursor.

  **VERIFIED (2026-06-30):** envelope is `{lists: [...], total_items, _links}`;
  each list carries `id`, `date_created`, `stats`, `visibility` — and no
  updated_at-like field, so the stream cannot be incremental on updates.
