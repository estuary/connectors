info:
  name: fields projection probe
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/lists?fields=lists.id,total_items&count=1000"
  params:
    - name: fields
      value: lists.id,total_items
      type: query
    - name: count
      value: "1000"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - id-only projection honored
    request:
      url: "{{base_url}}/lists?fields=lists.id,total_items&count=1000"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "lists": [
              {
                "id": "f34247943d"
              }
            ],
            "total_items": 1
          }

docs: |-
  **REFERENCE:** [API reference](https://mailchimp.com/developer/marketing/api/lists/get-lists-info/)

  **WHY:** field-selection probe for parent-ID draining — the snapshot-child
  streams re-enumerate parent collections on every poll only to harvest ids, so
  the fan-out requests project down to `<items_key>.id,total_items`. Teaches
  whether the comma-separated dotted `fields` syntax is honored.

  **VERIFIED (2026-06-30):** honored — response items carry only `id`, and
  `total_items` survives for the pagination contract.
