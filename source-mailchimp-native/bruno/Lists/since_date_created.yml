info:
  name: since_date_created
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/lists?count=10&since_date_created=2026-06-10T00:00:00Z&sort_field=date_created&sort_dir=ASC"
  params:
    - name: count
      value: "10"
      type: query
    - name: since_date_created
      value: 2026-06-10T00:00:00Z
      type: query
    - name: sort_field
      value: date_created
      type: query
    - name: sort_dir
      value: ASC
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - honored, narrowed 1 to 0 (list predates threshold)
    request:
      url: "{{base_url}}/lists?count=10&since_date_created=2026-06-10T00:00:00Z&sort_field=date_created&sort_dir=ASC"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "lists": [],
            "total_items": 0,
            "constraints": {
              "may_create": false,
              "max_instances": 1,
              "current_total_instances": 1
            },
            "_links": "REDACTED"
          }

docs: |-
  **REFERENCE:** [API reference](https://mailchimp.com/developer/marketing/api/lists/get-lists-info/)

  **WHY:** the docs are ambiguous on whether GET /lists honors
  `since_date_created` / `sort_field=date_created`. Teaches whether the filter
  is honored, ignored, or rejected — which decides if the stream could at least
  be created-time incremental.

  **VERIFIED (2026-06-30):** it IS honored. The account's only list was created
  2026-06-09; a 2026-06-10 threshold returns 200 with total_items 0 and an empty
  lists[] (narrowed 1 → 0), so the filter excludes the older list rather than
  ignoring the param or 400ing. Note date_created is a created-only cursor —
  even though honored, it cannot catch updates, so this stream is a snapshot,
  not an incremental cursor.
