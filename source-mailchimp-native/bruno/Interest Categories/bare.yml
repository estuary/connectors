info:
  name: bare
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/lists/{{list_id}}/interest-categories?count=60"
  params:
    - name: count
      value: "60"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - empty list
    request:
      url: "{{base_url}}/lists/{{list_id}}/interest-categories?count=60"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "list_id": "f34247943d",
            "categories": [],
            "total_items": 0,
            "_links": "REDACTED"
          }
  - name: 200 - populated, 2 categories
    request:
      url: "{{base_url}}/lists/{{list_id}}/interest-categories?count=60"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "list_id": "f34247943d",
            "categories": [
              {
                "list_id": "f34247943d",
                "id": "1d3affa9d2",
                "title": "Estuary Test Category A",
                "display_order": 0,
                "type": "checkboxes",
                "_links": "REDACTED"
              },
              {
                "list_id": "f34247943d",
                "id": "f9a37e2cd1",
                "title": "Estuary Test Category B",
                "display_order": 1,
                "type": "dropdown",
                "_links": "REDACTED"
              }
            ],
            "total_items": 2,
            "_links": "REDACTED"
          }

docs: |-
  **REFERENCE:** [API reference](https://mailchimp.com/developer/marketing/api/interest-categories/list-interest-categories/)

  **WHY:** bare child list for the `interest_categories` stream. Teaches the
  envelope, the per-item field set, and that count is honored. No date filters
  are documented; this stream is a snapshot fanned out over parent list IDs.

  **VERIFIED (2026-06-30):** envelope `{categories: [...], list_id, total_items,
  _links}`; items carry `id`, `list_id`, `title`, `display_order`, `type`;
  count honored (see the empty pre-seeding and populated post-seeding examples).
