info:
  name: fields projection probe
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/lists/{{list_id}}/interest-categories?fields=categories.id,total_items&count=60"
  params:
    - name: fields
      value: categories.id,total_items
      type: query
    - name: count
      value: "60"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - id-only projection honored on child path
    request:
      url: "{{base_url}}/lists/{{list_id}}/interest-categories?fields=categories.id,total_items&count=60"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "categories": [
              {
                "id": "1d3affa9d2"
              },
              {
                "id": "f9a37e2cd1"
              }
            ],
            "total_items": 2
          }

docs: |-
  **REFERENCE:** [API reference](https://mailchimp.com/developer/marketing/api/interest-categories/list-interest-categories/)

  **WHY:** field-selection probe on a CHILD endpoint — the interests grandchild
  stream drains (list_id, category_id) pairs by projecting the
  interest-categories collection down to ids. Teaches whether `fields` works the
  same on nested paths as on top-level collections.

  **VERIFIED (2026-06-30):** id-only projection honored on the child path (see
  the saved example).
