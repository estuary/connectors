$defs:
  Meta:
    additionalProperties: true
    description: |-
      `extra="allow"` lets context-stamped parent IDs ride in `_meta`;
      `BaseDocument.Meta` otherwise drops unknown keys.
    properties:
      op:
        default: u
        description: 'Operation type (c: Create, u: Update, d: Delete)'
        enum:
        - c
        - u
        - d
        title: Op
        type: string
      row_id:
        default: -1
        description: Row ID of the Document, counting up from zero, or -1 if not known
        title: Row Id
        type: integer
    title: Meta
    type: object
additionalProperties: true
description: |-
  Email in a classic automation workflow. Like its `Automation` parent,
  the endpoint is feature-gated and empty on the test account, so this shape
  is docs-based; the required `id` fails loudly if a real payload
  disagrees.
properties:
  _meta:
    $ref: '#/$defs/Meta'
    description: Document metadata
  id:
    title: Id
    type: string
required:
- id
title: AutomationEmail
type: object
x-infer-schema: true
if:
  required:
  - _meta
  properties:
    _meta:
      required:
      - op
      properties:
        op:
          const: d
then:
  reduce:
    strategy: merge
    delete: true
