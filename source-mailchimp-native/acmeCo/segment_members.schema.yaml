$defs:
  Meta:
    additionalProperties: true
    description: |-
      `extra="allow"` lets context-stamped parent IDs ride in `_meta`;
      `BaseDocument.Meta` otherwise drops unknown keys.
    properties:
      op:
        default: u
        description: 'Operation type (c: Create, u: Update, d: Delete)'
        enum:
        - c
        - u
        - d
        title: Op
        type: string
      row_id:
        default: -1
        description: Row ID of the Document, counting up from zero, or -1 if not known
        title: Row Id
        type: integer
    title: Meta
    type: object
additionalProperties: true
description: |-
  Items carry `list_id` natively, so it stays a body field; the parent
  `segment_id` is absent from the response and stamped into `_meta`.
properties:
  _meta:
    $ref: '#/$defs/Meta'
    description: Document metadata
  id:
    title: Id
    type: string
  list_id:
    title: List Id
    type: string
required:
- id
- list_id
title: SegmentMember
type: object
x-infer-schema: true
if:
  required:
  - _meta
  properties:
    _meta:
      required:
      - op
      properties:
        op:
          const: d
then:
  reduce:
    strategy: merge
    delete: true
