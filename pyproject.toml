# Virtual workspace root: not a package itself, just the set of members that
# share one resolution and one uv.lock. Members are listed explicitly because
# a `source-*` glob would also match the Go connectors, which have no
# pyproject.toml.
#
# `requires-python` intersects across members, so the narrowest member sets the
# floor for every member's resolution. Every member here declares `>=3.14`
# except estuary-cdk, which is wider because it is also published to consumers
# outside this repo; source-google-ads' `<3.15` supplies the only ceiling. The
# lock therefore resolves for `==3.14.*`.
#
# The two Python packages that belong to Go connectors are deliberately not
# members. materialize-snowflake/sidecar must run on the base image's 3.13 and
# is its own uv project with its own lock; materialize-iceberg/python is
# `go:embed`-ed and submitted to Spark images carrying 3.10 and 3.8, and keeps
# the poetry.lock it has always had.
[tool.uv.workspace]
members = [
    "estuary-cdk",
    # The vendored Airbyte fork. A member of its own so that estuary-cdk's
    # published wheel carries `estuary_cdk` alone; see vendor/README.md.
    "estuary-cdk/vendor",
    "source-ada",
    "source-aircall-native",
    "source-airtable",
    "source-airtable-native",
    "source-apple-app-store",
    "source-appsflyer",
    "source-asana",
    "source-ashby",
    "source-aws-cost-explorer",
    "source-braintree-native",
    "source-brevo",
    "source-calendly",
    "source-chargebee-native",
    "source-commercetools",
    "source-criteo",
    "source-datadog",
    "source-dynamics-365-finance-and-operations",
    "source-estuary",
    "source-facebook-marketing-native",
    "source-front",
    "source-gainsight-nxt",
    "source-genesys",
    "source-gladly",
    "source-gong",
    "source-google-ads",
    "source-google-analytics-data-api-native",
    "source-google-play",
    "source-google-sheets-native",
    "source-greenhouse-native",
    "source-hubspot",
    "source-hubspot-native",
    "source-impact-native",
    "source-incident-io",
    "source-intercom-native",
