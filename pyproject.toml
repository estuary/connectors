# Test and tooling dependencies live here, once, rather than in 69 member
# copies that drift apart. A workspace resolves to one version of each package
# anyway, so a per-member declaration could only ever disagree with its
# siblings, never actually get a different version.
[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-insta>=0.4.1,<0.5",
    "pytest-mock>=3.15.1,<4",
    "requests-mock>=1.11.0,<2",
    "mock>=5.1.0,<6",
    "freezegun>=1.4.0,<2",
    "jsonschema>=4,<5",
    "debugpy>=1.8.0,<2",
    "boto3-stubs[ce]>=1.40,<2",
    "types-python-dateutil>=2.9.0.20251008,<3",
]
# pyright needs to import the workspace's dependencies, so it runs from the
# environment rather than via `uvx`. ruff does not, and stays a `uvx` call
# pinned by ruff.toml's `required-version`.
lint = [
    "pyright==1.1.408",
]
