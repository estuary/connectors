# Test and tooling dependencies live here, once, rather than in 69 member
# copies that drift apart. A workspace resolves to one version of each package
# anyway, so a per-member declaration could only ever disagree with its
# siblings, never actually get a different version.
[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-insta>=0.4.1,<0.5",
    "pytest-mock>=3.15.1,<4",
    "requests-mock>=1.11.0,<2",
    "mock>=5.1.0,<6",
    "freezegun>=1.4.0,<2",
    "jsonschema>=4,<5",
    "debugpy>=1.8.0,<2",
    "boto3-stubs[ce]>=1.40,<2",
    "types-python-dateutil>=2.9.0.20251008,<3",
]
# pyright needs to import the workspace's dependencies, so it runs from the
# environment rather than via `uvx`. ruff does not, and stays a `uvx` call
# pinned by ruff.toml's `required-version`.
lint = [
    "pyright==1.1.408",
]

# Type checking. Every workspace member is checked, but only estuary-cdk gates
# on it: the connectors carry a backlog in the low thousands, so their findings
# are surfaced as annotations and worked down separately. `vendor/` is excluded
# as vendored Airbyte code that is never edited to satisfy a checker.
[tool.pyright]
include = [
    "estuary-cdk/estuary_cdk",
    "source-*",
]
# The CDK is checked at full strict. The list promotes rules per-path -- an
# executionEnvironment can't, as it has no say over typeCheckingMode -- so the
# connectors stay at the `typeCheckingMode` below. It also forces
# reportMissingTypeStubs back to an error for these paths, which the three
# stub-less imports (pycron, ijson, airbyte_protocol) suppress inline.
strict = ["estuary-cdk/estuary_cdk"]
exclude = ["**/.venv", "**/__pycache__", "estuary-cdk/vendor"]
# The workspace's own version. estuary-cdk supports 3.11 as well, but a
# second config for it would be a net loss: a per-member `[tool.pyright]`
# replaces the root's rules rather than extending them, so all six promotions
# below would have to be kept in sync by hand -- and pyright picks its config
# from the invocation directory, not the path argument, so `pyright
# estuary-cdk/estuary_cdk` from the repo root would read this file anyway. The
# 3.11 guarantee is carried by python.yaml's supported-Pythons job, which
# compiles and tests on a real 3.11 interpreter.
pythonVersion = "3.14"
typeCheckingMode = "standard"

# Rules from strict mode that are worth having on their own, applied to the
# connectors as well. reportMissingTypeStubs stays off: its hits are pycron,
# ijson and airbyte_protocol, none of which we can produce stubs for.
reportUnusedImport = "error"
reportMissingParameterType = "error"
reportInvalidTypeVarUse = "error"
reportDeprecated = "error"
reportUnnecessaryIsInstance = "error"
reportPrivateUsage = "error"
