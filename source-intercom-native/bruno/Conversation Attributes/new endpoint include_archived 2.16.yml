docs: |-
  **REFERENCE:** [List all conversation attributes (2.16)](https://developers.intercom.com/docs/references/rest-api/api.intercom.io/conversations-attributes/listconversationattributes)

  **WHY:** Silent-data-loss audit: the docs say `include_archived` defaults to false.
  Shows whether archived attributes are excluded by default. The current
  connector does not pass `include_archived` to `/data_attributes` either, so
  matching the old behaviour means not passing it here.

  **VERIFIED (2026-10-02):** the parameter is accepted; the response is identical to
  `Conversation Attributes / new endpoint 2.16` because the dev workspace has no
  archived conversation attributes.

  **UNVERIFIED:** whether the default excludes archived attributes. The dev
  workspace has no archived conversation attribute to show it.
