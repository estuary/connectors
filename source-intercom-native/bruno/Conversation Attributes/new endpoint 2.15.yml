docs: |-
  **REFERENCE:** [List all conversation attributes (2.16)](https://developers.intercom.com/docs/references/rest-api/api.intercom.io/conversations-attributes/listconversationattributes)

  **WHY:** Does the new endpoint exist before 2.16? If it works on every version the
  connector supports, a version gate is unnecessary.

  **LIMITATION (VERIFIED 2026-10-02):** 400 `intercom_version_invalid` ("Requested
  resource is not available in current API version"). The new endpoint can't be
  used on older versions, so the connector needs a version gate.
