docs: |-
  **REFERENCE:** [List all conversation attributes (2.16)](https://developers.intercom.com/docs/references/rest-api/api.intercom.io/conversations-attributes/listconversationattributes)

  **WHY:** Shape of the replacement endpoint on the version that needs it. Teaches the
  envelope field, whether it paginates, and the per-item field set compared with
  `Conversation Attributes / old endpoint 2.15`. Drives the connector's
  `response_field` and whether `snapshot_resources` is enough.

  **VERIFIED (2026-10-02):** `{type: "list", data: [...]}`, no pagination fields. Returns
  only the workspace's **custom** conversation attributes (2 in dev), not the 54
  built-ins that `/data_attributes?model=conversation` returns on 2.15 (see
  `Conversation Attributes / old endpoint 2.15`). Per-item `type` is
  `conversation_attribute`. Field set: `admin_id, archived, created_at, data_type,
  description, id, multiline, name, required, type, updated_at,
  visible_to_team_ids`. Gone compared with the old shape: `model, full_name, label,
  custom, api_writable, ui_writable, messenger_writable`.

  **UNVERIFIED:** `options` / `reference` (documented) not observed; the dev workspace has
  no list-type attribute.
