info:
  name: search sort descending 2.11
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/contacts/search"
  headers:
    - name: Intercom-Version
      value: "2.11"
  body:
    type: json
    data: |-
      {
        "query": { "field": "updated_at", "operator": ">", "value": 0 },
        "pagination": { "per_page": 1 },
        "sort": { "field": "updated_at", "order": "descending" }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - accepted (projection: id, updated_at)
    request:
      url: "{{base_url}}/contacts/search"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "type": "list",
            "data": [
              {
                "id": "67570a878b6e26fe4ce6a894",
                "updated_at": 1772633377
              }
            ],
            "total_count": 3,
            "pages": {
              "type": "pages",
              "next": {
                "page": 2,
                "starting_after": "WzE3NzI2MzMzNzcwMDAsIjY3NTcwYTg3OGI2ZTI2ZmU0Y2U2YTg5NCIsMl0="
              },
