docs: |-
  **REFERENCE:** [Search contacts (2.16)](https://developers.intercom.com/docs/references/rest-api/api.intercom.io/contacts/searchcontacts)

  Read-only search, but sent as POST. Run only with the user's consent.

  **WHY:** The fix candidate on the default version: if `descending` works on 2.11 too,
  the connector can send it on every version with no version gate.

  **VERIFIED (2026-10-02):** 200 on 2.11 too, with the same first page (identical
  `starting_after` token) as `Contacts / search sort descending 2.16`. The
  connector can send `descending` on every version; no version gate needed.
