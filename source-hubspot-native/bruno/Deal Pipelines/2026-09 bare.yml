docs: |-
  **REFERENCE:** [Retrieve all pipelines (2026-09)](https://developers.hubspot.com/docs/api-reference/latest/crm/pipelines/get-pipelines)

  **WHY:** the call `fetch_deal_pipelines` (`api/deal_pipelines.py`) makes after the
  migration off Pipelines V1. It answers whether the live response matches the
  2026-09 spec, whether it returns the same pipelines and stages as
  `Deal Pipelines / v1 bare`, and whether the existing scopes are enough.

  **VERIFIED (2026-10-19):** `200` with the connector's existing OAuth scopes, so no
  re-authorization is needed. Same wrapper (`{"results": [...]}`, no pagination) and the
  same pipeline and 7 stages as `Deal Pipelines / v1 bare`, with every value matching
  after renaming:
  - `pipelineId` → `id` (still `"default"`); `stageId` → `id` (same values).
  - `active: true` → `archived: false`, on the pipeline and on every stage. No
    `archivedAt`, since nothing is archived.
  - `objectType`, `objectTypeId` and `default` are absent.
  - Pipeline `createdAt` is `"1970-01-01T00:00:00Z"`, the same value the connector
    already emitted from V1's `0`.
  - Stage `createdAt`/`updatedAt` are ISO strings with milliseconds and `Z`
    (`"2025-04-03T12:58:52.529Z"`), each equal to the V1 epoch-ms value.
  - `metadata` is unchanged: `isClosed` and `probability`, both strings.
  - New on every stage: `writePermissions: "CRM_PERMISSIONS_ENFORCEMENT"`.
  - Stages come back sorted by `displayOrder` (0–6), unlike V1.

  **UNOBSERVABLE:** how several pipelines are ordered relative to each other. The test
  account has only the default pipeline, and creating another would change the
  capture snapshot's data. The order decides which `/_meta/row_id` each pipeline gets.
  That matters little, because every row is re-emitted at cutover. The
  [guide](https://developers.hubspot.com/docs/api-reference/latest/crm/pipelines/guide)
  defines `displayOrder` as the order pipelines are displayed in, with ties broken by
  label (DOCUMENTED 2026-10-16). It doesn't say the API returns results in that order;
  the stages observed here suggest it does.
