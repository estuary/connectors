info:
  name: v1 include deleted
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/crm-pipelines/v1/pipelines/deals?includeInactive=INCLUDE_DELETED"
  params:
    - name: includeInactive
      value: INCLUDE_DELETED
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - same pipeline, nothing deleted (projection - ids and active only)
    request:
      url: "{{base_url}}/crm-pipelines/v1/pipelines/deals?includeInactive=INCLUDE_DELETED"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "results": [
              {
                "pipelineId": "default",
                "active": true,
                "stages": [
                  {
                    "stageId": "appointmentscheduled",
                    "active": true
                  },
                  {
                    "stageId": "qualifiedtobuy",
                    "active": true
                  },
                  {
                    "stageId": "decisionmakerboughtin",
                    "active": true
                  },
                  {
                    "stageId": "contractsent",
                    "active": true
                  },
                  {
                    "stageId": "closedlost",
                    "active": true
                  },
                  {
                    "stageId": "closedwon",
                    "active": true
                  },
                  {
                    "stageId": "presentationscheduled",
                    "active": true
                  }
                ]
              }
            ]
          }

docs: |-
  **REFERENCE:** [Get pipelines (v1, legacy)](https://developers.hubspot.com/docs/api-reference/legacy/crm/pipelines/v1/get-pipelines)

  **WHY:** silent-data-loss audit of the old call. V1's `includeInactive` defaults to
  `EXCLUDE_DELETED`, and the binding never set it, so this shows what the old
  binding was leaving out. Compare it with `Deal Pipelines / 2026-09 archived param`
  to see whether the migration changes which pipelines are captured.

  **DOCUMENTED (2026-10-19):** "Whether or not to include inactive pipelines.
  Inactive pipelines and stages cannot be used when creating or updating objects."
  Values `EXCLUDE_DELETED | INCLUDE_DELETED`, default `EXCLUDE_DELETED`.

  **VERIFIED (2026-10-19):** with `INCLUDE_DELETED` the response is the same single
  pipeline and 7 stages as `Deal Pipelines / v1 bare`, all `active: true`. The test
  account has no deleted pipelines or stages.

  **UNOBSERVABLE:** what V1 returns for a deleted pipeline or stage on an account that
  has one. Producing one would mean deleting data in the test account, which this
  read-only collection doesn't do. The old binding sent no `includeInactive`, so it
  already excluded deleted pipelines, the same as the 2026-09 call (see
  `Deal Pipelines / 2026-09 archived param`).
