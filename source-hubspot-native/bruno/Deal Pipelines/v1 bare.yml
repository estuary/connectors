info:
  name: v1 bare
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/crm-pipelines/v1/pipelines/deals"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

