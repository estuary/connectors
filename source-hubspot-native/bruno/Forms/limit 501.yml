info:
  name: limit 501
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/marketing/v3/forms?limit=501&formTypes=all"
  params:
    - name: limit
      value: "501"
      type: query
    - name: formTypes
      value: all
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - limit 501 accepted (empty account, clamp unobservable)"
    request:
      url: "{{base_url}}/marketing/v3/forms?limit=501&formTypes=all"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "results": []
          }

docs: |-
  **REFERENCE:** [Get a list of forms (v3, legacy)](https://developers.hubspot.com/docs/api-reference/legacy/marketing/forms/get-forms)

  **WHY:** `+1` probe on the connector's `limit=500`. The reference page documents no
  maximum (DOCUMENTED 2026-10-20), so this checks whether 500 is a server ceiling.
  Otherwise identical to `Forms / bare`.

  **VERIFIED (2026-10-20):** `200`, `{"results": []}`. `limit=501` is **not rejected**.

  **UNOBSERVABLE:** whether 501 is served in full or clamped. Telling them apart needs
  more than 500 forms, and the account has none. Either way the connector loses nothing:
  it follows `paging.next.after` until it's absent.
