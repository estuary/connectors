info:
  name: archived audit
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/crm/v3/schemas?archived=true"
  params:
    - name: archived
      value: "true"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - no archived schemas"
    request:
      url: "{{base_url}}/crm/v3/schemas?archived=true"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "results": []
          }

docs: |-
  **REFERENCE:** [Retrieve all custom object schemas](https://developers.hubspot.com/docs/api-reference/legacy/crm/objects/schemas/get-schemas)

  **WHY:** silent-data-loss audit. The connector sends no `archived`, and also drops
  schemas with `archived: true` itself, so an archived custom object never becomes a
  binding.

  **DOCUMENTED (2026-10-20):** `archived` is "Whether to return only results that have been
  archived", default `false`.

  **VERIFIED (2026-10-20):** `archived=true` returns `200` with `{"results": []}`. The account
  has no archived custom objects either.
