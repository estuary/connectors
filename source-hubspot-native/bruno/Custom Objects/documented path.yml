info:
  name: documented path
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/crm-object-schemas/v3/schemas"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - no custom object schemas"
    request:
      url: "{{base_url}}/crm-object-schemas/v3/schemas"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "results": []
          }

docs: |-
  **REFERENCE:** [Retrieve all custom object schemas](https://developers.hubspot.com/docs/api-reference/legacy/crm/objects/schemas/get-schemas)

  **WHY:** compares the documented path with the connector's `/crm/v3/schemas` (see
  `Custom Objects / bare`), to know whether moving to the documented path changes
  anything.

  **DOCUMENTED (2026-10-20):** "To retrieve all custom object schemas, make a `GET` request to
  `/crm-object-schemas/v3/schemas`." ([schemas guide](https://developers.hubspot.com/docs/api-reference/legacy/crm/objects/schemas/guide))

  **VERIFIED (2026-10-20):** `200` with `{"results": []}`, the same as `Custom Objects / bare`.
  With no schemas on the account, "the same" only shows that both paths resolve and
  authorize identically.
