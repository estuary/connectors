info:
  name: search lastmodifieddate replacement
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/crm/objects/2026-03/contacts/search"
  body:
    type: json
    data: |-
      {
        "filterGroups": [
          {
            "filters": [
              {
                "propertyName": "lastmodifieddate",
                "operator": "GT",
                "value": "2020-01-01T00:00:00.000000Z"
              }
            ]
          }
        ],
        "sorts": [{"propertyName": "lastmodifieddate", "direction": "ASCENDING"}],
        "limit": 200
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Pin the newest contact (last result of the ascending sort) for
        // `Contacts / search GT boundary probe`.
        const results = res.getBody()?.results || [];
        const newest = results[results.length - 1];
        if (res.getStatus() === 200 && newest) {
          bru.setVar('pin_contact_id', String(newest.id));
          bru.setVar('pin_contact_lastmodifieddate', newest.properties.lastmodifieddate);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - total 3, newest modified 2026-06-03 (projection - first item full, rest id and lastmodifieddate)"
    request:
      url: "{{base_url}}/crm/objects/2026-03/contacts/search"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "total": 3,
            "results": [
              {
                "id": "72810357568",
                "properties": {
                  "createdate": "2024-10-28T16:39:00.846Z",
                  "email": "emailmaria@hubspot.com",
                  "firstname": "Maria",
                  "hs_object_id": "72810357568",
                  "lastmodifieddate": "2024-10-28T16:40:17.996Z",
                  "lastname": "Johnson (Sample Contact)"
                },
                "createdAt": "2024-10-28T16:39:00.846Z",
                "updatedAt": "2024-10-28T16:40:17.996Z",
                "archived": false,
                "url": "REDACTED"
              },
              {
                "id": "72811506244",
                "properties": {
                  "lastmodifieddate": "2024-10-28T16:40:20.553Z"
                },
                "updatedAt": "2024-10-28T16:40:20.553Z"
              },
              {
                "id": "225877317544",
                "properties": {
                  "lastmodifieddate": "2026-06-03T01:33:01.284Z"
                },
                "updatedAt": "2026-06-03T01:33:01.284Z"
              }
            ]
          }

docs: |-
  **REFERENCE:** [Search for contacts (2026-03)](https://developers.hubspot.com/docs/api-reference/2026-03/crm/objects/contacts/search/search-contacts)

  **WHY:** the replacement HubSpot names for `Contacts / v1 recently updated bare`.
  The [V1 Lists API migration guide](https://developers.hubspot.com/docs/api-reference/legacy/crm/lists/v1-list-api-migration-guide)
  says to "filter by `lastmodifieddate`" with a search, and its example uses the `GT`
  operator. The body here is that filter with the sort and page size the connector's
  own search (`_request_search_page` in `api/search_objects.py`) already sends for the
  delayed `contacts` subtask. The window is wide, so the ascending sort ends on the
  newest contact. That shows whether any contact changed inside V1's 30-day lookback,
  which decides whether V1's empty answer is honest. Its after-response script pins
  the newest contact for `Contacts / search GT boundary probe`.

  **DOCUMENTED (2026-10-20):** `limit` is "up to 200 objects"; the
  [search guide](https://developers.hubspot.com/docs/api-reference/search/guide) says
  "The search endpoints are rate limited to five requests per second per account",
  "limited to 10,000 total results for any given query", and "It may take a few
  moments for newly created or updated CRM objects to appear in search results."

  **VERIFIED (2026-10-20):** `200` on the date-versioned path with the connector's
  existing scopes. `total: 3`, in ascending `lastmodifieddate` order. With no
  `properties` in the body, each contact carries the defaults: `createdate`, `email`,
  `firstname`, `hs_object_id`, `lastmodifieddate`, `lastname`. `lastmodifieddate`
  equals the record's top-level `updatedAt`, at millisecond precision with `Z`
  (`2026-06-03T01:33:01.284Z`). The request value is written with microseconds, the
  way the connector's `dt_to_str` writes it, and is accepted. The newest contact was
  modified 2026-06-03, so no contact changed in the 30 days before this run.

  **LIMITATION (DOCUMENTED 2026-10-20):** a realtime subtask moved onto search inherits
  search's limits: 5 requests/second per account, shared with the delayed subtasks
  of every CRM binding; 10,000 results per query; and an indexing delay before a
  change is searchable. The delay means a realtime search must trail "now", or it will
  checkpoint past changes that aren't indexed yet.
