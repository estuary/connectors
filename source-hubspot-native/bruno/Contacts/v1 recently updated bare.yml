info:
  name: v1 recently updated bare
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/contacts/v1/lists/recently_updated/contacts/recent?count=1"
  params:
    - name: count
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - endpoint still live, empty list (no contact modified in the last 30 days)"
    request:
      url: "{{base_url}}/contacts/v1/lists/recently_updated/contacts/recent?count=1"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "contacts": [],
            "has-more": false,
            "vid-offset": 0,
            "time-offset": 0
          }

docs: |-
  **REFERENCE:** none live. HubSpot's reference page for this endpoint is gone: the
  legacy URL checked,
  https://developers.hubspot.com/docs/api-reference/legacy/crm/objects/contacts/v1/get-recently-updated-contacts,
  returns 404. The sunset is stated in the
  [V1 Lists API migration guide](https://developers.hubspot.com/docs/api-reference/legacy/crm/lists/v1-list-api-migration-guide).

  **WHY:** the first call `fetch_recent_contacts` (`api/contacts.py`) makes on every
  realtime poll of the `contacts` binding (`count=1`; later pages send `count=100`
  and `timeOffset`). It answers whether the endpoint the realtime subtask depends on
  still exists.

  **DOCUMENTED (2026-10-20):** the migration guide says "The v1 contact lists API was
  sunset on April 30th, 2026", and that this endpoint returns a 404 from that date.
  Its named replacement is a CRM search filtered on `lastmodifieddate` with `GT`
  (see `Contacts / search lastmodifieddate replacement`).

  **VERIFIED (2026-10-20):** the endpoint is **not** retired. It answers `200` with
  the legacy envelope, `{"contacts": [], "has-more": false, "vid-offset": 0,
  "time-offset": 0}`, almost six months after the announced 404 date. The connector's
  existing scopes still reach it.

  **UNOBSERVABLE:** whether the empty list is honest. The newest contact in the test
  account was last modified on 2026-06-03 (`Contacts / search lastmodifieddate
  replacement`), outside the 30-day lookback the connector's code comment gives for
  this endpoint, so a working endpoint would also return nothing. Telling a working
  endpoint from a stub that always answers empty needs a contact modified in the
  last 30 days, which means editing test-account data. `Contacts / v1 count 101
  probe` doesn't settle it either. The assumption is that the endpoint still serves
  data. If it is a stub, the realtime `contacts` subtask emits nothing and contacts
  arrive only through the delayed search subtask, `DELAYED_LAG` (1 hour) late.

  **LIMITATION (DOCUMENTED 2026-10-20):** HubSpot has announced this endpoint as
  retired, so it can start returning 404 at any time. The CDK raises 4xx responses as
  `HTTPError`, and nothing on the realtime path catches it, so the realtime `contacts`
  subtask would fail rather than fall back. The replacement is the search in
  `Contacts / search lastmodifieddate replacement`.
