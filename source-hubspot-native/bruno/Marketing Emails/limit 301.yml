info:
  name: limit 301
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/marketing/v3/emails?limit=301&sort=updatedAt&updatedAfter=1970-01-01T00:00:01.000000Z&updatedBefore=2026-10-20T00:00:00.000000Z&archived=false&includeStats=true"
  params:
    - name: limit
      value: "301"
      type: query
    - name: sort
      value: updatedAt
      type: query
    - name: updatedAfter
      value: 1970-01-01T00:00:01.000000Z
      type: query
    - name: updatedBefore
      value: 2026-10-20T00:00:00.000000Z
      type: query
    - name: archived
      value: "false"
      type: query
    - name: includeStats
      value: "true"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - limit 301 accepted (empty account, clamp unobservable)"
    request:
      url: "{{base_url}}/marketing/v3/emails?limit=301&sort=updatedAt&updatedAfter=1970-01-01T00:00:01.000000Z&updatedBefore=2026-10-20T00:00:00.000000Z&archived=false&includeStats=true"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "total": 0,
            "results": []
          }

docs: |-
  **REFERENCE:** [Get all marketing emails (v3, legacy)](https://developers.hubspot.com/docs/api-reference/legacy/marketing/marketing-emails/get-emails)

  **WHY:** `+1` probe on `MARKETING_EMAILS_PAGE_SIZE = 300`. Neither the v3 page nor the
  [2026-09
  page](https://developers.hubspot.com/docs/api-reference/latest/marketing/marketing-emails/get-emails)
  states a maximum for `limit` (DOCUMENTED 2026-10-20), so this checks whether 300 is a
  server ceiling. Otherwise identical to `Marketing Emails / bare`.

  **VERIFIED (2026-10-20):** `200`, `{"total": 0, "results": []}`. `limit=301` is **not
  rejected**.

  **UNOBSERVABLE:** whether 301 is served in full or clamped. Telling them apart needs
  more than 300 emails, and the account has none. Either way the connector loses
  nothing: it follows `paging.next.after` until it's absent and never treats a short
  page as the end.
