info:
  name: bare
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/marketing/v3/emails?limit=300&sort=updatedAt&updatedAfter=1970-01-01T00:00:01.000000Z&updatedBefore=2026-10-20T00:00:00.000000Z&archived=false&includeStats=true"
  params:
    - name: limit
      value: "300"
      type: query
    - name: sort
      value: updatedAt
      type: query
    - name: updatedAfter
      value: 1970-01-01T00:00:01.000000Z
      type: query
    - name: updatedBefore
      value: 2026-10-20T00:00:00.000000Z
      type: query
    - name: archived
      value: "false"
      type: query
    - name: includeStats
      value: "true"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - empty, total 0"
    request:
      url: "{{base_url}}/marketing/v3/emails?limit=300&sort=updatedAt&updatedAfter=1970-01-01T00:00:01.000000Z&updatedBefore=2026-10-20T00:00:00.000000Z&archived=false&includeStats=true"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "total": 0,
            "results": []
          }

docs: |-
  **REFERENCE:** [Get all marketing emails (v3, legacy)](https://developers.hubspot.com/docs/api-reference/legacy/marketing/marketing-emails/get-emails)

  **WHY:** the connector's first pass. `_fetch_marketing_emails_updated_between`
  (`api/marketing_emails.py`) makes four passes over each time window: `archived`
  `false` then `true`, each with `includeStats` `true` then `false`, de-duplicating by
  email id. Every pass sends `limit=300`, `sort=updatedAt`, and
  `updatedAfter`/`updatedBefore` formatted by `dt_to_str` (microseconds, `Z`). The
  window used here, `1970-01-01T00:00:01.000000Z` to `2026-10-20T00:00:00.000000Z`, is
  the backfill's (`fetch_marketing_emails_page` starts at `EPOCH_PLUS_ONE_SECOND`). The
  discovery access check makes the same call with a window starting now. This answers
  whether the scope is granted and what the envelope looks like, and checks that the
  microsecond timestamps are accepted.

  **DOCUMENTED (2026-10-20):** the v3 page lists every parameter without a description
  or default, and the scopes `marketing.email.read`, `marketing.email.write` and
  `content`. The connector has `content` (optional). The [2026-09
  page](https://developers.hubspot.com/docs/api-reference/latest/marketing/marketing-emails/get-emails)
  describes `updatedAfter` as "Filter emails updated after a specific date." and
  `updatedBefore` as "Filter emails updated before a specific date." Neither says
  whether its bound is inclusive.

  **VERIFIED (2026-10-20):** `200`, `{"total": 0, "results": []}`, with no `paging`. The
  `content` scope is enough, and the microsecond, `Z`-suffixed timestamps are accepted.
  The account has no marketing emails at all: `Marketing Emails / unfiltered control`
  and `Marketing Emails / archived true` are empty too.

  **UNOBSERVABLE:** everything that needs an email to exist. The test account has none,
  and this collection creates none.
  - The per-email shape. The `MarketingEmail` model needs only `id` and `updatedAt`.
  - Whether the bounds are exclusive, as the connector's code comment says. If both are,
    an email whose `updatedAt` equals a window seam exactly falls into neither the
    window ending there nor the one starting there.
  - The `includeStats=true` bug the connector works around (its comment says some emails
    are left out). The two-pass, de-duplicated sweep doesn't depend on it.
  - Whether `sort=updatedAt` is honored. The connector doesn't rely on order: it follows
    `paging.next.after` to the end of every pass.
