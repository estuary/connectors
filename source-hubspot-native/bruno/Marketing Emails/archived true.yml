examples:
  - name: "200 - empty, no archived emails"
    request:
      url: "{{base_url}}/marketing/v3/emails?limit=300&sort=updatedAt&updatedAfter=1970-01-01T00:00:01.000000Z&updatedBefore=2026-10-20T00:00:00.000000Z&archived=true&includeStats=true"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "total": 0,
            "results": []
          }

docs: |-
  **REFERENCE:** [Get all marketing emails (v3, legacy)](https://developers.hubspot.com/docs/api-reference/legacy/marketing/marketing-emails/get-emails)

  **WHY:** silent-data-loss audit. This is the connector's third pass (`archived=true`,
  `includeStats=true`); see `Marketing Emails / bare` for all four. It shows whether
  archived emails are reachable and whether `archived=true` returns only archived ones,
  which is what makes the separate archived passes necessary.

  **DOCUMENTED (2026-10-20):** the v3 page lists `archived` (boolean) with no
  description or default. The [2026-09
  page](https://developers.hubspot.com/docs/api-reference/latest/marketing/marketing-emails/get-emails)
  says: "Whether to return only results that have been archived."

  **VERIFIED (2026-10-20):** `200`, `{"total": 0, "results": []}`. The parameter is
  accepted, and the account has no archived emails.

  **UNOBSERVABLE:** whether v3 also treats `archived=true` as "only archived", and
  whether the default leaves archived emails out. Archiving an email would change the
  test account. The connector sends both values explicitly and de-duplicates by id, so
  it covers both partitions whatever the default is.
