http:
  method: GET
  url: "{{base_url}}/marketing/v3/emails?limit=300&sort=updatedAt&updatedAfter=1970-01-01T00:00:01.000000Z&updatedBefore=2026-10-20T00:00:00.000000Z&archived=true&includeStats=true"
  params:
    - name: limit
      value: "300"
      type: query
    - name: sort
      value: updatedAt
      type: query
    - name: updatedAfter
      value: 1970-01-01T00:00:01.000000Z
      type: query
    - name: updatedBefore
      value: 2026-10-20T00:00:00.000000Z
      type: query
