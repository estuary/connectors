info:
  name: archived audit
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/crm/v3/objects/products?limit=100&archived=true&properties=hs_lastmodifieddate"
  params:
    - name: limit
      value: "100"
      type: query
    - name: archived
      value: "true"
      type: query
    - name: properties
      value: hs_lastmodifieddate
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - no archived products"
    request:
      url: "{{base_url}}/crm/v3/objects/products?limit=100&archived=true&properties=hs_lastmodifieddate"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "results": []
          }

docs: |-
  **REFERENCE:** [Retrieve products](https://developers.hubspot.com/docs/api-reference/legacy/crm/objects/products/get-products)

  **WHY:** silent-data-loss audit, as `_crm-objects / list archived audit` does for
  contacts. An empty list of live products could still be hiding archived ones.

  **VERIFIED (2026-10-20):** `archived=true` returns `200` with `{"results": []}`. The account
  has no archived products either.
