info:
  name: access check
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/crm/v3/objects/products?limit=1"
  params:
    - name: limit
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - readable, no products"
    request:
      url: "{{base_url}}/crm/v3/objects/products?limit=1"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "results": []
          }

docs: |-
  **REFERENCE:** [Retrieve products](https://developers.hubspot.com/docs/api-reference/legacy/crm/objects/products/get-products)

  **WHY:** `check_products_access` (`api/products.py`). Discovery makes this call with
  `limit=1` and drops the `products` binding when HubSpot answers with a missing-scope
  `403` (`_remove_permission_blocked_resources` in `resources.py`). The connector
  treats `products` as needing the optional `e-commerce` scope (`optional_scopes` in
  `models.py`).

  **DOCUMENTED (2026-10-20):** `limit` defaults to 10 and `archived` to `false`. The endpoint
  is available on the free tier. The page lists no scope.

  **VERIFIED (2026-10-20):** `200` with `{"results": []}` and no `paging`. The test token can
  read products, so discovery keeps the binding, and the account has no products.

  **UNOBSERVABLE:** the `403` that a token without the scope gets, and whether its
  wording matches `MISSING_SCOPE_REGEX`. Seeing it needs a second app install without
  the scope. If the wording didn't match, discovery would fail instead of dropping the
  binding. `tests/test_missing_scope_error.py` covers the wordings seen so far.
