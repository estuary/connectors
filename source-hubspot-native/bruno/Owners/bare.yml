info:
  name: bare
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/crm/v3/owners?limit=500"
  params:
    - name: limit
      value: "500"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - 4 owners, no paging (projection - first of 4 results)"
    request:
      url: "{{base_url}}/crm/v3/owners?limit=500"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "results": [
              {
                "id": "12236123",
                "email": "dave@estuary.dev",
                "type": "PERSON",
                "firstName": "David",
                "lastName": "Yaffe",
                "userId": 12236123,
                "userIdIncludingInactive": 12236123,
                "createdAt": "2026-08-17T22:37:32.256Z",
                "updatedAt": "2026-08-17T22:37:32.256Z",
                "archived": false
              }
            ]
          }

docs: |-
  **REFERENCE:** [Retrieve all owners](https://developers.hubspot.com/docs/api-reference/legacy/crm/owners/get-owners)

  **WHY:** the call `fetch_owners` (`api/owners.py`) makes for the `owners` snapshot,
  every 5 minutes: `limit=500`, then `after` from each page until `paging` is absent.

  **DOCUMENTED (2026-10-20):** `limit` defaults to 100 and has no stated maximum. `archived`
  defaults to `false`. Owners have a `teams` array. The scope is any one of
  `crm.objects.owners.read`, `automation`, `crm.pipelines.approval.read` or
  `crm.pipelines.governance.write`; the connector requires
  `crm.objects.owners.read`.

  **VERIFIED (2026-10-20):** `200` with 4 owners on one page and no `paging`. Each owner has
  `id` (a string), `email`, `type: "PERSON"`, `firstName`, `lastName`, `userId`,
  `userIdIncludingInactive`, `createdAt`, `updatedAt` and `archived: false`, but **no
  `teams` key**. For one owner, `id` (`904875188`) differs from `userId`
  (`73074756`), as the [owners guide](https://developers.hubspot.com/docs/api-reference/legacy/crm/owners/guide) explains; for the other three they're equal.

  **UNOBSERVABLE:** what `teams` looks like. No test-account owner returns it, and
  adding a team would change the test account. Schema inference will add the field
  when it first appears.
