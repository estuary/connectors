info:
  name: list limit 1 page 2
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/crm/v3/objects/contacts?limit=1&properties=lastmodifieddate&after={{crm_list_after}}"
  params:
    - name: limit
      value: "1"
      type: query
    - name: properties
      value: lastmodifieddate
      type: query
    - name: after
      value: "{{crm_list_after}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Set by `_crm-objects / list limit 1 paging`; fall back to the cursor it
        // returned on 2026-10-20 when that request hasn't run in this session.
        if (!bru.getVar('crm_list_after')) bru.setVar('crm_list_after', '72810357569');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - resumes at the next id (projection - id, cursor and paging)"
    request:
      url: "{{base_url}}/crm/v3/objects/contacts?limit=1&properties=lastmodifieddate&after=72810357569"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "results": [
              {
                "id": "72811506244",
                "properties": {
                  "lastmodifieddate": "2024-10-28T16:40:20.553Z"
                },
                "updatedAt": "2024-10-28T16:40:20.553Z"
              }
            ],
            "paging": {
              "next": {
                "after": "72811506245",
                "link": "https://api.hubapi.com/crm/objects/v3/contacts?limit=1&after=72811506245&properties=lastmodifieddate"
              }
            }
          }

docs: |-
  **REFERENCE:** [Retrieve contacts](https://developers.hubspot.com/docs/api-reference/legacy/crm/objects/contacts/get-contacts)

  **WHY:** the second half of the paging walk. It sends the `after` that
  `_crm-objects / list limit 1 paging` returned, to check that the token resumes where
  page 1 stopped, without skipping or repeating a record. Run
  `_crm-objects / list limit 1 paging` first in a fresh session; otherwise the
  before-request script falls back to the token it returned on 2026-10-20 (`72810357569`).

  **VERIFIED (2026-10-20):** the page holds `72811506244`, the next id in
  `_crm-objects / list bare`, and a new `after` of `"72811506245"`, again the last id
  plus one. No record was skipped or repeated.
