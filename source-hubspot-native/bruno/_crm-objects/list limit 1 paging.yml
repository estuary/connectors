info:
  name: list limit 1 paging
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/crm/v3/objects/contacts?limit=1&properties=lastmodifieddate"
  params:
    - name: limit
      value: "1"
      type: query
    - name: properties
      value: lastmodifieddate
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Pin the paging cursor for `_crm-objects / list limit 1 page 2`.
        const after = res.getBody()?.paging?.next?.after;
        if (after) bru.setVar('crm_list_after', String(after));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - after is last id plus 1 (projection - id, cursor and paging)"
    request:
      url: "{{base_url}}/crm/v3/objects/contacts?limit=1&properties=lastmodifieddate"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "results": [
              {
                "id": "72810357568",
                "properties": {
                  "lastmodifieddate": "2024-10-28T16:40:17.996Z"
                },
                "updatedAt": "2024-10-28T16:40:17.996Z"
              }
            ],
            "paging": {
              "next": {
                "after": "72810357569",
                "link": "https://api.hubapi.com/crm/objects/v3/contacts?limit=1&properties=lastmodifieddate&after=72810357569"
              }
            }
          }

docs: |-
  **REFERENCE:** [Retrieve contacts](https://developers.hubspot.com/docs/api-reference/legacy/crm/objects/contacts/get-contacts)

  **WHY:** the backfill checkpoints `paging.next.after` as its page cursor
  (`fetch_page_with_associations` yields it after each page), so the token has to
  survive a restart. One record per page forces a `paging` block on a three-record
  account and shows what the token is made of. Its after-response script pins the token
  for `_crm-objects / list limit 1 page 2`.

  **DOCUMENTED (2026-10-20):** `after` is "The paging cursor token of the last successfully
  read resource will be returned as the `paging.next.after`".

  **VERIFIED (2026-10-20):**
  - `paging.next.after` is `"72810357569"`: the returned contact's `id`
    (`72810357568`) plus one. With records in ascending `id` order (see
    `_crm-objects / list bare`), the token is an id bound derived from the data, not a
    server-side session that could expire. `_crm-objects / list limit 1 page 2` shows
    it resumes at the next id.
  - `paging.next.link` points at `/crm/objects/v3/contacts?...`, with the path segments
    in a different order from the request. The connector ignores `link`.
  - Asked only for `lastmodifieddate`, the record also carries `createdate` and
    `hs_object_id`. Those two come back whatever `properties` says.
