info:
  name: search companies default properties
  type: http
  seq: 17

http:
  method: POST
  url: "{{base_url}}/crm/v3/objects/companies/search"
  body:
    type: json
    data: |-
      {
        "filters": [
          {
            "propertyName": "hs_lastmodifieddate",
            "operator": "BETWEEN",
            "value": "1970-01-01T00:00:01.000000Z",
            "highValue": "2026-10-20T00:00:00.000000Z"
          }
        ],
        "sorts": [{"propertyName": "hs_lastmodifieddate", "direction": "ASCENDING"}],
        "limit": 200
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - one company, hs_lastmodifieddate returned by default"
    request:
      url: "{{base_url}}/crm/v3/objects/companies/search"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "total": 1,
            "results": [
              {
                "id": "25177527565",
                "properties": {
                  "createdate": "2024-10-28T16:39:01.173Z",
                  "domain": "hubspot.com",
                  "hs_lastmodifieddate": "2025-01-18T21:49:41.259Z",
                  "hs_object_id": "25177527565",
                  "name": "HubSpot"
                },
                "createdAt": "2024-10-28T16:39:01.173Z",
                "updatedAt": "2025-01-18T21:49:41.259Z",
                "archived": false,
                "url": "REDACTED"
              }
            ]
          }

docs: |-
  **REFERENCE:** [Search records](https://developers.hubspot.com/docs/api-reference/legacy/crm/objects/objects/search/search-objects)

  **WHY:** every searched object except contacts filters and sorts on
  `hs_lastmodifieddate`. That covers companies, deals, tickets, products, line items,
  goals, leads, orders, feedback submissions and custom objects. The search body asks
  for no `properties`, so `CustomObjectSearchResult` only works if
  `hs_lastmodifieddate` comes back by default. Products and line items are empty on
  this account (`Products / search window`, `Line Items / search window`), so the
  single sample company stands in. The body is the connector's, with the window
  opened from `EPOCH_PLUS_ONE_SECOND`.

  **DOCUMENTED (2026-10-20):** the [search guide](https://developers.hubspot.com/docs/api-reference/legacy/crm/search-the-crm) lists companies' defaults as "name, domain,
  createdate, hs_lastmodifieddate, hs_object_id".

  **VERIFIED (2026-10-20):** `200`, `total: 1`: company `25177527565` with exactly those five
  properties. `hs_lastmodifieddate` (`2025-01-18T21:49:41.259Z`) equals `updatedAt`.

  **UNOBSERVABLE:** whether products, line items and custom objects also return
  `hs_lastmodifieddate` by default. None exist in the test account. If one didn't,
  `CustomObjectSearchResult` would fail validation loudly rather than lose records
  silently.
