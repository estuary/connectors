info:
  name: list limit 101 probe
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/crm/v3/objects/contacts?limit=101&properties=lastmodifieddate"
  params:
    - name: limit
      value: "101"
      type: query
    - name: properties
      value: lastmodifieddate
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "400 - limit 101 rejected"
    request:
      url: "{{base_url}}/crm/v3/objects/contacts?limit=101&properties=lastmodifieddate"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "error",
            "message": "You can only request at most 100 objects in one request.",
            "correlationId": "01a15b8c-e8c2-7ee1-ae69-50758620c34d",
            "context": {
              "limit": [
                "101"
              ]
            },
            "category": "VALIDATION_ERROR"
          }

docs: |-
  **REFERENCE:** [Retrieve contacts](https://developers.hubspot.com/docs/api-reference/legacy/crm/objects/contacts/get-contacts)

  **WHY:** the connector sends `limit=100` on every backfill page without history
  capture. One past it shows how the maximum is enforced: rejected, clamped, or
  silently truncated.

  **DOCUMENTED (2026-10-20):** the reference gives a default of 10 and no maximum. The
  [contacts guide](https://developers.hubspot.com/docs/api-reference/legacy/crm/objects/contacts/guide)
  says "You can retrieve up to 100 contacts in one request."

  **LIMITATION (VERIFIED 2026-10-20):** `limit=101` is **rejected** with
  `400 VALIDATION_ERROR`, "You can only request at most 100 objects in one request."
  Nothing is clamped or truncated, so the page size must stay at or below 100. The
  connector's 100 is exactly the maximum.
