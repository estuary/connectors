examples:
  - name: "400 - 101 inputs rejected"
    request:
      url: "{{base_url}}/crm/v3/objects/contacts/batch/read"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "error",
            "message": "The maximum number of inputs supported in a batch is 100. Please reduce the number of items and try again",
            "correlationId": "01a15b8d-98f6-72ea-8760-140cda0cf276",
            "category": "VALIDATION_ERROR"
          }

docs: |-
  **REFERENCE:** [Retrieve a batch of contacts](https://developers.hubspot.com/docs/api-reference/legacy/crm/objects/contacts/batch/get-contacts)

  **WHY:** one past the 100 ids the connector puts in each batch read without history
  (`itertools.batched` in `_emit_batches`). After the three real contacts, the ids are
  placeholders `1` to `98`, because only the count matters for the limit.

  **DOCUMENTED (2026-10-20):** "Object API batch endpoints are limited to 100 inputs per
  request." ([Using object APIs](https://developers.hubspot.com/docs/api-reference/legacy/crm/using-object-apis))

  **LIMITATION (VERIFIED 2026-10-20):** 101 inputs are **rejected** with
  `400 VALIDATION_ERROR`, "The maximum number of inputs supported in a batch is 100.
  Please reduce the number of items and try again". Nothing is read, so an oversized
  batch fails as a whole. The connector's 100 is exactly the maximum.
