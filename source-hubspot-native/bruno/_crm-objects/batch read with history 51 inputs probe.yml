examples:
  - name: "400 - 51 inputs with history rejected"
    request:
      url: "{{base_url}}/crm/v3/objects/contacts/batch/read"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "error",
            "message": "The maximum number of inputs supported in a batch request for property histories is 50. Please reduce the number of items and try again",
            "correlationId": "01a15b93-70a6-7def-b1e1-9f416665955a",
            "category": "VALIDATION_ERROR"
          }

docs: |-
  **REFERENCE:** [Retrieve a batch of contacts](https://developers.hubspot.com/docs/api-reference/legacy/crm/objects/contacts/batch/get-contacts)

  **WHY:** with `capturePropertyHistory` on, the connector sends both `properties` and
  `propertiesWithHistory` and cuts each batch to 50 ids. One past that shows whether
  the batch endpoint enforces the same lower ceiling as
  `_crm-objects / list with history limit 51 probe`. After the three real contacts,
  the ids are placeholders `1` to `48`.

  **DOCUMENTED (2026-10-20):** the batch reference and the object API guide give only the
  general 100-input limit. Neither mentions a lower one for history.

  **LIMITATION (VERIFIED 2026-10-20):** 51 inputs with `propertiesWithHistory` are
  **rejected** with `400 VALIDATION_ERROR`, "The maximum number of inputs supported in
  a batch request for property histories is 50. Please reduce the number of items and
  try again". The limit is undocumented. The connector's 50 is exactly the maximum.
