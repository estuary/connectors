info:
  name: list archived audit
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/crm/v3/objects/contacts?limit=100&archived=true&properties=lastmodifieddate"
  params:
    - name: limit
      value: "100"
      type: query
    - name: archived
      value: "true"
      type: query
    - name: properties
      value: lastmodifieddate
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - no archived contacts"
    request:
      url: "{{base_url}}/crm/v3/objects/contacts?limit=100&archived=true&properties=lastmodifieddate"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "results": []
          }

docs: |-
  **REFERENCE:** [Retrieve contacts](https://developers.hubspot.com/docs/api-reference/legacy/crm/objects/contacts/get-contacts)

  **WHY:** silent-data-loss audit. `archived` defaults to `false` and the connector
  never sends it, on the backfill list or on batch reads, and search never returns
  archived records. This shows whether the test account hides any archived contacts,
  and records the request shape that would reach them.

  **DOCUMENTED (2026-10-20):** `archived` is "Whether to return only results that have been
  archived", boolean, default `false`. So `true` switches to the archived partition; it
  doesn't add it. The [search guide](https://developers.hubspot.com/docs/api-reference/legacy/crm/search-the-crm) says "Archived CRM objects won't appear in any
  search results."

  **VERIFIED (2026-10-20):** `archived=true` returns `200` with an empty `results` and no
  `paging`. The request shape is accepted, and the test account has no archived
  contacts.

  **LIMITATION (DOCUMENTED 2026-10-20):** every v3 object read the connector makes (this list,
  `batch/read` and search) excludes archived records, so a record archived (deleted) in
  HubSpot is neither backfilled nor emitted as a deletion. Capturing deletions would
  need a separate `archived=true` sweep.

  **UNOBSERVABLE:** what an archived record looks like on this endpoint. Producing one
  means deleting a contact in the test account, which this read-only collection doesn't
  do. `Products / archived audit` and `Line Items / archived audit` are empty too.
