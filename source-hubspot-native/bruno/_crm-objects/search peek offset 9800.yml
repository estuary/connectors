info:
  name: search peek offset 9800
  type: http
  seq: 15

http:
  method: POST
  url: "{{base_url}}/crm/v3/objects/contacts/search"
  body:
    type: json
    data: |-
      {
        "filters": [
          {
            "propertyName": "lastmodifieddate",
            "operator": "BETWEEN",
            "value": "2024-10-28T16:40:18.000000Z",
            "highValue": "2026-10-20T00:00:00.000000Z"
          }
        ],
        "sorts": [{"propertyName": "lastmodifieddate", "direction": "ASCENDING"}],
        "limit": 200,
        "after": 9800
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - offset 9800 accepted, empty page"
    request:
      url: "{{base_url}}/crm/v3/objects/contacts/search"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "total": 2,
            "results": []
          }

docs: |-
  **REFERENCE:** [Search for contacts](https://developers.hubspot.com/docs/api-reference/legacy/crm/objects/contacts/search/search-contacts)

  **WHY:** when a window holds more than 10,000 records, `fetch_search_objects` peeks
  at `after: 9800` (`PEEK_OFFSET`), the last page the cap allows, to find where the cap
  falls in time. This checks that HubSpot accepts that offset, even on a small window.

  **DOCUMENTED (2026-10-20):** "The search endpoints are limited to 10,000 total results for
  any given query. Attempting to page beyond 10,000 will result in a 400 error."
  ([search guide](https://developers.hubspot.com/docs/api-reference/legacy/crm/search-the-crm))

  **VERIFIED (2026-10-20):** `200`, `total: 2`, empty `results` and no `paging`. Offset 9,800
  with `limit: 200` (results 9,801 to 10,000) is accepted. An offset past the end
  returns an empty page, which `_choose_chunk_end` reads as `FITS`.
