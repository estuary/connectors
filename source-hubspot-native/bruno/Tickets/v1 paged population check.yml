info:
  name: v1 paged population check
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/crm-objects/v1/objects/tickets/paged?properties=hs_lastmodifieddate"
  params:
    - name: properties
      value: hs_lastmodifieddate
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - no tickets in the account"
    request:
      url: "{{base_url}}/crm-objects/v1/objects/tickets/paged?properties=hs_lastmodifieddate"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "objects": [],
            "hasMore": false,
            "offset": 0
          }

docs: |-
  **REFERENCE:** [Get all tickets (v1, legacy)](https://developers.hubspot.com/docs/api-reference/legacy/crm/objects/tickets/v1/get-crm-objects-v1-objects-tickets-paged)

  **WHY:** population check for `Tickets / change-log bare`. An empty change log means
  little unless the account is known to hold no tickets. This uses the legacy list
  rather than the v3 tickets list. The collection's v3 list probes
  (`_crm-objects / list bare` and its siblings) run against `contacts` only, so the v3
  tickets call behind `check_tickets_access` (`api/tickets.py`) isn't probed here.

  **DOCUMENTED (2026-10-20):** the page says you can "get specific properties in the
  response by using the properties parameter"; it states no page-size defaults.

  **VERIFIED (2026-10-20):** live. `{"objects": [], "hasMore": false, "offset": 0}`.
  The test account has **no tickets**, so the empty change log is expected, and
  change-log boundary behaviour can't be observed here.
