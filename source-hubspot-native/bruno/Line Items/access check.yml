info:
  name: access check
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/crm/v3/objects/line_items?limit=1"
  params:
    - name: limit
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - readable, no line items"
    request:
      url: "{{base_url}}/crm/v3/objects/line_items?limit=1"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "results": []
          }

docs: |-
  **REFERENCE:** [Retrieve line items](https://developers.hubspot.com/docs/api-reference/legacy/crm/objects/line-items/get-line-items)

  **WHY:** `check_line_items_access` (`api/line_items.py`). Discovery makes this call
  with `limit=1` and drops the `line_items` binding when HubSpot answers with a
  missing-scope `403` (`_remove_permission_blocked_resources` in `resources.py`). The
  connector treats `line_items` as needing the optional `e-commerce` scope
  (`optional_scopes` in `models.py`).

  **DOCUMENTED (2026-10-20):** `limit` defaults to 10 and `archived` to `false`. The endpoint
  is available on the free tier. The [line items guide](https://developers.hubspot.com/docs/api-reference/legacy/crm/objects/line-items/guide) names
  `crm.objects.line_items.read` as the read scope, which the connector never requests;
  it asks for `e-commerce` instead.

  **VERIFIED (2026-10-20):** `200` with `{"results": []}` and no `paging`. The test token can
  read line items, so discovery keeps the binding, and the account has no line items.

  **UNOBSERVABLE:** which granted scope lets the test token through, and the `403` a
  token without it gets. Both need a second app install with different scopes. If a
  new install with `e-commerce` alone were refused, discovery would drop `line_items`
  without failing.
