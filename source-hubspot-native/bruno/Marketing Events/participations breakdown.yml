info:
  name: participations breakdown
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/marketing/v3/marketing-events/participations/{{marketing_event_id}}/breakdown?limit=100"
  params:
    - name: limit
      value: "100"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // marketing_event_id normally arrives from `Marketing Events / bare`'s
        // after-response script. Out of order (or in a fresh session), fall back to
        // the test account's only event, pinned from that request's saved example.
        if (!bru.getVar('marketing_event_id')) bru.setVar('marketing_event_id', '559722810694');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - one participation, total 1"
    request:
      url: "{{base_url}}/marketing/v3/marketing-events/participations/559722810694/breakdown?limit=100"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "total": 1,
            "results": [
              {
                "id": "560628475813",
                "properties": {
                  "attendanceState": "ATTENDED",
                  "occurredAt": 1780282800000,
                  "attendanceDurationSeconds": 2422800,
                  "attendancePercentage": null
                },
                "associations": {
                  "contact": {
                    "contactId": "225877317544",
                    "email": "test@test.com",
                    "firstname": "John",
                    "lastname": "Doe"
                  },
                  "marketingEvent": {
                    "marketingEventId": "559722810694",
                    "name": "Test Marketing Event",
                    "externalEventId": null,
                    "externalAccountId": null
                  }
                },
                "createdAt": "2026-06-02T17:29:25.619Z"
              }
            ]
          }

docs: |-
  **REFERENCE:** [Retrieve participant breakdown by HubSpot ID (v3, legacy)](https://developers.hubspot.com/docs/api-reference/legacy/marketing/marketing-events/participant-state/get-breakdown)

  **WHY:** `fetch_marketing_event_participants` (`api/marketing_events.py`) makes this
  call once per event, with the event's `objectId`, `limit=100`, no `state`, and `after`
  from `paging.next.after`. The before-request script falls back to the test account's
  only event (`559722810694`) when `marketing_event_id` isn't set. To chain the id
  instead, run `Marketing Events / bare` first in a fresh session. This answers whether
  `objectId` is the right path id, what a participation looks like, and whether leaving
  out `state` drops participations.

  **DOCUMENTED (2026-10-20):**
  - `marketingEventId`: "The internal id of the marketing event in HubSpot."
  - `limit`: "The limit for response size. The default value is 10, the max number is
    100".
  - `state`: "The participation state value. It may be REGISTERED, CANCELLED, ATTENDED,
    NO_SHOW". No default is stated.
  - Scope: `crm.objects.marketing_events.read`.

  **VERIFIED (2026-10-20):** `200`, `total: 1`, one participation (`id: "560628475813"`,
  `attendanceState: "ATTENDED"`), the same document as the capture snapshot's
  `marketing_event_participants`. Its `associations.marketingEvent.marketingEventId`
  equals the path id, so the events list's `objectId` is the right id to pass.
  `properties.occurredAt` is an epoch-ms integer, while `createdAt` is an ISO string. A
  single page carries no `paging`. Leaving out `state` still returns an `ATTENDED`
  participation, so the default isn't limited to `REGISTERED`.

  **UNOBSERVABLE:** whether leaving out `state` also returns `CANCELLED` and `NO_SHOW`
  participations. The account has only the one `ATTENDED` participation, and registering
  or cancelling contacts would change the snapshot's data. The docs present `state` as
  an optional filter, which suggests that leaving it out returns every state. Fallback
  if it doesn't: one sweep per state.
