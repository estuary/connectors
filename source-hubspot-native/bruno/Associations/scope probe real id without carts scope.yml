  - name: "207 - NO_ASSOCIATIONS_FOUND for a real contact, no scope check"
    request:
      url: "{{base_url}}/crm/v4/associations/contacts/carts/batch/read"
      method: POST
    response:
      status: 207
      statusText: Multi-Status
      headers:
