docs: |-
  **REFERENCE:** [Retrieve associations (v4, legacy)](https://developers.hubspot.com/docs/api-reference/legacy/crm/associations/associate-records/batch/get-associations)

  **WHY:** rules out the made-up ID as the reason
  `Associations / scope probe id 0 without carts scope` got no `403`. This sends the
  same scope-blocked target with a real record. The account has no engagements, so it
  uses contact `72810357568`; contacts → carts is not one of
  `Contact.ASSOCIATED_ENTITIES`.

  **VERIFIED (2026-10-20):** again `207` `NO_ASSOCIATIONS_FOUND` ("No cart is associated
  with contact 72810357568."), not a `403`. For a record without carts, HubSpot doesn't
  check the associated object's scope at all.

  **UNOBSERVABLE:** what HubSpot returns when a record does have cart associations and
  the token lacks the carts scope: the cart IDs, or a `403`. Finding out needs a cart in
  the test account (a mutation) and a token without the scope. If HubSpot returns the
  IDs, engagement documents carry `carts` IDs the token can't otherwise read, which is
  harmless. If it returns `403`, `fetch_association` drops `carts` for the rest of the
  run. Either way the capture doesn't fail.
