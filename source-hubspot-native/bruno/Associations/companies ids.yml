info:
  name: companies ids
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/crm/v3/objects/companies?limit=3"
  params:
    - name: limit
      value: "3"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Pin these company ids for `Associations / batch read bare`.
        const ids = (res.getBody()?.results || []).map((r) => String(r.id));
        if (res.getStatus() === 200 && ids.length) {
          bru.setVar('assoc_company_ids', JSON.stringify(ids));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - one company (HubSpot sample company)"
    request:
      url: "{{base_url}}/crm/v3/objects/companies?limit=3"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "results": [
              {
                "id": "25177527565",
                "properties": {
                  "createdate": "2024-10-28T16:39:01.173Z",
                  "domain": "hubspot.com",
                  "hs_lastmodifieddate": "2025-01-18T21:49:41.259Z",
                  "hs_object_id": "25177527565",
                  "name": "HubSpot"
                },
                "createdAt": "2024-10-28T16:39:01.173Z",
                "updatedAt": "2025-01-18T21:49:41.259Z",
                "archived": false,
                "url": "REDACTED"
              }
            ]
          }

docs: |-
  **REFERENCE:** [Retrieve companies (v3)](https://developers.hubspot.com/docs/api-reference/legacy/crm/objects/companies/get-companies)

  **WHY:** the ID source for `Associations / batch read bare`. It lists a few companies
  and pins their IDs in its after-response script. Companies are used because
  `Company.ASSOCIATED_ENTITIES` includes `contacts`, and the account's sample company
  has contacts attached.

  **DOCUMENTED (2026-10-20):** `limit` defaults to 10; `archived` defaults to `false`.

  **VERIFIED (2026-10-20):** one company, `25177527565` (HubSpot's sample company),
  with `hs_lastmodifieddate` `2025-01-18T21:49:41.259Z`. There is no `paging`, so it is
  the only company in the account. `Companies / recent modified bare` relies on that
  date.
