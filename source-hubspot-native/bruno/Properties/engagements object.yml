docs: |-
  **REFERENCE:** [Read all properties](https://developers.hubspot.com/docs/api-reference/legacy/crm/properties/get-properties)

  **WHY:** the `properties` snapshot and the `engagements` binding both call
  `fetch_properties` with `engagements`. The v3 activity APIs are split by type
  (calls, emails, meetings, notes, tasks), so this checks that `engagements` resolves
  as an object type here and shows what it returns.

  **VERIFIED (2026-10-20):** `200` with 395 properties, mostly in the groups `engagement`
  (72), `email` (65), `taskinformation` (62), `call` (56) and `meeting` (54). That is
  the activity types' properties merged into one list.
