info:
  name: archived audit
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/crm/v3/properties/contacts?archived=true"
  params:
    - name: archived
      value: "true"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - no archived contact properties"
    request:
      url: "{{base_url}}/crm/v3/properties/contacts?archived=true"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "results": []
          }

docs: |-
  **REFERENCE:** [Read all properties](https://developers.hubspot.com/docs/api-reference/legacy/crm/properties/get-properties)

  **WHY:** silent-data-loss audit. The connector sends no `archived`, so archived
  property definitions are left out. They drop out of the `properties` snapshot, and
  their values are never requested on records.

  **DOCUMENTED (2026-10-20):** `archived` is "Whether to return only results that have been
  archived", default `false`.

  **VERIFIED (2026-10-20):** `archived=true` returns `200` with an empty `results`. The
  account has no archived contact properties.

  **UNOBSERVABLE:** whether records still return values for an archived property when
  asked by name. Archiving a property would change the test account, which this
  read-only collection doesn't do. The connector treats an archived property as
  removed.
