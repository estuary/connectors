info:
  name: bare
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/crm/v3/properties/contacts"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - 403 contact properties, no paging (projection - 1 of 403 results)"
    request:
      url: "{{base_url}}/crm/v3/properties/contacts"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "results": [
              {
                "updatedAt": "2022-05-27T22:31:01.789Z",
                "createdAt": "2019-08-06T02:41:09.596Z",
                "name": "lastmodifieddate",
                "label": "Last Modified Date",
                "type": "datetime",
                "fieldType": "date",
                "description": "The date any property on this contact was modified",
                "groupName": "contactinformation",
                "options": [],
                "displayOrder": -1,
                "calculated": false,
                "externalOptions": false,
                "hasUniqueValue": false,
                "hidden": false,
                "hubspotDefined": true,
                "modificationMetadata": {
                  "archivable": true,
                  "readOnlyDefinition": true,
                  "readOnlyValue": true
                },
                "formField": false,
                "dataSensitivity": "non_sensitive"
              }
            ]
          }

docs: |-
  **REFERENCE:** [Read all properties](https://developers.hubspot.com/docs/api-reference/legacy/crm/properties/get-properties)

  **WHY:** the call `fetch_properties` (`api/properties.py`) makes with no query
  parameters, once per object per run. Its results feed three things: the `properties`
  binding emits them, every CRM object binding builds its sourced schema from them, and
  the backfill and batch reads request every `name` listed. `contacts` is the example
  object.

  **DOCUMENTED (2026-10-20):** `results` is not paginated. `archived` defaults to `false`.
  `dataSensitivity` defaults to `non_sensitive` (one of `highly_sensitive`,
  `non_sensitive`, `sensitive`).

  **VERIFIED (2026-10-20):** `200` with 403 contact properties in one `results` array and no
  `paging`, so one call is complete.
  - 38 are `calculated: true`; those are what a connector-initiated backfill re-reads.
    109 are `hidden: true`, and the connector still requests them.
  - Types: `string` 125, `number` 90, `datetime` 81, `enumeration` 69, `bool` 29,
    `date` 5, `object_coordinates` 2 and `phone_number` 2. `phone_number`
    (`hs_searchable_calculated_phone_number` and `..._mobile_number`) isn't in
    `PropertyTypes`. `sourced_schema` deliberately leaves unknown types out of the
    sourced schema, so those two fields reach the collection through inference alone.
  - Every property is `dataSensitivity: non_sensitive`. 7 carry an explicit
    `archived: false`; the rest leave the key out.
