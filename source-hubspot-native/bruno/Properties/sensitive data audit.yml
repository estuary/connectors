info:
  name: sensitive data audit
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/crm/v3/properties/contacts?dataSensitivity=sensitive"
  params:
    - name: dataSensitivity
      value: "sensitive"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - no sensitive contact properties"
    request:
      url: "{{base_url}}/crm/v3/properties/contacts?dataSensitivity=sensitive"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "results": []
          }

docs: |-
  **REFERENCE:** [Read all properties](https://developers.hubspot.com/docs/api-reference/legacy/crm/properties/get-properties)

  **WHY:** silent-data-loss audit. `dataSensitivity` defaults to `non_sensitive`, so
  the default call the connector makes never lists sensitive properties, and their
  values are never requested on records. This shows whether the account has any, and
  whether the token is allowed to list them.

  **DOCUMENTED (2026-10-20):** `dataSensitivity` is one of `highly_sensitive`,
  `non_sensitive` and `sensitive`, default `non_sensitive`.

  **VERIFIED (2026-10-20):** `dataSensitivity=sensitive` returns `200` (not `403`) with an
  empty `results`. The account has no sensitive contact properties. `highly_sensitive`
  wasn't probed.

  **LIMITATION (DOCUMENTED 2026-10-20):** on an account that uses HubSpot's sensitive-data
  properties, those properties are missing from the `properties` binding and from every
  captured record, with no error. The connector only ever lists the default
  `non_sensitive` set.
