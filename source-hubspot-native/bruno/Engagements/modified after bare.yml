info:
  name: modified after bare
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/engagements/v1/engagements/modified/after?after=1000&limit=250"
  params:
    - name: after
      value: "1000"
      type: query
    - name: limit
      value: "250"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - endpoint live, empty, cursor encodes the after timestamp"
    request:
      url: "{{base_url}}/engagements/v1/engagements/modified/after?after=1000&limit=250"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "results": [],
            "hasMore": false,
            "after": "cursor:MTAwMA"
          }

docs: |-
  **REFERENCE:** [Get engagements modified after (v1, legacy)](https://developers.hubspot.com/docs/api-reference/legacy/crm/activities/engagements/get-engagements-v1-engagements-modified-after)

  **WHY:** the call `_fetch_engagements_modified_after` (`api/engagements.py`) makes
  for the delayed `engagements` subtask (`after=<since ms>`, `limit=250`). It starts
  here at `1000`, the connector's `EPOCH_PLUS_ONE_SECOND`, so the response holds every
  engagement the endpoint will serve.

  **DOCUMENTED (2026-10-20):** `after` is "A Unix timestamp in milliseconds or a cursor
  returned by a previous response. Determines where to start reading from." `limit`
  "Defaults to 100, maximum 1000". "Recently modified engagements may not appear
  immediately due to indexing delays." The page doesn't say whether a timestamp
  `after` is inclusive, which timestamp it compares against, or how long a returned
  cursor stays valid. There is no sunset notice.

  **VERIFIED (2026-10-20):** live. `200` with the connector's existing scopes:
  `{"results": [], "hasMore": false, "after": "cursor:MTAwMA"}`. The account has no
  engagements (`Engagements / paged population check`). The returned cursor is
  `cursor:` plus the base64 of `1000`, the timestamp sent, so it encodes a read
  position rather than a server-side session. The connector never checkpoints this
  cursor: it walks the whole window inside one call and returns no next page. The
  skill's durability rule for opaque cursors therefore doesn't apply.

  **UNOBSERVABLE:** whether `after` is inclusive at an engagement's exact `lastUpdated`,
  and whether it filters on `lastUpdated` at all (FETCH-SERVER-SIDE-BOUNDARIES). Both
  need an engagement in the account. The connector keeps only `since < lastUpdated <=
  until` itself, so inclusive or exclusive is equally safe, provided `after` compares
  against `lastUpdated`. If it compared against an index time instead, an engagement
  indexed after the window had passed would be skipped. This subtask is the
  connector's consistency path, so nothing else would recover it.

  **LIMITATION (DOCUMENTED 2026-10-20):** HubSpot doesn't quantify the indexing delay.
  The delayed subtask reads this endpoint `DELAYED_LAG` (1 hour) behind real time. That
  lag is the connector's only margin against changes that aren't indexed yet.
