info:
  name: recent modified bare
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/engagements/v1/engagements/recent/modified?count=1"
  params:
    - name: count
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - endpoint live, empty (account has no engagements)"
    request:
      url: "{{base_url}}/engagements/v1/engagements/recent/modified?count=1"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "results": [],
            "hasMore": false,
            "offset": 0,
            "total": 0
          }

docs: |-
  **REFERENCE:** [Get recent engagements (v1, legacy)](https://developers.hubspot.com/docs/api-reference/legacy/crm/activities/engagements/get-engagements-v1-engagements-recent-modified)

  **WHY:** the first call `_fetch_recently_modified_engagements` (`api/engagements.py`)
  makes on every realtime poll of the `engagements` binding (`count=1`; later pages
  send `count=100` and `offset`). It answers whether this legacy endpoint is still
  live, and what it returns.

  **DOCUMENTED (2026-10-20):** `count` "Defaults to 20, has a maximum value of 100";
  `offset` pages through results; `since` returns "only records modified after the
  specified time" (the connector doesn't send it). Results are sorted by most recently
  updated first, and "This endpoint will only return records updated in the last 30
  days, or the 10k most recently updated records." Scopes: `contacts`, plus
  `sales-email-read` for the details of email engagements.

  **VERIFIED (2026-10-20):** live. `200` with the connector's existing scopes:
  `{"results": [], "hasMore": false, "offset": 0, "total": 0}`. The account has no
  engagements at all (`Engagements / paged population check`).

  **UNOBSERVABLE:** the newest-first order, the `offset` paging and the
  `engagement.lastUpdated` field the connector reads. All of them need an engagement.
  Creating one would change the data the capture snapshot is recorded from. The
  connector relies on the documented sort. Anything the realtime subtask misses is
  picked up by the delayed subtask (`Engagements / modified after bare`).

  **LIMITATION (DOCUMENTED 2026-10-20):** at most the last 30 days or the 10k most
  recent changes. The connector stops at 9,900 IDs and, as its code comment says,
  relies on the delayed `modified/after` subtask for the rest.
