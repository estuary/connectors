info:
  name: paged population check
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/engagements/v1/engagements/paged?limit=1"
  params:
    - name: limit
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - no engagements in the account"
    request:
      url: "{{base_url}}/engagements/v1/engagements/paged?limit=1"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "results": [],
            "hasMore": false,
            "offset": 0
          }

docs: |-
  **REFERENCE:** [Get all engagements (v1, legacy)](https://developers.hubspot.com/docs/api-reference/legacy/crm/activities/engagements/get-engagements-v1-engagements-paged)

  **WHY:** population check for the other two engagements requests. Their empty
  answers mean little unless the account is known to hold no engagements.

  **DOCUMENTED (2026-10-20):** `limit` "Defaults to 100, has a maximum value of 250";
  `offset` pages through results.

  **VERIFIED (2026-10-20):** `{"results": [], "hasMore": false, "offset": 0}`. The test
  account has **no engagements**. That explains the empty
  `Engagements / recent modified bare` and `Engagements / modified after bare`, and it
  is why their boundary behaviour is unobservable here.
