info:
  name: count 101 probe
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/deals/v1/deal/recent/modified?count=101"
  params:
    - name: count
      value: "101"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - count 101 accepted, empty list"
    request:
      url: "{{base_url}}/deals/v1/deal/recent/modified?count=101"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "results": [],
            "hasMore": false,
            "offset": 0,
            "total": 0
          }

docs: |-
  **REFERENCE:** [Get recently modified deals (v1, legacy)](https://developers.hubspot.com/docs/api-reference/legacy/crm/objects/deals/v1/get-deals-v1-deal-recent-modified)

  **WHY:** the connector pages with `count=100`, which is the documented maximum. One
  past it shows how HubSpot enforces the maximum: by rejecting the request or by
  clamping it.

  **VERIFIED (2026-10-20):** `count=101` is **accepted**: `200` with the same empty
  envelope as `Deals / recent modified bare`, not a `400`.

  **UNOBSERVABLE:** whether HubSpot clamps to 100, serves 101, or truncates. Telling
  these apart needs more than 100 deals modified in the last 30 days. Bulk-seeding
  that many is out of scope for this read-only collection. The connector never
  sends more than 100 and pages on `hasMore`/`offset`, so a clamp or a 101-item page
  are equally safe for it.
