info:
  name: recent modified bare
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/deals/v1/deal/recent/modified?count=1"
  params:
    - name: count
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - endpoint live, empty (no deal modified in the last 30 days)"
    request:
      url: "{{base_url}}/deals/v1/deal/recent/modified?count=1"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "results": [],
            "hasMore": false,
            "offset": 0,
            "total": 0
          }

docs: |-
  **REFERENCE:** [Get recently modified deals (v1, legacy)](https://developers.hubspot.com/docs/api-reference/legacy/crm/objects/deals/v1/get-deals-v1-deal-recent-modified)

  **WHY:** the first call `fetch_recent_deals` (`api/deals.py`) makes on every
  realtime poll of the `deals` binding (`count=1`; later pages send `count=100` and
  `offset`). It answers whether this legacy endpoint is still live, and what it
  returns.

  **DOCUMENTED (2026-10-20):** `count` defaults to 20, maximum 100. `offset` is "Used
  to page backwards through recent deals". `since` returns only "deals modified after
  and including timestamp x"; the connector doesn't send it. Results are "sorted by
  their last modified date, starting with the most recently modified deals", and the
  endpoint "will only return records modified in the last 30 days, or the 10k most
  recently modified records". Scope: `crm.objects.deals.read`.

  **VERIFIED (2026-10-20):** live. `200` with the connector's existing scopes:
  `{"results": [], "hasMore": false, "offset": 0, "total": 0}`. That is the expected
  answer. The account's only deal was last modified on 2026-07-16
  (`Deals / population check`), outside the 30-day window.

  **UNOBSERVABLE:** the newest-first order and the `offset` paging that
  `fetch_recent_deals` relies on. It stops paging at the first deal as old as
  `since`. Observing either needs a deal modified in the last 30 days, which means
  editing test-account data. The connector relies on the documented sort. If the
  order were not newest-first, the early stop could skip newer deals on later pages.
  The delayed search subtask would then pick them up `DELAYED_LAG` (1 hour) late.

  **LIMITATION (DOCUMENTED 2026-10-20):** at most the last 30 days or the 10k most
  recent changes, as for `Companies / recent modified bare`. The connector stops at
  9,900 IDs and leaves the rest to the delayed search subtask.
