info:
  name: population check
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/crm/v3/objects/deals?limit=100&properties=hs_lastmodifieddate"
  params:
    - name: limit
      value: "100"
      type: query
    - name: properties
      value: hs_lastmodifieddate
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - one deal, last modified 2026-07-16"
    request:
      url: "{{base_url}}/crm/v3/objects/deals?limit=100&properties=hs_lastmodifieddate"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "results": [
              {
                "id": "35447325508",
                "properties": {
                  "createdate": "2025-04-03T12:59:10.726Z",
                  "hs_lastmodifieddate": "2026-07-16T20:55:20.497Z",
                  "hs_object_id": "35447325508"
                },
                "createdAt": "2025-04-03T12:59:10.726Z",
                "updatedAt": "2026-07-16T20:55:20.497Z",
                "archived": false,
                "url": "REDACTED"
              }
            ]
          }

docs: |-
  **REFERENCE:** [List deals (v3)](https://developers.hubspot.com/docs/api-reference/legacy/crm/objects/deals/get-deals)
  (the page writes the path with the object type ID, `/crm/v3/objects/0-3`; this
  request uses the `deals` name).

  **WHY:** population check for `Deals / recent modified bare`. It shows whether the
  account has deals and when they last changed. That decides whether the legacy
  endpoint's empty answer is honest.

  **DOCUMENTED (2026-10-20):** `limit` defaults to 10; `archived` defaults to `false`.

  **VERIFIED (2026-10-20):** one deal, `35447325508`, with `hs_lastmodifieddate`
  `2026-07-16T20:55:20.497Z`, 96 days before the run. There is no `paging`, so this is
  every deal in the account. Nothing changed inside the 30-day window, which matches
  the empty `Deals / recent modified bare`.
