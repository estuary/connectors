version: "3.7"

services:
  db:
    image: 'mcr.microsoft.com/mssql/server:2022-latest'
    entrypoint: "/startup.sh"
    ports:
      - "1433:1433"
    volumes:
      - type: bind
        source: ./docker-initdb.sh
        target: /startup.sh
      - sqlserver_data:/var/opt/mssql
    environment:
      SA_PASSWORD: "gf6w6dkD"
      ACCEPT_EULA: "Y"
      MSSQL_AGENT_ENABLED: "true"
    healthcheck:
      # The entrypoint starts sqlservr in the background and then runs the
      # initialization SQL against it, so the server accepts connections well
      # before setup has finished: `CREATE DATABASE test` is the first
      # statement and the CDC configuration comes after it -- roughly ten
      # seconds after, which is ten seconds of tests running against a server
      # whose capture jobs aren't started yet.
      # Gate on the marker file the entrypoint touches once it is done, and on
      # a live connection, so that a container reusing an already-initialized
      # volume still waits for the server itself to come up.
      test: ["CMD-SHELL", "test -e /var/opt/mssql/initdb-performed && /opt/mssql-tools18/bin/sqlcmd -C -U sa -P gf6w6dkD -Q 'SELECT 1'"]
      interval: 2s
      timeout: 10s
      retries: 60
    networks:
      - flow-test

networks:
  flow-test:
    name: flow-test
    external: true

volumes:
  sqlserver_data: {}
