docs: |-
  **REFERENCE:** [Get all employee fields](https://apidocs.hibob.com/reference/get_company-people-fields.md)

  **WHY:** (1) backs the `employee_fields` snapshot stream; (2) this is the
  `validate_credentials` probe in `resources.py`; (3) source of exact field ids for the
  `employees` field selection; (4) its after-response script feeds `People / all fields`
  and `People / fields 401 limit probe`.

  **VERIFIED (2026-11-02):** 200, bare top-level JSON array of 276 field objects. Every
  item has exactly `id, categoryId, categoryDisplayName, category, name, description,
  jsonPath, type, typeData, historical`. `description` is often null; `typeData` is `{}`
  or `{"listId": ...}`.

  **VERIFIED (2026-11-02):** `validate_credentials` probe authenticates (200).
  **LIMITATION (VERIFIED 2026-11-02):** it succeeded while the service user could see
  **zero** employees (see `People / ids only`, example "before permission grant") — the
  docs say this endpoint "does not require any permissions", so passing it does not
  prove the service user can read people.

  **VERIFIED (2026-11-02):** `type` values exceed the documented enum: also seen
  `boolean, list_id, period, working_pattern, short-date, time, avatar, ssn, employee,
  objectReference, duration_with_unit`. Model `type` as a free string.

  **VERIFIED (2026-11-02):** `jsonPath` is where the field lives in the nested
  (non-slash) part of a `/people/search` employee (e.g. `root.id` -> `id`,
  `work.department` -> `work.department`) — cross-checked for all 276 ids in
  `People / all fields`.

  **VERIFIED (2026-11-02):** requirement field ids in this tenant: `work.department`
  (list, listId `department`), `work.siteId` (list_id, listId `site`) / `work.site`
  (text), `work.title`, `work.reportsTo` / `work.manager`, `work.startDate`,
  `work.originalStartDate`, `payroll.employment.activeEffectiveDate`,
  `payroll.employment.fte` (number, "FTE %"), `payroll.employment.weeklyHours`,
  `internal.status`, `internal.lifecycleStatus`, `internal.terminationDate`,
  `internal.terminationReason`, `internal.terminationType`, `employee.lastDayOfWork`,
  `employee.recentLeaveStartDate` / `recentLeaveEndDate`. No custom fields exist in this
  tenant (**UNOBSERVABLE:** custom-field id format; docs show
  `category_<n>`-style ids — the metadata-driven selection picks them up regardless).

  Rate-limit header: `x-ratelimit-limit: 50` (matches docs).
