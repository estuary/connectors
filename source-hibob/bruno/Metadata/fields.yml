info:
  name: fields
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/company/people/fields"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Chain: `People / all fields` and `People / fields 401 limit probe` build
        // their fields[] from this list. Runtime var only (field ids, not credentials).
        const body = res.getBody();
        if (res.getStatus() === 200 && Array.isArray(body)) {
          bru.setVar('all_field_ids', JSON.stringify(body.map((f) => f.id)));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

