info:
  name: named lists include archived
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/company/named-lists?includeArchived=true"
  params:
    - name: includeArchived
      value: "true"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - projection: summary (byte-identical to default; tenant has 0 archived items)"
    request:
      url: "https://api.hibob.com/v1/company/named-lists?includeArchived=true"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: "application/json"
        - name: x-ratelimit-limit
          value: "60"
      body:
        type: json
        data: |-
          {
            "lists": 252,
            "archived_items": 0,
            "identical_to_default": true
          }

docs: |-
  **REFERENCE:** [Get all company lists](https://apidocs.hibob.com/reference/get_company-named-lists.md)

  **WHY:** the request the connector sends. Terminated employees may still reference
  archived departments/sites, so archived items must be captured for the
  employee -> list-item join.

  **DOCUMENTED (2026-11-02):** "`includeArchived` (boolean, default `false`) ... By
  default, archived items are excluded."

  **VERIFIED (2026-11-02):** 200; response is byte-identical to `Metadata / named lists`
  (252 lists, 3138 items, 0 with `archived: true`).

  **UNOBSERVABLE:** that `includeArchived=true` actually adds archived items — this
  tenant has none, and archiving a list item is a mutation shared by every list
  consumer in the test tenant. We rely on the docs; sending the parameter costs nothing,
  and if it turns out to be ignored the stream still captures every non-archived item.
