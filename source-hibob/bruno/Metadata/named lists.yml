docs: |-
  **REFERENCE:** [Get all company lists](https://apidocs.hibob.com/reference/get_company-named-lists.md)

  **WHY:** bare shape of the `named_lists` stream with the provider default
  (`includeArchived=false`). Compare with `Metadata / named lists include archived`.

  **LIMITATION (VERIFIED 2026-11-02):** the response is **not** the documented array —
  it is a JSON **object keyed by list name**: `{"<name>": {"name", "values", "items"}}`.
  252 lists, 3138 items in total. `values` and `items` are identical in all 252 lists
  (`values` is undocumented; drop it).

  **VERIFIED (2026-11-02):** item keys are exactly `id, value, name, archived, children`.
  **`id` is mixed-type:** int for entity lists (`site`: 2614101) and string for
  value lists (`department`: "Client Services" — id == value == name). Model as
  `int | str`.

  **VERIFIED (2026-11-02):** nesting reaches **2 levels** below the item
  (`jobFunction`: item -> children -> children), not the one level the docs show.
  Treat `children` as recursive.

  **VERIFIED (2026-11-02):** an employee's raw `work.department` value equals the
  `department` list item `id` ("Client Services"); raw `work.siteId` (2614101) equals
  the `site` item `id`. Raw values join to named-list item ids.

  Rate-limit header: `x-ratelimit-limit: 60` (docs say 50 — design to 50).
