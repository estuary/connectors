info:
  name: bare
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/bulk/people/lifecycle?limit=200"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    **REFERENCE:** https://apidocs.hibob.com/reference/get_bulk-people-lifecycle

    **WHY:** Shape of the `lifecycle` bulk table: the **start / leave /
    termination history** (status per effective date).

    **VERIFIED (2026-11-02):** per-entry keys: id, effectiveDate,
    endEffectiveDate, isCurrent, canBeDeleted, canEditOotbColumns, change,
    creationDate, modificationDate, status, employeeStatus, reasonType,
    leaveReason, customColumns. `status` values are **lowercase**
    (`employed`, `terminated`), not the docs' "Employed"/"Terminated".
    `employeeStatus` is `Active`/`Inactive`. A termination effective 2026-10-31
    appended `{id: 1000020261031, effectiveDate: 2026-10-31, status: terminated,
    employeeStatus: Inactive, isCurrent: true}` and closed the prior `employed`
    row with `endEffectiveDate: 2026-10-31`. Note that this is the termination
    date itself, not the day before as on the employment and work tables.
    `reasonType` / `leaveReason` were null on both rows (none were set).

    **VERIFIED (2026-11-02) — shared bulk-table envelope** (same for employment,
    lifecycle and work; see `_bulk-table / *`):
    - Shape is `{results: [{employeeId, values: [entry, ...]}], response_metadata: {next_cursor}, errors: {}}`
      plus a **top-level** `restricted_columns` when columns are restricted.
      **The docs are wrong here:** they nest `values: [{values: [entry], restricted_columns}]`.
      Live, `results[].values` is the entry array itself, with no middle level.
    - `errors` is an **object keyed by employeeId**
      (`{"<id>": {error: "MISSING_PERMISSION", message}}`), not the documented
      array. It is `{}` when no `employeeIds` are sent.
    - `employeeId` exists only on the result; entries don't carry it.
    - **Entry `id` is NOT unique across employees.** For every observed entry,
      `id == int("10000" + effectiveDate.replace("-", ""))` (e.g. 2026-10-15 ->
      1000020261015), so it is unique per (employee, effectiveDate) and identical
      across tables. PK = (employeeId, id).
    - History semantics (seeded 2026-11-02): adding an entry effective
      2026-10-15 set the prior row `isCurrent=false`,
      `endEffectiveDate=2026-10-14`; the current row has `endEffectiveDate=null`.
    - Dates (`effectiveDate`, `endEffectiveDate`, `creationDate`,
      `modificationDate`, `activeEffectiveDate`) are `YYYY-MM-DD` strings with no
      time part. `creationDate` is null on employment and work, populated on
      lifecycle. The docs' `CreationDate` (capital C) on employment is wrong:
      live it is `creationDate`. No field is usable as an incremental cursor,
      and there are no date filters (**LIMITATION**: full snapshot every sync).
    - **LIMITATION (VERIFIED 2026-11-02):** terminated employees are dropped
      from the default listing (45 -> 44 results) when the service user's
      permission group's "Access data for" keeps the default
      "Lifecycle status equals Employed" condition. Removing that condition
      brings them back. See `_bulk-table / employeeIds terminated`.
    - **LIMITATION (VERIFIED 2026-11-02):** with View but not View history on
      a table, the response has top-level
      `restricted_columns.no_view_history_permission` (+
      `X-Has-Restricted-Columns: true`). Every row in that response was current
      and its listed columns still had values, which fits the docs ("View" covers
      the current row). **UNOBSERVABLE:** how restricted columns render on
      *non-current* rows. View history was granted before a multi-entry history
      existed under the restriction. The docs say they are filtered (null or
      absent); the connector warns from `restricted_columns` either way.
    - Without table permissions at all: 403 with an empty body. Never retry it
      (WAF: >50 401/403 in 10 s => 5-minute IP block).

    Examples redact `change.changedBy` (a person's display name); ids are kept.
  type: text/markdown

examples:
  - name: "403 - service user lacks table permission (empty body)"
    request:
      url: "{{base_url}}/bulk/people/lifecycle?limit=200"
      method: GET
    response:
      status: 403
      statusText: "Forbidden"
      headers:
        - name: x-ratelimit-limit
          value: "100"
        - name: x-ratelimit-remaining
          value: "98"
        - name: x-ratelimit-reset
          value: "1793637900"
      body:
        type: json
        data: |-
          ""
