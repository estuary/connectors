info:
  name: limit 201 probe
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/bulk/people/{{table}}?limit=201"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // `table` selects the bulk table (employment | lifecycle | work). Override per
        // run with `--env-var table=<name>`; otherwise default to employment.
        if (!bru.getEnvVar('table') && !bru.getVar('table')) bru.setVar('table', 'employment');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    **REFERENCE:** https://apidocs.hibob.com/reference/pagination-1

    **WHY:** The docs say the max `limit` is 200 and that more "return[s] a 400
    error". Probe 201 to learn the enforcement mode.

    **LIMITATION (VERIFIED 2026-11-02):** **Rejected:** 400 with
    `{"error": "Maximum allowed value for 'limit' is 200. Requested: 201"}`.
    The connector must send at most 200 (it sends exactly 200).
  type: text/markdown

examples:
  - name: "400 - employment: limit 201 rejected"
    request:
      url: "{{base_url}}/bulk/people/employment?limit=201"
      method: GET
    response:
      status: 400
      statusText: "Bad Request"
      headers:
        - name: content-type
          value: "application/json"
      body:
        type: json
        data: |-
          {
            "key": "Maximum allowed value for 'limit' is 200. Requested: 201",
            "error": "Maximum allowed value for 'limit' is 200. Requested: 201",
            "args": []
          }
