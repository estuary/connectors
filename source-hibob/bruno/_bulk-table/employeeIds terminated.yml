                    "leaveReason": null,
                    "customColumns": {}
                  }
                ]
              }
            ],
            "response_metadata": {
              "next_cursor": null
            },
            "errors": {
              "4021630453151695573": {
                "error": "MISSING_PERMISSION",
                "message": "You don't have permission to access data for employee with id 4021630453151695573"
              }
            }
          }
