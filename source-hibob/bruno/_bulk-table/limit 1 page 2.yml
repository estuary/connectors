info:
  name: limit 1 page 2
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/bulk/people/{{table}}?limit=1&cursor={{bulk_next_cursor}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // `table` selects the bulk table (employment | lifecycle | work). Override per
        // run with `--env-var table=<name>`; otherwise default to employment.
        if (!bru.getEnvVar('table') && !bru.getVar('table')) bru.setVar('table', 'employment');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    **REFERENCE:** https://apidocs.hibob.com/reference/pagination-1

    **WHY:** Second page of the cursor walk. Needs `_bulk-table / limit 1 page 1`
    to run first in the same session (it sets `bulk_next_cursor`).

    **VERIFIED (2026-11-02):** the URL-encoded cursor is accepted. Page 2 returned
    the employee in position 2 of `Employment History / bare` (page 1 had
    position 1), with no overlap and stable ordering, and another string
    `next_cursor`.
  type: text/markdown

examples:
  - name: "200 - employment: next result in bare order, next_cursor string (full body)"
    request:
      url: "{{base_url}}/bulk/people/employment?limit=1&cursor=YWxnbzI6OiYmdlNHZ3F1YU9ibFpnUGgxaFBoUUFaQ1ZiK3IxVEY1YndySFNCYzFYT2prYUt2d0EvQkszWkdTOUo5UUErZ3dDVEE4MTBBMlptYmdFaXlDR0ViZHZZR2hvNXB2S2N3UTJyZDhxYThhWjZRc0dO"
      method: GET
    response:
