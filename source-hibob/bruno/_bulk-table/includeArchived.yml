info:
  name: includeArchived
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/bulk/people/{{table}}?limit=200&includeArchived=true"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // `table` selects the bulk table (employment | lifecycle | work). Override per
        // run with `--env-var table=<name>`; otherwise default to employment.
        if (!bru.getEnvVar('table') && !bru.getVar('table')) bru.setVar('table', 'employment');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    **REFERENCE:** https://apidocs.hibob.com/reference/get_bulk-people-employment

    **WHY:** Silent-data-loss audit of a defaulted parameter. `includeArchived`
    defaults to `false`, and the docs say it governs archived *columns*: "By
    default (false), archived columns are excluded from the response. When set to
    true, archived columns are included." (DOCUMENTED 2026-11-02)

    **VERIFIED (2026-11-02):** on employment, `includeArchived=true` returned the
    same 45 employees, entries and per-entry key set as `Employment History / bare`.
    The tenant has no archived columns, so the column-adding effect is
    **UNOBSERVABLE** here (archiving a custom column is an admin action we won't
    ask for). Row set is unaffected. The connector sends `includeArchived=true`
    so columns archived after the fact stay in history; schema inference
    absorbs the extra columns.
  type: text/markdown

examples:
  - name: "200 - employment: identical rows and keys to bare, no archived columns in account (projection: ids only)"
