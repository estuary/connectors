info:
  name: curated fields
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/people/search"
  body:
    type: json
    data: |-
      {
        "fields": [
          "root.id",
          "root.email",
          "root.firstName",
          "root.surname",
          "root.displayName",
          "work.employeeIdInCompany",
          "work.title",
          "work.department",
          "work.site",
          "work.siteId",
          "work.reportsTo",
          "work.manager",
          "work.startDate",
          "work.originalStartDate",
          "payroll.employment.activeEffectiveDate",
          "payroll.employment.fte",
          "payroll.employment.weeklyHours",
          "payroll.employment.type",
          "payroll.employment.contract",
          "internal.status",
          "internal.lifecycleStatus",
          "internal.terminationDate",
          "internal.terminationReason",
          "internal.terminationType",
          "employee.firstDayOfWork",
          "employee.lastDayOfWork",
          "employee.recentLeaveStartDate",
          "employee.recentLeaveEndDate",
          "internal.currentActiveStatusStartDate"
        ],
        "filters": [{ "fieldPath": "root.id", "operator": "equals", "values": {{pin_employee_ids}} }],
        "showInactive": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

