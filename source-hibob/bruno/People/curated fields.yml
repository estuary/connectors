docs: |-
  **REFERENCE:** [Search for employees](https://apidocs.hibob.com/reference/post_people-search.md)

  Read-only search. Run `People / ids only show inactive` first in a fresh session
  (provides `{{pin_employee_ids}}`).

  **WHY:** step 2 of the two-phase read — batch read by `root.id` filter, machine format
  (`humanReadable` omitted), with the fields the user's requirements depend on.

  **VERIFIED (2026-11-02):** a `root.id` filter with 45 ids returns all 45.

  **LIMITATION (VERIFIED 2026-11-02):** each employee carries **two copies** of the
  data: slash keys (`"/work/department": {"value": ...}`) and nested objects (`"work":
  {"department": ...}`, root fields flattened to top level: `id`, `email`, ...). Slash
  keys are **omitted when the value is null** (no `/internal/terminationDate` on active
  employees); the nested form keeps explicit `null`s. The connector keeps the nested
  form and drops slash keys (see `People / all fields` for the superset proof).

  **VERIFIED (2026-11-02):** terminated employee (after `Seeding / H3 - Terminate Employee`):
  `internal.lifecycleStatus: "terminated"`, `internal.status: "Inactive"`,
  `internal.terminationDate` and `employee.lastDayOfWork` both `"2026-10-31"`,
  `internal.currentActiveStatusStartDate: null`.

  **VERIFIED (2026-11-02):** raw value encodings — `work.department`: list item id
  (string, == name here); `work.siteId`: int site item id; `work.site`: site name
  text; `work.manager`: manager employee id; `work.reportsTo`: object
  `{id, firstName, surname, displayName, email}`; dates `YYYY-MM-DD`;
  `payroll.employment.fte`: number (100); `weeklyHours`: number (40).
