docs: |-
  **REFERENCE:** [Search for employees](https://apidocs.hibob.com/reference/post_people-search.md)

  Read-only search. Run `People / ids only show inactive` first in a fresh session.

  **WHY:** decide raw ids vs display values.

  **VERIFIED (2026-11-02):** `APPEND` adds a `humanReadable` object mirroring the nested
  shape, with display strings: dates become locale strings (`"01/05/2015"`), numbers
  become strings (`"100.00"`), `siteId` becomes the site name, `manager` the manager's
  name, `lifecycleStatus` `"Employed"` vs raw `"employed"`. Null fields are omitted from
  the node. Response is ~32% larger than raw (125.9 KB vs 95.7 KB for 45 employees).
  Raw values already join to `named_lists`, so the connector does not request
  `humanReadable`.
