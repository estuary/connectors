info:
  name: curated fields human readable append
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/people/search"
  body:
    type: json
    data: |-
      {
        "fields": [
          "root.id",
          "root.email",
          "root.firstName",
          "root.surname",
          "root.displayName",
          "work.employeeIdInCompany",
          "work.title",
          "work.department",
          "work.site",
          "work.siteId",
          "work.reportsTo",
          "work.manager",
          "work.startDate",
          "work.originalStartDate",
          "payroll.employment.activeEffectiveDate",
          "payroll.employment.fte",
          "payroll.employment.weeklyHours",
          "payroll.employment.type",
          "payroll.employment.contract",
          "internal.status",
          "internal.lifecycleStatus",
          "internal.terminationDate",
          "internal.terminationReason",
          "internal.terminationType",
          "employee.firstDayOfWork",
          "employee.lastDayOfWork",
          "employee.recentLeaveStartDate",
          "employee.recentLeaveEndDate",
          "internal.currentActiveStatusStartDate"
        ],
        "filters": [{ "fieldPath": "root.id", "operator": "equals", "values": {{pin_employee_ids}} }],
        "showInactive": true,
        "humanReadable": "APPEND"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 - projection: 1 employee, nested keys + humanReadable node (slash keys elided)"
    request:
      url: "https://api.hibob.com/v1/people/search"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: "application/json"
        - name: x-ratelimit-limit
          value: "100"
      body:
        type: json
        data: |-
          {
            "employees": [
              {
                "internal": {
                  "terminationDate": null,
                  "currentActiveStatusStartDate": "2015-05-01",
                  "lifecycleStatus": "employed",
                  "terminationType": null,
                  "terminationReason": null,
                  "status": "Active"
                },
                "displayName": "Alan Tullin",
                "employee": {
                  "firstDayOfWork": null,
                  "recentLeaveStartDate": null,
                  "lastDayOfWork": null,
                  "recentLeaveEndDate": null
                },
                "surname": "Tullin",
                "id": "4021630481756848861",
                "email": "alan.tullin_644219_14@samplebob.com",
                "work": {
                  "originalStartDate": "2015-05-01",
                  "site": "New York (Demo)",
                  "employeeIdInCompany": 40,
                  "manager": "4021630477688373980",
