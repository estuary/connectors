docs: |-
  **REFERENCE:** [Search for employees](https://apidocs.hibob.com/reference/post_people-search.md)

  Read-only search. Requires `Metadata / fields` and `People / ids only show inactive`
  in the same session.

  **WHY:** evaluates the "derive fields[] from metadata" strategy at the 400 cap.

  **VERIFIED (2026-11-02):** all 276 metadata ids requested for 45 employees: 200,
  ~692 KB raw, ~9 KB per employee once slash keys are dropped.

  **VERIFIED (2026-11-02):** the nested form is a **superset** of the slash form —
  for every field, if the slash key is present the value at metadata `jsonPath` in the
  nested form is present and equal (0 mismatches, 0 slash-only fields across 45 x 276).

  **LIMITATION (VERIFIED 2026-11-02):** 28 requested ids are absent from **both**
  forms — silently dropped, as documented (restricted, e.g. `identification.ssn`,
  `personal.birthDate`, `actualPayment.*`; or history-table markers such as
  `work.isCurrent`, `payroll.employment.endEffectiveDate`). The document can't tell
  "restricted" from "not applicable".

  **LIMITATION (VERIFIED 2026-11-02):** volatile values that change without any HR
  change: `avatarUrl` / `coverImageUrl` / `about.avatar` carry signed Cloudinary tokens
  (`__cld_token__=exp=...`, `token=...`); tenure/age values tick daily
  (`work.tenureDuration`, `work.durationOfEmployment`, `work.yearsOfService`,
  `work.tenureDurationYears`, `work.tenureYears`, `personal.age`,
  `payroll.timeSinceLastSalaryChange`, `internal.periodSinceTermination`,
  `internal.yearsSinceTermination`). Top-level `creationDateTime` has no timezone
  (`2026-11-02T16:08:54.286571`) — not RFC3339.
