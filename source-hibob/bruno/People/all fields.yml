info:
  name: all fields
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/people/search"
  body:
    type: json
    data: |-
      { "fields": ["root.id"], "showInactive": true }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Shapes this ONE request's body (no request loop): the first 400 field ids from
        // `Metadata / fields` (runtime var all_field_ids), filtered to the pinned
        // employees from `People / ids only show inactive`. Run both first.
        const all = JSON.parse(bru.getVar('all_field_ids') || 'null');
        const ids = JSON.parse(bru.getVar('pin_employee_ids') || 'null');
        if (!all || !ids) throw new Error('run Metadata/fields and People/ids only show inactive first');
        req.setBody({
          fields: all.slice(0, 400),
          filters: [{ fieldPath: 'root.id', operator: 'equals', values: ids }],
          showInactive: true,
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

