[tool.poetry]
name = "estuary_cdk"
version = "0.2.0"
description = "Estuary Connector Development Kit"
authors = ["Joseph Shearer <joseph@estuary.dev>", "Johnny Graettinger <johnny@estuary.dev>"]
homepage = "https://github.com/estuary/connectors/tree/main/estuary-cdk"
packages = [
    { include = "estuary_cdk" },
    { include = "airbyte_cdk", from = "vendor" },
    { include = "airbyte_protocol", from = "vendor" },
]

[tool.poetry.dependencies]
python = "^3.11"

aiocsv = "^1.3.2"
aiodns = "^3.1.1"
aiohttp = "^3.14.3"
orjson = "^3.11.6"
pydantic = ">1.10,<3"
xxhash = "^3.4.1"
ijson = "^3.3.0"
pycron = "^3.1.2"
stream-unzip = "0.0.99"
typing-extensions = "^4.13"

google-auth = {version = ">=2.40.3", extras = ["requests"]}
pendulum = "<=2.0.0 | >=3.0.0"

# Leaf dependencies of the vendored Airbyte CDK subset under `vendor/`.
# See vendor/README.md. pydantic and pendulum are already required above.
backoff = {version = "*", optional = true}
dpath = {version = ">=2.0.1,<2.1.0", optional = true}
jsonref = {version = ">=0.2,<1.0", optional = true}
jsonschema = {version = ">=3.2.0,<3.3.0", optional = true}
PyYAML = {version = ">=6.0.1", optional = true}
requests = {version = "*", optional = true}
requests-cache = {version = "*", optional = true}

[tool.poetry.extras]
airbyte-shim = ["backoff", "dpath", "jsonref", "jsonschema", "PyYAML", "requests", "requests-cache"]

[tool.poetry.group.dev.dependencies]
debugpy = "^1.8.0"
mypy = "^1.8.0"
pytest = "^7.4.3"
pytest-insta = "^0.3.0"
pytest-asyncio = "0.23.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
