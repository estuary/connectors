services:
  db:
    image: 'gvenzl/oracle-free:23.2'
    platform: 'linux/amd64'
    ports:
      - "1521:1521"
    environment:
      {
        "ORACLE_PASSWORD": "adminpassword",
        "ORACLE_DATABASE": "TEST"
      }
    # The image's healthcheck.sh passes before docker-initdb.sql runs, so we
    # check that the test user can log in instead.
    healthcheck:
      test: ["CMD-SHELL", "printf 'WHENEVER SQLERROR EXIT FAILURE\\nSELECT 1 FROM DUAL;\\n' | sqlplus -s -L 'C##FLOW_TEST_BATCH/FLOW123@localhost/FREE'"]
      interval: 10s
      start_period: 300s
      start_interval: 5s
    networks:
      - flow-test
    volumes:
      - ./docker-initdb.sql:/container-entrypoint-initdb.d/docker-initdb.sql

networks:
  flow-test:
    name: flow-test
    external: true
