[project]
name = "source_notion"
version = "0.1.0"
description = ""
authors = [
    { name = "Will Baker", email = "wbaker@estuary.dev" },
]
requires-python = ">=3.14"
dependencies = [
    # The vendored Airbyte CDK is pydantic v1 code; see estuary-cdk/vendor/README.md.
    "estuary-cdk[airbyte-shim]",
    "pydantic>=2,<3",
    "types-requests>=2.31,<3.0",
]

# The dependency is declared in [project.dependencies] above; this is where
# uv finds it.
[tool.uv.sources]
estuary-cdk = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
