---
# "Only Changes" set on a shared fixture topic, used to prove that a saved
# offset wins over the mode. This test only reads, so it is safe to point at a
# shared fixture topic.
import:
  - acmeCo/flow.yaml
captures:
  acmeCo/source-kafka:
    endpoint:
      local:
        command:
          - cargo
          - run
        config:
          bootstrap_servers: "localhost:9092"
          schema_registry:
            schema_registry_type: confluent_schema_registry
            endpoint: http://localhost:8081
            username: user
            password: password
    bindings:
      - resource:
          topic: json-raw-topic
          mode: Only Changes
        target: acmeCo/json-raw-topic
