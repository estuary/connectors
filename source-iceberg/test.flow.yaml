captures:
  acmeCo/source-iceberg:
    endpoint:
      local:
        command:
          - python
          - -m
          - source_iceberg
        config:
          catalog_uri: http://localhost:8181
          credentials:
            auth_type: None
          namespaces: [test]
          s3:
            auth_type: AWSAccessKey
            endpoint: http://localhost:9010
            region: us-east-1
            access_key_id: test_key
            secret_access_key: test_secret
            path_style_access: true
    bindings:
      - resource:
          namespace: test
          table: orders
          interval: PT5S
        target: acmeCo/orders

collections:
  acmeCo/orders:
    schema:
      type: object
      properties:
        id: {type: integer}
        canary: {type: string}
        at: {type: [string, "null"], format: date-time}
        amount: {type: [string, "null"], format: number}
        payload: {type: [string, "null"], contentEncoding: base64}
        _meta:
          type: object
          properties:
            snapshot_id: {type: integer}
            file: {type: string}
            row: {type: integer}
          required: [snapshot_id, file, row]
      required: [id, canary, _meta]
    key: [/_meta/snapshot_id, /_meta/file, /_meta/row]
