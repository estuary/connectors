info:
  name: full scan null audit
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/v2/invoices?limit=100&include_total=true"
  params:
    - name: limit
      value: "100"
      type: query
    - name: include_total
      value: "true"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** https://docs.hyperline.co/api-reference/endpoints/invoices/list-invoices-1.md

  **WHY:** `updated_at__isNull` is rejected by the validator (see `Invoices /
  null updated count`), so the nullable-`updated_at` partition can't be
  queried directly. The account holds only 14 invoices, so a single
  limit=100 page IS the full table: count rows with `updated_at = null` and
  tabulate the `status`/`type` distribution (are drafts/voided present
  unfiltered?) by direct inspection instead. Saved example is a projection
  (id, status, type, updated_at, issued_at per row).
  **VERIFIED (2026-09-04):** 14 of 14 rows returned in one page; ZERO rows
  with null `updated_at`; status distribution 7 to_pay / 7 paid; type
  distribution 13 invoice / 1 credit_note. No draft rows exist in this
  account, so whether drafts appear unfiltered is **UNOBSERVABLE** here —
  the spec gives `status` no default (no documented hidden partition), and
  the fallback is a one-off `status` filter probe if a production account
  ever reports missing drafts.

examples:
  - name: 200 - all 14 rows, zero null updated_at (projection)
