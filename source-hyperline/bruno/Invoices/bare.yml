info:
  name: bare
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v2/invoices?limit=3&include_total=true"
  params:
    - name: limit
      value: "3"
      type: query
    - name: include_total
      value: "true"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Pin the first non-null updated_at for `Invoices / since updated`.
        const body = res.getBody();
        const hit = body && Array.isArray(body.data)
          ? body.data.find((d) => d.updated_at) : null;
        if (hit) bru.setVar('invoices_pin_updated_at', hit.updated_at);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** https://docs.hyperline.co/api-reference/endpoints/invoices/list-invoices-1.md

  **WHY:** Prove the v2 cursor envelope on invoices and inspect the default
  status partition — the spec gives `status` no default, but eyeball whether
  draft/voided invoices actually appear unfiltered. Also observe `updated_at`
  nullability in the wild (the item schema marks it `string|null`) and pin the
  first non-null `updated_at` (runtime var `invoices_pin_updated_at`) for
  `Invoices / since updated`; run this first in a fresh session.
  **VERIFIED (2026-09-04):** v2 cursor envelope confirmed; total=14. Rows
  seen are `status` to_pay/paid and `type` invoice — plus one credit_note in
  `Invoices / full scan null audit`, so CREDIT NOTES FLOW THROUGH THIS
  STREAM. All rows seen have non-null `updated_at`. The item payload has NO
  `created_at`/`emitted_at` field even though the `sort` enum names them —
  they are internal columns, not response fields.

