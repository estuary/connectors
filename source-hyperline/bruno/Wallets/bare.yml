info:
  name: bare
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v2/wallets?take=2"
  params:
    - name: take
      value: "2"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - empty list
    request:
      url: "{{base_url}}/v2/wallets?take=2"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "meta": {
              "total": "REDACTED",
              "taken": 0,
              "skipped": 0
            },
            "data": []
          }

docs: |-
  **REFERENCE:** [List wallets](https://docs.hyperline.co/api-reference/endpoints/wallets/list-wallets.md)

  **WHY:** bare list for the `wallets` stream. Teaches the live envelope, the
  per-item field set (primary key, created_at/updated_at presence and precision),
  and `meta.total` (dataset size — snapshot sweep cost).

  **VERIFIED (2026-09-04):** endpoint EMPTY on this account — meta `{total: 0, taken: 0, skipped: 0}` WITHOUT a customer_id filter → the endpoint accepts account-wide listing (200, well-formed envelope), answering the grouping question; whether populated accounts return all customers' wallets in one list is consistent with the docs (`customer_id` is optional).

  **UNOBSERVABLE:** item shape on the wire. The public API has NO `POST /v2/wallets` — wallets cannot be seeded via the API (dashboard/checkout-driven), and creating one would attach financial state to a production customer. Proceeding on the OpenAPI item shape (id, customer_id, state, currency, balance, projected_balance, created_at + auto_load allOf variants; no updated_at). Fallback: `extra="allow"` document model with only `id` required-by-code, so an unexpected shape widens, not breaks.
