docs: |-
  **REFERENCE:** [List price configurations](https://docs.hyperline.co/api-reference/endpoints/price-configurations/list-price-configurations.md)

  **WHY:** bare list for the `price_configurations` stream. Teaches the live envelope, the
  per-item field set (primary key, created_at/updated_at presence and precision),
  and `meta.total` (dataset size — snapshot sweep cost).

  **VERIFIED (2026-09-04):** meta.total: 69; id prefix `prc_`; items carry `updated_at` as full RFC3339 with milliseconds (`2026-08-17T10:27:04.211Z`) — the OpenAPI's `format: date` understates the actual precision — plus `archived_at`, but NO created_at. `type` discriminates fee/volume/packaged/bulk/bps/bundle variants; `prices` is a nested array. The bare list returns configurations across all products/price books (no product_id filter needed). No updated_at filter is honored though — see `Price Configurations / updated_at filter probe` — so this stays snapshot.
