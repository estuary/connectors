docs: |-
  **REFERENCE:** https://docs.hyperline.co/api-reference/endpoints/customers-%3E-credits/list-credit-products.md

  **WHY:** Prove `updated_at__gte` is accepted by the v1 credits engine. The
  account's credits list is empty (`Customer Credits / bare`: total=0 — the
  credits feature appears unused), so narrowing can't be observed; the bound
  is a fixed epoch-ish datetime. Inclusivity of the shared `__gte`/`__gt`
  grammar is pinned by `Customers / since updated asc` + `Customers / gt
  boundary`.
  **VERIFIED (2026-09-04):** `updated_at__gte=2020-01-01T00:00:00Z` accepted
  (200, total=0). Narrowing **UNOBSERVABLE** while the feature is unused
  (see `Customer Credits / bare`).

