docs: |-
  **REFERENCE:** [List customer segments](https://docs.hyperline.co/api-reference/endpoints/customers->-segments/list-segments.md)

  **WHY:** bare list for the `customer_segments` stream. Teaches the live envelope, the
  per-item field set (primary key, created_at/updated_at presence and precision),
  and `meta.total` (dataset size — snapshot sweep cost).

  **VERIFIED (2026-09-04):** meta.total: 2; id prefix `seg_`; created_at/updated_at are full RFC3339 with milliseconds (`2026-09-01T12:15:07.285Z`) — OpenAPI's `format: date` understates precision; `rules` is a nested object.
