info:
  name: offset page
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/{{resource}}?take=1&skip=1"
  params:
    - name: take
      value: "1"
      type: query
    - name: skip
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - products skip=1 (projection of meta + id)
    request:
      url: "{{base_url}}/v1/products?take=1&skip=1"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "meta": {
              "total": "REDACTED",
              "taken": 1,
              "skipped": 1
            },
            "data": [
              {
                "id": "itm_43D8azcskw1HEp"
              }
            ]
          }

docs: |-
  **REFERENCE:** [Pagination and filtering](https://docs.hyperline.co/api-reference/docs/pagination.md)

  **WHY:** proves `skip` is honored on the shared take/skip URL shape and that the
  default ordering is stable enough for a paged sweep. These endpoints document
  no `sort` parameter, so the snapshot sweep leans entirely on a stable default
  order — prove it, don't assume it. Set `resource` in the environment
  (version-qualified, e.g. `v1/products`).

  **VERIFIED (2026-09-04):** on `v1/products` (69 rows): `take=1&skip=1` returned
  exactly the second id of `Products / bare` (`itm_43D8azcskw1HEp`), meta
  `{total: 69, taken: 1, skipped: 1}`; re-running `Products / bare` immediately
  after returned the same first two ids in the same order. `skip` is honored and
  the default order is stable across consecutive requests. (Stability across
  inserts/deletes mid-sweep remains UNOBSERVABLE without mutations — the snapshot
  strategy tolerates it since every sweep re-reads everything.)
