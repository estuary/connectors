info:
  name: sort asc probe
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/v1/transactions?take=1&sort=process_at&order=asc"
  params:
    - name: take
      value: "1"
      type: query
    - name: sort
      value: "process_at"
      type: query
    - name: order
      value: "asc"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - asc first item (projection of meta + id, process_at)
    request:
      url: "{{base_url}}/v1/transactions?take=1&sort=process_at&order=asc"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "meta": {
              "total": "REDACTED",
              "taken": 1,
              "skipped": 0
            },
            "data": [
              {
                "id": "tra_PnTaznIzIamiUr",
                "process_at": "2025-10-01T10:59:00.000Z"
              }
            ]
          }

docs: |-
  **REFERENCE:** [Pagination and filtering](https://docs.hyperline.co/api-reference/docs/pagination.md)

  **WHY:** the pagination docs say "some endpoints support sorting" via
  `sort`/`order`, but the transactions endpoint documents neither. If an
  undocumented sort were honored, an incremental-only strategy (walk
  newest-first back to the cursor) would become possible for this
  potentially-unbounded stream.

  **VERIFIED (2026-09-04):** first item `tra_PnTaznIzIamiUr` — identical to `Transactions
  / sort desc probe` on a 7-row account → `sort`/`order` are silently ignored on
  this endpoint. No incremental walk is possible; snapshot stands.
