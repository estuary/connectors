docs: |-
  **REFERENCE:** [List transactions](https://docs.hyperline.co/api-reference/endpoints/transactions/list-transactions.md)

  **WHY:** bare list for the `transactions` stream. Teaches the live envelope, the
  per-item field set (primary key, created_at/updated_at presence and precision),
  and `meta.total` (dataset size — snapshot sweep cost).

  **VERIFIED (2026-09-04):** meta.total: 7 on this account (the feared unbounded volume is not present today); id prefix `tra_`; items carry `process_at` (RFC3339), `settled_at`/`refunded_at`/`last_refreshed_at` (null here), `status` (mutable: scheduled/to_process/pending/settled/cancelled/failed), `type` (subscription/one_time/refund/chargeback), `payment_method_type`, `allocations` array.

  **LIMITATION (VERIFIED 2026-09-04):** zero filters and no sort are honored on this endpoint (see the sibling probes: `Transactions / sort asc probe`, `Transactions / sort desc probe`, `Transactions / process_at filter probe`) → full-refresh snapshot is the only implementable strategy. Documents mutate in place (status transitions, refunded_at, last_refreshed_at), so a created-style cursor would miss updates anyway. Growth risk: if a production account accumulates >>10k transactions, each sweep costs total/100 requests, and the provider has form for imposing a 10k skip cap (customers/invoices, 2026-05-27) — see `_top-level / deep skip probe`.
