info:
  name: sort desc probe
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/v1/transactions?take=1&sort=process_at&order=desc"
  params:
    - name: take
      value: "1"
      type: query
    - name: sort
      value: "process_at"
      type: query
    - name: order
      value: "desc"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - desc first item identical to asc (projection of meta + id, process_at)
    request:
      url: "{{base_url}}/v1/transactions?take=1&sort=process_at&order=desc"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "meta": {
              "total": "REDACTED",
              "taken": 1,
              "skipped": 0
            },
            "data": [
              {
                "id": "tra_PnTaznIzIamiUr",
                "process_at": "2025-10-01T10:59:00.000Z"
              }
            ]
          }

docs: |-
  **REFERENCE:** [Pagination and filtering](https://docs.hyperline.co/api-reference/docs/pagination.md)

  **WHY:** the desc half of the sort probe — see `Transactions / sort asc probe`
  for the full rationale and the comparison rule.

  **VERIFIED (2026-09-04):** first item `tra_PnTaznIzIamiUr`, identical to the asc run →
  sort ignored (see `Transactions / sort asc probe`).
