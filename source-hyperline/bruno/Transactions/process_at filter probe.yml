info:
  name: process_at filter probe
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/v1/transactions?take=1&process_at__gte=2030-01-01T00:00:00Z"
  params:
    - name: take
      value: "1"
      type: query
    - name: process_at__gte
      value: "2030-01-01T00:00:00Z"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - far-future gte ignored, total unchanged (projection of meta + id, process_at)
    request:
      url: "{{base_url}}/v1/transactions?take=1&process_at__gte=2030-01-01T00:00:00Z"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "meta": {
              "total": "REDACTED",
              "taken": 1,
              "skipped": 0
            },
            "data": [
              {
                "id": "tra_PnTaznIzIamiUr",
                "process_at": "2025-10-01T10:59:00.000Z"
              }
            ]
          }

docs: |-
  **REFERENCE:** [Pagination and filtering](https://docs.hyperline.co/api-reference/docs/pagination.md)

  **WHY:** transactions document zero filters, but Hyperline's generic
  `fieldName__operator` convention (incl. `gte`) might be honored anyway. A
  working `process_at__gte` would give this stream a usable cursor and force
  reclassification away from snapshot.

  **VERIFIED (2026-09-04):** `process_at__gte=2030-01-01T00:00:00Z` (far-future bound) →
  200 with meta.total 7, unchanged vs `Transactions / bare` → the undocumented
  filter is silently ignored, consistent with `Price Configurations / updated_at
  filter probe`. Snapshot-only classification confirmed.
