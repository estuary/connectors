info:
  name: bare
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/promotion-codes?take=2"
  params:
    - name: take
      value: "2"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - empty list
    request:
      url: "{{base_url}}/v1/promotion-codes?take=2"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "meta": {
              "total": "REDACTED",
              "taken": 2,
              "skipped": 0
            },
            "data": []
          }

docs: |-
  **REFERENCE:** [List promotion codes](https://docs.hyperline.co/api-reference/endpoints/coupons->-promotion-codes/list-promotion-codes.md)

  **WHY:** bare list for the `promotion_codes` stream. Teaches the live envelope, the
  per-item field set (primary key, created_at/updated_at presence and precision),
  and `meta.total` (dataset size — snapshot sweep cost).

  **VERIFIED (2026-09-04):** endpoint EMPTY on this account — meta `{total: 0, taken: 2, skipped: 0}` (same `taken`-echoes-`take` quirk as coupons).

  **UNOBSERVABLE (until seeded):** item shape unobserved (OpenAPI: id, code, coupon_id, created_at, updated_at — all required). Close by running `Seeding / B2 - Create Promotion Code` after B1 (user-run only), then re-run this request.
