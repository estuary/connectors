info:
  name: status all
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/v1/features?take=1&status=all"
  params:
    - name: take
      value: "1"
      type: query
    - name: status
      value: "all"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - status all, empty
    request:
      url: "{{base_url}}/v1/features?take=1&status=all"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "meta": {
              "total": "REDACTED",
              "taken": 0,
              "skipped": 0
            },
            "data": []
          }

docs: |-
  **REFERENCE:** [List features](https://docs.hyperline.co/api-reference/endpoints/features/list-features.md)

  **WHY:** silent-data-loss audit, same shape as `Products / status all`:
  `status` accepts all/active/archived with no documented default.

  **VERIFIED (2026-09-04):** `status=all` → meta.total 0, same as `Features / bare`
  (the account has no features at all — active or archived). The parameter is
  accepted (200). Inconclusive about the default for the same reason as
  products; the connector passes `status=all` defensively (see `Products /
  status archived` for the full argument).
