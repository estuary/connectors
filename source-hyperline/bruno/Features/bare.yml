info:
  name: bare
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/features?take=2"
  params:
    - name: take
      value: "2"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - empty list
    request:
      url: "{{base_url}}/v1/features?take=2"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "meta": {
              "total": "REDACTED",
              "taken": 0,
              "skipped": 0
            },
            "data": []
          }

docs: |-
  **REFERENCE:** [List features](https://docs.hyperline.co/api-reference/endpoints/features/list-features.md)

  **WHY:** bare list for the `features` stream. Teaches the live envelope, the
  per-item field set (primary key, created_at/updated_at presence and precision),
  and `meta.total` (dataset size — snapshot sweep cost).

  **VERIFIED (2026-09-04):** endpoint EMPTY on this account — meta `{total: 0, taken: 0, skipped: 0}`. Envelope matches the cluster shape; item shape unobserved (OpenAPI: keyed by `code`, no `id` field; carries created_at/updated_at/archived_at, status).

  **UNOBSERVABLE (until seeded):** item shape (and the code-as-primary-key claim) unobserved. Close by running `Seeding / C1 - Create Feature` (user-run only), then re-run this request.
