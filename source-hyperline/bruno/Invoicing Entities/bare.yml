docs: |-
  **REFERENCE:** [List invoicing entities](https://docs.hyperline.co/api-reference/endpoints/invoicing-entities/list-invoicing-entities.md)

  **WHY:** bare list for the `invoicing_entities` stream. Teaches the live envelope, the
  per-item field set (primary key, created_at/updated_at presence and precision),
  and `meta.total` (dataset size — snapshot sweep cost).

  **VERIFIED (2026-09-04):** meta.total: 1; id prefix `ive_`; created_at/updated_at are full RFC3339 with milliseconds (`2026-09-01T13:48:57.148Z`) — the OpenAPI's `format: date` understates the actual precision; `deleted_at` present (null). ~40 flat fields, all present.
