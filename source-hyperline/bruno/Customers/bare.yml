info:
  name: bare
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v2/customers?limit=3&include_total=true"
  params:
    - name: limit
      value: "3"
      type: query
    - name: include_total
      value: "true"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Pin a document for the boundary probes and record account size.
        const body = res.getBody();
        if (body && Array.isArray(body.data) && body.data.length) {
          bru.setVar('customers_pin_id', body.data[0].id);
          bru.setVar('customers_pin_updated_at', body.data[0].updated_at);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** https://docs.hyperline.co/api-reference/endpoints/customers/list-customers-1.md

  **WHY:** Prove the v2 cursor envelope `{data, next_cursor, has_more, total}`
  live — the public pagination doc only describes take/skip, the OpenAPI spec is
  the only written source for the cursor form. Also pins `data[0]`'s id and
  `updated_at` (runtime vars `customers_pin_id` / `customers_pin_updated_at`)
  for `Customers / since updated asc` and `Customers / gt boundary`; run this
  first in a fresh session.
  **VERIFIED (2026-09-04):** envelope is exactly `{data, next_cursor,
  has_more, total}`; total=2395; timestamps are RFC3339 with millisecond
  precision. `next_cursor` is base64url JSON — decodes to
  `{"i":"<last item id>","s":"created_at","o":"desc"}` — i.e. a KEYSET cursor
  derived from the last document plus the sort context, revealing the default
  sort is `created_at desc`. Not a TTL'd server session token.

