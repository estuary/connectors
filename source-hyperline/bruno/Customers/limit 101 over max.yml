info:
  name: limit 101 over max
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/v2/customers?limit=101&include_total=true"
  params:
    - name: limit
      value: "101"
      type: query
    - name: include_total
      value: "true"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** https://docs.hyperline.co/api-reference/endpoints/customers/list-customers-1.md

  **WHY:** The docs cap `limit` at 100; learn the enforcement mode one past the
  ceiling (reject / silent clamp / silent truncation) so the connector knows
  whether it must clamp client-side. Truncation-vs-clamp cannot be
  distinguished unless the account holds >100 customers; `has_more` +
  drain-to-empty pagination recovers all items regardless, so we do not seed
  for it. Probes the v2 cursor engine; `Subscriptions / take 101 over max`
  covers the take/skip engine.
  **VERIFIED (2026-09-04):** REJECTED — 400
  `{"limit": ["Too big: expected number to be <=100"]}`. The connector must
  clamp `limit` to 100 client-side. Cap-truncation order for >100-row result
  sets is trusted from the keyset-pagination design (see decoded cursor in
  `Customers / bare`): a keyset cursor cannot skip mid-sort rows.

examples:
  - name: 400 - limit 101 rejected, connector must clamp
    request:
      url: "{{base_url}}/v2/customers?limit=101&include_total=true"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "statusCode": 400,
            "type": "ValidationError",
            "message": "Invalid query params",
            "errors": {
              "limit": [
                "Too big: expected number to be <=100"
              ]
            }
          }
