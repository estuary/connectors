info:
  name: status all
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/v1/products?take=1&status=all"
  params:
    - name: take
      value: "1"
      type: query
    - name: status
      value: "all"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - status all, total 69 (projection of meta + id)
    request:
      url: "{{base_url}}/v1/products?take=1&status=all"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "meta": {
              "total": "REDACTED",
              "taken": 1,
              "skipped": 0
            },
            "data": [
              {
                "id": "itm_5gEthpjqY9kEUL",
                "status": "active"
              }
            ]
          }

docs: |-
  **REFERENCE:** [List products](https://docs.hyperline.co/api-reference/endpoints/products/list-products.md)

  **WHY:** silent-data-loss audit. `status` accepts all/active/archived and the
  docs state NO default — if the bare list defaults to `active`, archived
  products silently vanish from a connector that doesn't pass `status=all`.

  **VERIFIED (2026-09-04):** `status=all` → meta.total 69, identical to `Products /
  bare` (69). But `Products / status archived` shows the archived partition is
  empty on this account, so equal totals cannot distinguish "default is all"
  from "default hides archived". The parameter is accepted (200), so the
  connector passes `status=all` defensively — correct under either default.
