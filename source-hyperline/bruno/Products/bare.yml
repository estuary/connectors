docs: |-
  **REFERENCE:** [List products](https://docs.hyperline.co/api-reference/endpoints/products/list-products.md)

  **WHY:** bare list for the `products` stream. Teaches the live envelope, the
  per-item field set (primary key, created_at/updated_at presence and precision),
  and `meta.total` (dataset size — snapshot sweep cost).

  **VERIFIED (2026-09-04):** envelope `{meta: {total, taken, skipped}, data: [...]}`; `meta.total: 69`; id prefix `itm_`; items carry NO created_at/updated_at (confirmed live, matching OpenAPI) → no cursor candidate, snapshot-only. `type` discriminates flat_fee/seat/dynamic/credit/bundle variants. See `Products / status all` + `Products / status archived` for the status-partition audit.
