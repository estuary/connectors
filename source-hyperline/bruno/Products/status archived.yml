info:
  name: status archived
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/v1/products?take=1&status=archived"
  params:
    - name: take
      value: "1"
      type: query
    - name: status
      value: "archived"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 - archived partition empty
    request:
      url: "{{base_url}}/v1/products?take=1&status=archived"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "meta": {
              "total": "REDACTED",
              "taken": 0,
              "skipped": 0
            },
            "data": []
          }

docs: |-
  **REFERENCE:** [List products](https://docs.hyperline.co/api-reference/endpoints/products/list-products.md)

  **WHY:** disambiguates `Products / status all`: measures the archived
  partition directly.

  **VERIFIED (2026-09-04):** meta `{total: 0, taken: 0, skipped: 0}` — no archived
  products exist on this account.

  **UNOBSERVABLE:** whether the bare default hides archived products. Seeding
  would require archiving a live catalog product on a production account — not
  appropriate. Mitigation: the connector always passes `status=all` (accepted,
  see `Products / status all`), which is correct under either default. Same
  reasoning applies to `Features / status all`.
