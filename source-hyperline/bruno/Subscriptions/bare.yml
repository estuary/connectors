info:
  name: bare
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v2/subscriptions?take=3"
  params:
    - name: take
      value: "3"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Pin a document for the boundary/membership probes.
        const body = res.getBody();
        if (body && Array.isArray(body.data) && body.data.length) {
          bru.setVar('subscriptions_pin_id', body.data[0].id);
          bru.setVar('subscriptions_pin_updated_at', body.data[0].updated_at);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** https://docs.hyperline.co/api-reference/endpoints/subscriptions/list-subscriptions.md

  **WHY:** Prove that v2 subscriptions uses the take/skip engine and the
  `{meta:{total,taken,skipped}, data}` envelope (NOT the v2 cursor envelope —
  the two v2 shapes coexist and this is the ground truth for which one this
  endpoint speaks). Also eyeball the default status partition (cancelled/
  paused/errored present?) and pin `data[0]`'s id and `updated_at` (runtime
  vars `subscriptions_pin_id` / `subscriptions_pin_updated_at`) for
  `Subscriptions / since updated membership` and `Subscriptions / skip compose`;
  run this first in a fresh session.
  **VERIFIED (2026-09-04):** take/skip engine confirmed on this v2 path —
  envelope `{meta:{total,taken,skipped}, data}`, total=6. All rows seen are
  `status: active`; no cancelled/paused rows exist in the account, so the
  default-partition question is **UNOBSERVABLE** here (spec shows no `status`
  param default; nothing to hide behind).

