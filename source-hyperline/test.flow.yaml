import:
- acmeCo/flow.yaml
captures:
  acmeCo/source-hyperline:
    endpoint:
      local:
        command:
        - python
        - -m
        - source_hyperline
        config: config.yaml
    bindings:
    - resource:
        name: customers
        interval: PT5M
      target: acmeCo/customers
    - resource:
        name: invoices
        interval: PT5M
      target: acmeCo/invoices
    - resource:
        name: subscriptions
        interval: PT5M
      target: acmeCo/subscriptions
    - resource:
        name: quotes
        interval: PT5M
      target: acmeCo/quotes
    - resource:
        name: customer_credits
        interval: PT5M
      target: acmeCo/customer_credits
    - resource:
        name: audit_logs
        interval: PT5M
      target: acmeCo/audit_logs
    - resource:
        name: products
        interval: PT5M
      target: acmeCo/products
    - resource:
        name: price_books
        interval: PT5M
      target: acmeCo/price_books
    - resource:
        name: price_configurations
        interval: PT5M
      target: acmeCo/price_configurations
    - resource:
        name: features
        interval: PT5M
      target: acmeCo/features
    - resource:
        name: coupons
        interval: PT5M
      target: acmeCo/coupons
    - resource:
        name: promotion_codes
        interval: PT5M
      target: acmeCo/promotion_codes
    - resource:
        name: tax_rates
        interval: PT5M
      target: acmeCo/tax_rates
    - resource:
        name: invoicing_entities
        interval: PT5M
      target: acmeCo/invoicing_entities
    - resource:
        name: users
        interval: PT5M
      target: acmeCo/users
    - resource:
        name: customer_segments
        interval: PT5M
      target: acmeCo/customer_segments
    - resource:
        name: transactions
        interval: PT5M
      target: acmeCo/transactions
    - resource:
        name: wallets
        interval: PT5M
      target: acmeCo/wallets
    - resource:
        name: subscription_transitions
        interval: PT5M
      target: acmeCo/subscription_transitions
