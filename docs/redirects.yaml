# Connector documentation redirects.
#
# When a connector page is removed or renamed, its old URL would otherwise
# 404 once the aggregation step drops the deleted file from the docs site.
# Add an entry here in the SAME PR as the removal/rename so the old URL
# redirects instead. estuary/docs reads this file via submodule and feeds it
# to the Docusaurus client-redirects plugin.
#
# Each entry is a { from, to } pair of site-root-relative, trailing-slashed
# paths. Uncomment the example below as a template:
#
#   - from: /reference/Connectors/capture-connectors/old-connector/
#     to:   /reference/Connectors/capture-connectors/
#
# Point `to` at the best surviving destination: a replacement connector if
# one exists, otherwise the connector category index. Avoid case-only renames
# (e.g. foo -> Foo); they collide on case-insensitive filesystems.
#
# Only for pages that no longer exist. The redirect plugin silently ignores a
# `from` that still resolves to a page, so an entry added for a deprecated page
# whose .md file remains does nothing and the build still passes. Deprecated
# pages that stay reachable instead carry a `<head>` block with a robots
# noindex meta tag, which keeps the URL working and drops it from the sitemap.
- from: /reference/Connectors/capture-connectors/facebook-marketing/
  to: /reference/Connectors/capture-connectors/facebook-marketing-native/
- from: /reference/Connectors/capture-connectors/amazon-redshift/
  to: /reference/Connectors/capture-connectors/redshift-batch/
- from: /reference/Connectors/capture-connectors/amazon-sqs/
  to: /reference/Connectors/capture-connectors/amazon-sqs-native/
- from: /reference/Connectors/capture-connectors/google-analytics/
  to: /reference/Connectors/capture-connectors/google-analytics-data-api-native/
- from: /reference/Connectors/capture-connectors/greenhouse/
  to: /reference/Connectors/capture-connectors/greenhouse-native/
- from: /reference/Connectors/capture-connectors/jira-legacy/
  to: /reference/Connectors/capture-connectors/jira-native/
- from: /reference/Connectors/capture-connectors/Salesforce/salesforce-real-time/
  to: /reference/Connectors/capture-connectors/Salesforce/salesforce-native/
- from: /reference/Connectors/capture-connectors/shopify/
  to: /reference/Connectors/capture-connectors/shopify-native/
- from: /reference/Connectors/capture-connectors/stripe/
  to: /reference/Connectors/capture-connectors/stripe-realtime/
- from: /reference/Connectors/materialization-connectors/Rockset/
  to: /reference/Connectors/materialization-connectors/
