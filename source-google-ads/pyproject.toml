[project]
name = "source_google_ads"
version = "0.1.0"
description = ""
authors = [
    { name = "Jonathan Wihl", email = "jonathan@estuary.dev" },
]
# The `<3.15` is google-ads'; nothing else in the workspace carries a
# ceiling. Because `requires-python` intersects across members, this one line
# is what makes the workspace lock resolve for `==3.14.*` rather than `>=3.14`
# -- widening it changes every member's resolution, not just this connector's.
requires-python = ">=3.14,<3.15"
dependencies = [
    "estuary-cdk[airbyte-shim]",
    "freezegun>=1.4.0,<2.0.0",
    "google-ads>=31.2.0,<32.0.0",
    "protobuf>=5.29.5",
    "types-requests>=2.31,<3.0",
    "urllib3>=2.7.0",
    "requests>=2.32.4",
    "aiohttp>=3.10.11",
    "pycares>=4.8.1",
]

# The dependency is declared in [project.dependencies] above; this is where
# uv finds it.
[tool.uv.sources]
estuary-cdk = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
