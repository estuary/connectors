services:
  polaris:
    image: apache/polaris:latest
    environment:
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
      AWS_ACCESS_KEY_ID: flow
      AWS_SECRET_ACCESS_KEY: flow
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL_S3: http://rustfs:9000
      JAVA_OPTS_APPEND: "-Xms128m -Xmx128m -XX:TieredStopAtLevel=1"
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8182/q/health" ]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
      rustfs:
        condition: service_healthy
    networks:
      materialize-s3-iceberg:
    ports:
      - "9700:8181" # catalog API
      - "9701:8182" # management/health

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: flow
      RUSTFS_SECRET_KEY: flow
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: :9000
    healthcheck:
      test:
        [
          "CMD", "sh", "-c",
          "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health"
        ]
      interval: 2s
      timeout: 10s
      retries: 2
      start_period: 5s
    networks:
      materialize-s3-iceberg:
    ports:
      - "9702:9000"


  bootstrap:
    # Creates the bucket and the Polaris catalog that testdata/config*.yaml
    # name, then stays up so that `docker compose up --wait` returns once they
    # exist. The rustfs image is used for its curl.
    image: rustfs/rustfs:latest
    depends_on:
      rustfs:
        condition: service_healthy
      polaris:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        curl -fsS --aws-sigv4 "aws:amz:us-east-1:s3" --user flow:flow \
          -X PUT http://rustfs:9000/test-warehouse

        token=$$(curl -fsS http://polaris:8181/api/catalog/v1/oauth/tokens \
          -d grant_type=client_credentials -d client_id=root -d client_secret=s3cr3t \
          -d scope=PRINCIPAL_ROLE:ALL | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')

        # Clients reach rustfs on the host port; Polaris over the compose
        # network. rustfs has no STS, so clients use the s3.* properties.
        curl -fsS -H "Authorization: Bearer $$token" -H "Content-Type: application/json" \
          http://polaris:8181/api/management/v1/catalogs -d '{"catalog": {
            "name": "test_warehouse",
            "type": "INTERNAL",
            "readOnly": false,
            "properties": {
              "default-base-location": "s3://test-warehouse/warehouse",
              "s3.endpoint": "http://localhost:9702",
              "s3.access-key-id": "flow",
              "s3.secret-access-key": "flow",
              "s3.region": "us-east-1",
              "s3.path-style-access": "true"
            },
            "storageConfigInfo": {
              "storageType": "S3",
              "allowedLocations": ["s3://test-warehouse/warehouse/"],
              "roleArn": "arn:aws:iam::000000000000:role/dummy",
              "region": "us-east-1",
              "endpoint": "http://localhost:9702",
              "endpointInternal": "http://rustfs:9000",
              "pathStyleAccess": true,
              "stsUnavailable": true
            }
          }}'

        touch /tmp/ready
        trap 'exit 0' TERM
        while :; do sleep 1; done
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 500ms
      retries: 60
    networks:
      materialize-s3-iceberg:

networks:
  materialize-s3-iceberg:
