info:
  name: definitions
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v2/settings/scorecards"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **REFERENCE:** https://gong.app.gong.io/settings/api/documentation#get-/v2/settings/scorecards

  **WHY:** the read side of the `scorecard_definitions` stream — a full-refresh
  snapshot of every scorecard configured on the account.

  **VERIFIED (2026-08-31):** empty on this sandbox — `200` with
  `{"scorecards": [], "requestId": "…"}`. A live capture produced zero
  documents for this stream.

  **LIMITATION — this endpoint does not 404 when empty.** It takes no filter,
  and unfiltered endpoints return `200` with an empty array where filtered
  ones return `404` (see the collection root). So the empty-result handling in
  `source_gong/api.py` is exercised by `calls` and `scorecards`, never by this
  stream.

  **LIMITATION — UI-only to seed.** Gong exposes no create endpoint for
  scorecard definitions; this path is read-only. A definition has to be built
  in the instance's Coaching settings by hand, then published. This is the
  blocker for `scorecards` too, since an answered scorecard needs a definition
  to answer against. Nothing in `Seeding/` can help here.
