import:
- acmeCo/flow.yaml
captures:
  acmeCo/source-gong:
    endpoint:
      local:
        command:
        - python
        - -m
        - source_gong
        config: config.yaml
    bindings:
    - resource:
        name: scorecard_definitions
        interval: PT1H
      target: acmeCo/scorecard_definitions
    - resource:
        name: calls
        interval: PT2M
      target: acmeCo/calls
    - resource:
        name: users
        interval: PT2M
        schedule: 0 0 * * *
      target: acmeCo/users
    - resource:
        name: scorecards
        interval: PT2M
      target: acmeCo/scorecards
