info:
  name: transactions
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/finances/2024-06-19/transactions?postedAfter=2026-10-01T00:00:00Z&postedBefore=2026-10-02T00:00:00Z"
  params:
    - name: postedAfter
      value: "2026-10-01T00:00:00Z"
      type: query
    - name: postedBefore
      value: "2026-10-02T00:00:00Z"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    **REFERENCE:** https://developer-docs.amazon.com/sp-api/reference/listtransactions

    **WHY:** the `financial_transactions` stream's request
    (`_transactions_window`), used by its backfill and its realtime, late and
    lookback passes. No `marketplaceId` or `transactionStatus` is sent.

    **DOCUMENTED (2026-11-10):** transactions are under
    `payload.transactions`, and a further page repeats the request's
    arguments with `nextToken` from `payload.nextToken`. `postedAfter` is
    inclusive ("on or after") and `postedBefore` exclusive ("before (but not
    on)").

    **LIMITATION (DOCUMENTED 2026-11-10):** a window longer than 180 days
    returns no transactions.

    **PENDING:** that leaving out `transactionStatus` returns DEFERRED,
    RELEASED and DEFERRED_RELEASED transactions alike; and whether releasing
    a deferred transaction keeps its `postedDate`.
  type: text/markdown
