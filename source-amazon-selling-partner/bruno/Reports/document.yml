info:
  name: document
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/reports/2021-06-30/documents/{{report_document_id}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('report_document_id')) {
          throw new Error('report_document_id is not set: run `Reports / list` or poll `Reports / report` until DONE first in the same run');
        }
    - type: after-response
      code: |-
        // Hand `Reports / download` the pre-signed URL before the collection
        // script redacts it. Runtime vars live in memory only.
        const url = res.getBody()?.url;
        if (url) bru.setVar('report_document_url', url);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    **REFERENCE:** https://developer-docs.amazon.com/sp-api/reference/getreportdocument

    **WHY:** the step before every report download
    (`reports.fetch_report_document`). The connector asks for the document
    immediately before each download and never keeps the URL.

    **DOCUMENTED (2026-11-10):** the response gives a pre-signed `url` that
    expires five minutes after it is issued, and `compressionAlgorithm`
    (GZIP) when the document is compressed.

    **PENDING:** whether any document Amazon serves names a compression other
    than GZIP (the connector fails on one).
  type: text/markdown
