info:
  name: participations
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/sellers/v1/marketplaceParticipations"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    **REFERENCE:** https://developer-docs.amazon.com/sp-api/reference/getmarketplaceparticipations

    **WHY:** the connector's credential check (`validate_credentials`). It
    fails a configured marketplace ID that isn't in
    `payload[].marketplace.id`.

    **DOCUMENTED (2026-11-10):** takes no parameters; `payload` lists the
    account's marketplace participations.

    **PENDING:** confirm `payload[].marketplace.id` on a real account, and
    which status a revoked or wrong-region authorization returns (the
    connector reports 400, 401 and 403 as invalid credentials).
  type: text/markdown
