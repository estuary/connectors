# Shared ruff config for every Python project in the repo. Per-project
# `[tool.ruff]` sections would shadow it, so don't add them.
#
# Only rules that catch real bugs are selected. Formatting, import order,
# naming and annotation style are deliberately left out for now.

# Every invocation (CI and agent skills) runs `uvx ruff@0.16.9`; bump them
# together.
required-version = "==0.16.9"

# The connector images run Python 3.14, and so does every workspace member.
# estuary-cdk also supports down to 3.11, but needs no exception here: it has
# no 3.12-or-later syntax, so checking it at py314 reports exactly what py311
# does. The connectors are not so lucky in the other direction -- lowering this
# to py311 reports PEP 695 type parameter lists and `type` aliases as syntax
# errors across a dozen of them, which CLAUDE.md's own house rules require.
target-version = "py314"

# Vendored third-party code, kept as a fork and not written to this repo's
# rules. See estuary-cdk/vendor/README.md.
extend-exclude = ["estuary-cdk/vendor"]

[lint]
select = [
    "F",       # pyflakes: undefined names, redefinitions, unused variables
    "E9",      # syntax errors
    "B",       # bugbear: call-time defaults, loop closures, static-key comprehensions
    "ASYNC",   # blocking or misused calls in async code
    "RUF006",  # asyncio tasks created without keeping a reference
    "DTZ",     # naive datetimes
    "PLR0124", # comparing a value with itself
]
ignore = [
    "F401", # unused imports
    "F541", # f-strings without placeholders
    "B904", # `raise` without `from` inside `except`; implicit chaining keeps the traceback
    "B905", # `zip` without `strict`
    "ASYNC109", # `timeout` parameters here carry an aiohttp.ClientTimeout
                # through to aiohttp, which is that library's own API, rather
                # than reimplementing asyncio.timeout.
]
