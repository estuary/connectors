[project]
name = "source_braintree_native"
version = "0.1.0"
description = ""
authors = [
    { name = "Alex Bair", email = "alexb@estuary.dev" },
]
requires-python = ">=3.14"
dependencies = [
    "estuary-cdk",
    "pydantic>=2,<3",
    # Braintree removed the `business_details`, `funding_details`, and `individual_details` for `merchant_accounts` in version 4.35.0 of their
    # Python SDK, and I could not find any explanation for why they were removed. Customers still have these fields populated in the API responses,
    # so I've pinned the `braintree` package version we're using to version 4.34.0.
    "braintree==4.34.0",
    "aiohttp>=3.11.10",
    "pycares>=4.9.0",
    "requests>=2.32.4",
    "urllib3>=2.5.0",
    "xmltodict>=1.0.2,<2.0.0",
]

# The dependency is declared in [project.dependencies] above; this is where
# uv finds it.
[tool.uv.sources]
estuary-cdk = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
