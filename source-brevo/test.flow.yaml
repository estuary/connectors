import:
- acmeCo/flow.yaml
captures:
  acmeCo/source-brevo:
    endpoint:
      local:
        command:
        - python
        - -m
        - source_brevo
        config: config.yaml
    bindings:
    - resource:
        name: contacts_attributes
        interval: PT1H
      target: acmeCo/contacts_attributes
    - resource:
        name: contacts_lists
        interval: PT1H
      target: acmeCo/contacts_lists
    - resource:
        name: contacts_folders
        interval: PT1H
      target: acmeCo/contacts_folders
    - resource:
        name: contacts_segments
        interval: PT1H
      target: acmeCo/contacts_segments
    - resource:
        name: senders
        interval: PT1H
      target: acmeCo/senders
    - resource:
        name: webhooks
        interval: PT1H
      target: acmeCo/webhooks
    - resource:
        name: contacts
        interval: PT5M
      target: acmeCo/contacts
