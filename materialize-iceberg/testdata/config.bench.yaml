# config.rest-local.yaml for the benchmark suite (tests/benchmark/materialize).
# It authenticates as Polaris's root user, whose credential the compose stack
# fixes, rather than the flow_user principal driver_test.go fills in at runtime.
url: http://localhost:9802/api/catalog
warehouse: quickstart_catalog
namespace: flow
base_location: s3://warehouse/
hard_delete: true
credentials:
    auth_type: "OAuth 2.0 Client Credentials"
    oauth2_server_uri: "v1/oauth/tokens"
    credential: "root:s3cr3t"
    scope: "PRINCIPAL_ROLE:ALL"
advanced:
    feature_flags: nested_dot_hash_location_style,no_variant_columns
compute:
    compute_type: "Spark Standalone"
    aws_access_key_id: "flow"
    aws_secret_access_key: "flow"
    region: "us-east-1"
    bucket: "warehouse"
    bucket_path: "staging/"
    daemon_url: "http://localhost:9806"
    s3_endpoint: "http://localhost:9800"
    s3_path_style: true
