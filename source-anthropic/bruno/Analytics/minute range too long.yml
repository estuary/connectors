docs:
  content: |-
    **LIMITATION (VERIFIED 2026-11-16):** 1m buckets accept at most 24 hours →
    400 `date range must span at most 24 hours when time_bucket_width is "1m"`.
    1h/1d accept at most 31 days → 400 `date range must span at most 31 days`.
    The connector splits windows at these spans.
