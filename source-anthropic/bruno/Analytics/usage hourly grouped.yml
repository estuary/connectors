info:
  name: usage hourly grouped
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/usage?starting_at={{seed_start}}&ending_at={{seed_end}}&time_bucket_width=1h&order_by=time&order=asc&limit=1000&group_by[]=actor&group_by[]=model&group_by[]=product&group_by[]=api_key_id&group_by[]=workspace_id"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    **REFERENCE:** https://platform.claude.com/docs/en/api/http/beta/organization/analytics/usage
    
    **WHY:** the connector's exact request shape for usage_hourly.
    
    **VERIFIED (2026-11-16):** 3 rows in the 21:00 bucket, one per model
    (claude-sonnet-5-5, claude-opus-5-5, claude-opus-5). Playground traffic is
    product messages_api with a workspace_id and a null api_key_id; actor is a
    user_actor with user_id, email_address, name, deleted. Null dimensions are
    why the connector keys on a synthetic group_key.
  type: text/markdown
